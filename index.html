<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LI · Procesos</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════
   TOKENS — paleta "B · Cercano" (ya elegida por el usuario)
══════════════════════════════════════════════════════ */
:root{
  --bg:       #F7F5EF;
  --surface:  #FFFFFF;
  --surface2: #F1EEE4;
  --border2:  rgba(70,80,55,.12);
  --text:     #333B29;
  --muted:    #6E7A61;
  --accent:   #5B7553;
  --accent2:  #4A6144;
  --accent-bg:rgba(91,117,83,.13);
  --ok:       #4C7A3F;
  --ok-bg:    rgba(76,122,63,.14);
  --warn:     #A87A22;
  --warn-bg:  rgba(168,122,34,.15);
  --bad:      #A6402F;
  --bad-bg:   rgba(166,64,47,.14);
  --r:    14px;
  --r-sm: 10px;
  --r-pill: 20px;
  --shadow: 0 1px 2px rgba(51,59,41,.06), 0 4px 16px rgba(51,59,41,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:       #1C1F17;
    --surface:  #262A1F;
    --surface2: #2F3426;
    --border2:  rgba(224,228,210,.12);
    --text:     #E7E9DD;
    --muted:    #A4AD96;
    --accent:   #8FAE82;
    --accent2:  #A6C398;
    --accent-bg:rgba(143,174,130,.18);
    --ok:       #7FBE6C;
    --ok-bg:    rgba(127,190,108,.16);
    --warn:     #D9A64A;
    --warn-bg:  rgba(217,166,74,.16);
    --bad:      #E1786A;
    --bad-bg:   rgba(225,120,106,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:600;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── Layout ── */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex:0 0 216px;background:var(--surface);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;padding:16px 12px;
  position:sticky;top:0;height:100vh;
}
.brand{font-weight:700;font-size:15px;padding:6px 10px 18px;color:var(--text)}
.brand span{color:var(--accent)}
.brand-block{padding:12px 12px 6px}
.brand-logo{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:center;box-shadow:var(--shadow)}
.brand-logo img{width:100%;max-width:150px;height:auto;display:block}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.brand-sub{font-weight:700;font-size:14px;color:var(--text)}
.brand-sub span{color:var(--accent)}
.notif-bell{font-size:20px;position:relative;padding:6px 8px}
.notif-badge-count{
  position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;
  border-radius:99px;min-width:17px;height:17px;text-align:center;padding:0 4px;
  display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface);
}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border:none;background:none;border-radius:var(--r-sm);
  color:var(--muted);font-weight:500;cursor:pointer;margin-bottom:2px;
}
.nav-btn .ic{font-size:16px}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border2)}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm)}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 30px}
.user-chip .who{flex:1;min-width:0}
.user-chip .who .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who .r{font-size:11px;color:var(--muted)}
.icon-btn{border:none;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:15px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}

.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1180px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.view-head h1{font-size:21px}
.view-sub{color:var(--muted);font-size:13px;margin-top:2px}

/* ── Componentes ── */
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:var(--r-sm);border:1px solid var(--border2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.ok:hover{background:var(--ok-bg)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-bg);color:var(--accent)}

.input,.select-input,textarea.input{
  width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);
}
textarea.input{resize:vertical;min-height:60px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
.small{font-size:12px}
.muted{color:var(--muted)}

.state-box{padding:44px 20px;text-align:center;color:var(--muted)}
.state-box .ico{font-size:30px;margin-bottom:8px}
.state-box .t{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border2)}
table.tbl td{padding:10px;border-bottom:1px solid var(--border2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}

.avatar{border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.bar-track{background:var(--surface2);border-radius:8px;height:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:8px}

/* ── Login ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;
}
.login-card{width:340px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:19px;margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
#login-err{display:none;background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;margin-top:10px}

/* ── Dialog ── */
dialog{border:none;border-radius:var(--r);padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(520px,92vw)}
dialog.dlg-wide{width:min(900px,94vw)}
dialog::backdrop{background:rgba(28,31,23,.4)}
.dlg-head{padding:18px 20px 4px}
.dlg-head h2{font-size:16px}
.dlg-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dlg-body{padding:14px 20px;max-height:60vh;overflow-y:auto}
.dlg-foot{padding:14px 20px 20px;display:flex;justify-content:flex-end;gap:8px}

/* ── Toast ── */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* Todos los líderes en UNA sola fila horizontal, alineados arriba (no uno
   debajo del otro, no en columnas de alto disparejo tipo masonry): cada
   líder es una columna de ancho fijo. Si no caben todos en la pantalla, la
   fila completa se desliza — nunca bajan a una 2ª línea ni empujan al de
   al lado. #proj-cols-nav (◀▶ arriba) es la forma fácil de moverse; el
   scroll con el dedo/mouse sigue funcionando igual, es solo un atajo. */
/* Proyectos — acordeón vertical por Sección/líder: uno debajo del otro, cada
   uno se abre/cierra con <details>, nunca scroll horizontal. */
.proj-cols{display:flex;flex-direction:column;gap:10px}
.proj-col{border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.proj-col>summary{
  cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;gap:8px;
}
.proj-col>summary::-webkit-details-marker{display:none}
.proj-col>summary::before{content:'▶';font-size:10px;color:var(--muted);transition:transform .15s}
.proj-col[open]>summary::before{transform:rotate(90deg)}
.proj-col-inner{padding:0 14px 14px;display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media (max-width:760px){.proj-col-inner{grid-template-columns:1fr}}
/* Las tarjetas de proyecto DENTRO de cada líder van apiladas verticalmente
   (una debajo de otra, scroll normal de la página) — nada de una 2ª barra
   de scroll horizontal anidada dentro de la fila de líderes; eso era
   confuso, sobre todo en celular. */
.proj-cards-scroll{display:flex;flex-direction:column;gap:12px}

.proj-subgroup>summary::before{content:'▸';display:inline-block;margin-right:6px;transition:transform .15s;color:var(--muted)}
.proj-subgroup[open]>summary::before{transform:rotate(90deg)}
.proj-subgroup>summary{outline:none}
.proj-subgroup>summary::-webkit-details-marker{display:none}

#btn-mobile-menu{display:none;position:fixed;top:14px;left:14px;z-index:41;background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow)}
#sidebar-overlay{display:none}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;z-index:42;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .main{padding:56px 16px 60px}
  .form-row{grid-template-columns:1fr}
  #btn-mobile-menu{display:flex}
  #sidebar-overlay.open{display:block;position:fixed;inset:0;background:rgba(28,31,23,.35);z-index:41}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     LOGIN
══════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <h1>LI · Procesos</h1>
    <div class="sub">Ingeniería de Procesos — Línea Italia</div>
    <div class="field">
      <label class="lbl">Usuario</label>
      <input class="input" id="li-user" autocomplete="username"/>
    </div>
    <div class="field">
      <label class="lbl">Contraseña</label>
      <input class="input" type="password" id="li-pass" autocomplete="current-password"/>
    </div>
    <button class="btn primary" id="btn-login" style="width:100%;justify-content:center">Iniciar sesión</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     APP
══════════════════════════════════════════════════════ -->
<div id="app">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-logo"><img src="assets/logo-linea-italia.png" alt="Línea Italia"></div>
        <div class="brand-row">
          <div class="brand-sub">LI · <span>Procesos</span></div>
          <div style="display:flex;gap:2px">
            <button class="icon-btn notif-bell" id="btn-notif" title="Notificaciones — lo que es para ti">🔔<span id="notif-badge" class="notif-badge-count"></span></button>
            <button class="icon-btn notif-bell leader-only" id="btn-enviar" title="Avisar a mi gente por correo" style="display:none">📤<span id="enviar-badge" class="notif-badge-count"></span></button>
          </div>
        </div>
      </div>
      <button class="nav-btn" data-view="dashboard"><span class="ic">🏠</span> Dashboard</button>
      <button class="nav-btn" data-view="proyectos"><span class="ic">📁</span> Proyectos</button>
      <button class="nav-btn" data-view="equipo"><span class="ic">👥</span> Equipo</button>
      <button class="nav-btn" data-view="centrotrabajo"><span class="ic">🏭</span> Centro de Trabajo</button>
      <button class="nav-btn" data-view="reportemaquinas"><span class="ic">📋</span> ROI Máquinas</button>
      <button class="nav-btn" data-view="reportes"><span class="ic">📊</span> Reportes</button>
      <button class="nav-btn admin-only" data-view="pedidosventa" style="display:none"><span class="ic">🧾</span> Pedidos venta</button>
      <button class="nav-btn admin-only" data-view="leadtime" style="display:none"><span class="ic">⏱️</span> Lead Time</button>
      <button class="nav-btn admin-only" data-view="admin" style="display:none"><span class="ic">⚙️</span> Administración</button>
      <!-- Sección "Otras apps" (enlaces a Control_CT_v7.html, infraestructura_dashboard_v10.html,
           CT_MH_v8.html, LineaItalia.html) retirada del menú a pedido del usuario (2026-09-15,
           "me confunden") — los 4 archivos siguen en el repo, movidos a apps-archivadas/,
           no se borró nada. Ver memoria procesos-li-remaster para el detalle. -->
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="av" id="sb-av">--</div>
          <div class="who">
            <div class="n" id="sb-name">—</div>
            <div class="r" id="sb-role">—</div>
          </div>
          <button class="icon-btn" id="btn-logout" title="Cerrar sesión">⏻</button>
        </div>
      </div>
    </div>
    <div class="main" id="view-root"><!-- la vista activa se dibuja aquí --></div>
  </div>
  <button class="icon-btn" id="btn-mobile-menu" title="Menú">☰</button>
  <div id="sidebar-overlay"></div>
</div>

<!-- ══════════════════════════════════════════════════════
     DIALOGS GENÉRICOS
══════════════════════════════════════════════════════ -->
<dialog id="dlg-edit">
  <div class="dlg-head"><h2 id="dlg-title"></h2><div class="sub" id="dlg-sub"></div></div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot">
    <button class="btn" id="dlg-cancel">Cancelar</button>
    <button class="btn primary" id="dlg-save">Guardar cambios</button>
  </div>
</dialog>

<dialog id="dlg-confirm">
  <div class="dlg-head"><h2 id="dlg-confirm-title"></h2><div class="sub" id="dlg-confirm-sub"></div></div>
  <div class="dlg-foot">
    <button class="btn" id="dlg-confirm-cancel">Cancelar</button>
    <button class="btn danger" id="dlg-confirm-ok">Confirmar</button>
  </div>
</dialog>

<!-- Resumen al entrar: Actividad/Proyecto/Responsable/Líder/Avance de lo
     pendiente — más ancho que los diálogos de formulario, por eso su propia
     clase (.dlg-wide) en vez de reutilizar el ancho fijo de #dlg-edit. -->
<dialog id="dlg-resumen" class="dlg-wide">
  <div class="dlg-head"><h2>📋 Resumen de pendientes</h2><div class="sub" id="dlg-resumen-sub"></div></div>
  <div class="dlg-body" id="dlg-resumen-body"></div>
  <div class="dlg-foot">
    <button class="btn" id="dlg-resumen-pdf">⬇ Descargar PDF por equipo</button>
    <button class="btn" id="dlg-resumen-mail">✉️ Enviar por correo</button>
    <button class="btn" id="dlg-resumen-copiar" title="Por si el correo no abre solo — pégalo tú en un mensaje nuevo">📋 Copiar</button>
    <button class="btn primary" id="dlg-resumen-close">Cerrar</button>
  </div>
</dialog>

<!-- Notificaciones — proyecto/entregable nuevo, aprobación. Automáticas dentro
     de la app; por correo llevan un botón ✉️ por fila (no hay backend de
     correo aquí, es mailto: con el link directo ya adentro). -->
<dialog id="dlg-notif">
  <div class="dlg-head"><h2>🔔 Notificaciones</h2><div class="sub">Lo que es para ti — proyectos/entregables nuevos y aprobaciones</div></div>
  <div class="dlg-body" id="dlg-notif-body"></div>
  <div class="dlg-foot">
    <button class="btn primary" id="dlg-notif-close">Cerrar</button>
  </div>
</dialog>

<!-- 📤 Envío — solo admin/líder. Aparte de la campana a propósito: esto es
     "avisar a mi gente por correo", no "lo que me toca a mí". -->
<dialog id="dlg-enviar">
  <div class="dlg-head"><h2>📤 Avisar a mi equipo por correo</h2><div class="sub">Todo lo que le puedes mandar a tu gente — nada se envía solo, tú confirmas cada uno</div></div>
  <div class="dlg-body" id="dlg-enviar-body"></div>
  <div class="dlg-foot">
    <button class="btn primary" id="dlg-enviar-close">Cerrar</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════
   UTILIDADES BASE
══════════════════════════════════════════════════════ */
function uid(p='x'){return p+'_'+Math.random().toString(16).slice(2)+'_'+Date.now().toString(16)}
function todayISO(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);return t.toISOString().slice(0,10)}
function esc(s){return(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function byId(arr,id){return (arr||[]).find(x=>x.id===id)||null}
function initials(name){return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
let _toastT=null;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='show'+(type?' '+type:'');
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.classList.remove('show'),2600);
}

/* Modal genérico de edición (form libre) */
let _dlgSave=null;
function openDlg({title,sub='',body,onSave,saveLabel='Guardar cambios',showCancel=true}){
  document.getElementById('dlg-title').textContent=title;
  document.getElementById('dlg-sub').textContent=sub;
  document.getElementById('dlg-body').innerHTML=body;
  // saveLabel/showCancel se resetean SIEMPRE (nunca se quedan pegados del diálogo anterior)
  document.getElementById('dlg-save').textContent=saveLabel;
  document.getElementById('dlg-cancel').style.display=showCancel?'':'none';
  _dlgSave=onSave;
  document.getElementById('dlg-edit').showModal();
}
function closeDlg(){document.getElementById('dlg-edit').close();_dlgSave=null}
document.getElementById('dlg-cancel').addEventListener('click',closeDlg);
document.getElementById('dlg-save').addEventListener('click',()=>{

/* Confirmación nombrando lo que se borra — nunca usar confirm() nativo */
function appConfirm(title,sub=''){
  return new Promise(resolve=>{
    const dlg=document.getElementById('dlg-confirm');
    document.getElementById('dlg-confirm-title').textContent=title;
    document.getElementById('dlg-confirm-sub').textContent=sub;
    // FIX: clonar los botones antes de enganchar listeners nuevos — si una llamada
    // anterior a appConfirm() no llegó a limpiar los suyos (cierre atípico del
    // diálogo, dos confirmaciones casi seguidas, etc.), esto los deja "en cero" en
    // vez de ir acumulando manejadores viejos sobre los mismos botones compartidos
    // (eso podía hacer que un "Confirmar" real no borrara nada, sin ningún error).
    let ok=document.getElementById('dlg-confirm-ok');
    let cancel=document.getElementById('dlg-confirm-cancel');
    ok.replaceWith(ok=ok.cloneNode(true));
    cancel.replaceWith(cancel=cancel.cloneNode(true));
    function cleanup(){dlg.close();ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);dlg.removeEventListener('close',onClose)}
    function onOk(){cleanup();resolve(true)}
    function onCancel(){cleanup();resolve(false)}
    function onClose(){cleanup();resolve(false)}
    ok.addEventListener('click',onOk);
    cancel.addEventListener('click',onCancel);
    dlg.addEventListener('close',onClose,{once:true});
    dlg.showModal();
  });
}

// Guarda en localStorage sin nunca tronar la app: es solo una caché para
// pintar rápido antes de que responda Firebase (que es la fuente de verdad
// real) — si el navegador ya llenó su cuota (QuotaExceededError, típico
// cuando se acumulan fotos de máquinas en base64), simplemente se avisa en
// consola y se sigue de largo. Antes esto tronaba dentro de saveShare()/
// saveApp(), lo que abortaba saveDB() ANTES de llegar a Firebase o a
// render() — por fuera se veía como "no guarda nada" o "el diálogo no cierra".
function lsSetSafe(key,value){
  try{ localStorage.setItem(key,value); }
  catch(e){ console.warn('[cache local] no se guardó ('+key+'): '+e.message); }
}
// Versión de Centros para la caché local SIN las fotos de máquinas
// (heroPhoto, base64) — pueden pesar varios MB entre todas y son las que
// suelen llenar la cuota. Firebase siempre guarda la copia completa; esta
// caché es desechable y se vuelve a llenar sola en el próximo pullShare().
function centrosParaCache(centros){
  return (centros||[]).map(c=>(c.maquinas&&c.maquinas.length)?{...c,maquinas:c.maquinas.map(({heroPhoto,...resto})=>resto)}:c);
}

// Cache local inmediata (para que un refresh no muestre "vacío" un instante)
(function loadCache(){
  try{ const s=localStorage.getItem(LS_SHARE); if(s){ const p=JSON.parse(s); Object.assign(DB,{users:p.users||[],secciones:p.secciones||[],centros:p.centros||[],puestos:p.puestos||[],tabulador:p.tabulador||{grupos:[],categorias:[],niveles:[]},globalParams:{...DEFAULT_GLOBAL_PARAMS,...(p.globalParams||{})}}); } }catch{}
  try{ const a=localStorage.getItem(LS_APP); if(a){ const p=JSON.parse(a); Object.assign(DB,{projects:p.projects||[],deliverables:toDeliverablesArr(p.deliverables),_deleted:p._deleted||{},notificaciones:toNotifArr(p.notificaciones)}); } }catch{}
})();

const FB_URL='https://ingenieria-de-procesos-24ba4-default-rtdb.firebaseio.com';
firebase.initializeApp({databaseURL: FB_URL});
const _fbDB=firebase.database();
const _refShare=_fbDB.ref('li_procesos');     // solo users/secciones/centros
const _refApp=_fbDB.ref('li_procesos_v3');    // projects/deliverables

function cleanUndefined(obj){
  return JSON.parse(JSON.stringify(obj,(k,v)=>v===undefined?null:v));
}
function toArr(v){ return v&&typeof v==='object'&&!Array.isArray(v) ? Object.values(v) : (v||[]); }
function toTabulador(v){ return {grupos:toArr(v?.grupos),categorias:toArr(v?.categorias),niveles:toArr(v?.niveles)}; }
function toGlobalParams(v){ return {...DEFAULT_GLOBAL_PARAMS,...(v||{})}; }
// Firebase Realtime Database no guarda arreglos vacíos [] tal cual — al
// leerlos de vuelta la clave simplemente no viene (undefined), no []. Una
// notificación recién creada siempre tiene leidoPor:[] — en cuanto se guarda
// y se vuelve a leer, esa clave desaparece y cualquier .includes()/.push()
// sobre ella truena. Se normaliza aquí, en la única puerta de entrada, en
// vez de defender cada lectura de leidoPor/paraUserIds por separado.
function toNotifArr(v){ return toArr(v).map(n=>({...n,leidoPor:n.leidoPor||[],paraUserIds:n.paraUserIds||[]})); }
// Mismo problema que las notificaciones: cambiosFecha:[] se guarda vacío y
// Firebase se lo come al leerlo de vuelta — se normaliza aquí para que PT
// nunca truene por un .filter()/.some() sobre undefined. dueDateOriginal
// también se defiende para entregables creados antes de que existiera ese
// campo (usa dueDate como si siempre hubiera sido la fecha original).
function toDeliverablesArr(v){
  return toArr(v).map(d=>({...d,cambiosFecha:d.cambiosFecha||[],dueDateOriginal:d.dueDateOriginal||d.dueDate||null}));
}

let _shareBusy=false,_appBusy=false;
let _sharePending=false,_appPending=false;

function saveShare(){
  lsSetSafe(LS_SHARE,JSON.stringify({users:DB.users,secciones:DB.secciones,centros:centrosParaCache(DB.centros),puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams}));
  _sharePending=true;
  clearTimeout(saveShare._t);
  saveShare._t=setTimeout(pushShare,700);
}
function saveApp(){
  lsSetSafe(LS_APP,JSON.stringify({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{},notificaciones:DB.notificaciones||[]}));
  _appPending=true;
  clearTimeout(saveApp._t);
  saveApp._t=setTimeout(pushApp,700);
}
// saveDB(): usar tras cualquier cambio; guarda ambas rutas (cada una decide
// si de verdad cambió algo la próxima vez que se lea, pero por simplicidad
// aquí simplemente empujamos las dos — es barato y evita bugs de "se me
// olvidó guardar esta parte").
function saveDB(){ saveShare(); saveApp(); render(); }

async function pushShare(){
  if(_shareBusy)return; _shareBusy=true;
  try{
    // No pisamos otros campos que ya existan en el nodo real (proyectos viejos,
    // reglas, etc. del index.html anterior) — solo actualizamos users/secciones/centros.
    await _refShare.update(cleanUndefined({users:DB.users,secciones:DB.secciones,centros:DB.centros,puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams,_v3SavedAt:Date.now()}));
    _sharePending=false;
  }catch(e){ console.error('[FB share] push error',e.message); }
  _shareBusy=false;
}
async function pushApp(){
  if(_appBusy)return; _appBusy=true;
  try{
    await _refApp.set(cleanUndefined({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{},notificaciones:DB.notificaciones||[],_savedAt:Date.now()}));
    _appPending=false;
  }catch(e){ console.error('[FB app] push error',e.message); }
  _appBusy=false;
}

async function pullShare(){
  const snap=await _refShare.get();
  const remote=snap.val();
  if(remote){
    DB.users=toArr(remote.users);
    DB.secciones=toArr(remote.secciones);
    DB.centros=toArr(remote.centros);
    DB.puestos=toArr(remote.puestos);
    DB.tabulador=toTabulador(remote.tabulador);
    DB.globalParams=toGlobalParams(remote.globalParams);
  }
  _sharedLoaded=true;
  lsSetSafe(LS_SHARE,JSON.stringify({users:DB.users,secciones:DB.secciones,centros:centrosParaCache(DB.centros),puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams}));
}
async function pullApp(){
  const snap=await _refApp.get();
  const remote=snap.val();
  if(remote){
    // Tombstones: unión de lo que este dispositivo y el remoto ya sabían que se
    // borró — así un delete de alguien más no revive algo que yo ya borré, y
    // viceversa. Ver deleteProjectPrompt/deleteDeliverablePrompt.
    const deleted=Object.assign({},DB._deleted||{},remote._deleted||{});
    DB._deleted=deleted;
    DB.projects=toArr(remote.projects).filter(p=>!deleted[p.id]);
    DB.deliverables=toDeliverablesArr(remote.deliverables).filter(d=>!deleted[d.id]);
    DB.notificaciones=toNotifArr(remote.notificaciones);
  }
  _appLoaded=true;
  lsSetSafe(LS_APP,JSON.stringify({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{},notificaciones:DB.notificaciones||[]}));
}

/* ══════════════════════════════════════════════════════
   AUTENTICACIÓN — mismo esquema/login que ya usa la suite
   (sessionStorage 'li_sess', mismo formato compartido con
   Infraestructura y Plan de Inversión).
══════════════════════════════════════════════════════ */
function getLoginList(){
  // Los perfiles reales van primero — si alguien tiene el mismo "usuario" que el
  // acceso maestro, su perfil real gana. El acceso maestro queda de respaldo al final.
  const list=[];
  (DB.users||[]).forEach(u=>{
    const norm=u.customUsername||(u.name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'.');
    list.push({username:norm,password:u.loginPassword||DEFAULT_PASS,role:u.loginRole||'user',name:u.name,userId:u.id});
  });
  list.push({username:ADMIN_USER,password:ADMIN_PASS,role:'admin',name:'Admin',userId:null});
  return list;
}
async function doLogin(){
  const inputU=document.getElementById('li-user').value.trim().toLowerCase();
  const inputP=document.getElementById('li-pass').value;
  const btn=document.getElementById('btn-login');
  const errEl=document.getElementById('login-err');
  errEl.style.display='none';
  btn.disabled=true; btn.textContent='Verificando…';
  try{
    if(!_sharedLoaded) await pullShare();
    if(!_appLoaded) await pullApp();
  }catch(e){ console.error(e); }
  btn.disabled=false; btn.textContent='Iniciar sesión';

  const found=getLoginList().find(u=>u.username===inputU&&u.password===inputP);
  if(!found){
    errEl.textContent='Usuario o contraseña incorrectos.';
    errEl.style.display='block';
    return;
  }
  SESSION={userId:found.userId,name:found.name,role:found.role};
  sessionStorage.setItem('li_sess',JSON.stringify(SESSION));
  enterApp();
}
async function logout(){
  if(!await appConfirm('¿Cerrar sesión?')) return;
  SESSION=null; sessionStorage.removeItem('li_sess'); location.reload();
}
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  applyRole();
  checkYGenerarNotificacionesPT();
  if(location.hash){
    // Se entró desde un link de notificación (correo) — va directo ahí en
    // vez de interrumpir con el resumen de pendientes.
    abrirDesdeHash();
  } else {
    showView('dashboard');
    openResumenPendientesDlg();
  }
}
document.getElementById('btn-login').addEventListener('click',doLogin);
document.getElementById('li-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('li-pass').focus()});
document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* ══════════════════════════════════════════════════════
   PERMISOS — misma lógica ya construida y probada de Secciones
   (Centro de Trabajo agrupado por líder). No se rediseña, solo
   se reutiliza para decidir quién ve/edita qué.
══════════════════════════════════════════════════════ */
function isAdmin(){ return SESSION?.role==='admin'; }
function isLeader(){ return SESSION?.role==='leader'||SESSION?.role==='admin'; }
function myUser(){ return SESSION?.userId?byId(DB.users,SESSION.userId):null; }
function mySeccion(){
  return (DB.secciones||[]).find(s=>s.liderId===SESSION?.userId)||null;
}
// Todas las Secciones que este líder encabeza (puede ser más de una) — único
// criterio de alcance para un líder: admin sigue viendo todo, un líder ve
// nada más lo de su(s) propia(s) Sección(es), nunca la operación completa.
function misSeccionesLider(){
  return (DB.secciones||[]).filter(s=>s.liderId===SESSION?.userId);
}
// Jerarquía de gente — UN SOLO campo la define: users[].reportsTo ("Reporta
// a", editable desde el botón "＋ Agregar reporte directo" en Equipo, o desde
// Editar usuario). Antes también se inferían jefes/equipos a partir de quién
// era "encargado"/"ingeniero" de qué Centro de Trabajo — dos caminos al mismo
// destino que podían contradecirse entre sí (ej. un líder que también es
// encargado de un Centro de su propia Sección aparecía como si "se reportara
// a sí mismo"). Centro de Trabajo se queda para lo que es: el catálogo de
// ingeniería (balanceo, CIF, tabulador) — ya no decide de quién es reporte
// nadie. Los proyectos SÍ se siguen ligando a Centros de Trabajo
// (seccionesDeProyecto/canManageProject) — eso es "de qué área es este
// proyecto", un eje distinto de "quién le reporta a quién".
function getMyReports(){
  if(isAdmin()) return DB.users;
  const ids=new Set([SESSION?.userId]);
  (DB.users||[]).forEach(u=>{ if(u.reportsTo===SESSION?.userId) ids.add(u.id); });
  return (DB.users||[]).filter(u=>ids.has(u.id));
}
function myScopeUserIds(){ return new Set(getMyReports().map(u=>u.id)); }
function seccionOfUser(userId){
  const user=byId(DB.users,userId);
  if(!user?.reportsTo) return null;
  return (DB.secciones||[]).find(sec=>sec.liderId===user.reportsTo)||null;
}
// Puesto/DGP/Funciones de una persona: solo el admin o el líder de la Sección
// a la que pertenece esa persona puede editarlo. Un integrante normal (o un
// líder de OTRA sección) nunca puede editarlo, solo verlo si es el suyo propio.
function canEditPerfil(userId){
  if(isAdmin()) return true;
  const sec=seccionOfUser(userId);
  return !!sec && sec.liderId===SESSION?.userId;
}
// Un Proyecto se liga a uno o varios Centros de Trabajo (p.centroIds), NO a una
// Sección elegida a mano. La(s) Sección(es) responsable(s) se derivan solas:
// se busca en qué Sección(es) cae cada Centro del proyecto (una Sección
// contiene una lista de centroIds) — puede haber más de una si el proyecto
// junta Centros de distintas Secciones.
function seccionesDeProyecto(p){
  if(!p) return [];
  const ids=new Set(p.centroIds||[]);
  if(!ids.size) return [];
  return (DB.secciones||[]).filter(sec=>(sec.centroIds||[]).some(ctId=>ids.has(ctId)));
}
function canManageProject(p){
  if(!p) return false;
  if(isAdmin()) return true;
  // Basta con que UNA de las Secciones derivadas del proyecto sea la del líder
  // (no se requiere que todas lo sean).
  if(seccionesDeProyecto(p).some(sec=>sec.liderId===SESSION?.userId)) return true;
  // FIX (revisión post-rewrite): antes, si ningún Centro del proyecto caía todavía
  // en ninguna Sección, SOLO el admin podía manejarlo — eso significa que, en
  // producción, con las Secciones recién empezando a armarse, TODOS los líderes
  // pierden de golpe el control de TODOS sus proyectos existentes. Este respaldo
  // se lo devuelve a quien creó el proyecto o a su equipo (por Secciones/reportsTo
  // vía getMyReports), y deja de aplicar solo, sin tocar nada, en cuanto el
  // proyecto quede cubierto por una Sección real.
  if(!seccionesDeProyecto(p).length){
    if(p.createdBy===SESSION?.userId) return true;
    const scope=new Set(getMyReports().map(u=>u.id));
    return (DB.deliverables||[]).some(d=>d.projectId===p.id&&scope.has(d.assigneeId));
  }
  return false;
}
function canManageDeliverable(d){
  if(!d) return false;
  if(isAdmin()) return true;
  const p=byId(DB.projects,d.projectId);
  if(!p || !canManageProject(p)) return false;
  // FIX (revisión post-rewrite): antes, con poder manejar el PROYECTO ya bastaba para
  // editar/aprobar/borrar CUALQUIER entregable suyo — pero un proyecto puede tocar
  // varios Centros/Secciones, así que un líder terminaba pudiendo tocar entregables de
  // OTRO equipo dentro del mismo proyecto compartido. Ahora también se exige que el
  // responsable del entregable sea gente de su propio alcance (getMyReports).
  const scope=new Set(getMyReports().map(u=>u.id));
  return scope.has(d.assigneeId);
}
function canUpdateOwnDeliverable(d){
  // El responsable asignado siempre puede actualizar el estatus de lo suyo,
  // aunque no pueda crear/editar/borrar el proyecto o el entregable completo.
  return d && d.assigneeId===SESSION?.userId;
}
function applyRole(){
  if(!SESSION) return;
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=isAdmin()?'':'none');
  document.querySelectorAll('.leader-only').forEach(el=>el.style.display=isLeader()?'':'none');
  const u=myUser();
  document.getElementById('sb-name').textContent=SESSION.name||'—';
  document.getElementById('sb-role').textContent=isAdmin()?'Admin':(SESSION.role==='leader'?'Líder de sección':'Integrante');
  document.getElementById('sb-av').textContent=initials(SESSION.name);

// Se refresca en cada render (no solo al abrir el panel) — así el número se
// actualiza solo cuando llega algo nuevo por Firebase, sin tener que abrir
// la campana para enterarte.

/* ══════════════════════════════════════════════════════
   PROYECTOS / ENTREGABLES
══════════════════════════════════════════════════════ */
function computeProjectStatus(p){
  const dels=(DB.deliverables||[]).filter(d=>d.projectId===p.id);
  if(!dels.length) return 'Activo';
  return dels.every(d=>d.status==='Entregado') ? 'Cerrado' : 'Activo';
}
function projectProgress(p){
  const dels=(DB.deliverables||[]).filter(d=>d.projectId===p.id);
  const done=dels.filter(d=>d.status==='Entregado').length;
  return {done,total:dels.length};
}
function visibleProjects(){
  if(isAdmin()) return DB.projects||[];
  if(isLeader()){
    // Un líder ve solo los proyectos de su(s) propia(s) Sección(es) — nunca
    // la operación completa (pedido explícito: "para cada líder dejale solo
    // lo de sus reportes y para mi [admin] todos").
    const secs=misSeccionesLider();
    if(!secs.length) return [];
    const vistos=new Set();
    const out=[];
    secs.forEach(sec=>seccionScope(sec).projects.forEach(p=>{ if(!vistos.has(p.id)){ vistos.add(p.id); out.push(p); } }));
    return out;
  }
  const mine=SESSION?.userId;
  return (DB.projects||[]).filter(p=>(DB.deliverables||[]).some(d=>d.projectId===p.id&&d.assigneeId===mine));
}
function visibleDeliverables(projectId){
  const all=(DB.deliverables||[]).filter(d=>d.projectId===projectId);
  if(isLeader()) return all;
  return all.filter(d=>d.assigneeId===SESSION?.userId);
}
let _currentProjectId=null;
let _proyectosScrollY=0; // dónde estabas desplazado en la lista de Proyectos antes de
                         // entrar a un detalle — se restaura al volver (ver openProjectDetail
                         // y los botones "← Volver a Proyectos").
let _profileUserId=null; // a quién muestra "Mi puesto" — null = el propio usuario en sesión
let _currentCentroId=null; // qué centro muestra Centro de Trabajo — null = la lista
let _ctTab='distribucion'; // qué pestaña del detalle de centro está activa
let _adminTab='equipo'; // qué pestaña de Administración está activa
let _ctCifChart=null; // instancia Chart.js de la dona de CIF — se destruye/recrea en cada render
let _currentMaquinaId=null; // qué maquina muestra el tab "Máquinas" — null = la lista
let _maqTab='id'; // sub-tab del detalle de maquina: id | vars | roi
let _openVarId=null; // que variable esta expandida en el tab Variables
let _reporteMaqSel=null; // Set de ids de maquina marcados en "ROI Máquinas" para el PDF — null = aun no inicializado (se marcan todas)

function renderProyectos(root){
  // Si hay un proyecto abierto (detalle), un re-render (p.ej. tras guardar) debe
  // quedarse en el detalle — solo el nav de "Proyectos" limpia _currentProjectId.
  if(_currentProjectId){ renderProyectoDetail(root); return; }
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando proyectos…'); return; }
  const canCreate=isLeader();
  const projects=visibleProjects();
  const tab=root._tab||'activos'; // 'activos' es el default al entrar — nunca se mezclan con 'cerrados'
  const countActivos=projects.filter(p=>computeProjectStatus(p)==='Activo').length;
  const countCerrados=projects.filter(p=>computeProjectStatus(p)==='Cerrado').length;
  const enTab=projects
    .filter(p=>computeProjectStatus(p)===(tab==='activos'?'Activo':'Cerrado'))
    .sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

  // Filtro por líder — solo tiene sentido si hay más de una Sección con líder
  // asignado; si no, se oculta en vez de mostrar un select vacío/inútil.
  const liderFilter=root._liderFilter||'';
  const liderOpts=[...new Map(
    (DB.secciones||[]).filter(s=>s.liderId).map(s=>[s.liderId, byId(DB.users,s.liderId)])
  ).values()].filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
  // Filtro por persona — para acotar a lo suyo y poder mandarle un aviso
  // individual (no solo por equipo). Mismo alcance de "a quién puedo ver"
  // que ya usa el resto de la app (isAdmin ve a todos, un líder solo a los
  // suyos).
  const userFilter=root._userFilter||'';
  // Solo admin/líder puede filtrar por persona y avisar por correo — un
  // integrante normal no debe ver esto ni de él mismo (getMyReports() siempre
  // se incluye a sí mismo, por eso antes se colaba este acceso).
  const userOpts=isLeader()?(isAdmin()?DB.users:getMyReports()).slice().sort((a,b)=>a.name.localeCompare(b.name)):[];

  root.innerHTML=`
    <div class="view-head">
      <div><h1>Proyectos</h1><div class="view-sub">Entregables y fechas de tu área, en un solo lugar.</div></div>
      ${canCreate?'<button class="btn primary" id="btn-new-project">＋ Nuevo proyecto</button>':''}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:${liderOpts.length>1||userOpts.length?'10px':'16px'};flex-wrap:wrap;align-items:center" id="proj-tabs">
      <button class="btn sm ${tab==='activos'?'primary':''}" data-t="activos">Activos <span class="pill ${tab==='activos'?'ok':'muted'}" style="margin-left:6px">${countActivos}</span></button>
      <button class="btn sm ${tab==='cerrados'?'primary':''}" data-t="cerrados">Cerrados <span class="pill ${tab==='cerrados'?'ok':'muted'}" style="margin-left:6px">${countCerrados}</span></button>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
      ${liderOpts.length>1?`<div style="display:flex;gap:8px;align-items:center">
        <label class="small muted" for="proj-lider-filter">Filtrar por líder:</label>
        <select class="select-input" id="proj-lider-filter" style="width:auto;padding:7px 10px;font-size:13px">
          <option value="">Todos los líderes</option>
          ${liderOpts.map(u=>`<option value="${u.id}"${liderFilter===u.id?' selected':''}>${esc(u.name)}</option>`).join('')}
        </select>
      </div>`:''}
      ${userOpts.length?`<div style="display:flex;gap:8px;align-items:center">
        <label class="small muted" for="proj-user-filter">Filtrar por persona:</label>
        <select class="select-input" id="proj-user-filter" style="width:auto;padding:7px 10px;font-size:13px">
          <option value="">Todas las personas</option>
          ${userOpts.map(u=>`<option value="${u.id}"${userFilter===u.id?' selected':''}>${esc(u.name)}</option>`).join('')}
        </select>
      </div>`:''}
    </div>
    <div id="proj-resumen-individual"></div>
    <div id="proj-grid"></div>
  `;
  document.getElementById('proj-tabs').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ root._tab=b.dataset.t; renderProyectos(root); });
  });
  if(canCreate) document.getElementById('btn-new-project').addEventListener('click',openNewProjectDlg);
  const liderSel=document.getElementById('proj-lider-filter');
  if(liderSel) liderSel.addEventListener('change',()=>{ root._liderFilter=liderSel.value; renderProyectos(root); });
  const userSel=document.getElementById('proj-user-filter');
  if(userSel) userSel.addEventListener('change',()=>{ root._userFilter=userSel.value; renderProyectos(root); });
  const resumenCont=document.getElementById('proj-resumen-individual');
  if(userFilter){
    resumenCont.innerHTML=resumenIndividualHTML(userFilter);
    document.getElementById('btn-aviso-individual')?.addEventListener('click',()=>{ enviarAvisoIndividual(userFilter); renderProyectos(root); });
    resumenCont.querySelectorAll('[data-ir-proyecto]').forEach(el=>{
      el.addEventListener('click',()=>irAProyectoEntregable(el.dataset.irProyecto,el.dataset.irEntregable));
    });
  }

  // Proyectos con al menos un entregable de la persona filtrada (misma lógica
  // de "el proyecto entero se ve" que ya usa el filtro por líder).
  const enTabPorPersona=userFilter
    ? enTab.filter(p=>(DB.deliverables||[]).some(d=>d.projectId===p.id&&d.assigneeId===userFilter))
    : enTab;

  const grid=document.getElementById('proj-grid');
  if(!projects.length){
    grid.innerHTML=emptyStateHTML('Sin proyectos todavía',
      canCreate?'Da clic en "Nuevo proyecto" para crear el primero.':'Cuando te asignen un entregable, el proyecto aparecerá aquí.');
    return;
  }
  if(!enTabPorPersona.length){
    grid.innerHTML=emptyStateHTML(
      tab==='activos'?'Sin proyectos activos':'Sin proyectos cerrados todavía',
      tab==='activos'?'Todos los proyectos de tu alcance están cerrados por ahora.':'Aquí aparecerán los proyectos en cuanto se cierren (todos sus entregables en "Entregado").');
    return;
  }
  grid.className='';
  grid.innerHTML=proyectosAgrupadosHTML(enTabPorPersona,liderFilter);
  if(!grid.innerHTML.trim()){
    const liderNombre=liderOpts.find(u=>u.id===liderFilter)?.name||'';
    grid.innerHTML=emptyStateHTML('Sin proyectos para este líder',
      `${liderNombre?esc(liderNombre)+' no tiene':'Ese líder no tiene'} proyectos en esta pestaña ahora mismo.`);
    return;

  grid.querySelectorAll('[data-open-project]').forEach(el=>{

// Subgrupos por Centro de Trabajo dentro de un grupo ya filtrado. ctIds trae
// el orden de los Centros a mostrar (los de la Sección, o los detectados en
// "Sin equipo asignado"). Los proyectos sin ningún CT en esa lista (p.ej.
// centroIds:[]) caen aparte, al final, bajo "Sin centro de trabajo".
function ctSubgruposHTML(projectsInGroup, ctIds){
  let html='';
  const cubiertos=new Set();
  ctIds.forEach(ctId=>{
    const ct=byId(DB.centros,ctId); if(!ct) return;
    const enCT=projectsInGroup.filter(p=>(p.centroIds||[]).includes(ctId));
    if(!enCT.length) return;
    cubiertos.add(ctId);
    html+=`<details class="proj-subgroup" style="margin-bottom:12px">
      <summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--accent);list-style:none">🏭 ${esc(ct.nombre)} <span class="pill muted" style="margin-left:4px">${enCT.length}</span></summary>
      <div class="proj-cards-scroll" style="margin-top:8px">${enCT.map(projectCardHTML).join('')}</div>
    </details>`;
  });
  const resto=projectsInGroup.filter(p=>!(p.centroIds||[]).some(id=>cubiertos.has(id)));
  if(resto.length){
    html+=`<div style="font-weight:600;font-size:13px;color:var(--muted);margin:4px 0 8px">Sin centro de trabajo <span class="pill muted" style="margin-left:4px">${resto.length}</span></div>
      <div class="proj-cards-scroll">${resto.map(projectCardHTML).join('')}</div>`;
  }
  return html;
}

/* ══════════════════════════════════════════════════════
   NOTIFICACIONES — en la app son automáticas (se crean solas al pasar cada
   evento real: nuevo proyecto, nuevo entregable, aprobación); por correo NO
   hay backend de email en esta app estática, así que cada notificación trae
   un botón ✉️ que abre un mailto: con el link directo ya adentro — quien la
   ve decide si de verdad la manda. El link (#p=<proyecto>&d=<entregable>)
   funciona incluso si a quien se lo mandas no había iniciado sesión: entra,
   hace login, y cae directo ahí (ver abrirDesdeHash/enterApp).
══════════════════════════════════════════════════════ */
function crearNotificacion({tipo,texto,proyectoId,entregableId,paraUserIds}){
  DB.notificaciones=DB.notificaciones||[];
  const n={
    id:uid('ntf'), tipo, texto,
    proyectoId:proyectoId||null, entregableId:entregableId||null,
    paraUserIds:[...new Set((paraUserIds||[]).filter(Boolean))],
    leidoPor:[], createdAt:Date.now(), createdBy:SESSION?.userId||null,
    emailEnviado:null, // {at,by} — se llena cuando alguien de verdad le da clic a ✉️
    descartado:null, // {at,by} — "no hace falta avisar esto por correo", sin mandar nada
  };
  DB.notificaciones.unshift(n);
  if(DB.notificaciones.length>200) DB.notificaciones.length=200; // no crece sin límite
  return n;
}
// 🔔 Campana personal — SOLO lo que es para ti, nunca "porque eres admin".
// Es tu bandeja de "me toca a mí", separada a propósito de la de envío.
function notificacionesVisibles(){
  return (DB.notificaciones||[]).filter(n=>n.paraUserIds.includes(SESSION?.userId));
}
function notifSinLeer(){
  return notificacionesVisibles().filter(n=>!n.leidoPor.includes(SESSION?.userId));
}
// 📤 Ícono de envío — solo admin/líder. Es la bandeja de "avisar a mi gente
// por correo", nunca se mezcla con la campana personal de cada quien. Admin
// ve todas; un líder solo las de su propia gente (mismo alcance que ya usa
// el resto de la app — getMyReports).
function notificacionesParaEnviar(){
  if(isAdmin()) return DB.notificaciones||[];
  if(isLeader()){
    const misIds=new Set(getMyReports().map(u=>u.id));
    return (DB.notificaciones||[]).filter(n=>n.paraUserIds.some(uid=>misIds.has(uid)));
  }
  return [];
}
function notifPendientesDeEnviar(){
  return notificacionesParaEnviar().filter(n=>!n.emailEnviado&&!n.descartado);
}
// "Descartar" = ya no hace falta avisarlo por correo (se resolvió de otra
// forma, ya no aplica, etc.) — sale del pendiente sin mandar nada, así es
// como se "limpia" la bandeja de envío sin forzar un correo por cada cosa.
function descartarNotificacion(id){
  const n=byId(DB.notificaciones,id); if(!n) return;
  n.descartado={at:Date.now(),by:SESSION?.userId||null};
  saveDB();
}
// Link "oficial" para los correos — MIENTRAS la app siga sirviéndose desde
// localhost (tu servidor de desarrollo), este link SOLO funciona en TU
// computadora — nadie más puede abrirlo. En cuanto la publiquemos en Firebase
// Hosting (o el dominio real que decidas), cambia este único valor y todos
// los correos —nuevos y ya mandados que alguien vuelva a abrir— apuntan bien.
const PUBLIC_APP_URL=(location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? location.origin+location.pathname // provisional — ver nota arriba
  : location.origin+location.pathname;
function linkNotificacion(n){
  let h='#p='+encodeURIComponent(n.proyectoId||'');
  if(n.entregableId) h+='&d='+encodeURIComponent(n.entregableId);
  return PUBLIC_APP_URL+h;
}
// Días entre hoy (o entre la creación) y la fecha límite — para el "tienes
// tantos días" del correo. Se usa createdAt (automático, nunca se captura a
// mano) contra dueDate (lo único que sí se asigna a mano).
function diasParaEntrega(createdAt,dueDate){
  if(!dueDate) return null;
  const inicio=createdAt?new Date(createdAt):new Date();
  inicio.setHours(0,0,0,0);
  const limite=new Date(dueDate+'T00:00:00');
  return Math.round((limite-inicio)/86400000);
}
function marcarNotifLeida(id){
  const n=byId(DB.notificaciones,id); if(!n) return;
  if(!n.leidoPor.includes(SESSION?.userId)) n.leidoPor.push(SESSION.userId);
  saveDB();
}
function irANotificacion(n){
  marcarNotifLeida(n.id);
  document.getElementById('dlg-notif').close();
  if(!n.proyectoId||!byId(DB.projects,n.proyectoId)){ toast('Ese proyecto ya no existe','err'); return; }
  location.hash='p='+encodeURIComponent(n.proyectoId)+(n.entregableId?'&d='+encodeURIComponent(n.entregableId):'');
  abrirDesdeHash();
}
// Redacción del correo — enfocada en lo que a la persona le importa: cuánto
// tiempo tiene, que la fecha es fija, y la puerta abierta a avisar si algo no
// va a poder cumplirse. Cambia según el tipo de notificación; siempre lleva
// el link oficial adentro.
function emailBodyParaNotificacion(n){
  const quienManda=SESSION?.name||'Tu líder';
  const p=n.proyectoId?byId(DB.projects,n.proyectoId):null;
  const d=n.entregableId?byId(DB.deliverables,n.entregableId):null;
  const destino=byId(DB.users,n.paraUserIds[0]);
  const nombrePersona=destino?destino.name.split(' ')[0]:'';
  const saludo=nombrePersona?`Hola ${nombrePersona},`:'Hola,';
  const link=linkNotificacion(n);
  const firma=`\n\nCualquier duda, avísame para platicarlo.\n\n— ${quienManda}`;

  if(n.tipo==='entregable_nuevo'&&d){
    const dias=diasParaEntrega(d.createdAt,d.dueDate);
    // Si la fecha límite quedó capturada antes que hoy (entregable atrasado
    // desde que se creó, o un registro histórico), "-N días" no dice nada —
    // se avisa como urgente en vez de un número negativo sin sentido.
    const diasLinea = dias===null ? '' : dias>0 ? `Tienes ${dias} día${dias!==1?'s':''} para entregarlo — fecha límite: ${fmtDate(d.dueDate)}.\n`
      : dias===0 ? `Fecha límite: hoy (${fmtDate(d.dueDate)}) — es urgente.\n`
      : `Fecha límite: ${fmtDate(d.dueDate)} — ya venció, es urgente.\n`;
    return {
      subject:`Nuevo entregable: "${d.name}"`,
      body:`${saludo} te acabo de asignar el entregable "${d.name}"${p?' en el proyecto "'+p.name+'"':''}.\n\n`
        +diasLinea
        +`Recuerda que las fechas son fijas: si ves que no vas a poder cumplirla, avísame antes para platicarlo, no hasta el último día.\n\n`
        +`Ve el detalle aquí:\n${link}${firma}`,
    };
  }
  if(n.tipo==='proyecto_nuevo'&&p){
    return {
      subject:`Nuevo proyecto: "${p.name}"`,
      body:`${saludo} se abrió un nuevo proyecto en tu área: "${p.name}", con fecha límite ${fmtDate(p.dueDate)}.\n\n`
        +`Ve el detalle y asigna los entregables que le correspondan a tu equipo aquí:\n${link}${firma}`,
    };
  }
  if(n.tipo==='aprobacion'&&d){
    return {
      subject:`Se aprobó: "${d.name}"`,
      body:`${saludo} se aprobó tu entregable "${d.name}"${p?' en "'+p.name+'"':''}. Bien hecho.\n\n`
        +`Ve el detalle aquí:\n${link}${firma}`,
    };
  }
  // Genérico — cualquier otro tipo (aviso_individual, etc.)
  return { subject:'LI · Procesos — '+n.texto, body:`${saludo}\n\n${n.texto}\n\nVe el detalle aquí:\n${link}${firma}` };
}
function avisarNotifPorCorreo(n){
  const destinatarios=[...new Set(n.paraUserIds.map(uid=>byId(DB.users,uid)?.email).filter(e=>e&&e.includes('@')))];
  if(!destinatarios.length){ toast('Esa persona no tiene correo capturado (Administración → Usuarios)','err'); return; }
  const {subject,body}=emailBodyParaNotificacion(n);
  // Registra que SÍ se mandó (o al menos que se abrió el cliente de correo con
  // todo listo) — es lo único que esta app puede saber con certeza, ya que no
  // hay backend de email: no puede confirmar que de verdad le diste "Enviar"
  // en Outlook, pero sí que tú abriste el link para hacerlo.
  n.emailEnviado={at:Date.now(),by:SESSION?.userId||null};
  saveDB();
  abrirMailto(`mailto:${destinatarios.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
}
// Respaldo cuando mailto: no abre nada — copia al portapapeles en vez de
// abrir el cliente de correo. No marca emailEnviado (no hay forma de saber
// si de verdad se llegó a pegar/mandar; ese estatus queda solo para cuando
// sí se disparó el mailto: real).
function copiarNotifPorCorreo(n){
  const destinatarios=[...new Set(n.paraUserIds.map(uid=>byId(DB.users,uid)?.email).filter(e=>e&&e.includes('@')))];
  const {subject,body}=emailBodyParaNotificacion(n);
  const paraLinea=destinatarios.length?destinatarios.join(', '):'(sin correo capturado — Administración → Usuarios)';
  copiarAlPortapapeles(`Para: ${paraLinea}\nAsunto: ${subject}\n\n${body}`);
}

// Deep link — #p=<proyectoId>&d=<entregableId opcional>. Abre el proyecto y,
// si viene un entregable, hace scroll y lo resalta un momento.
// Abre un proyecto (y opcionalmente resalta un entregable dentro) — lo usan
// el link de notificaciones (#p=&d=) Y cualquier lista en pantalla que
// apunte a un entregable/proyecto concreto (ej. el resumen por persona).
function irAProyectoEntregable(pid,did){
  if(!pid||!byId(DB.projects,pid)) return;
  _currentProjectId=pid;
  showView('proyectos');
  if(did){
    setTimeout(()=>{
      const row=document.getElementById('deliv-row-'+did);
      if(!row) return;
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.style.transition='background .4s';
      row.style.background='var(--accent-bg)';
      setTimeout(()=>{ row.style.background=''; },2500);
    },80);
  }
}
function abrirDesdeHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h||!dataReady()) return;
  const params=new URLSearchParams(h);
  irAProyectoEntregable(params.get('p'),params.get('d'));
  // Se limpia el hash en cuanto se usa — si se queda pegado en la URL, la
  // próxima vez que entres a la app (aunque sea horas después) cree que
  // "vienes de un link" y se salta el Resumen de pendientes que sí debería
  // salir siempre al hacer login normal. history.replaceState no dispara
  // hashchange (a diferencia de location.hash=''), así que no hay rebote.
  history.replaceState(null,'',location.pathname+location.search);
}
window.addEventListener('hashchange',abrirDesdeHash);

async function deleteProjectPrompt(id){
  const p=byId(DB.projects,id); if(!p) return;
  // Respaldo: el botón ya está oculto salvo para quien administra este proyecto
  // (admin, o el líder de su Sección/equipo) — esto cubre por si se llega a llamar
  // esta función desde otro lado. Ya no se filtra entre equipos porque

  if(!canManageProject(p)){ toast('No tienes permiso para eliminar este proyecto','err'); return; }

  if(!await appConfirm(`¿Eliminar el proyecto "${p.name}"?`,n?`Se eliminarán también sus ${n} entregable${n!==1?'s':''}.`:'')) return;
  if(!DB._deleted) DB._deleted={};

  DB.projects=DB.projects.filter(x=>x.id!==id);
  DB.deliverables=DB.deliverables.filter(d=>d.projectId!==id);

/* ══════════════════════════════════════════════════════
   REPORTES — solo 2, a propósito (no igualar en cantidad a la app vieja):
   Atrasados/por vencer, y Carga por persona.
══════════════════════════════════════════════════════ */
const PROX_DIAS=5; // ventana de "por vencer"
function reportDeliverables(){
  if(isAdmin()) return DB.deliverables||[];
  if(isLeader()){
    const secs=misSeccionesLider();
    if(!secs.length) return [];
    const vistos=new Set();
    const out=[];
    secs.forEach(sec=>seccionScope(sec).deliverables.forEach(d=>{ if(!vistos.has(d.id)){ vistos.add(d.id); out.push(d); } }));
    return out;
  }
  return (DB.deliverables||[]).filter(d=>d.assigneeId===SESSION?.userId);
}
function renderReportes(root){
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando reportes…'); return; }
  // Filtrar por líder — solo tiene sentido si hay más de una Sección con
  // líder asignado, y solo para quien puede ver más de la suya (admin ve
  // todas; un líder ya está acotado a la suya por reportDeliverables, así
  // que filtrar no le cambiaría nada).
  const liderOpts=isAdmin()?[...new Map(
    (DB.secciones||[]).filter(s=>s.liderId).map(s=>[s.liderId, byId(DB.users,s.liderId)])
  ).values()].filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)):[];
  const liderFilter=root._repLiderFilter||'';
  const secFiltrada=liderFilter?(DB.secciones||[]).find(s=>s.liderId===liderFilter):null;
  const scope=secFiltrada?seccionScope(secFiltrada):null;
  const delsScope=scope?scope.deliverables:reportDeliverables();
  const peopleScope=scope?scope.people:(isLeader()?getMyReports():[myUser()].filter(Boolean));

// Constructores puros de HTML (sin efectos, sin ids fijos) — los usa tanto la
// vista Reportes (alcance global vía reportDeliverables/getMyReports) como el
// Dashboard nuevo (alcance por Sección). Una sola lógica, dos consumidores.
function vencidosTableHTML(dels){
  const today=todayISO();
  const limite=todayISO(new Date(Date.now()+PROX_DIAS*86400000));
  const pend=dels.filter(d=>isOpenOverdueStatus(d.status)&&d.dueDate);
  const atrasados=pend.filter(d=>d.dueDate<today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const porVencer=pend.filter(d=>d.dueDate>=today&&d.dueDate<=limite).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  if(!atrasados.length&&!porVencer.length){
    return emptyStateHTML('Nada atrasado ni por vencer','Todo está al día en los próximos '+PROX_DIAS+' días.');
  }
  function rowsHTML(list,tag){
    return list.map(d=>{
      const p=byId(DB.projects,d.projectId);
      const u=byId(DB.users,d.assigneeId);
      const dias=Math.round((new Date(d.dueDate)-new Date(today))/86400000);
      return `<tr>
        <td>${esc(d.name)}</td>
        <td class="small muted">${p?esc(p.name):'—'}</td>
        <td>${u?esc(u.name):'—'}</td>
        <td>${fmtDate(d.dueDate)}</td>
        <td>${tag==='atrasado'?`<span class="pill bad">${Math.abs(dias)} día${Math.abs(dias)!==1?'s':''} tarde</span>`:`<span class="pill warn">en ${dias} día${dias!==1?'s':''}</span>`}</td>
      </tr>`;
    }).join('');
  }
  return `<div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
    <thead><tr><th>Entregable</th><th>Proyecto</th><th>Responsable</th><th>Fecha</th><th>Situación</th></tr></thead>
    <tbody>${rowsHTML(atrasados,'atrasado')}${rowsHTML(porVencer,'proximo')}</tbody>
  </table></div>`;
}
function cargaListHTML(people){
  if(!people.length) return emptyStateHTML('Sin datos todavía','No encontramos personas para mostrar aquí.');
  const rows=people.map(u=>({u,carga:cargaAbierta(u.id)})).sort((a,b)=>b.carga-a.carga);
  const max=Math.max(1,...rows.map(r=>r.carga));
  return `<div class="card">${rows.map(r=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:120px;font-size:12.5px;flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.u.name)}</div>
      <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${r.carga/max*100}%"></div></div>
      <div style="width:70px;text-align:right;font-size:12.5px" class="muted">${r.carga} abierto${r.carga!==1?'s':''}</div>
    </div>`).join('')}</div>`;
}
function renderReporteVencidos(dels){
  const el=document.getElementById('rep-vencidos'); if(!el) return;
  el.innerHTML=vencidosTableHTML(dels||reportDeliverables());
}
function renderReporteCarga(people){
  const el=document.getElementById('rep-carga'); if(!el) return;

/* ══════════════════════════════════════════════════════
   RESUMEN AL ENTRAR — ventana que aparece justo después de iniciar sesión
   (enterApp) con Actividad/Proyecto/Responsable/Líder/Avance de todo lo
   pendiente. Mismo alcance que reportDeliverables() (todo para líder/admin,
   solo lo propio para integrante) — una sola fuente de "qué es mío".
══════════════════════════════════════════════════════ */
function resumenPendientesRows(dels){
  const today=todayISO();
  return (dels||reportDeliverables())
    .filter(d=>d.status!=='Entregado') // todo lo no entregado (incluye "En pausa")
    .map(d=>{
      const p=byId(DB.projects,d.projectId);
      const u=byId(DB.users,d.assigneeId);
      const secs=p?seccionesDeProyecto(p):[];
      const liderNombres=secs.map(s=>byId(DB.users,s.liderId)).filter(Boolean).map(l=>l.name);
      const {done,total}=p?projectProgress(p):{done:0,total:0};
      return {
        actividad:d.name,
        proyecto:p?p.name:'—',
        responsable:u?u.name:'—',
        lider:liderNombres.length?[...new Set(liderNombres)].join(', '):'—',
        dueDate:d.dueDate,
        overdue:d.dueDate&&d.dueDate<today&&isOpenOverdueStatus(d.status),
        pct:total?Math.round(done/total*100):0,
        secciones:secs, // solo para agrupar el PDF por equipo — no se pinta tal cual
      };
    })
    .sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
}
// Mismas filas de arriba, agrupadas por Sección/equipo (para el PDF) — un
// renglón puede repetirse bajo 2 equipos si su proyecto pertenece a 2
// Secciones, igual que ya pasa en Proyectos; "Sin equipo asignado" al final.
function resumenPorEquipoGrupos(dels){
  const rows=resumenPendientesRows(dels);
  const grupos=[];
  (DB.secciones||[]).forEach(sec=>{
    const enSec=rows.filter(r=>r.secciones.some(s=>s.id===sec.id));
    if(enSec.length) grupos.push({nombre:sec.nombre,lider:byId(DB.users,sec.liderId)?.name||'',rows:enSec});
  });
  const sinEquipo=rows.filter(r=>r.secciones.length===0);
  if(sinEquipo.length) grupos.push({nombre:'Sin equipo asignado',lider:'',rows:sinEquipo});
  return grupos;
}
function resumenPdfHTML(dels,titulo){
  const grupos=resumenPorEquipoGrupos(dels);
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const gruposHTML=grupos.map(g=>`
    <h2>${esc(g.nombre)}${g.lider?` — líder ${esc(g.lider)}`:''} <span class="n">(${g.rows.length})</span></h2>
    <table>
      <thead><tr><th>Actividad</th><th>Proyecto</th><th>Responsable</th><th>Entrega</th><th>Avance</th></tr></thead>
      <tbody>${g.rows.map(r=>`<tr>
        <td>${esc(r.actividad)}</td><td>${esc(r.proyecto)}</td><td>${esc(r.responsable)}</td>
        <td${r.overdue?' class="bad"':''}>${fmtDate(r.dueDate)}</td><td>${r.pct}%</td>
      </tr>`).join('')}</tbody>
    </table>`).join('');
  const tituloReal=titulo||'Resumen de pendientes por equipo';
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(tituloReal)}</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;padding:28px;color:#222}
  h1{font-size:19px;margin:0 0 2px}
  .fecha{color:#666;font-size:11.5px;margin-bottom:22px}
  h2{font-size:13.5px;margin:22px 0 6px;border-bottom:2px solid #333;padding-bottom:4px}
  h2 .n{font-weight:400;color:#666}
  table{width:100%;border-collapse:collapse;margin-bottom:4px;font-size:11px}
  th,td{border:1px solid #ccc;padding:5px 7px;text-align:left}
  th{background:#f0f0f0}
  td.bad{color:#a6402f;font-weight:700}
  @media print{ h2{page-break-after:avoid} tr{page-break-inside:avoid} }
</style></head>
<body>
  <h1>📋 ${esc(tituloReal)}</h1>
  <div class="fecha">Generado el ${fecha}</div>
  ${gruposHTML||'<p>Nada pendiente ahora mismo.</p>'}
</body></html>`;
}
// Ventana nueva abierta de forma SÍNCRONA (antes de escribir el HTML) — así
// no la bloquea el bloqueador de pop-ups, que solo permite window.open()
// disparado directo desde el clic, no después de un await o un setTimeout.
// dels/titulo opcionales — sin ellos usa tu alcance completo (como siempre);
// con ellos (ej. desde el filtro por líder en Reportes) genera el PDF SOLO
// de esa Sección.
function descargarResumenPDF(dels,titulo){
  const w=window.open('','_blank');
  if(!w){ toast('Tu navegador bloqueó la ventana — permite pop-ups para este sitio e intenta de nuevo.','err'); return; }
  w.document.write(resumenPdfHTML(dels,titulo));
  w.document.close();
  w.focus();
  w.print();
}
// Mismo alcance que el diálogo (reportDeliverables): admin = todo, líder =
// solo su(s) Sección(es), integrante = lo suyo. Un solo correo con todo lo
// pendiente en ese alcance, a todos los responsables + líderes involucrados.
// El cuerpo del correo ahora es el MISMO contenido que la hoja del PDF —
// misma fuente (resumenPorEquipoGrupos), mismos grupos, mismas columnas
// (Actividad/Proyecto/Responsable/Entrega/Avance), fila por fila completa
// (no un resumen recortado). La única razón por la que no es literal el PDF
// es que mailto: solo manda texto plano — ningún correo puede llevar HTML ni
// adjuntos por este camino (limitación real del navegador, no de la app) —
// así que se acomoda como texto ordenado que dice exactamente lo mismo.
// Arma destinatarios/asunto/cuerpo — lo comparten enviarResumenPendientesCorreo
// (mailto:) y copiarResumenPendientesCorreo (portapapeles, respaldo para
// cuando mailto: no abre nada — depende de que Windows/el navegador tengan
// bien enganchado un programa de correo, y eso a veces falla o se cuelga
// sin avisar). null si no hay nada pendiente.
function resumenPendientesEmailPartes(delsOverride,tituloAlcance){
  const dels=(delsOverride||reportDeliverables()).filter(d=>d.status!=='Entregado');
  if(!dels.length) return null;
  const emails=new Set();
  dels.forEach(d=>{
    const u=byId(DB.users,d.assigneeId); if(u?.email) emails.add(u.email);
    const p=byId(DB.projects,d.projectId);
    if(p) seccionesDeProyecto(p).forEach(sec=>{ const l=byId(DB.users,sec.liderId); if(l?.email) emails.add(l.email); });
  });
  const destinatarios=[...emails];
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const titulo=tituloAlcance||(isAdmin()?'toda la operación':'tu equipo');
  const grupos=resumenPorEquipoGrupos(dels); // misma fuente que usa el PDF
  // Outlook (y la mayoría de webmails) recorta los espacios al inicio de línea
  // en texto plano, así que la sangría no sirve para dar jerarquía visual — en
  // vez de eso cada entregable va en su propio bloque de 2 líneas separado por
  // una línea en blanco del siguiente, para que no se corran entre sí.
  const cuerpoCompleto=grupos.map(g=>{
    let s=`▌ ${g.nombre}${g.lider?' — líder '+g.lider:''} (${g.rows.length})\n`+'─'.repeat(44);
    s+='\n\n'+g.rows.map((r,i)=>
      `${i+1}. ${r.actividad}\n${r.proyecto} · ${r.responsable} · Entrega: ${fmtDate(r.dueDate)}${r.overdue?' — ATRASADO':''} · Avance: ${r.pct}%`
    ).join('\n\n');
    return s;
  }).join('\n\n\n');
  const subject=`Resumen de pendientes — ${titulo} — ${fecha}`;
  const body=`Resumen de pendientes — ${titulo}\nGenerado el ${fecha}\n\n${cuerpoCompleto}\n\nEnviado desde LI · Procesos.`;
  return {destinatarios,subject,body,grupos,titulo,fecha};
}
function enviarResumenPendientesCorreo(delsOverride,tituloAlcance){
  const partes=resumenPendientesEmailPartes(delsOverride,tituloAlcance);
  if(!partes){ toast('No hay nada pendiente para avisar','err'); return; }
  if(!partes.destinatarios.length){ toast('Nadie en ese alcance tiene correo capturado (Administración → Usuarios)','err'); return; }
  const {destinatarios,subject,grupos,titulo,fecha}=partes;
  let {body}=partes;
  let mailto=`mailto:${destinatarios.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  // mailto: sí tiene un límite real, pero es más alto de lo que parece —
  // solo se recorta si de verdad es enorme (equipos muy grandes), y aun así
  // conserva los grupos y conteos, no solo un aviso genérico.
  if(mailto.length>6000){
    const cuerpoCorto=grupos.map(g=>`${g.nombre}${g.lider?' — líder '+g.lider:''}: ${g.rows.length} pendiente(s)`).join('\n');
    const bodyCorto=`Resumen de pendientes — ${titulo}\nGenerado el ${fecha}\n\n${cuerpoCorto}\n\nEs una lista larga — revisa el detalle completo en LI · Procesos → Reportes.\n\nEnviado desde LI · Procesos.`;
    mailto=`mailto:${destinatarios.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyCorto)}`;
  }
  abrirMailto(mailto);
}
// Respaldo cuando mailto: no abre nada (Outlook nuevo, colgado, sin programa
// de correo configurado, etc.) — copia TODO al portapapeles, sin recorte de
// tamaño (el límite de 6000 solo aplica a la URL de mailto:, el portapapeles
// no tiene ese problema), para pegarlo tal cual en un correo nuevo.
function copiarResumenPendientesCorreo(delsOverride,tituloAlcance){
  const partes=resumenPendientesEmailPartes(delsOverride,tituloAlcance);
  if(!partes){ toast('No hay nada pendiente para avisar','err'); return; }
  const paraLinea=partes.destinatarios.length?partes.destinatarios.join(', '):'(nadie en ese alcance tiene correo capturado — Administración → Usuarios)';
  copiarAlPortapapeles(`Para: ${paraLinea}\nAsunto: ${partes.subject}\n\n${partes.body}`);
}
// Copia texto al portapapeles con aviso — respaldo genérico para cualquier
// "enviar por correo" de la app cuando mailto: no abre nada (depende de que
// el navegador/Windows tengan bien enganchado un programa de correo, y eso a
// veces falla sin avisar). document.execCommand como respaldo del respaldo,
// por si el navegador no tiene la API moderna de Clipboard disponible.
// Dispara un mailto: — usa un <a> temporal + .click() en vez de
// window.location.href=... porque Chrome (confirmado por el usuario: "le di
// ctrl+r y funcionó 1 vez") deja de abrir el programa externo después del
// primer mailto: disparado así en la misma carga de página — lo trata como
// posible spam de redirecciones. Un clic real sobre un <a href="mailto:...">
// no tiene ese límite, cada uno cuenta como su propio gesto.
function abrirMailto(url){
  const a=document.createElement('a');
  a.href=url; a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function copiarAlPortapapeles(texto){
  const ok=()=>toast('Copiado al portapapeles ✓ — pégalo en un correo nuevo');
  // Respaldo del respaldo: si la API moderna no existe O existe pero el
  // permiso se niega en tiempo de ejecución (pasa en algunos entornos
  // corporativos con políticas de portapapeles restringidas), se intenta
  // igual con el truco viejo del textarea antes de darse por vencido.
  const conExecCommand=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=texto; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const copiado=document.execCommand('copy');
      document.body.removeChild(ta);
      if(copiado) ok(); else toast('No se pudo copiar automático — selecciona el texto a mano','err');
    }catch(e){ toast('No se pudo copiar automático — selecciona el texto a mano','err'); }
  };
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(texto).then(ok).catch(conExecCommand);
  } else {
    conExecCommand();
  }
}
