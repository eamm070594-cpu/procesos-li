  return `
  <div class="feh-alerta-panel no-print" data-cliente="${cliente}" data-pedido="${pedido}" data-fecha="${fecha}" data-detalle="${escapeHtml(detalleTxt)}">
    <div class="feh-alerta-titulo">Avisar por correo sobre este pedido</div>
    <div class="feh-alerta-detalle-preview">${escapeHtml(detalleTxt).replace(/\n/g, '<br>')}</div>
    <label class="feh-alerta-label" for="">Para (elige un grupo o escribe uno o varios correos, separados por coma):</label>
    <div class="feh-alerta-grupos">
      <button type="button" class="feh-btn-grupo" onclick="window.PV_ANDON.agregarGrupoAlerta(this, 'produccion')">👥 Producción</button>
      <button type="button" class="feh-btn-grupo-editar" title="Ver / editar quién recibe este grupo" onclick="window.PV_ANDON.verEditarGrupoAlerta('produccion')">✏️</button>
      <button type="button" class="feh-btn-grupo" onclick="window.PV_ANDON.agregarGrupoAlerta(this, 'cs')">👥 CS / Ventas</button>
      <button type="button" class="feh-btn-grupo-editar" title="Ver / editar quién recibe este grupo" onclick="window.PV_ANDON.verEditarGrupoAlerta('cs')">✏️</button>
      <button type="button" class="feh-btn-grupo" onclick="window.PV_ANDON.agregarGrupoAlerta(this, 'compras')">👥 Compras / Materiales</button>
      <button type="button" class="feh-btn-grupo-editar" title="Ver / editar quién recibe este grupo" onclick="window.PV_ANDON.verEditarGrupoAlerta('compras')">✏️</button>
      <button type="button" class="feh-btn-grupo" onclick="window.PV_ANDON.agregarGrupoAlerta(this, 'mantenimiento')">👥 Mantenimiento</button>
      <button type="button" class="feh-btn-grupo-editar" title="Ver / editar quién recibe este grupo" onclick="window.PV_ANDON.verEditarGrupoAlerta('mantenimiento')">✏️</button>
    </div>
    <input type="text" class="feh-alerta-para" placeholder="ej. produccion@lineaitalia.com.mx, cs@lineaitalia.com.mx" value="amartinez@lineaitalia.com.mx">
    <div class="feh-alerta-plantillas">
      <button type="button" class="feh-btn-plantilla" onclick="window.PV_ANDON.aplicarPlantillaAlerta(this, 'Este pedido está detenido por falta de materia prima.', 'compras')">Falta de material</button>
      <button type="button" class="feh-btn-plantilla" onclick="window.PV_ANDON.aplicarPlantillaAlerta(this, 'Hay un problema mecánico deteniendo la producción de este pedido.', 'mantenimiento')">Falla de máquina</button>
      <button type="button" class="feh-btn-plantilla" onclick="window.PV_ANDON.aplicarPlantillaAlerta(this, 'No hay capacidad de producción disponible a tiempo para este pedido.', 'produccion')">Atraso de mano de obra / capacidad</button>
    </div>
    <textarea class="feh-alerta-texto" placeholder="O escribe aquí la razón (puedes editar la plantilla que elijas)"></textarea>
    <label class="feh-alerta-label">Proponer nueva fecha de finalización (opcional — se incluye en el correo):</label>
    <input type="date" class="feh-alerta-fecha-nueva">

    <div class="feh-alerta-footer">
      <button type="button" class="feh-btn-enviar" onclick="window.PV_ANDON.enviarAlertaPedido(this)">✉️ Enviar correo</button>
    </div>
  </div>`;
}

// 08-sep-2026: Adrian — remasterización TOTAL. El trabajo real de esta
// pantalla es TRIAGE (ver rápido qué pedidos están mal y por qué, no
// navegar uno por uno) — por eso ahora es una TABLA ancha, ordenable, con
// la fila expandiéndose hacia abajo para el detalle completo, en vez de
// tarjetas apiladas o un panel aparte (los 3 intentos anteriores).
let fehPedidoExpandidoKey = null; // clave (cliente+no_documento) de la fila abierta ahora mismo, o null
let fehAutoAlertaKey = null; // si el 🚨 de una fila colapsada la abre, se abre YA con el panel de alerta visible
let fehOrdenColumna = 'fecha'; // 'fecha' | 'cliente' | 'estado' | 'restantes'
let fehOrdenDireccion = 'asc';
let currentEstadoFiltroFecha = 'todos'; // 'todos' | 'atrasado' | 'riesgo' | 'ok'
function claveFehPedido(p) { return (p.cliente || '') + '||' + (p.no_documento || ''); }

const FEH_ESTADOS = [
  { val: 'atrasado', clase: 'atrasado', label: 'Atrasado' },
  { val: 'riesgo', clase: 'riesgo', label: 'En riesgo' },
  { val: 'ok', clase: 'ok', label: 'En tiempo' },
];
// 08-sep-2026: Adrian — "dale orden a la tabla estan todas movidas". Causa
// real: se reusó `nivelDe()` (de Vista de Pedidos) para la columna Estado,
// pero esa función define "atrasado" como "alguna OP de PRODUCCIÓN ya
// vencida" — no como "ya se venció la fecha del cliente". Resultado: filas
// con "Restantes: Vencida hace 21d" (en rojo) salían con la pastilla ámbar
// "En riesgo" en vez de "Atrasado" — contradictorio a la vista, aunque cada
// dato en sí era correcto. Aquí, específicamente para esta columna, "ya se
// venció la fecha del cliente" manda primero — coincide siempre con lo que
// dice "Restantes" en la misma fila. nivelDe() en Vista de Pedidos NO se
// tocó, sigue con su propio criterio (OP de producción), es una pregunta
// distinta.
function nivelFechaEntrega(p) {
  if (p.dias_para_entrega !== null && p.dias_para_entrega !== undefined && p.dias_para_entrega < 0) return 'atrasado';
  const nivelBase = nivelDe(p);
  return (nivelBase === 'atrasado' || nivelBase === 'riesgo') ? 'riesgo' : 'ok';
}

function renderPedidosPorFechaEntrega() {
  const el = pvRoot.getElementById('vistaFechaEntrega');
  if (!el) return;
  if (!allRows.length) {
    el.innerHTML = '<div class="empty-state" style="padding:60px 20px;"><p>Sube tus archivos para ver pedidos por fecha de entrega.</p></div>';
    return;
  }
  const d = buildFechaEntregaData();
  window._ultimaFechaEntrega = d;

  // --- filtros: tipo de venta + estado (nivelDe) + "solo críticos" ---
  const tiposVentaDisponibles = Array.from(new Set(d.porFechaEntrega.map(p => p.tipo_venta || 'Otros'))).sort((a, b) => a.localeCompare(b));
  const filtroTipoVentaValido = tiposVentaDisponibles.includes(currentTipoVentaFiltroFecha) ? currentTipoVentaFiltroFecha : 'todos';
  let filas = filtroTipoVentaValido === 'todos'
    ? d.porFechaEntrega
    : d.porFechaEntrega.filter(p => (p.tipo_venta || 'Otros') === filtroTipoVentaValido);

  if (currentEstadoFiltroFecha !== 'todos') filas = filas.filter(p => nivelFechaEntrega(p) === currentEstadoFiltroFecha);

  const criticosEnFiltro = filas.filter(p => (d.criticidadPorPedido.get(p) || {}).critico).length;
  if (fehSoloCriticosFecha) filas = filas.filter(p => (d.criticidadPorPedido.get(p) || {}).critico);

  // --- orden: clic en encabezado de columna (ver listener delegado abajo) ---
  function valorOrden(p, col) {
    if (col === 'cliente') return (p.cliente || '').toLowerCase();
    if (col === 'restantes') return (p.dias_para_entrega === null || p.dias_para_entrega === undefined) ? Infinity : p.dias_para_entrega;
    if (col === 'estado') return { atrasado: 0, riesgo: 1, ok: 2 }[nivelFechaEntrega(p)];
    return p.fecha_requerida ? new Date(p.fecha_requerida).getTime() : Infinity;
  }
  filas = [...filas].sort((a, b) => {
    const va = valorOrden(a, fehOrdenColumna), vb = valorOrden(b, fehOrdenColumna);
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return fehOrdenDireccion === 'asc' ? cmp : -cmp;
  });

  function flechaOrden(col) {
    if (fehOrdenColumna !== col) return '';
    return fehOrdenDireccion === 'asc' ? ' ▲' : ' ▼';
  }

  // Detalle completo expandido — el MISMO contenido/markup que ya usan
  // Vista de Pedidos y Resumen Directivo (KPIs, alerta, SKUs completos),
  // envuelto en un div que sigue llevando la clase `feh-card` para que los
  // toggles existentes (`this.closest('.feh-card')...`) seguir funcionando
  // sin tocar `renderAlertaPanelGenerico`/`renderDetallePendGenerico`/
  // `renderDetalleFullGenerico`, compartidos por las 3 vistas.
  function detalleExpandidoHtml(p, extraClase) {
    const partidas = p.partidas || [];
    const partidasPendientes = partidas.filter(x => !x.listo);
    const totalPartidas = partidas.length;
    const listasCount = totalPartidas - partidasPendientes.length;
    const pctListo = totalPartidas ? Math.round((listasCount / totalPartidas) * 100) : 0;
    const margenTxt = (p.monto_total > 0) ? `${(((p.monto_total - p.costo_total) / p.monto_total) * 100).toFixed(1)}%` : '—';
    const diasTxt = (p.dias_para_entrega === null || p.dias_para_entrega === undefined) ? '—'
      : p.dias_para_entrega < 0 ? `Vencida hace ${-p.dias_para_entrega}d` : `${p.dias_para_entrega}d restantes`;
    const alertaTxt = partidasPendientes.length === 0
      ? '✓ Nada pendiente por producir'
      : (p.piezas_pendientes > 0)
        ? `🔧 Faltan ${p.piezas_pendientes.toLocaleString('es-MX')} pza. por producir`
        : `🔧 ${partidasPendientes.length} SKU${partidasPendientes.length === 1 ? '' : 's'} pendiente${partidasPendientes.length === 1 ? '' : 's'} por producir`;
    return `
    <div class="feh-fila-detalle-wrap feh-card${extraClase ? ' ' + extraClase : ''}">
      ${renderAlertaPanelGenerico(p)}
      <div class="feh-kpis">
        <div class="feh-kpi c-blue">
          <div class="feh-kpi-top">📦 Producción</div>
          <div class="feh-kpi-value">${listasCount} / ${totalPartidas}<span style="font-size:12px; font-weight:600;"> SKUs</span></div>
          <div class="feh-progress"><b style="width:${pctListo}%;"></b></div>
        </div>
        <div class="feh-kpi c-amber">
          <div class="feh-kpi-top">⏱ Restantes</div>
          <div class="feh-kpi-value">${diasTxt}</div>
        </div>
        ${kpiProyeccionHtml(p)}
      </div>
      <div class="feh-kpi-fin">
        <div class="feh-kpi-fin-item"><span class="l">💰 Costo</span><span class="v">${fmtMoney(p.costo_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">📈 Venta</span><span class="v">${fmtMoney(p.monto_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">🥧 Margen estimado</span><span class="v">${margenTxt}</span></div>
      </div>
      <button type="button" class="feh-alert ${partidasPendientes.length === 0 ? 'ok' : 'pend'}" onclick="this.closest('.feh-card').classList.toggle('show-pend')">
        <span class="txt">${alertaTxt}</span><span class="chev">›</span>
      </button>
      <div class="feh-detail-pend">${renderDetallePendGenerico(p, d.hoyMedianoche)}</div>
      <button type="button" class="feh-btn-full" onclick="this.closest('.feh-card').classList.toggle('show-full')">
        Ver pedido completo (${totalPartidas} SKU${totalPartidas === 1 ? '' : 's'}) <span class="chev">›</span>
      </button>
      <div class="feh-detail-full">${renderDetalleFullGenerico(p, d.hoyMedianoche)}</div>
    </div>`;
  }

  // Fila compacta de la tabla (siempre visible) + su detalle si está expandida.
  function filaHtml(p) {
    const crit = d.criticidadPorPedido.get(p) || { critico: false };
    const nivel = nivelFechaEntrega(p);
    const nivelInfo = FEH_ESTADOS.find(e => e.val === nivel) || { clase: nivel, label: nivel };
    const key = claveFehPedido(p);
    const expandida = key === fehPedidoExpandidoKey;
    const partidasPendientes = (p.partidas || []).filter(x => !x.listo);
    const faltaTxt = partidasPendientes.length === 0
      ? '✓ Nada pendiente'
      : (p.piezas_pendientes > 0)
        ? `Faltan ${p.piezas_pendientes.toLocaleString('es-MX')} pza. (${partidasPendientes.length} SKU)`
        : `${partidasPendientes.length} SKU${partidasPendientes.length === 1 ? '' : 's'} pendiente${partidasPendientes.length === 1 ? '' : 's'}`;
    const diasTxt = (p.dias_para_entrega === null || p.dias_para_entrega === undefined) ? '—'
      : p.dias_para_entrega < 0 ? `Vencida hace ${-p.dias_para_entrega}d` : `${p.dias_para_entrega}d`;
    const diasColor = (p.dias_para_entrega === null || p.dias_para_entrega === undefined) ? 'var(--muted)'
      : p.dias_para_entrega < 0 ? '#C1443C' : (p.dias_para_entrega <= 2 ? '#C67D1E' : 'var(--ink)');

    const filaPrincipal = `
    <div class="feh-tabla-fila feh-tabla-fila-grid${crit.critico ? ' critica' : ''}${expandida ? ' expandida' : ''}" data-clave="${escapeHtml(key)}">
      <div class="feh-td-fecha${crit.critico ? ' critico' : ''}">${fmtFecha(p.fecha_requerida)}</div>
      <div class="feh-td-cliente">
        <div class="nombre">${escapeHtml(p.cliente) || 'Sin cliente'}${p.tiene_garantia ? ' 🛡' : ''}</div>
        <div class="doc">${escapeHtml(p.no_documento) || '—'} · ${escapeHtml(p.tipo_venta) || 'Otros'}</div>
      </div>
      <div class="feh-td-estado">
        <span class="feh-badge-estado ${nivelInfo.clase}">${nivelInfo.label}</span>
        ${crit.critico ? '<span class="feh-badge-critico-mini">🔴 CRÍTICO</span>' : ''}
      </div>
      <div class="feh-td-falta">${escapeHtml(faltaTxt)}</div>
      <div class="feh-td-restantes" style="color:${diasColor};">${diasTxt}</div>
      <div class="feh-td-acciones">
        <button type="button" class="btn-fila-alerta" title="Alertar por correo sobre este pedido" data-clave="${escapeHtml(key)}">🚨</button>
        <button type="button" class="btn-exportar-pedido" title="Exportar este pedido" data-exportar-clave="${escapeHtml(key)}">🖨️</button>
      </div>
    </div>`;

    if (!expandida) return filaPrincipal;
    // Si el 🚨 fue lo que abrió esta fila, se abre YA con el panel de
    // alerta visible (se consume una sola vez, ver más abajo).
    const abrirConAlerta = key === fehAutoAlertaKey;
    return filaPrincipal + detalleExpandidoHtml(p, abrirConAlerta ? 'show-alerta' : '');
  }

  const toolbarHtml = `
    <div class="feh-tabla-toolbar no-print">
      <div class="filtro-grupo"><label for="fechaFiltroInput">Desde</label><input type="date" id="fechaFiltroInput" value="${currentFechaFiltroDesde || ''}"></div>
      <div class="filtro-grupo"><label for="fechaFiltroHastaInput">Hasta</label><input type="date" id="fechaFiltroHastaInput" value="${currentFechaFiltroHasta || ''}"></div>
      <button type="button" id="btnFechaFiltroHoy">Hoy</button>
      <div class="filtro-grupo">
        <label for="tipoVentaFiltroFechaSelect">Tipo de venta</label>
        <select id="tipoVentaFiltroFechaSelect">
          <option value="todos"${filtroTipoVentaValido === 'todos' ? ' selected' : ''}>Todos</option>
          ${tiposVentaDisponibles.map(tv => `<option value="${escapeHtml(tv)}"${filtroTipoVentaValido === tv ? ' selected' : ''}>${escapeHtml(tv)}</option>`).join('')}
        </select>
      </div>
      <div class="filtro-grupo">
        <label for="estadoFiltroFechaSelect">Estado</label>
        <select id="estadoFiltroFechaSelect">
          <option value="todos"${currentEstadoFiltroFecha === 'todos' ? ' selected' : ''}>Todos</option>
          ${FEH_ESTADOS.map(e => `<option value="${e.val}"${currentEstadoFiltroFecha === e.val ? ' selected' : ''}>${e.label}</option>`).join('')}
        </select>
      </div>
    </div>`;

  const avisoHtml = criticosEnFiltro > 0
    ? `<button type="button" class="feh-tabla-aviso no-print" id="fehAvisoCriticos">🔴 ${criticosEnFiltro} crítico${criticosEnFiltro === 1 ? '' : 's'} en este filtro — ${fehSoloCriticosFecha ? 'clic para ver todos' : 'clic para ver solo estos'}</button>`
    : '';

  const tablaHtml = `
    <div class="feh-tabla">
      <div class="feh-tabla-head feh-tabla-fila-grid">
        <div class="th${fehOrdenColumna === 'fecha' ? ' activo' : ''}" data-sort="fecha">Fecha${flechaOrden('fecha')}</div>
        <div class="th${fehOrdenColumna === 'cliente' ? ' activo' : ''}" data-sort="cliente">Cliente${flechaOrden('cliente')}</div>
        <div class="th${fehOrdenColumna === 'estado' ? ' activo' : ''}" data-sort="estado">Estado${flechaOrden('estado')}</div>
        <div class="th">Qué falta</div>
        <div class="th${fehOrdenColumna === 'restantes' ? ' activo' : ''}" data-sort="restantes">Restantes${flechaOrden('restantes')}</div>
        <div class="th">Acciones</div>
      </div>
      ${!filas.length ? '<div class="feh-tabla-vacio">Ningún pedido en este rango/filtro.</div>' : filas.map(filaHtml).join('')}
    </div>`;
  fehAutoAlertaKey = null; // ya se consumió (si aplicaba) al construir tablaHtml — no debe seguir pegado en el próximo render

  el.innerHTML = `
    <div class="resumen-wrap">
      <div class="fecha-entrega-hero">
        <div class="feh-top">
          <div>
            <div class="feh-titulo">📅 Pedidos por Fecha de Entrega</div>
            <div class="feh-rango">${d.fechaEntregaRangoTxt}</div>
          </div>
          <button id="btnReporteFechaEntrega" class="feh-btn-pdf no-print">🖨️ Exportar PDF</button>
        </div>
        <div class="feh-stats">
          <div class="feh-stat">
            <div class="v">${d.porFechaEntrega.length}</div>
            <div class="l">Pedido${d.porFechaEntrega.length === 1 ? '' : 's'} sin completar en el rango</div>
          </div>
          ${d.totalCriticos ? `
          <div class="feh-stat feh-stat-critico">

// Arma y abre un mailto: con el resumen del pedido + la razón elegida/escrita.
// Este archivo es HTML estático sin backend — no puede enviar correo por sí
// solo — mailto: abre el cliente de correo de Adrian con Para/Asunto/Cuerpo
// ya listos; el destinatario queda como borrador editable ahí mismo antes de
// darle enviar, que es justo lo que pidió ("ajustable a mano").
function enviarAlertaPedido(btn) {
  const panel = btn.closest('.feh-alerta-panel');
  if (!panel) return;
  const textarea = panel.querySelector('.feh-alerta-texto');
  const razon = (textarea && textarea.value.trim()) || '';
  if (!razon) { alert('Elige una plantilla o escribe la razón antes de enviar.'); return; }
  // 07-sep-2026: Adrian — "necesito poner varios correos" — el campo "Para"
  // es libre (uno o varios, separados por coma); se manda tal cual al
  // mailto:, que ya sabe interpretar varios destinatarios separados por coma.
  const paraInput = panel.querySelector('.feh-alerta-para');
  const destinatariosLista = ((paraInput && paraInput.value) || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!destinatariosLista.length) { alert('Escribe al menos un correo destinatario antes de enviar.'); return; }
  const cliente = panel.dataset.cliente || 'Sin cliente';
  const pedido = panel.dataset.pedido || '—';
  const fecha = panel.dataset.fecha || '—';
  // 08-sep-2026: Adrian — "en el correo da detalle de lo que falta del
  // pedido SKU OP estatus" — viene ya armado desde el render (data-detalle).
  const detalle = panel.dataset.detalle || 'Nada pendiente por producir.';
  // 08-sep-2026 (Adrian: "tambien quiero proponer una fecha nueva para
  // finalizar el pedido y que tambien se mande por correo") — campo opcional
  // de fecha; el input type="date" da "YYYY-MM-DD", se reformatea con
  // fmtFecha para que se vea igual que el resto de fechas de la app.
  const fechaNuevaInput = panel.querySelector('.feh-alerta-fecha-nueva');
  const fechaNuevaVal = (fechaNuevaInput && fechaNuevaInput.value) || '';
  const fechaNuevaTxt = fechaNuevaVal ? fmtFecha(new Date(fechaNuevaVal + 'T00:00:00')) : null;
  const asunto = `Alerta de producción — Pedido ${pedido} (${cliente})`;
  const lineaFechaNueva = fechaNuevaTxt ? `\nNueva fecha propuesta de finalización: ${fechaNuevaTxt}\n` : '';
  const cuerpo = `Pedido: ${pedido}\nCliente: ${cliente}\nFecha que espera el cliente: ${fecha}\n${lineaFechaNueva}\nDetalle de lo pendiente (SKU | OP | Estatus):\n${detalle}\n\nMotivo:\n${razon}`;
  // Cada dirección se codifica por separado y se unen con una coma SIN
  // codificar — un mailto: con la coma codificada (%2C) no separa bien los
  // destinatarios en varios clientes de correo (Outlook incluido).
  const paraTexto = destinatariosLista.map(encodeURIComponent).join(',');
  const mailto = `mailto:${paraTexto}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  intentarAbrirCorreo(mailto, destinatariosLista, asunto, cuerpo);
}

// 08-sep-2026: Adrian — "probé el botón de alerta y trate de enviar correo y
// no se abre nada no se si sea configuracion de mi email". El mailto: SÍ se
// manda, pero si Windows/Chrome no tienen un programa de correo predeterminado
// configurado, no pasa NADA visible — ni error ni aviso, así se siente "no
// funciona". No hay forma de detectar eso desde la página (el navegador no
// avisa si el mailto: falló). Por eso, además de intentarlo, siempre se copia
// el mensaje completo al portapapeles como plan B, para que Adrian pueda
// pegarlo (Ctrl+V) en Outlook Web o donde sea aunque el mailto: no abra nada.
function intentarAbrirCorreo(mailto, destinatarios, asunto, cuerpo) {
  // 08-sep-2026: Adrian ya tiene outlook.office.com registrado como
  // controlador de mailto: en Chrome (lo confirmamos juntos en
  // chrome://settings/handlers) y AUN ASÍ no abría nada con
  // "window.location.href = mailto:...". Causa probable: Chrome no siempre
  // dispara el controlador de protocolo registrado cuando la navegación se
  // hace por JS (location.href) desde una página file:// — sí lo hace de
  // forma más confiable con un clic real sobre un <a href="mailto:...">. Se
  // cambió a crear ese enlace y clickearlo en vez de reasignar location.href.
  const a = document.createElement('a');
  a.href = mailto;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  const textoPlano = `Para: ${destinatarios.join(', ')}\nAsunto: ${asunto}\n\n${cuerpo}`;
  copiarAlPortapapeles(textoPlano).finally(() => {
    alert('Se intentó abrir tu programa de correo.\n\nSi no se abrió nada, es porque Windows/Chrome no tienen configurado un programa de correo predeterminado (Outlook, Outlook Web, etc.) — no es un error de la app.\n\nPor si acaso, ya copié el mensaje completo: pégalo (Ctrl+V) en un correo nuevo dirigido a:\n' + destinatarios.join(', '));
  });
}
function copiarAlPortapapeles(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(texto).catch(() => copiarAlPortapapelesFallback(texto));
  }
  return copiarAlPortapapelesFallback(texto);
}
function copiarAlPortapapelesFallback(texto) {
  try {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { /* si ni esto funciona, al menos ya se intentó el mailto: */ }
  return Promise.resolve();
}

  const fechaNuevaValLote = (fechaNuevaInputLote && fechaNuevaInputLote.value) || '';
  const fechaNuevaTxtLote = fechaNuevaValLote ? fmtFecha(new Date(fechaNuevaValLote + 'T00:00:00')) : null;
  const lineaFechaNuevaLote = fechaNuevaTxtLote ? `\nNueva fecha propuesta de finalización (para todos estos pedidos): ${fechaNuevaTxtLote}\n` : '';
  const asunto = `Alerta de producción — ${pedidosArr.length} pedido(s) con el mismo problema`;
  const bloques = pedidosArr.map(p => `Pedido: ${p.pedido}\nCliente: ${p.cliente}\nFecha que espera el cliente: ${p.fecha}\nDetalle:\n${p.detalle}`).join('\n\n---\n\n');
  const cuerpo = `Se reportan ${pedidosArr.length} pedido(s) afectados por el mismo motivo:\n${lineaFechaNuevaLote}\n${bloques}\n\nMotivo:\n${razon}`;
  const paraTexto = destinatariosLista.map(encodeURIComponent).join(',');
  const mailto = `mailto:${paraTexto}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  intentarAbrirCorreo(mailto, destinatariosLista, asunto, cuerpo);
}


  // Expuestas a window porque los onclick="..." en el HTML generado
  // dinámicamente siempre resuelven contra el scope global, nunca contra
  // este closure -- ver ONCLICK_NAMES en el script de migración.
  window.PV_ANDON = window.PV_ANDON || {};
  Object.assign(window.PV_ANDON, {agregarGrupoAlerta, agregarGrupoLote, aplicarPlantillaAlerta, aplicarPlantillaLote, enviarAlertaLote, enviarAlertaPedido, limpiarSeleccionLote, toggleFilasExtra, toggleLotePanel, verEditarGrupoAlerta});
}

/* Normaliza los nombres de familia que llegan del Excel (no son consistentes entre archivos) */
const NORMALIZA_FAMILIA = {
  'ARCHIVERO':'Archiveros', 'ARCHIVEROS':'Archiveros', 'ARCHIVE':'Archiveros',
  'LIBRERO':'Libreros', 'LIBREROS':'Libreros',
  'MAMPARA':'Mamparas', 'MAMPARAS':'Mamparas',
  'MUEBLE':'Muebles', 'MUEBLES':'Muebles',
  'SILLA':'Sillas', 'SILLAS':'Sillas', 'SILLAS-NAC':'Sillas', 'SILLAS NAC':'Sillas', 'PT-SILLAS-NAC':'Sillas',
  'SILLON':'Sillones', 'SILLONES':'Sillones',
};
/* Categorías que aparecen en el programa pero no son familias de cliente — se ignoran.
   Kit Plantas y Maquila Interna aparecían en el Excel real pero Adrian confirmó (2026-08-30)
   que NO son familias a trackear con lead time — se ignoran igual que Compras/Prototipos. */
const FAMILIA_IGNORAR = new Set(['COMPRAS', 'TIEMPO PARA PROTOTIPOS', 'CANCELADO', 'KIT PLANTAS', 'MAQUILA INTERNA']);

const MESES_MAP_IMPORT = {'enero':0,'febrero':1,'marzo':2,'abril':3,'mayo':4,'junio':5,'julio':6,'agosto':7,'septiembre':8,'octubre':9,'noviembre':10,'diciembre':11};
function quitarAcentos(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function parseFechaProgramaTexto(txt){
  if(txt === null || txt === undefined) return null;
  const m = quitarAcentos(String(txt).toLowerCase()).match(/(\d{1,2})\s+([a-z]+)\s+del?\s+(\d{4})/i);
  if(!m) return null;
  const dia = parseInt(m[1],10);
  const mes = MESES_MAP_IMPORT[m[2]];
  const anio = parseInt(m[3],10);
  if(mes===undefined || isNaN(dia) || isNaN(anio)) return null;
  return new Date(anio, mes, dia);
}

/* Lee las filas (array de arrays, como las da SheetJS con header:1) de la hoja PROGRAMA:
   encuentra el encabezado FAMILIA/PT UDS, la fecha del programa, y suma PT UDS por familia
   (usa el renglón "Total X" cuando existe — es la suma correcta de esa familia ese día). */
function parseProgramaSheet(rows){
  let headerRowIdx = -1;
  for(let i=0; i<Math.min(rows.length,15); i++){
    if(rows[i] && String(rows[i][0]||'').trim().toUpperCase()==='FAMILIA'){ headerRowIdx = i; break; }
  }
  if(headerRowIdx<0) return null;

  let fecha = null;
  for(let i=headerRowIdx-1; i>=0 && i>=headerRowIdx-3; i--){
    const cand = parseFechaProgramaTexto(rows[i] && rows[i][1]);
    if(cand){ fecha = cand; break; }
  }

  const headers = rows[headerRowIdx].map(h => String(h||'').trim().toUpperCase());
  const famCol = headers.indexOf('FAMILIA');
  const ptCol = headers.indexOf('PT UDS');
  if(famCol<0 || ptCol<0) return null;

  const lineSum = {}, totalRow = {};
  let currentFam = null;
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    let famCell = row[famCol];
    const pt = Number(row[ptCol]) || 0;
    if(famCell !== undefined && famCell !== null && String(famCell).trim() !== ''){
      famCell = String(famCell).trim();
      if(/^total\s+/i.test(famCell)){
        totalRow[famCell.replace(/^total\s+/i,'').trim()] = pt;
        currentFam = null;
      } else {
        currentFam = famCell;
        lineSum[currentFam] = (lineSum[currentFam]||0) + pt;
      }
    } else if(currentFam){
      lineSum[currentFam] = (lineSum[currentFam]||0) + pt;
    }
  }
  const fams = new Set([...Object.keys(lineSum), ...Object.keys(totalRow)]);
  const porFamilia = {};
  fams.forEach(f => { porFamilia[f] = (totalRow[f] !== undefined) ? totalRow[f] : lineSum[f]; });
  return { fecha, porFamilia };
}

async function importarArchivosPrograma(fileList){
  const resultEl = ltRoot.getElementById('importResult');
  const lineas = [];
  for(const file of fileList){
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const sheetName = wb.SheetNames.includes('PROGRAMA') ? 'PROGRAMA' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:true, defval:null });
      const parsed = parseProgramaSheet(rows);
      if(!parsed || !parsed.fecha){
        lineas.push(`⚠ ${file.name}: no reconocí el formato (encabezado FAMILIA/PT UDS o fecha del programa).`);
        continue;
      }
      const key = dateKey(parsed.fecha);
      knownProgramDates.add(key);
      // "PREVIO" en el nombre del archivo (tal como lo manda Control de
      // Producción, ej. "PRPCP-06- 01-09-2026 PREVIO.xlsx") es la única señal
      // real que tenemos de que ese día sigue sujeto a cambios — si no trae
      // "PREVIO", se asume que es la versión final.
      programaVersionPorFecha[key] = file.name.toUpperCase().includes('PREVIO') ? 'previo' : 'final';
      const sinReconocer = [];
      Object.entries(parsed.porFamilia).forEach(([famRaw, pt])=>{
        const famUp = famRaw.toUpperCase();
        if(FAMILIA_IGNORAR.has(famUp)) return;
        const famNorm = NORMALIZA_FAMILIA[famUp];
        if(!famNorm){ sinReconocer.push(famRaw); return; }
        let fam = families.find(f => f.name === famNorm);
        if(!fam){
          fam = { name: famNorm, capacity: 10, pendiente: 0, daysByDate: {} };
          families.push(fam);
        }
        fam.daysByDate[key] = pt;
      });
      lineas.push(`✓ ${file.name} → ${fechaCorta(parsed.fecha)}${sinReconocer.length ? ' — sin reconocer: ' + sinReconocer.join(', ') : ''}`);
    }catch(err){
      lineas.push(`⚠ ${file.name}: error al leer (${err.message}).`);
    }
  }
  if(resultEl){ resultEl.style.display='block'; resultEl.textContent = lineas.join('\n'); }
  renderCapture();
  renderSales();
  renderHistoryChart();
  populateFamiliaSelect();
  saveState();
}

/* ---------- IMPORTAR AVANCE DEL PROGRAMA DE PRODUCCION (BC) — planificado sin lanzar ----------
   Reporte de Business Central "Avance del programa de producción", exportado con el filtro
   Estado = Planificada|Planif. firme (el pendiente real, con OP pero SIN fecha de lanzamiento
   de Rodrigo — corrección del 06-sep-2026, ver memoria). Trae una fila por OP con la columna
   NombreCTrabajo tipo "ENSAMBLE SILLAS" — de ahí se saca la familia, no hay columna FAMILIA directa. */
const ESTADOS_PLANIFICADO = new Set(['PLANIFICADA', 'PLANIF. FIRME']);
function parseAvanceSheet(rows){
  let headerRowIdx = -1;
  for(let i=0; i<Math.min(rows.length,5); i++){
    if(rows[i] && rows[i].some(c => String(c||'').trim().toUpperCase()==='NOMBRECTRABAJO')) { headerRowIdx = i; break; }
  }
  if(headerRowIdx<0) return null;
  const headers = rows[headerRowIdx].map(h => String(h||'').trim().toUpperCase());
  const estadoCol = headers.indexOf('ESTADO');
  const ctrabajoCol = headers.indexOf('NOMBRECTRABAJO');
  const pendCol = headers.indexOf('CANTPENDIENTE');
  if(estadoCol<0 || ctrabajoCol<0 || pendCol<0) return null;

  const porFamilia = {};
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    const estado = String(row[estadoCol]||'').trim().toUpperCase();
    if(!ESTADOS_PLANIFICADO.has(estado)) continue;
    const ctrabajo = String(row[ctrabajoCol]||'').trim();
    const m = ctrabajo.match(/^ENSAMBLE\s+(.+)$/i);
    if(!m) continue;
    const famRaw = m[1].trim();
    const pend = Number(row[pendCol]) || 0;
    porFamilia[famRaw] = (porFamilia[famRaw]||0) + pend;
  }
  return porFamilia;
}

async function importarAvanceProgramaFile(file){
  const resultEl = ltRoot.getElementById('avanceImportResult');
  const lineas = [];
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheetName = wb.SheetNames.includes('Data') ? 'Data' : wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:true, defval:null });
    const porFamilia = parseAvanceSheet(rows);
    if(!porFamilia){
      lineas.push(`⚠ ${file.name}: no reconocí el formato (encabezado Estado/NombreCTrabajo/CantPendiente).`);
    } else {
      const sinReconocer = [];
      const vistos = new Set();
      // 08-sep-2026: si el archivo viene filtrado por error a un solo centro
      // de trabajo (pasó con un export real de Adrian: 441 filas, TODAS
      // "ENSAMBLE ARCHIVEROS"), la regla de abajo pone en 0 el pendiente de
      // las demás familias aunque sí tuvieran OP reales — se detecta antes de
      // aplicar el cambio, para avisar en vez de corromper el dato en silencio.
      const teniaPendienteAntes = families.filter(f => f.pendiente > 0).map(f => f.name);
      Object.entries(porFamilia).forEach(([famRaw, pend])=>{
        const famUp = famRaw.toUpperCase();
        const famNorm = NORMALIZA_FAMILIA[famUp] || (families.some(f=>f.name.toUpperCase()===famUp) ? famRaw : null);
        if(!famNorm){ sinReconocer.push(famRaw); return; }
        const fam = families.find(f => f.name === famNorm);
        if(fam){ fam.pendiente = pend; vistos.add(fam.name); }
      });
      // Familias que no aparecieron en este corte = 0 planificado, no se dejan con el valor viejo
      families.forEach(f => { if(!vistos.has(f.name)) f.pendiente = 0; });
      const seFueronACero = teniaPendienteAntes.filter(name => !vistos.has(name));
      lineas.push(`✓ ${file.name} → planificado actualizado por familia${sinReconocer.length ? ' — sin reconocer: ' + sinReconocer.join(', ') : ''}`);
      if(seFueronACero.length){
        lineas.push(`⚠ Ojo: este archivo NO traía OP planificadas de ${seFueronACero.join(', ')} — su "pendiente a lanzar" se puso en 0. Si esperabas que sí tuvieran, revisa que el reporte de Business Central no haya salido filtrado a un solo centro de trabajo antes de volver a subirlo.`);
      }
    }
  }catch(err){
    lineas.push(`⚠ ${file.name}: error al leer (${err.message}).`);
  }
  if(resultEl){ resultEl.style.display='block'; resultEl.textContent = lineas.join('\n'); }
  renderCapture();
  renderSales();
  renderHistoryChart();
  if(typeof renderDetalleLT === 'function') renderDetalleLT();
  saveState();
}

function totalProcesoDays(){ return STAGES.reduce((s,x)=>s+(Number(x.days)||0),0); }
function totalPostDays(){ return POST_STAGES.reduce((s,x)=>s+(Number(x.days)||0),0); }
function fmt(n,d=1){ if(!isFinite(n)) return '—'; return n.toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d}); }

/* El último día del que Rodrigo YA mandó programa (lanzado), venga de hoy para atrás o de hoy
   para adelante — es el mismo dato en TODAS las familias, por eso se calcula una sola vez
   viendo daysByDate de todas. Corrección del 06-sep-2026 (ver memoria): las fechas del programa
   de Rodrigo son fechas de LANZADO, no un límite — un día futuro ya programado (ej. el 10-sep
   mandado el 04-sep) sigue contando como "ya resuelto", no hay que esperar a que llegue esa fecha. */
function getLastKnownDate(){
  if(!knownProgramDates.size) return null;
  const maxKey = [...knownProgramDates].sort().pop();
  const [y,m,dd] = maxKey.split('-').map(Number);
  return new Date(y, m-1, dd);
}

function computeCard(f){
  const days = getBusinessDaysInMonth(viewMonth).map(d => Number(f.daysByDate[dateKey(d)]) || 0);
  const lanzadoReal = days.reduce((a,b)=>a+b,0);
  const cap = Number(f.capacity)||0;
  const planificado = Number(f.pendiente)||0; // unidades con OP pero SIN fecha de lanzamiento (BC: Planificada|Planif. firme)
  /* F4 = solo el planificado sin fecha ÷ capacidad — lo ya lanzado (lanzadoReal) NO se suma aquí:
     ese trabajo ya tiene fecha resuelta, no sigue "en cola". Corrección del 06-sep-2026. */
  const diasCola = cap>0 ? planificado/cap : 0;
  const lastKnown = getLastKnownDate();
  /* Colchón = días hábiles entre hoy y el último día ya lanzado — ese tramo ya está ocupado por
     lo que Rodrigo ya programó, un pedido nuevo no puede meterse ahí. El planificado (F4) empieza
     a correr justo después de ese día. */
  const diasColchon = lastKnown ? Math.max(0, businessDaysBetween(new Date(), lastKnown)) : 0;
  const proceso = totalProcesoDays();
  const postProceso = totalPostDays();
  const leadTime = proceso + diasColchon + diasCola + postProceso;
  const backlogTotal = planificado; // se conserva el nombre por compatibilidad con las vistas que ya lo usan
  /* Total programado (lanzado) de TODAS las fechas ya conocidas, sin importar el mes que se esté
     viendo en el calendario — a diferencia de lanzadoReal, que solo cuenta el mes visible.
     Pedido de Adrian (06-sep-2026): "¿cuántos archiveros tenemos programados?". */
  const programadoTotal = [...knownProgramDates].reduce((s,k)=> s + (Number(f.daysByDate[k])||0), 0);
  return { lanzadoReal, backlogTotal, diasCola, leadTime, proceso, postProceso, diasColchon, lastKnown, planificado, programadoTotal };
}

function timelineSegs(diasColchon, diasCola, proceso, postProceso){
  const total = diasColchon + diasCola + proceso + postProceso;
  if(total<=0) return { prevPct: 25, colchonPct: 25, procPct: 25, postPct: 25 };
  return {
    prevPct: proceso/total*100,
    colchonPct: diasColchon/total*100,
    procPct: diasCola/total*100,
    postPct: postProceso/total*100,
  };
}

/* ---------- ALERTAS CS / PEDIDOS EN RIESGO ---------- */
let pedidos = [];

/* Suma N días hábiles (fines de semana no cuentan) a una fecha — para "mejor fecha de entrega"
   pedido por Adrian (06-sep-2026): hoy + lead time, respetando el calendario/mes real. */
function addBusinessDays(startDate, numDays){
  let d = new Date(startDate); d.setHours(0,0,0,0);
  let remaining = Math.ceil(numDays);
  while(remaining > 0){
    d.setDate(d.getDate()+1);
    const wd = d.getDay();
    if(wd !== 0 && wd !== 6) remaining--;
  }
  return d;
}
function businessDaysBetween(from, to){
  let count = 0;
  let d = new Date(from); d.setHours(0,0,0,0);
  const end = new Date(to); end.setHours(0,0,0,0);
  const dir = end.getTime() >= d.getTime() ? 1 : -1;
  while(d.getTime() !== end.getTime()){
    d.setDate(d.getDate()+dir);
    const wd = d.getDay();
    if(wd!==0 && wd!==6) count += dir;
  }
  return count;
}
function fechaCorta(d){
  return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
}

function populateFamiliaSelect(){
  const sel = ltRoot.getElementById('newFamilia');
  if(!sel) return;
  const current = sel.value;
  sel.innerHTML = families.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
  if(families.some(f=>f.name===current)) sel.value = current;
}

function pedidoStats(p){
  const fam = families.find(f=>f.name===p.familia);
  const leadTimeNecesario = fam ? computeCard(fam).leadTime : 0;
  const diasDisponibles = businessDaysBetween(new Date(), p.fechaComprometida);
  const holgura = diasDisponibles - leadTimeNecesario;
  const enRiesgo = holgura < 0;
  return { leadTimeNecesario, diasDisponibles, holgura, enRiesgo };
}

function csMessage(p, stats){
  return `Pedido en riesgo — ${p.cliente}
Familia: ${p.familia}
Fecha comprometida: ${fechaCorta(p.fechaComprometida)}
Lead Time necesario: ${fmt(stats.leadTimeNecesario,1)} días hábiles
Días disponibles: ${stats.diasDisponibles} días hábiles
Faltan: ${fmt(Math.abs(stats.holgura),1)} días para cumplir la fecha.
Opciones: renegociar fecha con cliente / priorizar en producción / aceptar el riesgo.`;
}

function renderPedidos(){
  const list = ltRoot.getElementById('pedidosList');
  if(!list) return;

  let riesgoSinResolver = 0;

  list.innerHTML = pedidos.map((p, idx) => {
    const stats = pedidoStats(p);
    if(stats.enRiesgo && !p.decision) riesgoSinResolver++;

    const fueReasignado = p.fechaOriginal.getTime() !== p.fechaComprometida.getTime();
    const fechaHtml = fueReasignado
      ? `<span style="text-decoration:line-through; color:#b3b8c1;">${fechaCorta(p.fechaOriginal)}</span> → <b>${fechaCorta(p.fechaComprometida)}</b>`
      : fechaCorta(p.fechaComprometida);

    let actionsHtml = '';
    if(stats.enRiesgo){
      actionsHtml += `
        <div class="alert-banner">⚠️ <b>No va a salir a tiempo.</b> Le faltan ${fmt(Math.abs(stats.holgura),1)} días hábiles para cumplir la fecha comprometida (necesita ${fmt(stats.leadTimeNecesario,1)} días, solo tiene ${stats.diasDisponibles} disponibles).</div>
      `;
    }
    if(p.decision){
      actionsHtml += `<div class="decision-tag">Decisión: ${p.decision.label}${p.decision.nota ? ' — ' + p.decision.nota : ''}</div>`;
    } else if(stats.enRiesgo) {
      actionsHtml += `
        <div class="pedido-actions">
          <div class="field">
            <label>Nueva fecha comprometida</label>
            <input type="date" id="reFecha-${idx}">
          </div>
          <div class="field">
            <label>Decisión</label>
            <select id="reDecision-${idx}">
              <option value="renegociar">Renegociar fecha</option>
              <option value="priorizar">Priorizar en producción</option>
              <option value="aceptar">Aceptar el riesgo</option>
            </select>
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="add-btn" data-guardar-idx="${idx}">Guardar decisión</button>
          <button class="remove-btn" data-copiar-idx="${idx}">Copiar aviso para CS</button>
        </div>
      `;
    }

    return `
      <div class="pedido-card ${stats.enRiesgo ? 'risk':''}">
        <div class="pedido-top">
          <div class="pedido-info">
            <span class="fam-tag">${p.familia}</span>
            <div class="cliente">${p.cliente}</div>
            <div class="fecha">Fecha comprometida: ${fechaHtml}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="pedido-status ${stats.enRiesgo?'risk':'ok'}">${stats.enRiesgo ? '⚠ EN RIESGO' : '✅ A TIEMPO'}</div>
            <button class="pedido-remove" data-remove-idx="${idx}">Quitar</button>
          </div>
        </div>
        ${actionsHtml}
      </div>
    `;
  }).join('');

  const tabCount = ltRoot.getElementById('tabCount');
  if(tabCount) tabCount.textContent = riesgoSinResolver > 0 ? riesgoSinResolver : '';

  list.querySelectorAll('[data-remove-idx]').forEach(btn => btn.addEventListener('click', ()=>{
    pedidos.splice(Number(btn.dataset.removeIdx),1);
    renderPedidos();
    saveState();
  }));
  list.querySelectorAll('[data-copiar-idx]').forEach(btn => btn.addEventListener('click', ()=>{
    const idx = Number(btn.dataset.copiarIdx);
    const p = pedidos[idx];
    const stats = pedidoStats(p);
    const msg = csMessage(p, stats);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(()=>{
        btn.textContent = '✓ Copiado';
        setTimeout(()=>{ btn.textContent = 'Copiar aviso para CS'; }, 1800);
      }).catch(()=>{ alert(msg); });
    } else {
      alert(msg);
    }
  }));
  list.querySelectorAll('[data-guardar-idx]').forEach(btn => btn.addEventListener('click', ()=>{
    const idx = Number(btn.dataset.guardarIdx);
    const p = pedidos[idx];
    const tipo = ltRoot.getElementById(`reDecision-${idx}`).value;
    const nuevaFechaStr = ltRoot.getElementById(`reFecha-${idx}`).value;
    const labels = { renegociar: 'Renegociar fecha', priorizar: 'Priorizar en producción', aceptar: 'Aceptar el riesgo' };

    if(tipo === 'renegociar'){
      if(!nuevaFechaStr){ alert('Captura la nueva fecha comprometida.'); return; }
      p.fechaComprometida = new Date(nuevaFechaStr + 'T00:00:00');
      p.decision = { tipo, label: labels[tipo], nota: `Nueva fecha: ${fechaCorta(p.fechaComprometida)}` };
    } else if(tipo === 'priorizar'){
      p.decision = { tipo, label: labels[tipo], nota: 'Se adelanta en el programa de producción' };
    } else {
      p.decision = { tipo, label: labels[tipo], nota: 'Documentado — no se garantiza la fecha original' };
    }
    renderPedidos();
    saveState();
  }));
}

/* ---------- REPORTE (para responder al correo de estatus / imprimir a PDF) ---------- */
const PROGRAMA_STATUS_LABEL = { final: '✓ Final recibido', previo: '⏳ Solo previo (sujeto a cambios)', 'no-enviado': '— No enviado todavía' };
const DIAS_SEMANA_LARGO = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
// 08-sep-2026: reemplaza la tabla fija `PROGRAMA_STATUS` que había antes
// (escrita a mano en una sesión pasada, nunca se actualizaba con las cargas
// reales — ver hallazgo de Adrian: "no me cuadra si subí 4 archivos"). Ahora
// se calcula solo, cada vez que se abre el Reporte, de lunes a viernes de
// la semana de HOY, contra `knownProgramDates`/`programaVersionPorFecha`
// (que sí se llenan en cada carga real de archivo).
function programaStatusSemanaActual(){
  const lunes = getMonday(new Date());
  const dias = [];
  for(let i=0; i<5; i++){
    const d = new Date(lunes); d.setDate(lunes.getDate()+i);
    const key = dateKey(d);
    let estatus = 'no-enviado';
    if(knownProgramDates.has(key)) estatus = programaVersionPorFecha[key] || 'previo';
    dias.push({ fecha: key, dia: DIAS_SEMANA_LARGO[d.getDay()], estatus });
  }
  return dias;
}

function buildReporte(){
  const results = families.map(f => ({ name: f.name, ...computeCard(f), capacity: f.capacity, pendiente: f.pendiente }));
  let top = results[0];
  results.forEach(r => { if(r.leadTime > top.leadTime) top = r; });
  const promedio = results.reduce((a,r)=>a+r.leadTime,0) / (results.length || 1);
  const capacidadTotal = results.reduce((a,r)=>a+(Number(r.capacity)||0),0);
  const programaStatus = programaStatusSemanaActual();
  const diasFinales = programaStatus.filter(p=>p.estatus==='final').length;
  const diasTotal = programaStatus.length;
  const pedidosRiesgo = pedidos.map(p => ({ ...p, stats: pedidoStats(p) })).filter(p => p.stats.enRiesgo && !p.decision);
  return { fecha: new Date(), results, top, promedio, capacidadTotal, diasFinales, diasTotal, programaStatus, pedidosRiesgo };
}

function exportarReporteLeadTimePDF(){
  const d = buildReporte();
  const contentHtml = reporteContentHtml(d, true);
  const win = window.open('', '_blank');
  if(!win){ alert('El navegador bloqueó la ventana nueva. Permite pop-ups para este sitio y vuelve a intentar.'); return; }
  win.document.open();
  win.document.write(construirReporteLeadTimeHTML(contentHtml));
  win.document.close();
  win.focus();
  setTimeout(() => { try { win.print(); } catch (e) {} }, 350);
}

let leadTimeHistory = [
  { week: currentWeekLabel(), values: Object.fromEntries(families.map(f => [f.name, computeCard(f).leadTime])) }
];
let charts = { compare: null, bottleneck: null, average: null, fastest: null, capacidad: null };

function weeklyStats(){
  return leadTimeHistory.map(h => {
    const entries = Object.entries(h.values);
    let maxFam=null, maxVal=-Infinity, minFam=null, minVal=Infinity, sum=0;
    entries.forEach(([fam,val]) => {
      if(val>maxVal){ maxVal=val; maxFam=fam; }
      if(val<minVal){ minVal=val; minFam=fam; }
      sum += val;
    });
    return { week: h.week, maxFam, maxVal, minFam, minVal, avg: entries.length ? sum/entries.length : 0 };
  });
}
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); charts[key]=null; } }

/* ---------- PERSISTENCIA (guardado automático en el navegador) ---------- */
/* v4: se agregaron los PREVIOS reales de 01 y 04 de septiembre, y se excluye "CANCELADO" del importador.
   Se sube de versión para que la próxima carga tome los nuevos valores en vez de restaurar los viejos guardados. */
const STORAGE_KEY = 'leadtime_app_state_v6'; // v6 (06-sep-2026): modelo de "pendiente" cambió de significado (ahora es planificado-sin-lanzar de BC, no un número a mano) — forzar defaults nuevos, no arrastrar guardados viejos

function serializeState(){
  return {
    viewMonth: viewMonth.toISOString(),
    families: families.map(f => ({ name: f.name, capacity: f.capacity, pendiente: f.pendiente, daysByDate: f.daysByDate })),
    STAGES: STAGES.map(s => ({ ...s })),
    POST_STAGES: POST_STAGES.map(s => ({ ...s })),
    pedidos: pedidos.map(p => ({
      familia: p.familia,
      cliente: p.cliente,
      fechaComprometida: p.fechaComprometida.toISOString(),
      fechaOriginal: p.fechaOriginal.toISOString(),
      decision: p.decision,
    })),
    leadTimeHistory,
    knownProgramDates: [...knownProgramDates],
    programaVersionPorFecha,
  };
}

let _saveIndicatorTimeout = null;
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
    const ind = ltRoot.getElementById('saveIndicator');
    if(ind){
      ind.textContent = '✓ Guardado en este navegador — ' + new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      ind.style.opacity = '1';
      clearTimeout(_saveIndicatorTimeout);
      _saveIndicatorTimeout = setTimeout(()=>{ if(ind) ind.style.opacity = '0.45'; }, 2500);
    }
  }catch(e){
    console.warn('No se pudo guardar el estado en el navegador:', e);
  }
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ return false; }
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    if(data.viewMonth){
      const vm = new Date(data.viewMonth);
      if(!isNaN(vm)) viewMonth = startOfMonth(vm);
    }
    if(Array.isArray(data.families) && data.families.length){
      families = data.families.map(f => ({
        name: f.name,
        capacity: Number(f.capacity)||0,
        pendiente: Number(f.pendiente)||0,
        daysByDate: (f.daysByDate && typeof f.daysByDate==='object') ? f.daysByDate : {},
      }));
    }
    if(Array.isArray(data.STAGES) && data.STAGES.length){
      // 08-sep-2026: se eliminó F3 como fase aparte (se fusionó a F2, ahora
      // "F2 Programado"). Si el navegador todavía trae guardado el STAGES
      // viejo de 3 fases, se migra a 2 aquí — sin esto, un navegador con
      // datos guardados seguiría mostrando "F3 Programado" para siempre,
      // aunque el código ya no lo tenga como default.
      let stagesGuardados = data.STAGES;
      if(stagesGuardados.some(s => s.key === 'f3')){
        const f1g = stagesGuardados.find(s => s.key === 'f1');
        const f2g = stagesGuardados.find(s => s.key === 'f2');
        stagesGuardados = [
          { key: 'f1', label: 'F1 Por capturar', days: f1g ? f1g.days : STAGES[0].days },
          { key: 'f2', label: 'F2 Programado', days: f2g ? f2g.days : STAGES[1].days },
        ];
      }
      // Por si quedó guardado con la etiqueta vieja "F2 Capturado" aunque ya
      // no traiga f3 — se refresca el nombre siempre, nunca los días.
      stagesGuardados = stagesGuardados.map(s => s.key === 'f2' ? { ...s, label: 'F2 Programado' } : s);
      STAGES = stagesGuardados;
    }
    if(Array.isArray(data.POST_STAGES) && data.POST_STAGES.length) POST_STAGES = data.POST_STAGES;
    if(Array.isArray(data.pedidos)){
      pedidos = data.pedidos.map(p => ({
        familia: p.familia,
        cliente: p.cliente,
        fechaComprometida: new Date(p.fechaComprometida),
        fechaOriginal: new Date(p.fechaOriginal),
        decision: p.decision || null,
      }));
    }
    if(Array.isArray(data.leadTimeHistory) && data.leadTimeHistory.length) leadTimeHistory = data.leadTimeHistory;
    if(Array.isArray(data.knownProgramDates)) knownProgramDates = new Set(data.knownProgramDates);
    if(data.programaVersionPorFecha && typeof data.programaVersionPorFecha === 'object') programaVersionPorFecha = data.programaVersionPorFecha;
    return true;
  }catch(e){
    console.warn('El estado guardado no es válido, se usan los datos de fábrica:', e);
    return false;
  }
}

/* ---------- CAPACIDAD DE PLANTA (saturación por fase) — 17-sep-2026 ----------
   Pedido de Adrian: ver qué tan saturada está cada fase (F1/F2/F4-F7, F3 no
   existe desde el 08-sep y F8 nunca existió pese a un comentario viejo que lo
   mencionaba) comparando carga actual contra una capacidad capturada a mano.
   Investigación antes de construir (ver conversación): esta app SOLO calcula
   una carga real y variable para F4 (Fabricación) — `pendiente` (PT con OP
   sin fecha de lanzamiento, real de BC) ÷ `capacity` (PT/día) por familia, ya
   usado arriba en "Capturar datos" como "Fila de producción (F4)". F1, F2,
   F5, F6 y F7 son duraciones FIJAS (STAGES/POST_STAGES, mismos días para
   cualquier pedido) — el modelo de esta app nunca guarda en qué fase exacta
   está cada pedido individual, así que no existe un conteo real por fase para
   esas 5. En vez de inventar un cálculo nuevo, se reusa el único dato real de
   volumen de pedidos que sí existe en esta sección: el total de "pedidos
   activos en seguimiento" de la pestaña Alertas CS (mismo arreglo `pedidos`)
   — se compara contra la capacidad semanal que el admin capture para cada una
   de esas 5 fases. F4 no se captura aquí (se derivaría un dato duplicado y
   desincronizable frente a "Capacidad" por familia) — se sigue leyendo tal
   cual de `families`. */
const CAP_STORAGE_KEY = 'leadtime_capacidad_fases_v1';
const CAP_FASES_CAPTURABLES = ['f1','f2','f5','f6','f7']; // f4 se deriva, no se captura aquí
let capacidadFases = { f1: null, f2: null, f5: null, f6: null, f7: null };

function loadCapacidadFases(){
  try{
    const raw = localStorage.getItem(CAP_STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    CAP_FASES_CAPTURABLES.forEach(k=>{
      if(data && typeof data[k] === 'number' && isFinite(data[k])) capacidadFases[k] = data[k];
    });
  }catch(e){
    console.warn('No se pudo leer la capacidad de fases guardada:', e);
  }
}
function saveCapacidadFases(){
  try{ localStorage.setItem(CAP_STORAGE_KEY, JSON.stringify(capacidadFases)); }
  catch(e){ console.warn('No se pudo guardar la capacidad de fases:', e); }
}

/* Umbral: mismo esquema ok/warn/bad (verde/ámbar/rojo) que ya usa el resto de
   la app (report-badge, pill ok/warn/bad) — <70% ok, 70-100% warn, >100% bad. */
function nivelSaturacion(pct){
  if(pct === null) return 'sin-dato';
  if(pct > 100) return 'bad';
  if(pct >= 70) return 'warn';
  return 'ok';
}
const SATURACION_LABEL = { ok: 'normal', warn: 'ajustado', bad: 'sobrecargado', 'sin-dato': 'sin capacidad capturada' };
const SATURACION_ICONO = { ok: '✅', warn: '⚠️', bad: '🔴', 'sin-dato': '➖' };

/* Carga y capacidad real de F4, agregando TODAS las familias — mismos campos
   que ya usa computeCard()/renderCapture(), nada nuevo. */
function cargaCapacidadF4(){
  const cargaPiezas = families.reduce((s,f)=> s + (Number(f.pendiente)||0), 0);
  const capacidadSemana = families.reduce((s,f)=> s + (Number(f.capacity)||0), 0) * 5; // PT/día * 5 días hábiles
  return { carga: cargaPiezas, capacidad: capacidadSemana, unidad: 'PT' };
}

function datosSaturacionPorFase(){
  const pedidosActivos = pedidos.length;
  const orden = [
    { key:'f1', label: FASES_INFO.f1 ? 'F1 Por capturar' : 'F1' },
    { key:'f2', label: 'F2 Programado' },
    { key:'f4', label: 'F4 Fabricación' },
    { key:'f5', label: 'F5 Embarque' },
    { key:'f6', label: 'F6 Tránsito' },
    { key:'f7', label: 'F7 Instalación' },
  ];
  return orden.map(({key,label})=>{
    let carga, capacidad, unidad;
    if(key === 'f4'){
      const d = cargaCapacidadF4();
      carga = d.carga; capacidad = d.capacidad; unidad = d.unidad;
    } else {
      carga = pedidosActivos; capacidad = capacidadFases[key]; unidad = 'pedidos';
    }
    const pct = (capacidad !== null && capacidad !== undefined && capacidad > 0) ? (carga/capacidad*100) : null;
    const nivel = nivelSaturacion(pct);
    return { key, label, carga, capacidad, unidad, pct, nivel };
  });
}

function renderCapForm(){
  const wrap = ltRoot.getElementById('capForm');
  if(!wrap) return;
  const labels = { f1:'F1 Por capturar', f2:'F2 Programado', f5:'F5 Embarque', f6:'F6 Tránsito', f7:'F7 Instalación' };
  wrap.innerHTML = CAP_FASES_CAPTURABLES.map(key => `
    <div class="cap-field">
      <label>${labels[key]}</label>
      <span class="hint">pedidos / semana que puede procesar</span>
      <input type="number" step="1" min="0" data-fase="${key}" value="${capacidadFases[key] ?? ''}" placeholder="Sin capturar">
    </div>
  `).join('') + `
    <div class="cap-field">
      <label>F4 Fabricación</label>
      <span class="hint">PT / semana — suma de "Capturar datos"</span>
      <input type="text" value="${fmt(cargaCapacidadF4().capacidad,0)} PT" disabled>
    </div>
  `;
  wrap.querySelectorAll('input[data-fase]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const key = e.target.dataset.fase;
      const v = e.target.value === '' ? null : parseFloat(e.target.value);
      capacidadFases[key] = (v===null || isNaN(v)) ? null : v;
      saveCapacidadFases();
      renderCapChartYResumen();
    });
  });
}

function renderCapChartYResumen(){
  const datos = datosSaturacionPorFase();
  const canvas = ltRoot.getElementById('chartCapacidad');
  const COLOR_NIVEL = { ok: '#4C7A3F', warn: '#A87A22', bad: '#A6402F', 'sin-dato': '#B3B8C1' };
  if(canvas && typeof Chart !== 'undefined'){
    destroyChart('capacidad');
    charts.capacidad = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: datos.map(d=>d.label),
        datasets: [{
          label: '% de saturación',
          data: datos.map(d=> d.pct===null ? 0 : Number(d.pct.toFixed(0))),
          backgroundColor: datos.map(d=>COLOR_NIVEL[d.nivel]),
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx)=>{
            const d = datos[ctx.dataIndex];
            if(d.capacidad === null || d.capacidad === undefined || d.capacidad <= 0) return 'Sin capacidad capturada';
            return `Carga: ${fmt(d.carga,0)} ${d.unidad} · Capacidad: ${fmt(d.capacidad,0)} ${d.unidad}/semana · ${fmt(d.pct,0)}%`;
          } } },
        },
        scales: { y: { beginAtZero: true, ticks: { font:{size:10}, callback:(v)=>v+'%' } }, x: { ticks: { font:{size:10} } } },
      },
    });
  }

  const list = ltRoot.getElementById('capResumen');
  if(list){
    list.innerHTML = datos.map(d=>{
      if(d.nivel === 'sin-dato'){
        return `<div class="cap-item sin-dato">
          <div><div class="cap-item-fase">${d.label}</div><div class="cap-item-detalle">Captura la capacidad arriba para ver su saturación.</div></div>
          <div class="cap-item-badge">${SATURACION_ICONO['sin-dato']} sin dato</div>
        </div>`;
      }
      const cuello = d.pct > 100 ? ' — esta fase es tu cuello de botella' : '';
      return `<div class="cap-item ${d.nivel}">
        <div>
          <div class="cap-item-fase">${d.label}</div>
          <div class="cap-item-detalle">${fmt(d.carga,0)} ${d.unidad} de carga sobre ${fmt(d.capacidad,0)} ${d.unidad}/semana de capacidad${cuello}</div>
        </div>
        <div class="cap-item-badge">${SATURACION_ICONO[d.nivel]} ${fmt(d.pct,0)}% · ${SATURACION_LABEL[d.nivel]}</div>
      </div>`;
    }).join('');
  }
}

function renderCapacidadTab(){
  renderCapForm();
  renderCapChartYResumen();
}

/* ---------- INIT ---------- */
const seRestauroDesdeNavegador = loadState();
loadCapacidadFases();
/* Días sin captura quedan en 0 (no en "capacidad completa") — así "días de cola" solo refleja lo que

(async function init(){
  try{
    await Promise.all([pullShare(),pullApp()]);
  }catch(e){ console.error('[init] error cargando datos:',e); }
  const saved=sessionStorage.getItem('li_sess');
  if(saved){
    // Separado a propósito: si el JSON guardado está corrupto, SÍ hay que
    // desloguear (no hay con qué armar una sesión). Pero si enterApp() truena
    // YA con la sesión bien leída (un bug de renderizado, no de sesión), NO
    // se debe borrar SESSION — eso deja a la persona viendo la app "logueada"
    // pero en realidad deslogueada por dentro, sin ningún error visible (así
    // se vio "no hay proyectos" sin explicación). Mejor: se ve el error real
    // en consola y la sesión se queda viva para que un F5 alcance a arreglarlo.
    let parsed=null;
    try{ parsed=JSON.parse(saved); }
    catch(e){ console.error('[init] li_sess guardado está corrupto, se descarta:',e); sessionStorage.removeItem('li_sess'); }
    if(parsed){
      SESSION=parsed;
      try{ enterApp(); }
      catch(e){ console.error('[init] enterApp() falló después de restaurar la sesión — la sesión SIGUE activa, esto es un bug de renderizado:',e); }
    }
  }
})();
</script>
