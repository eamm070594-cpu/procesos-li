function categoriaPartida(estatusPartida) {
  if (estatusPartida.startsWith('Disponible')) return 'listo';
  // "Terminada tarde": la producción ya no está atorada (100% avance), solo falta
  // liberarla a CEDI. Se cuenta como 'listo' para KPIs de atraso, pero conserva su
  // propio texto para que se note que llegó tarde y conviene revisar por qué no se liberó.
  if (estatusPartida.startsWith('Terminada tarde')) return 'listo';
  if (estatusPartida.startsWith('ATRASADA')) return 'atrasada';
  if (estatusPartida.startsWith('En producción')) return 'en_proceso';
  if (estatusPartida.startsWith('Programado')) return 'en_proceso';
  if (estatusPartida.startsWith('SIN PROGRAMAR')) return 'riesgo';
  // Agregado 03-sep-2026: "planificada, aún no lanzada" se trata como
  // 'riesgo' para todoDisponible/sinOpAlguna (nada ha arrancado en piso
  // todavía, igual que "sin programar") — el texto completo de
  // estatusPartida sigue distinguiéndose ahí donde se muestra crudo, esto
  // solo afecta el bucket usado por esas 2 comprobaciones agregadas.
  if (estatusPartida.startsWith('PLANIFICADA')) return 'riesgo';
  return 'desconocido';
}

function normalizaSku(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[#_\s]/g, '').toUpperCase().trim();
}

// Busca un campo del renglón crudo del Excel tolerando variaciones de
// mayúsculas/espacios/guiones en el nombre de columna (ej. "Tipo de Venta",
// "Tipo_de_Venta", "Tipo_De_Venta" todos calzan con nombreEsperado="Tipo_de_Venta").
function campoFlexible(r, nombreEsperado) {
  if (r[nombreEsperado] !== undefined) return r[nombreEsperado];
  const objetivo = nombreEsperado.replace(/[^a-zA-Z]/g, '').toLowerCase();
  for (const k of Object.keys(r)) {
    if (k.replace(/[^a-zA-Z]/g, '').toLowerCase() === objetivo) return r[k];
  }
  return null;
}
// La columna de "fecha comprometida con el cliente" no siempre se llama igual
// entre exportes del ERP ("Fecha Requerida", "Fecha Comprometida", "Fecha de
// Entrega"...). Si solo se busca "Fecha_Requerida" y el archivo trae otro
// nombre, TODO el pedido se marca (incorrectamente) como "sin fecha" aunque
// el dato sí esté ahí, solo que bajo otra columna. Se intentan varios nombres
// conocidos antes de rendirse.
function campoFecha(r) {
  const candidatos = ['Fecha_Requerida', 'Fecha_Comprometida', 'Fecha_Compromiso', 'Fecha_de_Entrega', 'Fecha_Entrega'];
  for (const nombre of candidatos) {
    const v = campoFlexible(r, nombre);
    if (v !== null && v !== undefined && v !== '') return v;
  }
  return null;
}
// Normaliza la columna "Tipo de Venta" del ERP a las 4 categorías reales que
// usa Adrian (31-ago-2026: Exportación, Mayoristas, Venta directa, Flex),
// ignorando mayúsculas y acentos. Cualquier valor que no calce con ninguna
// (vacío, typo, categoría nueva) cae en "Otros" — nunca se pierde el dato.
function normalizaTexto(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}
function categoriaTipoVenta(raw) {
  const t = normalizaTexto(raw);
  if (!t) return 'Otros';
  if (t.includes('exportac')) return 'Exportación';
  if (t.includes('distribuidor')) return 'Distribuidores';
  if (t.includes('directa')) return 'Venta directa';
  if (t.includes('flex')) return 'Flex';
  return 'Otros';
}

// SheetJS (cellDates:true) y el cálculo de fecha serial de Excel entregan
// fechas ancladas en UTC-medianoche. El resto del código las lee con getters
// LOCALES (getFullYear/getMonth/getDate, en diasEntreFechas/fmtFecha/etc.) —
// en cualquier zona con offset negativo (México es UTC-6) eso corre TODA
// fecha un día hacia atrás: "01/09/2026" se leía como "31/08/2026", lo que
// hacía que fechas que ni siquiera habían llegado ya salieran como vencidas.
// Se reconstruye siempre a medianoche LOCAL usando los componentes UTC.
function aMedianocheLocal(d) {
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function toDateSafe(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : aMedianocheLocal(v);
  if (typeof v === 'number') {
    // Fecha serial de Excel (días desde 1899-12-30)
    const epoch = Date.UTC(1899, 11, 30);
    const d = new Date(epoch + v * 86400000);
    return isNaN(d.getTime()) ? null : aMedianocheLocal(d);
  }
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s) return null;
    // "DD/MM/AAAA" o "DD-MM-AAAA" (como exporta Business Central en español),
    // con hora opcional. El Date nativo de JS asume MM/DD y con esto falla o
    // se equivoca en silencio -- se parsea explícito antes de intentar nada más.
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (m) {
      const [, dd, mm, yyyy, hh, min, ss] = m;
      const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd), Number(hh || 0), Number(min || 0), Number(ss || 0));
      return isNaN(d.getTime()) ? null : d;
    }
    // Formatos tipo ISO ("AAAA-MM-DD") -- el parser nativo sí los interpreta bien.
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  return null;
}

// Cambio 03-sep-2026 (Adrian: "no trabajo sábados ni domingos", confirmado
// que aplica a TODO Andon, no solo al Reporte de Folios) — cuenta SOLO días
// hábiles (lunes a viernes) entre 2 fechas; sábado y domingo no suman ni
// restan nada. Antes contaba días de calendario simple. Como el resto de la
// app (atrasos, días para entrega, días en captura, pedidos antiguos, etc.)
// pasa por esta única función, el cambio de regla de negocio aplica solo
// con tocar aquí — no hace falta editar cada lugar que la usa por separado.
function diasEntreFechas(desde, hasta) {
  if (!hasta) return null;
  const d1 = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate());
  const d2 = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate());
  if (d1.getTime() === d2.getTime()) return 0;
  const signo = d2 > d1 ? 1 : -1;
  const inicio = signo === 1 ? d1 : d2;
  const fin = signo === 1 ? d2 : d1;
  let dias = 0;
  const cursor = new Date(inicio);
  cursor.setDate(cursor.getDate() + 1);
  while (cursor <= fin) {
    const dow = cursor.getDay(); // 0=domingo, 6=sábado
    if (dow !== 0 && dow !== 6) dias++;
    cursor.setDate(cursor.getDate() + 1);
  }
  return signo * dias;
}

// Suma (o resta, si n es negativo) N días HÁBILES a una fecha — mismo
// criterio que diasEntreFechas de arriba (fin de semana no cuenta). Usado
// donde se necesita construir una fecha nueva a partir de un desplazamiento
// fijo de días (ej. fecha límite de producción = fecha comprometida − N
// días de flete/armado), no solo comparar 2 fechas ya existentes.
function sumarDiasHabiles(fecha, n) {
  const resultado = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  const paso = n >= 0 ? 1 : -1;
  let restantes = Math.abs(n);
  while (restantes > 0) {
    resultado.setDate(resultado.getDate() + paso);
    const dow = resultado.getDay();
    if (dow !== 0 && dow !== 6) restantes--;
  }
  return resultado;
}

function construirDataRows(prodRecords, manufactura, comprados, hoy) {
  const UMBRAL_PROXIMA_DIAS = 7;
  // Colchón entre "producción termina" y "fecha comprometida" (mueble armado en
  // sitio del cliente), según las fases del CRM: F5 Listo para Embarcar (5d) +
  // F6 En Tránsito (2d) + F7 En Instalación (3d) = 10 días.
  const DIAS_FLETE_Y_ARMADO = 10;
  // Días máximos ANTES de producción, según el CRM: F1 Por Capturar (2d) +
  // F2 Capturado (3d) + F3 Programado (4d) = 9 días desde que entra el pedido
  // hasta que debería estar generada la OP y arrancando fabricación.
  const DIAS_CAPTURA_MAX = 9;

  // 1. Agregar producción por SKU normalizado.
  // Regla de negocio (confirmada por Adrian, 1-sep-2026): lo que de verdad dice
  // si una OP sigue pendiente es CantPendiente > 0 — NO el % de avance, que
  // puede no estar bien alimentado. Antes se usaba Pct_Avance < 100 como
  // criterio; ahora es CantPendiente > 0. "Atrasada" = todavía queda cantidad
  // por producir Y ya se pasó la fecha de vencimiento de la OP. Si ya no queda
  // cantidad pendiente pero terminó después de su fecha de vencimiento, ya no
  // es un problema de producción — es un pendiente de liberar a CEDI.
  const agg = new Map();
  for (const p of prodRecords) {
    const sku = normalizaSku(p.Modelo);
    if (!sku) continue;
    const diasAtraso = p.Fecha_Vencimiento ? -diasEntreFechas(hoy, p.Fecha_Vencimiento) : 0;
    if (!agg.has(sku)) {
      agg.set(sku, {
        // Agregado 04-sep-2026 (para la Vista de Piso por Centro de Trabajo):
        // ops/fechas ya se rastreaban, pero el Centro de Trabajo real
        // (columna NombreCTrabajo del Excel de Avance — ej. "ENSAMBLE
        // MUEBLES", "LASER", "CARP") nunca se guardaba, así que no había
        // forma de agrupar por dónde trabaja piso (distinto de "Familia",
        // que es categoría de producto, no estación de trabajo).
        incompleta: { existe: false, cantPendienteTotal: 0, cantTotal: 0, diasAtrasoMax: -Infinity, ops: new Set(), fechas: new Set(), centros: new Set() },
        completaTarde: { existe: false, diasAtrasoMax: -Infinity, ops: new Set(), fechas: new Set() },
        // Agregado 03-sep-2026: OP con Estado Planificada/Planif. firme —
        // "Lanzada" es lo que Adrian aclaró que significa "ya está programado
        // para planta" (tiene lugar asignado en piso); Planificada es un paso
        // antes, ya está en el plan pero SIN lanzar a piso todavía. Antes el
        // filtro de descarga de BC ni siquiera traía estas OP, así que un SKU
        // solo con una OP planificada se veía igual que "sin ninguna OP en
        // absoluto" (SIN PROGRAMAR) — bucket aparte para no repetir ese error.
        planificada: { existe: false, cantPendienteTotal: 0, cantTotal: 0, ops: new Set(), fechas: new Set(), centros: new Set() },
        // Agregado 04-sep-2026 (Adrian: "quiero que aparezcan en el reporte
        // como terminadas si así lo marca los archivos" — antes una OP ya al
        // 100% a tiempo simplemente no guardaba ni OP ni fecha, así que el
        // Reporte de Folios no tenía forma de ubicarla en ninguna fase y la
        // partida desaparecía sin dejar rastro, aunque el archivo de Avance sí
        // trae su fecha real). Se guarda aparte para no mezclarla con
        // "incompleta" (que sigue significando "todavía falta producir").
        completaATiempo: { existe: false, ops: new Set(), fechas: new Set() },
      });
    }
    const a = agg.get(sku);
    const esPlanificada = p.Estado === 'Planificada' || p.Estado === 'Planif. firme';
    if (esPlanificada) {
      a.planificada.existe = true;
      a.planificada.cantPendienteTotal += p.Cant_Pendiente;
      a.planificada.cantTotal += (p.Cant_Total || p.Cant_Pendiente);
      if (p.No_OP) a.planificada.ops.add(p.No_OP);
      if (p.Fecha_Vencimiento) a.planificada.fechas.add(fmtFecha(p.Fecha_Vencimiento));
      if (p.Centro_Trabajo) a.planificada.centros.add(p.Centro_Trabajo);
    } else if (p.Cant_Pendiente > 0) {
      a.incompleta.existe = true;
      a.incompleta.cantPendienteTotal += p.Cant_Pendiente;
      a.incompleta.cantTotal += (p.Cant_Total || p.Cant_Pendiente);
      a.incompleta.diasAtrasoMax = Math.max(a.incompleta.diasAtrasoMax, diasAtraso);
      if (p.No_OP) a.incompleta.ops.add(p.No_OP);
      if (p.Fecha_Vencimiento) a.incompleta.fechas.add(fmtFecha(p.Fecha_Vencimiento));
      if (p.Centro_Trabajo) a.incompleta.centros.add(p.Centro_Trabajo);
    } else if (diasAtraso > 0) {
      a.completaTarde.existe = true;
      a.completaTarde.diasAtrasoMax = Math.max(a.completaTarde.diasAtrasoMax, diasAtraso);
      if (p.No_OP) a.completaTarde.ops.add(p.No_OP);
      if (p.Fecha_Vencimiento) a.completaTarde.fechas.add(fmtFecha(p.Fecha_Vencimiento));
    } else {
      // Cant_Pendiente = 0 y no llegó tarde: terminada a tiempo.
      a.completaATiempo.existe = true;
      if (p.No_OP) a.completaATiempo.ops.add(p.No_OP);
      if (p.Fecha_Vencimiento) a.completaATiempo.fechas.add(fmtFecha(p.Fecha_Vencimiento));
    }
  }

  // FIX TEMPORAL (30-ago, quitar cuando Adrian termine de ligar bien OP↔pedido
  // desde la fuente — ver PENDIENTES_LeadTime.md punto 8): el ERP trae el SKU
  // "base" de un kit/compuesto (ej. "FD-6491"), pero producción registra sus
  // sub-partes con sufijo de letra (ej. "FD-6491A", "FD-6491B"). Si no hay
  // coincidencia exacta, se buscan todas las sub-partes (SKU + una sola letra)
  // y se combinan tomando el peor caso entre todas — el kit no está resuelto
  // hasta que TODAS sus sub-partes lo estén. Se marca "match" como 'exacto' o
  // 'sub-partes' para que el detalle sea transparente sobre qué se infirió.
  function buscarAgregadoPorSku(sku) {
    if (agg.has(sku)) return { info: agg.get(sku), match: 'exacto', subPartes: [] };
    const subPartes = [];
    for (const k of agg.keys()) {
      if (k.length === sku.length + 1 && k.startsWith(sku) && /^[A-Z]$/.test(k.slice(sku.length))) {
        subPartes.push(k);
      }
    }
    if (!subPartes.length) return null;
    const combinado = {
      incompleta: { existe: false, cantPendienteTotal: 0, cantTotal: 0, diasAtrasoMax: -Infinity, ops: new Set(), fechas: new Set() },
      completaTarde: { existe: false, diasAtrasoMax: -Infinity, ops: new Set(), fechas: new Set() },
      planificada: { existe: false, cantPendienteTotal: 0, cantTotal: 0, ops: new Set(), fechas: new Set(), centros: new Set() },
      completaATiempo: { existe: false, ops: new Set(), fechas: new Set() },
    };
    combinado.incompleta.centros = new Set();
    subPartes.forEach(k => {
      const c = agg.get(k);
      if (c.incompleta.existe) {
        combinado.incompleta.existe = true;
        combinado.incompleta.cantPendienteTotal += c.incompleta.cantPendienteTotal;
        combinado.incompleta.cantTotal += c.incompleta.cantTotal;
        combinado.incompleta.diasAtrasoMax = Math.max(combinado.incompleta.diasAtrasoMax, c.incompleta.diasAtrasoMax);
        c.incompleta.ops.forEach(op => combinado.incompleta.ops.add(op));
        c.incompleta.fechas.forEach(f => combinado.incompleta.fechas.add(f));
        c.incompleta.centros.forEach(ct => combinado.incompleta.centros.add(ct));
      }
      if (c.completaTarde.existe) {
        combinado.completaTarde.existe = true;
        combinado.completaTarde.diasAtrasoMax = Math.max(combinado.completaTarde.diasAtrasoMax, c.completaTarde.diasAtrasoMax);
        c.completaTarde.ops.forEach(op => combinado.completaTarde.ops.add(op));
        c.completaTarde.fechas.forEach(f => combinado.completaTarde.fechas.add(f));
      }
      if (c.planificada.existe) {
        combinado.planificada.existe = true;
        combinado.planificada.cantPendienteTotal += c.planificada.cantPendienteTotal;
        combinado.planificada.cantTotal += c.planificada.cantTotal;
        c.planificada.ops.forEach(op => combinado.planificada.ops.add(op));
        c.planificada.fechas.forEach(f => combinado.planificada.fechas.add(f));
        c.planificada.centros.forEach(ct => combinado.planificada.centros.add(ct));
      }
      if (c.completaATiempo.existe) {
        combinado.completaATiempo.existe = true;
        c.completaATiempo.ops.forEach(op => combinado.completaATiempo.ops.add(op));
        c.completaATiempo.fechas.forEach(f => combinado.completaATiempo.fechas.add(f));
      }
    });
    return { info: combinado, match: 'sub-partes', subPartes };
  }

  // FIX (04-sep-2026, Adrian con caso real FD-5428/OP09251202: la línea de
  // P-10113918 decía ERP "Programado completo" y la de P-10114353 decía ERP
  // "No programado" para el MISMO SKU, pero como el cruce es por SKU, la de
  // "No programado" heredaba igual la OP/pieza pendiente de la otra — mismo
  // patrón del bug del 03-sep, caso que ese fix no cubría (solo blindaba
  // "Listo para embarcar", no "No programado"). Si el ERP ya dice, en OTRA
  // línea de este mismo SKU, que sí hay algo programado/lanzado, entonces una
  // línea "No programado" no debe heredar el pool de producción — el ERP ya
  // está confirmando, línea por línea, que a ESTA le falta programar.
  const skusConLineaProgramada = new Set();
  manufactura.forEach(r => {
    if (r.Estatus && r.Estatus !== 'No programado') {
      skusConLineaProgramada.add(normalizaSku(r.No_Producto_SKU));
    }
  });

  // 2. Cruzar cada partida de manufactura con producción
  const cruce = manufactura.map(r => {
    const sku = normalizaSku(r.No_Producto_SKU);
    const encontrado = buscarAgregadoPorSku(sku);
    const a = encontrado ? encontrado.info : null;
    const otraLineaReclamaEsteSku = r.Estatus === 'No programado' && skusConLineaProgramada.has(sku);
    const notaSubPartes = encontrado && encontrado.match === 'sub-partes'
      ? ` [inferido de sub-partes ${encontrado.subPartes.join(', ')} — cruce temporal, ver pendiente #8]` : '';
    let diasAtraso = 0, estatusPartida, noOpTexto = null, fechaOpTexto = null, centroTrabajoTexto = null;
    // Piezas que de verdad faltan por producir para esta partida (CantPendiente
    // real de la OP, no el % de avance) — se guarda aparte como número, no solo
    // metido en el texto de estatus, para poder sumarlo en los totales del
    // Resumen Directivo.
    let piezasPendientesProduccion = otraLineaReclamaEsteSku ? 0
      : (a && a.incompleta.existe) ? a.incompleta.cantPendienteTotal
      : (a && a.planificada.existe) ? a.planificada.cantPendienteTotal : 0;
    // 03-sep-2026 (Adrian, con caso real confirmado: SKU FA-6379 aparecía en
    // 7 líneas de venta de 4 pedidos distintos — P-10113854/855/868/920 —
    // TODAS marcadas "Listo para embarcar" por el ERP, pero como ese mismo
    // SKU tenía una sola OP con 3 piezas pendientes (de otro pedido que no es
    // ninguno de estos 4), a las 7 se les pegaba igual esa misma OP/fecha/
    // piezas — mostrando ~$67,000 en líneas ya listas como si siguieran en
    // producción. El cruce por SKU (Excel de Avance) no distingue a qué
    // pedido pertenece cada OP — ver nota de "cruce temporal" arriba —, pero
    // el Estatus de la LÍNEA DE VENTA en el ERP sí es específico de este
    // pedido/línea exacto, así que gana primero: si el ERP ya confirma esta
    // línea como lista para embarcar, no se le hereda el estatus de
    // producción de una OP que en realidad es de otra línea/pedido.
    // EXCEPCIÓN (03-sep-2026, misma tarde — Adrian con OPs de garantía reales
    // en papel: OPG01861/900-KIT, OPG01862/901-KIT): en garantías, la línea
    // de venta ORIGINAL suele ya estar "Listo para embarcar" desde la entrega
    // inicial — la OP de garantía se abre DESPUÉS, para reponer/reparar esa
    // misma pieza, y es genuinamente la de este mismo pedido (no una fuga de
    // otro pedido como el caso de FA-6379). Adrian confirmó la regla: para
    // garantías, la OP de producción manda sobre el estatus viejo de la
    // línea de venta.
    const esGarantiaLinea = normalizaTexto(campoFlexible(r, 'Estatus_de_factura')) === 'garantias';
    if (r.Estatus === 'Listo para embarcar' && !(esGarantiaLinea && a && a.incompleta.existe)) {
      piezasPendientesProduccion = 0;
      // 04-sep-2026: si de todos modos hay un registro de producción para
      // este SKU ya terminado a tiempo, se conserva su OP/fecha (antes se
      // perdían aquí) — sin esto, el Reporte de Folios no podía ubicar la
      // partida en ninguna fase y simplemente desaparecía del reporte.
      if (a && a.completaATiempo.existe) {
        noOpTexto = a.completaATiempo.ops.size ? Array.from(a.completaATiempo.ops).join(', ') : null;
        fechaOpTexto = a.completaATiempo.fechas.size ? Array.from(a.completaATiempo.fechas).join(', ') : null;
      }
      estatusPartida = 'Disponible en CEDI (confirmado por ERP)';
    } else if (a && a.incompleta.existe && !otraLineaReclamaEsteSku) {
      // Sigue habiendo una OP sin terminar para este SKU: esto sí es producción real en curso (o atrasada).
      diasAtraso = a.incompleta.diasAtrasoMax;
      noOpTexto = a.incompleta.ops.size ? Array.from(a.incompleta.ops).join(', ') : null;
      fechaOpTexto = a.incompleta.fechas.size ? Array.from(a.incompleta.fechas).join(', ') : null;
      centroTrabajoTexto = a.incompleta.centros.size ? Array.from(a.incompleta.centros).join(', ') : null;
      estatusPartida = (diasAtraso > 0
        ? `ATRASADA EN PRODUCCIÓN (${diasAtraso} días, faltan ${a.incompleta.cantPendienteTotal} de ${a.incompleta.cantTotal} pza.)`
        : `En producción (faltan ${a.incompleta.cantPendienteTotal} de ${a.incompleta.cantTotal} pza.)`) + notaSubPartes;
    } else if (a && a.completaTarde.existe) {
      // Todas las OPs de este SKU ya están al 100%, solo que terminaron después de
      // su fecha de vencimiento. Ya no es un problema de producción — es un pendiente
      // de liberar a CEDI, así que NO cuenta como atraso de producción (diasAtraso=0).
      noOpTexto = a.completaTarde.ops.size ? Array.from(a.completaTarde.ops).join(', ') : null;
      fechaOpTexto = a.completaTarde.fechas.size ? Array.from(a.completaTarde.fechas).join(', ') : null;
      estatusPartida = `Terminada tarde (${a.completaTarde.diasAtrasoMax} días después de vencimiento) — pendiente liberar a CEDI` + notaSubPartes;
    } else if (a && a.planificada.existe && !otraLineaReclamaEsteSku) {
      // Agregado 03-sep-2026: ya está en el plan de producción (Estado=
      // Planificada o Planif. firme), pero TODAVÍA no tiene lugar asignado en
      // piso ("Lanzada"). Adrian: "LANZADO es que ya está programado para
      // planta". No cuenta como atraso de producción (no ha arrancado) ni
      // como SIN PROGRAMAR (sí existe un plan, solo falta lanzarlo).
      noOpTexto = a.planificada.ops.size ? Array.from(a.planificada.ops).join(', ') : null;
      fechaOpTexto = a.planificada.fechas.size ? Array.from(a.planificada.fechas).join(', ') : null;
      centroTrabajoTexto = a.planificada.centros.size ? Array.from(a.planificada.centros).join(', ') : null;
      estatusPartida = `PLANIFICADA, AÚN NO LANZADA A PISO (${a.planificada.cantPendienteTotal} de ${a.planificada.cantTotal} pza.)` + notaSubPartes;
    } else if (a && !otraLineaReclamaEsteSku) {
      // Todas las OPs de este SKU están al 100% y terminaron a tiempo.
      // 04-sep-2026: igual que arriba, se conserva la OP/fecha real para que
      // el Reporte de Folios pueda mostrarla como "Terminada" en su fase.
      if (a.completaATiempo.existe) {
        noOpTexto = a.completaATiempo.ops.size ? Array.from(a.completaATiempo.ops).join(', ') : null;
        fechaOpTexto = a.completaATiempo.fechas.size ? Array.from(a.completaATiempo.fechas).join(', ') : null;
      }
      estatusPartida = 'Disponible (producción completa a tiempo)' + notaSubPartes;
    } else if (r.Estatus === 'No programado' || r.Estatus === 'Planificada' || otraLineaReclamaEsteSku) {
      // No hay OP que la cubra Y el ERP confirma que tampoco se ha programado.
      // No asumimos "disponible" aquí — es justo el caso que se pierde entre
      // el PDF (no la rastrea) y el ERP (si la marca como pendiente de programar).
      // Si otraLineaReclamaEsteSku=true, el texto lo aclara: hay producción de
      // este SKU, pero el ERP mismo dice que es de OTRA línea/pedido, no de esta.
      estatusPartida = otraLineaReclamaEsteSku
        ? `SIN PROGRAMAR (SKU con producción/OP asignada a otra línea o pedido, ERP: ${r.Estatus})`
        : `SIN PROGRAMAR (ERP: ${r.Estatus}, sin OP en el Excel de producción)`;
    } else if (r.Estatus === 'Programado completo' && historialOP[sku]) {
      // 08-sep-2026: antes esto se daba por perdido ("fuera del alcance de
      // este Excel"), pero si en algún Avance subido antes sí vimos una OP
      // para este SKU, mostrarla es mejor que nada — se marca claramente
      // como "última conocida" para no aparentar que es de este Excel.
      const h = historialOP[sku];
      noOpTexto = h.noOp; fechaOpTexto = h.fecha;
      estatusPartida = `Programado (OP ${h.noOp} — última vez vista el ${h.vistoEl}, ya no aparece en este Excel de producción)`;
    } else if (r.Estatus === 'Programado completo') {
      // El ERP dice que sí tiene algo lanzado (OP, compra o plan), pero ese
      // trabajo no aparece en este Excel — probablemente otra familia/planta.
      estatusPartida = 'Programado (fuera del alcance de este Excel de producción)';
    } else if (historialOP[sku]) {
      // 08-sep-2026 (Adrian: "es muy extraño que no pueda leer la op del
      // pedido, revisa eso" → luego "pero si es importante ver op,
      // intentalo con el avance que descargue") — se revisaron 2 rondas de
      // Excel reales a fondo, la última con un Avance recién descargado de
      // 440 renglones/203 modelos: el cruce por SKU normalizado en sí
      // funciona bien, pero solo ~12% de las partidas pendientes reales
      // tienen una OP viva en el Avance de ESE momento. La causa: "Avance
      // del programa de producción" es una FOTO del trabajo EN CURSO, no un
      // histórico — en cuanto una OP se termina y pasa tiempo, deja de
      // aparecer ahí. El campo Fecha_OP de Estatus Pedidos (que en teoría
      // podría servir de respaldo) está vacío en 1781 de 1784 filas reales,
      // así que tampoco sirve. Solución real: Andon ahora GUARDA (ver
      // HISTORIAL_OP_KEY arriba) la última OP vista de cada SKU cada vez que
      // subes un Avance, y la usa aquí como respaldo cuando el Avance de hoy
      // ya no la trae — se acumula con cada Avance que subas.
      const h = historialOP[sku];
      noOpTexto = h.noOp; fechaOpTexto = h.fecha;
      estatusPartida = `Disponible (última OP conocida: ${h.noOp} — vista por última vez el ${h.vistoEl}, ya no aparece en el Avance actual)`;
    } else {
      // Ni el Avance actual ni ningún Avance subido antes (historialOP)
      // tienen rastro de una OP para este SKU — genuinamente no hay dato
      // disponible en ningún archivo que Andon haya visto hasta ahora.
      estatusPartida = 'Disponible (sin rastro de OP en ningún Avance subido hasta ahora)';
    }
    const fechaReqReal = toDateSafe(campoFecha(r));
    return {
      Cliente: r.Nombre_del_Cliente,
      Fecha_Pedido: toDateSafe(campoFlexible(r, 'Fecha_Pedido')),
      Fecha_Requerida: fechaReqReal,
      No_Documento: r.No_Documento,
      Orden_de_Compra: r.Orden_de_compra,
      SKU: r.No_Producto_SKU,
      Descripcion: r.Description,
      Cantidad_Pendiente: r.Outstanding_Quantity,
      Costo_Pendiente: r.Costo_pendiente || 0,
      Monto_Pendiente: r.Importe_Pendiente || 0,
      Estatus_ERP: r.Estatus,
      Familia_Codigo: r.Gen__Prod__Posting_Group,
      Estatus_Partida: estatusPartida,
      Dias_Atraso_Partida: diasAtraso,
      Piezas_Pendientes_Produccion: piezasPendientesProduccion,
      No_OP: noOpTexto,
      Fecha_Vencimiento_OP: fechaOpTexto,
      Centro_Trabajo_Real: centroTrabajoTexto,
      Tipo_Venta: categoriaTipoVenta(campoFlexible(r, 'TipoVenta')),
      // Corregido 03-sep-2026 (Adrian: "las garantías estamos tomando otra
      // columna, debemos filtrar de estatus de facturas"): el criterio viejo
      // (Inventory_Posting_Group === 'P-SUB GARANTIA') solo capturaba 4 de
      // las 44 garantías reales del corte de prueba — la columna correcta es
      // Estatus_de_factura === "Garantias", verificado contra el Excel real
      // ("Estatus Pedidos capturados"): 44 renglones con ese valor, repartidos
      // en varios Inventory_Posting_Group distintos (PP-MANUFAC, PT-MANUFAC-NAC,
      // MP-COMP-NAC...), no solo P-SUB GARANTIA.
      Es_Garantia: normalizaTexto(campoFlexible(r, 'Estatus_de_factura')) === 'garantias',
    };
  });

  // FIX (04-sep-2026, Adrian con caso real P-10114353/FA-6379: BC partió el
  // MISMO SKU, dentro del MISMO pedido, en 2 líneas de venta [2pza + 1pza]
  // que ambas caen sobre la ÚNICA OP de esa SKU [3 pza pendientes] — cada
  // línea mostraba el total COMPLETO de la OP (3 de 3) en vez de repartirse,
  // así que sumar las 2 filas del reporte inflaba al doble lo realmente
  // pendiente. Verificado con 3 casos reales del mismo corte (FA-6379 2+1=3,
  // FA-6549 1+5=6, FC-6199 5+1=6 — la suma de las líneas de venta siempre
  // cuadra exacto con el pendiente real de la OP), así que fusionarlas
  // sumando la cantidad/costo de cada línea (dato real del ERP, no inventado)
  // da el número correcto sin perder el detalle de a qué línea pertenece cada
  // pieza. Solo aplica a partidas con producción activa real (en producción,
  // atrasada o planificada) y con OP asignada — no toca "Disponible"/"SIN
  // PROGRAMAR"/"Programado (fuera de alcance)", donde no hay pool que repartir.
  const cruceFusionado = [];
  const idxPorLlaveFusion = new Map();
  for (const it of cruce) {
    const enPoolCompartible = it.No_OP && /^(En producción|ATRASADA EN PRODUCCIÓN|PLANIFICADA)/.test(it.Estatus_Partida);
    if (enPoolCompartible) {
      const llave = it.No_Documento + '||' + normalizaSku(it.SKU) + '||' + it.No_OP;
      if (idxPorLlaveFusion.has(llave)) {
        const existente = cruceFusionado[idxPorLlaveFusion.get(llave)];
        existente.Cantidad_Pendiente += it.Cantidad_Pendiente;
        existente.Costo_Pendiente += it.Costo_Pendiente;
        existente.Monto_Pendiente += it.Monto_Pendiente;
        continue;
      }
      idxPorLlaveFusion.set(llave, cruceFusionado.length);
    }
    cruceFusionado.push(it);
  }

  // 3. Agrupar por pedido (cliente + no_documento) para calcular estatus general y riesgo
  const grupos = new Map();
  for (const it of cruceFusionado) {
    const key = it.Cliente + '||' + it.No_Documento;
    if (!grupos.has(key)) grupos.set(key, []);
    grupos.get(key).push(it);
  }

  const infoPedido = new Map();
  for (const [key, grupo] of grupos) {
    const peorAtraso = Math.max(...grupo.map(g => g.Dias_Atraso_Partida));
    const todoDisponible = grupo.every(g => categoriaPartida(g.Estatus_Partida) === 'listo');
    const sinOpAlguna = grupo.some(g => categoriaPartida(g.Estatus_Partida) === 'riesgo');
    const fechasReq = grupo.map(g => g.Fecha_Requerida).filter(Boolean).sort((a, b) => a - b);
    const fechaReq = fechasReq.length ? fechasReq[0] : null;
    const diasParaEntrega = fechaReq ? diasEntreFechas(hoy, fechaReq) : null;

    // Fecha límite real de PCP: cuándo debe estar TERMINADA la producción para
    // que, con flete + armado, el pedido llegue armado en la fecha comprometida.
    // 03-sep-2026: resta días HÁBILES (no de calendario) — ver sumarDiasHabiles.
    const fechaLimiteProduccion = fechaReq ? sumarDiasHabiles(fechaReq, -DIAS_FLETE_Y_ARMADO) : null;
    const diasParaLimiteProduccion = fechaLimiteProduccion ? diasEntreFechas(hoy, fechaLimiteProduccion) : null;

    // Días transcurridos desde que entró el pedido (Fecha_Pedido), contra el
    // máximo de 9 días que debería tardar en pasar por Captura/Programación
    // antes de arrancar producción.
    const fechaPedidoGrupo = grupo.map(g => g.Fecha_Pedido).filter(Boolean).sort((a, b) => a - b)[0] || null;
    const diasEnCaptura = fechaPedidoGrupo ? diasEntreFechas(fechaPedidoGrupo, hoy) : null;

    // OJO: antes estas dos condiciones solo se activaban si "sinOpAlguna" (ninguna
    // partida tenía OP lanzada todavía). Eso dejaba pasar como "Al corriente" un
    // pedido con OP lanzada pero estancada en 0% de avance, aunque ya no quedara
    // margen de producción (límite en 0 días o vencido) o ya se hubiera pasado
    // por mucho el tiempo esperado de captura — que es exactamente tan grave.
    // Ahora se marca en riesgo por el simple hecho de faltar producto + estar
    // contra el tiempo, tenga o no OP lanzada (el texto solo cambia para decir
    // cuál es el caso).
    const riesgos = [];
    if (peorAtraso > 0) {
      riesgos.push(`Atraso de producción (${peorAtraso} días)`);
    }
    if (diasEnCaptura !== null && diasEnCaptura > DIAS_CAPTURA_MAX && !todoDisponible) {
      riesgos.push(sinOpAlguna
        ? `Lleva ${diasEnCaptura} días desde que entró (máx. ${DIAS_CAPTURA_MAX}d de captura/programación) y aún le falta lanzar OP a alguna partida`
        : `Lleva ${diasEnCaptura} días desde que entró (máx. ${DIAS_CAPTURA_MAX}d de captura/programación) — ya tiene OP lanzada, pero conviene revisar por qué no avanza`);
    }
    if (diasParaEntrega !== null && diasParaEntrega < 0) {
      if (todoDisponible) {
        riesgos.push(`Todo disponible en CEDI, pero la fecha requerida venció hace ${-diasParaEntrega} días — revisa por qué no se ha facturado/embarcado`);
      } else if (sinOpAlguna) {
        riesgos.push(`Fecha requerida vencida hace ${-diasParaEntrega} días y falta lanzar la OP de alguna partida`);
      } else {
        riesgos.push(`Fecha requerida vencida hace ${-diasParaEntrega} días`);
      }
    } else if (!todoDisponible && diasParaLimiteProduccion !== null && diasParaLimiteProduccion < 0) {
      // Ya se pasó la fecha límite de producción (compromiso menos flete+armado),
      // aunque la fecha comprometida con el cliente todavía no llegue.
      riesgos.push(`Ya se venció la fecha límite de producción (compromiso − ${DIAS_FLETE_Y_ARMADO}d de flete/armado), hace ${-diasParaLimiteProduccion} días — quedan ${diasParaEntrega}d para la fecha comprometida real, pero ya no hay margen de logística`);
    } else if (!todoDisponible && diasParaLimiteProduccion !== null && diasParaLimiteProduccion <= UMBRAL_PROXIMA_DIAS) {
      riesgos.push(sinOpAlguna
        ? `Falta lanzar OP y la fecha límite de producción está próxima (≤7 días, quedan ${diasParaLimiteProduccion}d)`
        : `La fecha límite de producción está próxima o ya llegó (quedan ${diasParaLimiteProduccion}d) y todavía falta producto por terminar`);
    }

    infoPedido.set(key, {
      peorAtraso, todoDisponible, enRiesgo: riesgos.length > 0,
      motivos: riesgos.join('; '), diasParaEntrega,
      fechaLimiteProduccion, diasParaLimiteProduccion,
      diasEnCaptura,
    });
  }

  // 4. Armar filas planas (mismo esquema que antes leía de la hoja "Data")
  const dataRows = [];
  for (const it of cruceFusionado) {
    const key = it.Cliente + '||' + it.No_Documento;
    const ped = infoPedido.get(key);
    dataRows.push({
      Tipo: 'Manufactura',
      Cliente: it.Cliente,
      Fecha_Pedido: it.Fecha_Pedido,
      Fecha_Requerida: it.Fecha_Requerida,
      No_Documento: it.No_Documento,
      Orden_de_Compra: it.Orden_de_Compra,
      SKU: it.SKU,
      Descripcion: it.Descripcion,
      Cantidad_Pendiente: it.Cantidad_Pendiente,
      Costo_Pendiente: it.Costo_Pendiente,
      Monto_Pendiente: it.Monto_Pendiente,
      Estatus_ERP: it.Estatus_ERP,
      Familia_Codigo: it.Familia_Codigo,
      Estatus_Partida: it.Estatus_Partida,
      // 02-sep-2026: este campo (atraso de ESTA partida/OP específica, no el
      // peor caso del pedido) se calculaba en el paso 2 (línea ~1230) pero
      // nunca se copiaba a la fila final — se perdía aquí. Un pedido se marca
      // "atrasado" (Peor_Atraso_Pedido > 0) si CUALQUIERA de sus partidas está
      // vencida, así que sin este campo era imposible saber, en el detalle,
      // cuál SKU/OP es el que realmente causa el atraso — Adrian lo notó
      // ("por qué me los dejas en atraso si aún no llega la fecha de la OP").
      Dias_Atraso_Partida: it.Dias_Atraso_Partida,
      Piezas_Pendientes_Produccion: it.Piezas_Pendientes_Produccion,
      No_OP: it.No_OP,
      Fecha_Vencimiento_OP: it.Fecha_Vencimiento_OP,
      Centro_Trabajo_Real: it.Centro_Trabajo_Real,
      Tipo_Venta: it.Tipo_Venta,
      Es_Garantia: it.Es_Garantia,
      Pedido_Completo: ped.todoDisponible,
      Peor_Atraso_Pedido: ped.peorAtraso,
      En_Riesgo: ped.enRiesgo,
      Motivos_Riesgo: ped.motivos,
      Dias_Para_Entrega: ped.diasParaEntrega,
      Fecha_Limite_Produccion: ped.fechaLimiteProduccion,
      Dias_Para_Limite_Produccion: ped.diasParaLimiteProduccion,
      Dias_En_Captura: ped.diasEnCaptura,
    });
  }
  for (const r of comprados) {
    const fechaReqCompra = toDateSafe(campoFecha(r));
    const diasParaEntrega = fechaReqCompra ? diasEntreFechas(hoy, fechaReqCompra) : null;
    dataRows.push({
      Tipo: 'Compra',
      Cliente: r.Nombre_del_Cliente,
      Fecha_Pedido: toDateSafe(campoFlexible(r, 'Fecha_Pedido')),
      Fecha_Requerida: fechaReqCompra,
      No_Documento: r.No_Documento,
      Orden_de_Compra: r.Orden_de_compra,
      SKU: r.No_Producto_SKU,
      Descripcion: r.Description,
      Cantidad_Pendiente: r.Outstanding_Quantity,
      Costo_Pendiente: r.Costo_pendiente || 0,
      Monto_Pendiente: r.Importe_Pendiente || 0,
      Estatus_ERP: r.Estatus,
      Familia_Codigo: r.Gen__Prod__Posting_Group,
      Estatus_Partida: 'Compra / importación',
      Tipo_Venta: categoriaTipoVenta(campoFlexible(r, 'TipoVenta')),
      // Mismo fix que en Manufactura (ver comentario arriba) — corregido 03-sep-2026.
      Es_Garantia: normalizaTexto(campoFlexible(r, 'Estatus_de_factura')) === 'garantias',
      Pedido_Completo: null,
      Peor_Atraso_Pedido: null,
      En_Riesgo: false,
      Motivos_Riesgo: '',
      Dias_Para_Entrega: diasParaEntrega,
    });
  }
  return dataRows;
}

async function tryProcess() {
  if (!pdfFile || !xlsxFiles.length) {
    setStatus('Falta subir ' + (!pdfFile && !xlsxFiles.length ? 'ambos archivos' : (!pdfFile ? 'el Excel de producción' : 'el Excel de pedidos')) + '.');
    return;
  }
  setStatus('Procesando archivos...');
  try {
    const [prodRecords, xlsx] = await Promise.all([
      parseAvanceExcel(pdfFile),
      parseXlsxPedidos(xlsxFiles),
    ]);
    if (!prodRecords.length) {
      throw new Error('No se pudo leer ninguna orden de producción del Excel. ¿Es el reporte "Avance del programa de producción"?');
    }
    pdfRecords = prodRecords;
    xlsxData = xlsx;
    actualizarHistorialOP(prodRecords);

    const hoy = new Date();
    allRows = construirDataRows(pdfRecords, xlsxData.manufactura, xlsxData.comprados, hoy);

    if (xlsx.totalArchivos > 1) {
      const duplicados = xlsx.totalFilasCrudas - xlsx.totalFilasCombinadas;
      setStatus(`${xlsx.totalArchivos} archivos combinados · ${xlsx.totalFilasCombinadas} renglones únicos (se descartaron ${duplicados} duplicados).`);
    } else {
      setStatus('');
    }
    pvRoot.getElementById('emptyState').style.display = 'none';
    pvRoot.getElementById('dashboardContent').style.display = 'block';
    colapsarPanelSidebar('panelCarga', 'btnToggleCarga');
    abrirPanelSidebar('panelFiltros', 'btnToggleFiltros');
    render();
    if (typeof renderResumenDirectivo === 'function') renderResumenDirectivo();

    setStatus('⚠ ' + err.message, true);

function buildPedidos(rows, tipo) {
  const map = new Map();
  rows.forEach(r => {
    if (r.Tipo !== tipo) return;
    const key = r.Cliente + '||' + r.No_Documento;
    if (!map.has(key)) {
      map.set(key, {
        cliente: r.Cliente,
        no_documento: r.No_Documento,
        tipo_venta: r.Tipo_Venta || 'Otros',
        orden_compra: r.Orden_de_Compra,
        fecha_pedido: r.Fecha_Pedido,
        fecha_requerida: r.Fecha_Requerida,
        peor_atraso: r.Peor_Atraso_Pedido || 0,
        en_riesgo: !!r.En_Riesgo,
        motivos: r.Motivos_Riesgo || '',
        dias_para_entrega: r.Dias_Para_Entrega,
        fecha_limite_produccion: r.Fecha_Limite_Produccion,
        dias_para_limite_produccion: r.Dias_Para_Limite_Produccion,
        dias_en_captura: r.Dias_En_Captura,
        completo: !!r.Pedido_Completo,
        costo_total: 0,
        monto_total: 0,
        piezas_pendientes: 0,
        estatus_erp_set: new Set(),
        familias: new Map(),
        partidas: [],
        tiene_garantia: false
      });
    }
    const grupo = map.get(key);
    grupo.costo_total += (r.Costo_Pendiente || 0);
    grupo.monto_total += (r.Monto_Pendiente || 0);
    grupo.piezas_pendientes += (r.Piezas_Pendientes_Produccion || 0);
    if (r.Estatus_ERP) grupo.estatus_erp_set.add(r.Estatus_ERP);
    if (r.Es_Garantia) grupo.tiene_garantia = true;

    const fam = familiaLabel(r.Familia_Codigo);
    if (!grupo.familias.has(fam)) grupo.familias.set(fam, { total: 0, faltan: 0, costoFalta: 0 });
    const infoFam = grupo.familias.get(fam);
    infoFam.total += 1;
    const listo = categoriaPartida(r.Estatus_Partida) === 'listo';
    if (!listo) { infoFam.faltan += 1; infoFam.costoFalta += (r.Costo_Pendiente || 0); }

    grupo.partidas.push({
      sku: r.SKU, descripcion: r.Descripcion, cantidad: r.Cantidad_Pendiente,
      estatus: r.Estatus_Partida, estatus_erp: r.Estatus_ERP, familia: fam,
      listo: listo, no_op: r.No_OP, fecha_op: r.Fecha_Vencimiento_OP,
      centro_trabajo: r.Centro_Trabajo_Real,
      // 02-sep-2026: antes no se guardaba el día de atraso POR PARTIDA, solo a
      // nivel pedido (peor_atraso) — un pedido se marca "atrasado" si CUALQUIERA
      // de sus SKU está vencido, pero al listar todas sus partidas pendientes,
      // las que no están vencidas se veían igual de "atrasadas" que la que sí
      // lo está. Adrian lo notó: "por qué me los dejas en atraso si aún no
      // llega la fecha de la OP". Se expone aquí para poder distinguir en el
      // reporte cuál SKU es el que realmente causa el atraso del pedido.
      dias_atraso: r.Dias_Atraso_Partida || 0,
      garantia: !!r.Es_Garantia, piezas_pendientes: r.Piezas_Pendientes_Produccion || 0,
      costo: r.Costo_Pendiente || 0, monto: r.Monto_Pendiente || 0,
    });
  });
  return Array.from(map.values()).map(p => {
    const familiasArr = Array.from(p.familias.entries()).map(([nombre, info]) => ({ nombre, ...info }));
    const faltantes = familiasArr.filter(f => f.faltan > 0);
    return {
      ...p,
      estatus_erp: Array.from(p.estatus_erp_set),
      familias: familiasArr,
      que_falta: faltantes,
    };
  });
}

function fmtFecha(d) {
  if (!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);

}

const FAMILIA_LABELS = {
  'PT-MUEBLES': 'Muebles',
  'PT-LIBRERO': 'Libreros',
  'PT-ARCHIVE': 'Archiveros',
  'PT-MAMPARA': 'Mamparas',
  'PT-SILLAS-NAC': 'Sillas (Nacional)',
  'PT-SILLAS-IMP': 'Sillas (Importada)',
  'PT-KIT': 'Kits',
  'PT-ESPECIA': 'Especiales',
  'PT-ACCESOR': 'Accesorios',
  'PT-CABINAS': 'Cabinas',
  'PT-ESPFLK': 'Especiales Flek',
};
function familiaLabel(codigo) {
  if (!codigo) return 'Sin familia';
  if (FAMILIA_LABELS[codigo]) return FAMILIA_LABELS[codigo];
  return codigo.replace(/^(PT|P-SUB|P-PR|MP)-?/, '').replace(/[-_]/g, ' ').trim().replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase()) || codigo;
}

// ---------------------------------------------------------------------
// Resumen Directivo — agrupación por familia
// ---------------------------------------------------------------------
// Un pedido puede tener partidas de varias familias (kits). Para no
// duplicarlo en varias sub-tablas, se le asigna UNA sola "familia dominante":
// la que tiene más costo pendiente dentro de ese pedido (p.que_falta, o
// p.familias si nada falta). Esta misma asignación se usa tanto para
// agrupar las listas (atrasados/próximos/antiguos) como para la tabla
// resumen por familia — así los números de ambas vistas cuadran entre sí.
function familiaDominante(p) {
  const candidatos = (p.que_falta && p.que_falta.length) ? p.que_falta : p.familias;
  if (!candidatos || !candidatos.length) return 'Sin familia';
  return [...candidatos].sort((a, b) => b.costoFalta - a.costoFalta)[0].nombre;
}
// Separa pedidos en Distribuidores / Exportación / Venta directa / Flex /
// Otros (columna "Tipo de Venta" del ERP). Orden fijo, para que el reporte
// no cambie de orden día a día.
const ORDEN_TIPO_VENTA = ['Distribuidores', 'Exportación', 'Venta directa', 'Flex', 'Otros'];
function agruparPorTipoVenta(pedidos) {
  const grupos = new Map();
  pedidos.forEach(p => {
    const tv = p.tipo_venta || 'Otros';
    if (!grupos.has(tv)) grupos.set(tv, []);
    grupos.get(tv).push(p);
  });
  const conocidos = ORDEN_TIPO_VENTA.filter(k => grupos.has(k)).map(k => [k, grupos.get(k)]);
  const otros = Array.from(grupos.entries()).filter(([k]) => !ORDEN_TIPO_VENTA.includes(k));
  return conocidos.concat(otros);
}
// Tabla resumen: por familia, cuántos pedidos atrasados / en riesgo y su costo
// atrasado — mismo criterio de "familia dominante" que las sub-tablas de abajo.
function buildResumenFamilias(atrasados, enRiesgoSolo) {
  const map = new Map();
  function add(p, esAtraso) {
    const fam = familiaDominante(p);
    if (!map.has(fam)) map.set(fam, { familia: fam, atrasados: 0, enRiesgo: 0, costoAtrasado: 0 });
    const e = map.get(fam);
    if (esAtraso) { e.atrasados += 1; e.costoAtrasado += (p.costo_total || 0); }
    else { e.enRiesgo += 1; }
  }
  atrasados.forEach(p => add(p, true));
  enRiesgoSolo.forEach(p => add(p, false));
  return Array.from(map.values())
    .map(e => ({ ...e, enRiesgoTotal: e.atrasados + e.enRiesgo }))
    .sort((a, b) => b.costoAtrasado - a.costoAtrasado || b.enRiesgoTotal - a.enRiesgoTotal);
}

function mesLabel(fecha) {
  if (!fecha) return 'Sin fecha';
  const d = (fecha instanceof Date) ? fecha : new Date(fecha);
  if (isNaN(d.getTime())) return 'Sin fecha';
  const label = d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function semanaLabel(fecha) {
  if (!fecha) return 'Sin fecha';
  const d = (fecha instanceof Date) ? fecha : new Date(fecha);
  if (isNaN(d.getTime())) return 'Sin fecha';
  const day = d.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = x => x.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
  return `Semana del ${fmt(monday)} al ${fmt(sunday)}`;
}

function fmtMoney(v) {
  return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(v || 0);
}

function escapeHtml(s) {

}

// ---------------------------------------------------------------------
// Tabla simple de atrasos: sin tarjetas, sin chips, sin acordeones — una
// tabla de toda la vida, un renglón por pedido atrasado, para verla rápido
// o pegarla en Excel/correo. Mismo orden que las tarjetas (primero los que
// sí afectan la fecha del cliente), mismo alcance que el filtro de familia
// activo en ese momento (si hay uno).
// ---------------------------------------------------------------------
// Rediseño 02-sep-2026, versión 3 (a petición de Adrian — la v2 agrupaba
// SOLO por familia y reemplazaba la vista por cliente; Adrian aclaró que
// quería LAS DOS vistas juntas, no que una sustituyera a la otra: "la otra
// vista del reporte estaba bien, solo quería dividieras para verlo de las
// 2 maneras"). Ahora el reporte tiene 2 partes:
//   Parte 1 — Concentrado por familia: tabla corta de SOLO TOTALES
//     (familia = centro de trabajo, # pedidos, # SKU, piezas, costo) para
//     panorama rápido, sin bajar al detalle de cada SKU.
//   Parte 2 — Detalle completo por cliente: la vista original con
//     tarjetas, agrupada por tipo de venta, un card por pedido con todas
//     sus partidas pendientes.
// Además: se agregó una marca por renglón (🔴) cuando ESA partida
// específica es la que está vencida (x.dias_atraso > 0) — Adrian preguntó

function construirTablaSimpleAtrasosHTML(d) {
  // ===== Resumen "OP Vencidas — Acción inmediata en producción" (agregado
  // 04-sep-2026, a petición de Adrian con una captura de referencia de otro
  // formato que le gustó): un renglón por cada PARTIDA/OP que realmente está

  // reporte distingue "el pedido está atrasado" de "esta OP específica está
  // vencida"), ordenado de más días vencida a menos, con una prioridad visual
  // simple por umbral de días para que piso de producción vea de un vistazo

  const opsVencidas = [];

  opsVencidas.sort((a, b) => b.partida.dias_atraso - a.partida.dias_atraso);
  function prioridadPorDiasVencida(dias) {
    if (dias >= 3) return { nombre: 'CRÍTICA', dot: '#C1443C', bg: '#FBE7E5', texto: '#8C2E27' };
    if (dias === 2) return { nombre: 'ALTA', dot: '#D97B29', bg: '#FDEBD8', texto: '#8C5015' };

        <tr style="background:${pr.bg};">
          <td><span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${pr.dot}; margin-right:6px;"></span><b style="color:${pr.texto};">${pr.nombre}</b></td>
          <td style="text-align:center; font-weight:700;">${x.dias_atraso} día(s)</td>

          <td style="font-family:'IBM Plex Mono',monospace;">${fechaReqTxt}</td>
          <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(x.no_op) || '—'}</td>
          <td style="font-family:'IBM Plex Mono',monospace;">${garantiaHtml}${escapeHtml(x.sku)}</td>
          <td>${escapeHtml(x.descripcion)}</td>
        </tr>`;

    </table>` : `<p class="parte-sub">Ninguna OP realmente vencida en este momento.</p>`;

  // ===== Parte 1: concentrado por familia (solo totales, sin detalle SKU) =====
  const concentradoMap = new Map();
  d.atrasados.forEach(p => {
    let partidas = (p.partidas || []).filter(x => !x.listo);
    if (currentResumenFamilia !== 'todas') partidas = partidas.filter(x => x.familia === currentResumenFamilia);
    partidas.forEach(x => {
      const fam = x.familia || 'Sin familia';

      const e = concentradoMap.get(fam);
      e.pedidos.add(p.no_documento);
      e.skus += 1;
      e.piezas += (x.piezas_pendientes || 0);

    });

  const concentradoFamilias = Array.from(concentradoMap.values())

    .sort((a, b) => b.costo - a.costo);
  const concentradoHTML = `
    <table class="tabla-concentrado">
      <thead><tr><th>Familia (centro de trabajo)</th><th>Pedidos</th><th>SKU pendientes</th><th>Piezas faltantes</th><th>Costo atrasado</th></tr></thead>

      </tbody>

  // ===== Parte 2: detalle completo por cliente (tarjetas, por tipo de venta) =====

    if (!partidas.length) return '';
    totalPedidos++;
    const fechaTxt = p.fecha_requerida ? fmtFecha(p.fecha_requerida) : 'Sin fecha capturada';
    totalFilas += partidas.length;
    const filasSku = partidas.map(x => {
      const garantiaHtml = x.garantia ? '<span style="color:#7A3FC9; font-weight:700;">🛡 </span>' : '';
      // Esta partida específica es la que vence, no solo "el pedido en general".
      const estaVencida = x.dias_atraso > 0;

        <td style="text-align:right;">${x.piezas_pendientes || 0}</td>
        <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(x.no_op) || '—'}</td>
        <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(x.fecha_op) || 'Sin fecha de OP'}</td>
        <td>${opBadge}</td>
      </tr>`;
    }).join('');
    return `
    <div class="pedido-card">
      <div class="pedido-card-header">
        <div class="cliente-info">
          <span class="cliente">${escapeHtml(p.cliente) || 'Sin cliente'}</span>
          <span class="pedido-num">Pedido ${escapeHtml(p.no_documento)}</span>
        </div>
        <div class="cliente-meta">
          <span class="fecha-req">📅 Requerido: <b>${fechaTxt}</b></span>
          <span class="dias-badge" style="color:#C1443C; background:#FBE7E5;">${p.peor_atraso} día(s) de retraso (peor caso del pedido)</span>
          <span class="dias-badge" style="color:${afecta.color}; background:${afecta.bg};">${afecta.txt}</span>
        </div>
      </div>
      <table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Pza. faltan</th><th>OP</th><th>Fecha venc. OP</th><th>¿Esta OP vencida?</th></tr></thead>
        <tbody>${filasSku}</tbody>
      </table>
    </div>`;
  }

  const grupos = agruparPorTipoVenta(d.atrasados);
  const seccionesHTML = grupos.map(([tipoVenta, pedidos]) => {
    const ordenados = pedidos.slice().sort((a, b) => {
      const ta = a.fecha_requerida ? a.fecha_requerida.getTime() : null;
      const tb = b.fecha_requerida ? b.fecha_requerida.getTime() : null;
      if (ta === null && tb === null) return 0;
      if (ta === null) return 1;
      if (tb === null) return -1;
      return tb - ta; // más nuevo primero
    });
    const tarjetas = ordenados.map(renderTarjetaPedido).join('');
    if (!tarjetas) return '';
    return `
    <div class="tipo-venta-seccion">
      <h2 class="tipo-venta-titulo">${escapeHtml(tipoVenta)}</h2>
      ${tarjetas}
    </div>`;
  }).join('');

  const fechaStr = fmtFecha(d.fecha);
  const familiaTxt = currentResumenFamilia !== 'todas' ? ` · familia: ${escapeHtml(currentResumenFamilia)}` : '';
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Tabla de atrasos — ${fechaStr}</title>
<style>${CSS_REPORTE_BASE}

  .vencidas-sub { font-size: 11.5px; color: #B7C0C9; margin-top: 3px; }
  .tabla-vencidas { margin-bottom: 28px; border: 1px solid #D6DCE2; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
  .tabla-vencidas th { background: #F5F7F9; }
  @media print { .vencidas-header, .tabla-vencidas tr { break-inside: avoid; } }

</head><body>
  <h1>Tabla de atrasos</h1>

  <div class="leyenda-fechas">Nota: <b>Fecha de OP</b> = fecha de salida de producción (compromiso interno de manufactura) · <b>Fecha Requerida</b> = fecha en que el cliente necesita su proyecto armado (instalado) — son 2 fechas distintas, no confundir una atrasada con la otra.</div>

  <div class="vencidas-header">

    ${seccionesHTML || '<p>No hay pedidos atrasados en este momento.</p>'}

function exportarTablaSimpleAtrasos(d) {
  const win = window.open('', '_blank');
  if (!win) { alert('El navegador bloqueó la ventana nueva. Permite pop-ups para este sitio y vuelve a intentar.'); return; }
  win.document.open();

  win.document.close();
  win.focus();
  setTimeout(() => { try { win.print(); } catch (e) {} }, 350);
}

// ---------------------------------------------------------------------
// Reporte de garantías pendientes: TODAS (no solo las atrasadas — una
// garantía "al corriente" también cuesta dinero), un renglón por SKU
// pendiente, con el costo total arriba de todo — es el dato que se
// necesita para decidir el impacto financiero, no un detalle más.
// ---------------------------------------------------------------------
// Rediseño 02-sep-2026 (mismo tratamiento que los otros 2 reportes, a
// petición de Adrian): agrupado por tipo de venta, pedidos ordenados por
// fecha requerida dentro de cada grupo, una tarjeta por pedido y la fecha
// también dentro de la descripción de cada SKU.
// Etiqueta corta + color para el estatus crudo de una partida (agregado
// 03-sep-2026, a petición de Adrian: "las garantías marcan cuáles no están
// programadas? atrasadas?" — antes el Reporte de garantías solo mostraba un
// estatus a nivel PEDIDO completo (Atrasado/En riesgo/Al corriente), sin
// decir si la partida de garantía en sí está sin programar, atrasada,
// planificada sin lanzar, o en producción normal).
function etiquetaEstatusPartida(estatus) {
  if (estatus.startsWith('ATRASADA')) return { txt: 'Atrasada', color: '#C1443C', bg: '#FBE7E5' };
  if (estatus.startsWith('PLANIFICADA')) return { txt: 'Planificada, sin lanzar', color: '#2B5B9E', bg: '#EAF1FB' };
  if (estatus.startsWith('SIN PROGRAMAR')) return { txt: 'Sin programar', color: '#C67D1E', bg: '#FBEED9' };
  if (estatus.startsWith('En producción')) return { txt: 'En producción', color: '#3F8557', bg: '#E7F3EC' };
  if (estatus.startsWith('Programado')) return { txt: 'Programado (otra planta)', color: '#6B7684', bg: '#EEF1F3' };
  return { txt: 'Otro', color: '#6B7684', bg: '#EEF1F3' };
}
// 03-sep-2026 (Adrian: "dale orden si esta programadas, planificadas en
// produccion no todo revuelto"): dentro de cada tarjeta de pedido, las filas
// de SKU venían en el orden en que salían del Excel — una garantía "Sin
// programar" podía aparecer mezclada entre otras "En producción" sin ningún
// criterio. Orden de prioridad (más urgente/menos avanzado primero): Atrasada
// > Sin programar > Planificada, sin lanzar > En producción > Programado
// (otra planta). Mismo orden que usa `etiquetaEstatusPartida` para los
// colores, solo que aquí se traduce a un número para poder ordenar.
const ORDEN_ESTATUS_PARTIDA = { 'Atrasada': 0, 'Sin programar': 1, 'Planificada, sin lanzar': 2, 'En producción': 3, 'Programado (otra planta)': 4, 'Otro': 5 };
function ordenEstatusPartida(estatus) {
  return ORDEN_ESTATUS_PARTIDA[etiquetaEstatusPartida(estatus || '').txt] ?? 5;
}
function construirReporteGarantiasHTML(d) {
  let totalCosto = 0, totalMonto = 0, totalPiezas = 0, totalFilas = 0, totalPedidos = 0;

    partidas = partidas.slice().sort((a, b) => ordenEstatusPartida(a.estatus) - ordenEstatusPartida(b.estatus));
    totalPedidos++;
    const estatusTxt = p.peor_atraso > 0 ? `Atrasado ${p.peor_atraso}d` : (p.en_riesgo ? 'En riesgo' : 'Al corriente');
    const estatusColor = p.peor_atraso > 0 ? '#C1443C' : (p.en_riesgo ? '#C67D1E' : '#3F8557');

    return `

      <div class="pedido-card-header">

        </div>
        <div class="cliente-meta">

      <table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Pza. faltan</th><th>Costo</th><th>OP</th><th>Fecha OP</th><th>Estatus</th></tr></thead>

// ---------------------------------------------------------------------
// Reporte de Folios (agregado 02-sep-2026, a petición de Adrian: "necesito
// un reporte de los folios" → "todo lo que inicia con SKU F"). Versión 2
// (mismo día): Adrian aclaró que NO lo quiere separado por cliente/tipo
// de venta — sí quiere ver el cliente, pero la agrupación real debe ser
// por TIPO DE FOLIO / complejidad: "los tipo A son los fáciles, los D los
// difíciles, quiero identificarlos por dificultad". El tipo de folio es
// la SEGUNDA letra del SKU (F**A**-6516 = tipo A, F**D**-6491 = tipo D) —
// verificado con los datos reales: los 345 SKU que empiezan con "F" TODOS
// siguen el patrón F[A-D]-nnnn, sin excepción. Esto además resuelve un
// pendiente viejo de LeadTime (`PENDIENTES_LeadTime.md` punto 1, abierto
// desde el 30-ago): nunca se supo con qué criterio se clasifican los
// folios A/B/C/D — es este mismo, el código del SKU.
// Recorre TODOS los pedidos (no solo d.atrasados/d.garantias), por eso
// arma su propia lista con buildPedidos(allRows, 'Manufactura') en vez de
// recibir `d` como los otros reportes.
// ---------------------------------------------------------------------
const ETIQUETA_TIPO_FOLIO = { A: 'A', B: 'B', C: 'C', D: 'D' };
// x.fecha_op es texto ya formateado (DD/MM/AAAA), y puede traer varias fechas
// separadas por coma si el SKU tiene más de una OP (ej. "01/09/2026,
// 04/09/2026") — se usa la más antigua de todas.
function primeraFechaOP(fechaOpTexto) {
  if (!fechaOpTexto) return null;
  const tiempos = fechaOpTexto.split(',').map(f => {
    const m = f.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
  }).filter(t => t !== null);
  return tiempos.length ? Math.min(...tiempos) : null;
}
// Clasificación por FASE de producción (agregado 02-sep-2026, versión 3;
// nombres reales de área y fecha por fase agregados 03-sep-2026 — versión
// 4). Regla exacta confirmada por Adrian (verificada con un ejemplo real:
// "hoy 03/09, el área inicial ya está produciendo lo del 07/09" cuadra con
// esta tabla — cuenta regresiva fija de 4 días, la MISMA para los 4 tipos
// de folio A/B/C/D):
//   Fecha de OP − 3 días = Día 1 — Carpintería / Láser Troqueles
//   Fecha de OP − 2 días = Día 2 — Enchapado / Estructuras
//   Fecha de OP − 1 día  = Día 3 — Habilitado / Pintura
//   Fecha de OP (hoy)    = Día 4 — Ensambles
// Cada día que pasa sin haberse resuelto, el folio "debería" haber
// avanzado un día — por eso se calcula sobre HOY, no sobre una fecha fija.
// Fuera de esa ventana de 4 días: "Sin iniciar" (aún faltan >3 días) o
// "Vencido" (ya se pasó el día de Ensambles y sigue con piezas pendientes).
// FASE_OFFSET_DIAS: cuántos días ANTES de la fecha de OP cae cada fase —
// se usa para mostrar la fecha real de calendario en el encabezado de cada
// sección (pedido de Adrian: "no se ve el día en el que está la fase,
// tiene que tener la fecha").
const FASE_OFFSET_DIAS = {
  'Día 1 — Carpintería / Láser Troqueles': 3,
  'Día 2 — Enchapado / Estructuras': 2,
  'Día 3 — Habilitado / Pintura': 1,
  'Día 4 — Ensambles': 0,
};
const ORDEN_FASE = ['Vencido', 'Día 1 — Carpintería / Láser Troqueles', 'Día 2 — Enchapado / Estructuras', 'Día 3 — Habilitado / Pintura', 'Día 4 — Ensambles', 'Sin iniciar', 'Sin fecha de OP'];
function calcularFaseFolio(fechaOpTexto, hoyMedianoche) {
  const t = primeraFechaOP(fechaOpTexto);
  if (t === null) return { fase: 'Sin fecha de OP', diasFaltan: null };
  // 03-sep-2026: días HÁBILES hasta la fecha de OP (no de calendario) —
  // ver diasEntreFechas.
  const diasFaltan = diasEntreFechas(hoyMedianoche, new Date(t));
  if (diasFaltan > 3) return { fase: 'Sin iniciar', diasFaltan };
  if (diasFaltan === 3) return { fase: 'Día 1 — Carpintería / Láser Troqueles', diasFaltan };
  if (diasFaltan === 2) return { fase: 'Día 2 — Enchapado / Estructuras', diasFaltan };
  if (diasFaltan === 1) return { fase: 'Día 3 — Habilitado / Pintura', diasFaltan };
  if (diasFaltan === 0) return { fase: 'Día 4 — Ensambles', diasFaltan };
  return { fase: 'Vencido', diasFaltan }; // diasFaltan < 0
}
function construirReporteFoliosHTML() {

// ---------------------------------------------------------------------
// Reporte de falta de programar: un renglón por SKU sin OP lanzada ni
// agenda en el ERP, con los días en captura (cuánto lleva esperando) y el
// costo pendiente — para poder priorizar a quién hay que lanzarle la OP
// primero, y saber cuánto dinero está detenido por este motivo.
//
// Rediseño 02-sep-2026 (a petición de Adrian, "que un niño de escuela lo
// entienda"): antes era una sola tabla plana con el cliente/pedido/fecha
// solo en el primer renglón de cada grupo y celdas en blanco en los
// siguientes ("huecos"). Ahora: (1) agrupado por Tipo de venta, igual que
// el Resumen Directivo, (2) dentro de cada grupo, los pedidos van
// ordenados por fecha requerida (más urgente primero; sin fecha al
// final), (3) cada pedido es una tarjeta con un encabezado propio
// (cliente/pedido/fecha/días en captura) y su tabla de SKU debajo — ya no
// hay columnas que se repitan vacías, y (4) la fecha requerida también se
// repite dentro de la descripción de cada SKU, no solo en el encabezado.
// ---------------------------------------------------------------------
function construirReporteSinProgramarHTML(d) {
  let totalCosto = 0, totalMonto = 0, totalFilas = 0, totalPedidos = 0;

  function renderTarjetaPedido(p) {
    let partidas = (p.partidas || []).filter(x => (x.estatus || '').startsWith('SIN PROGRAMAR'));
    if (currentResumenFamilia !== 'todas') partidas = partidas.filter(x => x.familia === currentResumenFamilia);
    if (!partidas.length) return '';
    totalPedidos++;
    const dc = p.dias_en_captura;
    const excedido = dc !== null && dc !== undefined && dc > 9;
    const fechaTxt = p.fecha_requerida ? fmtFecha(p.fecha_requerida) : 'Sin fecha capturada';
    totalFilas += partidas.length;
    const filasSku = partidas.map(x => {
      totalCosto += (x.costo || 0);
      totalMonto += (x.monto || 0);
      return `
      <tr>
        <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(x.sku)}</td>
        <td>${escapeHtml(x.descripcion)} <span class="fecha-en-desc">— requerido ${fechaTxt}</span></td>
        <td style="text-align:right;">${x.cantidad ?? '—'}</td>
        <td style="text-align:right;">${fmtMoney(x.costo || 0)}</td>
      </tr>`;
    }).join('');
    return `
    <div class="pedido-card">
      <div class="pedido-card-header">
        <div class="cliente-info">
          <span class="cliente">${escapeHtml(p.cliente) || 'Sin cliente'}</span>
          <span class="pedido-num">Pedido ${escapeHtml(p.no_documento)}</span>
        </div>
        <div class="cliente-meta">
          <span class="fecha-req">📅 Requerido: <b>${fechaTxt}</b></span>
          <span class="dias-badge" style="color:${excedido ? '#C1443C' : '#C67D1E'}; background:${excedido ? '#FBE7E5' : '#FBEED9'};">${dc ?? '—'} día(s) en captura</span>
        </div>
      </div>
      <table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Costo</th></tr></thead>
        <tbody>${filasSku}</tbody>
      </table>
    </div>`;
  }

  const grupos = agruparPorTipoVenta(d.sinProgramar);
  const seccionesHTML = grupos.map(([tipoVenta, pedidos]) => {
    const ordenados = pedidos.slice().sort((a, b) => {
      // Más nuevo primero (fecha requerida más lejana en el futuro), sin
      // fecha capturada siempre al final (no hay con qué compararlo) —
      // pedido explícito de Adrian el 02-sep-2026.
      const ta = a.fecha_requerida ? a.fecha_requerida.getTime() : null;
      const tb = b.fecha_requerida ? b.fecha_requerida.getTime() : null;
      if (ta === null && tb === null) return 0;
      if (ta === null) return 1;
      if (tb === null) return -1;
      return tb - ta;
    });
    const tarjetas = ordenados.map(renderTarjetaPedido).join('');
    if (!tarjetas) return '';
    return `
    <div class="tipo-venta-seccion">
      <h2 class="tipo-venta-titulo">${escapeHtml(tipoVenta)}</h2>
      ${tarjetas}
    </div>`;
  }).join('');

  const fechaStr = fmtFecha(d.fecha);
  const familiaTxt = currentResumenFamilia !== 'todas' ? ` · familia: ${escapeHtml(currentResumenFamilia)}` : '';
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Reporte de falta de programar — ${fechaStr}</title>
<style>${CSS_REPORTE_BASE}${CSS_RESUMEN_COSTO_AMBER}
  .sub { color: #6B7684; font-size: 12px; margin-bottom: 18px; }
  th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { text-align: right; }
</style>
</head><body>
  <h1>📋 Reporte de falta de programar</h1>
  <div class="sub">Generado el ${fechaStr}${familiaTxt} · agrupado por tipo de venta, ordenado por fecha requerida, de más nuevo a más viejo</div>
  <div class="resumen-costo">
    <div><span class="n">${fmtMoney(totalCosto)}</span><span class="t">Costo pendiente detenido por falta de programar</span></div>
    <div><span class="n">${fmtMoney(totalMonto)}</span><span class="t">Monto de venta pendiente</span></div>
    <div><span class="n">${totalPedidos}</span><span class="t">Pedido(s) sin programar</span></div>
    <div><span class="n">${totalFilas}</span><span class="t">SKU(s) sin OP lanzada</span></div>
  </div>
  ${seccionesHTML || '<p>No hay SKU sin programar en este momento.</p>'}
</body></html>`;
}

// de Adrian: filtros por día/semana/mes/2 meses + exportar a PDF). A
// diferencia del reporte de falta de programar, aquí se listan TODAS las
// partidas de cada pedido (no solo las sin OP) — el objetivo es ver de un
// vistazo todo lo que vence en el rango elegido, esté o no ya resuelto.
function construirReportePorFechaEntregaHTML(d) {
  let totalCosto = 0, totalMonto = 0, totalPedidos = 0;
  const hoyMedianoche = d.hoyMedianoche || (() => { const h = new Date(); h.setHours(0, 0, 0, 0); return h; })();

  function renderTarjetaPedido(p) {
    let partidas = [...(p.partidas || [])];
    if (currentResumenFamilia !== 'todas') partidas = partidas.filter(x => x.familia === currentResumenFamilia);
    if (!partidas.length) return '';
    totalPedidos++;
    totalCosto += (p.costo_total || 0);
    totalMonto += (p.monto_total || 0);
    const fechaTxt = p.fecha_requerida ? fmtFecha(p.fecha_requerida) : 'Sin fecha capturada';
    const crit = (d.criticidadPorPedido && d.criticidadPorPedido.get(p)) || evaluarCriticidadPedido(p, hoyMedianoche);
    const criticoBadge = crit.critico
      ? `<span class="dias-badge" style="color:#fff; background:#C1443C;">🔴 CRÍTICO — ${crit.margen}d de margen</span>` : '';
    // 07-sep-2026: Adrian solo quiere ver faltantes o en riesgo al abrir un
    // pedido — un SKU ya listo no aporta nada aquí, solo hace más largo el
    // reporte. Los totales de arriba (costo/monto/pedidos) siguen contando
    // TODAS las partidas del rango, esto solo filtra qué se lista por pedido.
    const partidasPendientes = partidas.filter(x => !x.listo);
    const filasSku = partidasPendientes.map(x => {
      const pendienteTxt = (x.piezas_pendientes > 0) ? `Faltan ${x.piezas_pendientes} pza.` : 'Pendiente';
      const diasOP = textoDiasVencerOP(x, hoyMedianoche);
      const diasOPTxt = diasOP ? diasOP.texto : '—';
      const diasOPColor = diasOP ? (diasOP.clase === 'rojo' ? '#C1443C' : diasOP.clase === 'ambar' ? '#C67D1E' : '#2E8B57') : '#6B7684';
      return `
      <tr>
        <td style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(x.sku)}</td>
        <td>${escapeHtml(x.descripcion)}</td>
        <td style="text-align:right;">${x.cantidad ?? '—'}</td>

        <td style="font-family:'IBM Plex Mono',monospace;">${x.no_op ? escapeHtml(x.no_op) : '—'}</td>
        <td style="color:${diasOPColor}; font-weight:700;">${diasOPTxt}</td>
        <td style="text-align:right;">${fmtMoney(x.costo || 0)}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center; color:#3F8557; font-weight:700;">✓ Todo lo de este pedido ya está listo — nada pendiente por producir</td></tr>';
    return `
    <div class="pedido-card">
      <div class="pedido-card-header">
        <div class="cliente-info">
          <span class="cliente">${escapeHtml(p.cliente) || 'Sin cliente'}</span>
          <span class="pedido-num">Pedido ${escapeHtml(p.no_documento)}</span>
        </div>
        <div class="cliente-meta">
          <span class="fecha-req">📅 Requerido: <b>${fechaTxt}</b></span>
          <span class="dias-badge" style="color:${p.dias_para_entrega < 0 ? '#C1443C' : '#C67D1E'}; background:${p.dias_para_entrega < 0 ? '#FBE7E5' : '#FBEED9'};">${p.dias_para_entrega ?? '—'} día(s) para vencer</span>
          ${criticoBadge}
        </div>
      </div>
      <table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Estatus</th><th>OP</th><th>Días por vencer OP</th><th>Costo</th></tr></thead>
        <tbody>${filasSku}</tbody>
      </table>
    </div>`;
  }

  const grupos = agruparPorTipoVenta(d.porFechaEntrega);
  const seccionesHTML = grupos.map(([tipoVenta, pedidos]) => {
    const ordenados = pedidos.slice().sort((a, b) => {
      const ta = a.fecha_requerida ? a.fecha_requerida.getTime() : Infinity;
      const tb = b.fecha_requerida ? b.fecha_requerida.getTime() : Infinity;
      return ta - tb;
    });
    const tarjetas = ordenados.map(renderTarjetaPedido).join('');
    if (!tarjetas) return '';
    return `
    <div class="tipo-venta-seccion">
      <h2 class="tipo-venta-titulo">${escapeHtml(tipoVenta)}</h2>
      ${tarjetas}
    </div>`;
  }).join('');

  const fechaStr = fmtFecha(d.fecha);
  const familiaTxt = currentResumenFamilia !== 'todas' ? ` · familia: ${escapeHtml(currentResumenFamilia)}` : '';
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Pedidos por fecha de entrega — ${fechaStr}</title>
