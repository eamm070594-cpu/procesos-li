<style>
/* ══════════════════════════════════════════════════════
   TOKENS — paleta "B · Cercano" (ya elegida por el usuario)
══════════════════════════════════════════════════════ */
:root{
  --bg:       #F7F5EF;
  --surface:  #FFFFFF;
  --surface2: #F1EEE4;
  --border2:  rgba(70,80,55,.12);
  --text:     #333B29;
  --muted:    #6E7A61;
  --accent:   #5B7553;
  --accent2:  #4A6144;
  --accent-bg:rgba(91,117,83,.13);
  --ok:       #4C7A3F;
  --ok-bg:    rgba(76,122,63,.14);
  --warn:     #A87A22;
  --warn-bg:  rgba(168,122,34,.15);
  --bad:      #A6402F;
  --bad-bg:   rgba(166,64,47,.14);
  --r:    14px;
  --r-sm: 10px;
  --r-pill: 20px;
  --shadow: 0 1px 2px rgba(51,59,41,.06), 0 4px 16px rgba(51,59,41,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:       #1C1F17;
    --surface:  #262A1F;
    --surface2: #2F3426;
    --border2:  rgba(224,228,210,.12);
    --text:     #E7E9DD;
    --muted:    #A4AD96;
    --accent:   #8FAE82;
    --accent2:  #A6C398;
    --accent-bg:rgba(143,174,130,.18);
    --ok:       #7FBE6C;
    --ok-bg:    rgba(127,190,108,.16);
    --warn:     #D9A64A;
    --warn-bg:  rgba(217,166,74,.16);
    --bad:      #E1786A;
    --bad-bg:   rgba(225,120,106,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:600;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── Layout ── */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex:0 0 216px;background:var(--surface);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;padding:16px 12px;
  position:sticky;top:0;height:100vh;
}
.brand{font-weight:700;font-size:15px;padding:6px 10px 18px;color:var(--text)}
.brand span{color:var(--accent)}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border:none;background:none;border-radius:var(--r-sm);
  color:var(--muted);font-weight:500;cursor:pointer;margin-bottom:2px;
}
.nav-btn .ic{font-size:16px}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border2)}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm)}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 30px}
.user-chip .who{flex:1;min-width:0}
.user-chip .who .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who .r{font-size:11px;color:var(--muted)}
.icon-btn{border:none;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:15px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}

.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1180px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.view-head h1{font-size:21px}
.view-sub{color:var(--muted);font-size:13px;margin-top:2px}

/* ── Componentes ── */
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:var(--r-sm);border:1px solid var(--border2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-bg);color:var(--accent)}

.input,.select-input,textarea.input{
  width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);
}
textarea.input{resize:vertical;min-height:60px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
.small{font-size:12px}
.muted{color:var(--muted)}

.state-box{padding:44px 20px;text-align:center;color:var(--muted)}
.state-box .ico{font-size:30px;margin-bottom:8px}
.state-box .t{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border2)}
table.tbl td{padding:10px;border-bottom:1px solid var(--border2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}

.avatar{border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.bar-track{background:var(--surface2);border-radius:8px;height:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:8px}

/* ── Login ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;
}
.login-card{width:340px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:19px;margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
#login-err{display:none;background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;margin-top:10px}

/* ── Dialog ── */
dialog{border:none;border-radius:var(--r);padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(520px,92vw)}
dialog.dlg-wide{width:min(900px,94vw)}
dialog::backdrop{background:rgba(28,31,23,.4)}
.dlg-head{padding:18px 20px 4px}
.dlg-head h2{font-size:16px}
.dlg-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dlg-body{padding:14px 20px;max-height:60vh;overflow-y:auto}
.dlg-foot{padding:14px 20px 20px;display:flex;justify-content:flex-end;gap:8px}

/* ── Toast ── */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* Todos los líderes en UNA sola fila horizontal, alineados arriba (no uno
   debajo del otro, no en columnas de alto disparejo tipo masonry): cada
   líder es una columna de ancho fijo. Si no caben todos en la pantalla, la
   fila completa se desliza — nunca bajan a una 2ª línea ni empujan al de
   al lado. #proj-cols-nav (◀▶ arriba) es la forma fácil de moverse; el
   scroll con el dedo/mouse sigue funcionando igual, es solo un atajo. */
.proj-cols{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth}
.proj-col{flex:0 0 340px;min-width:0} /* min-width:0 — si no, el contenido interno ancho ignora el flex-basis y la columna se estira igual */
.proj-cols-nav{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
/* Las tarjetas de proyecto DENTRO de cada líder van apiladas verticalmente
   (una debajo de otra, scroll normal de la página) — nada de una 2ª barra
   de scroll horizontal anidada dentro de la fila de líderes; eso era
   confuso, sobre todo en celular. */
.proj-cards-scroll{display:flex;flex-direction:column;gap:12px}

.proj-subgroup>summary::before{content:'▸';display:inline-block;margin-right:6px;transition:transform .15s;color:var(--muted)}
.proj-subgroup[open]>summary::before{transform:rotate(90deg)}
.proj-subgroup>summary{outline:none}
.proj-subgroup>summary::-webkit-details-marker{display:none}

#btn-mobile-menu{display:none;position:fixed;top:14px;left:14px;z-index:41;background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow)}
#sidebar-overlay{display:none}
@media(max-width:820px){

  #sidebar-overlay.open{display:block;position:fixed;inset:0;background:rgba(28,31,23,.35);z-index:41}
}

<script>
/* ══════════════════════════════════════════════════════
   UTILIDADES BASE
══════════════════════════════════════════════════════ */
function uid(p='x'){return p+'_'+Math.random().toString(16).slice(2)+'_'+Date.now().toString(16)}
function todayISO(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);return t.toISOString().slice(0,10)}
function esc(s){return(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function byId(arr,id){return (arr||[]).find(x=>x.id===id)||null}
function initials(name){return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
let _toastT=null;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='show'+(type?' '+type:'');
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.classList.remove('show'),2600);
}

/* Modal genérico de edición (form libre) */
let _dlgSave=null;
function openDlg({title,sub='',body,onSave,saveLabel='Guardar cambios',showCancel=true}){
  document.getElementById('dlg-title').textContent=title;
  document.getElementById('dlg-sub').textContent=sub;
  document.getElementById('dlg-body').innerHTML=body;
  // saveLabel/showCancel se resetean SIEMPRE (nunca se quedan pegados del diálogo anterior)
  document.getElementById('dlg-save').textContent=saveLabel;
  document.getElementById('dlg-cancel').style.display=showCancel?'':'none';
  _dlgSave=onSave;
  document.getElementById('dlg-edit').showModal();
}
function closeDlg(){document.getElementById('dlg-edit').close();_dlgSave=null}
document.getElementById('dlg-cancel').addEventListener('click',closeDlg);
document.getElementById('dlg-save').addEventListener('click',()=>{
  const result=_dlgSave&&_dlgSave();
  if(result===false)return; // onSave ya mostró el motivo (toast) y no se cierra
  closeDlg();
});

/* Confirmación nombrando lo que se borra — nunca usar confirm() nativo */
function appConfirm(title,sub=''){
  return new Promise(resolve=>{
    const dlg=document.getElementById('dlg-confirm');
    document.getElementById('dlg-confirm-title').textContent=title;
    document.getElementById('dlg-confirm-sub').textContent=sub;
    // FIX: clonar los botones antes de enganchar listeners nuevos — si una llamada
    // anterior a appConfirm() no llegó a limpiar los suyos (cierre atípico del
    // diálogo, dos confirmaciones casi seguidas, etc.), esto los deja "en cero" en
    // vez de ir acumulando manejadores viejos sobre los mismos botones compartidos
    // (eso podía hacer que un "Confirmar" real no borrara nada, sin ningún error).
    let ok=document.getElementById('dlg-confirm-ok');
    let cancel=document.getElementById('dlg-confirm-cancel');
    ok.replaceWith(ok=ok.cloneNode(true));
    cancel.replaceWith(cancel=cancel.cloneNode(true));
    function cleanup(){dlg.close();ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);dlg.removeEventListener('close',onClose)}
    function onOk(){cleanup();resolve(true)}
    function onCancel(){cleanup();resolve(false)}
    function onClose(){cleanup();resolve(false)}
    ok.addEventListener('click',onOk);
    cancel.addEventListener('click',onCancel);
    dlg.addEventListener('close',onClose,{once:true});
    dlg.showModal();
  });
}

/* ══════════════════════════════════════════════════════
   CATÁLOGOS — único lugar del código con estos valores
══════════════════════════════════════════════════════ */
const DELIVERABLE_STATUS = [
  {key:'Pendiente',  icon:'⚪', pill:'muted'},
  {key:'En proceso', icon:'🔵', pill:'accent'},
  {key:'En pausa',   icon:'⏸️', pill:'warn'},
  {key:'Entregado',  icon:'✅', pill:'ok'},
];
// Estatus de cada "Resultado esperado" del DGP en la tabla de logros de
// "Mi puesto" — lo marca a mano quien administra el perfil (canEditPerfil),
// trimestre a trimestre, igual que el DGP describe la evaluación real.
const LOGRO_STATUS = [
  {key:'No evaluado', icon:'⚪', pill:'muted'},
  {key:'En proceso',  icon:'🔵', pill:'accent'},
  {key:'Cumplido',    icon:'✅', pill:'ok'},
  {key:'No cumplido', icon:'🔴', pill:'bad'},
];
// "En pausa" es una espera deliberada (bloqueado, en espera de algo/alguien) —
// no debe contar como "Atrasado" aunque su fecha ya haya pasado. Los mismos 2
// lugares que preguntan "¿ya venció?" (fila del entregable y reporte
// Atrasados/por vencer) usan esto en vez de solo "!==Entregado".
function isOpenOverdueStatus(status){ return status!=='Entregado'&&status!=='En pausa'; }
function statusMeta(list,key){ return list.find(s=>s.key===key)||list[0]; }
function statusPillHTML(list,key){
  const m=statusMeta(list,key);
  return `<span class="pill ${m.pill}">${m.icon} ${esc(key||m.key)}</span>`;
}

// Contenido real de los 3 DGP (F-RH-05) que Adrián compartió — se usa solo

/* ══════════════════════════════════════════════════════
   ESTADO — objeto único DB, la interfaz se redibuja a partir de él.
   Nunca se lee el DOM como fuente de verdad.
══════════════════════════════════════════════════════ */
const LS_APP   = 'li_proc_v3_app';     // proyectos/entregables (cache local)
const LS_SHARE = 'li_proc_v3_share';   // usuarios/secciones/centros (cache local)
const ADMIN_USER = 'amartinez';
// La contraseña maestra se inyecta desde el archivo real (ver nota de despliegue) —
// nunca se escribe a mano en este archivo ni se muestra en chat.
const ADMIN_PASS = 'Lineaitalia.1';
const DEFAULT_PASS = 'LI2025';

const DEFAULT_GLOBAL_PARAMS = {salary:19661, days:21.5, hours:8.5, fx:18, cfe:3.5, months:12};
function emptyDB(){
  return {
    users:[], secciones:[], centros:[], puestos:[],
    tabulador:{grupos:[],categorias:[],niveles:[]},
    globalParams:{...DEFAULT_GLOBAL_PARAMS},
    projects:[], deliverables:[], _deleted:{},
  };
}
let DB = emptyDB();
let SESSION = null;
let _sharedLoaded=false, _appLoaded=false;

// Guarda en localStorage sin nunca tronar la app: es solo una caché para
// pintar rápido antes de que responda Firebase (que es la fuente de verdad
// real) — si el navegador ya llenó su cuota (QuotaExceededError, típico
// cuando se acumulan fotos de máquinas en base64), simplemente se avisa en
// consola y se sigue de largo. Antes esto tronaba dentro de saveShare()/
// saveApp(), lo que abortaba saveDB() ANTES de llegar a Firebase o a
// render() — por fuera se veía como "no guarda nada" o "el diálogo no cierra".
function lsSetSafe(key,value){
  try{ localStorage.setItem(key,value); }
  catch(e){ console.warn('[cache local] no se guardó ('+key+'): '+e.message); }
}
// Versión de Centros para la caché local SIN las fotos de máquinas
// (heroPhoto, base64) — pueden pesar varios MB entre todas y son las que
// suelen llenar la cuota. Firebase siempre guarda la copia completa; esta
// caché es desechable y se vuelve a llenar sola en el próximo pullShare().
function centrosParaCache(centros){
  return (centros||[]).map(c=>(c.maquinas&&c.maquinas.length)?{...c,maquinas:c.maquinas.map(({heroPhoto,...resto})=>resto)}:c);
}

// Cache local inmediata (para que un refresh no muestre "vacío" un instante)
(function loadCache(){
  try{ const s=localStorage.getItem(LS_SHARE); if(s){ const p=JSON.parse(s); Object.assign(DB,{users:p.users||[],secciones:p.secciones||[],centros:p.centros||[],puestos:p.puestos||[],tabulador:p.tabulador||{grupos:[],categorias:[],niveles:[]},globalParams:{...DEFAULT_GLOBAL_PARAMS,...(p.globalParams||{})}}); } }catch{}
  try{ const a=localStorage.getItem(LS_APP); if(a){ const p=JSON.parse(a); Object.assign(DB,{projects:p.projects||[],deliverables:p.deliverables||[],_deleted:p._deleted||{}}); } }catch{}
})();

/* ── FIREBASE ──────────────────────────────────────────────
   Mismo proyecto Firebase real que ya usa toda la suite.
   Dos rutas dentro de la misma base de datos:
   · li_procesos     → usuarios/secciones/centros — la MISMA que ya usa
     la app en producción hoy (se reutiliza tal cual, sin rediseñar).
   · li_procesos_v3  → proyectos/entregables — esquema nuevo
     y simplificado de este remaster; se guarda aparte para no chocar
     con el index.html que sigue publicado y en uso mientras este
     archivo no se suba (ver nota en el reporte de avance).
──────────────────────────────────────────────────────────── */
const FB_URL='https://ingenieria-de-procesos-24ba4-default-rtdb.firebaseio.com';
firebase.initializeApp({databaseURL: FB_URL});
const _fbDB=firebase.database();
const _refShare=_fbDB.ref('li_procesos');     // solo users/secciones/centros
const _refApp=_fbDB.ref('li_procesos_v3');    // projects/deliverables

function cleanUndefined(obj){
  return JSON.parse(JSON.stringify(obj,(k,v)=>v===undefined?null:v));
}
function toArr(v){ return v&&typeof v==='object'&&!Array.isArray(v) ? Object.values(v) : (v||[]); }
function toTabulador(v){ return {grupos:toArr(v?.grupos),categorias:toArr(v?.categorias),niveles:toArr(v?.niveles)}; }
function toGlobalParams(v){ return {...DEFAULT_GLOBAL_PARAMS,...(v||{})}; }

let _shareBusy=false,_appBusy=false;
let _sharePending=false,_appPending=false;

function saveShare(){
  lsSetSafe(LS_SHARE,JSON.stringify({users:DB.users,secciones:DB.secciones,centros:centrosParaCache(DB.centros),puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams}));
  _sharePending=true;
  clearTimeout(saveShare._t);
  saveShare._t=setTimeout(pushShare,700);
}
function saveApp(){
  lsSetSafe(LS_APP,JSON.stringify({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{}}));
  _appPending=true;
  clearTimeout(saveApp._t);
  saveApp._t=setTimeout(pushApp,700);
}
// saveDB(): usar tras cualquier cambio; guarda ambas rutas (cada una decide
// si de verdad cambió algo la próxima vez que se lea, pero por simplicidad
// aquí simplemente empujamos las dos — es barato y evita bugs de "se me
// olvidó guardar esta parte").
function saveDB(){ saveShare(); saveApp(); render(); }

async function pushShare(){
  if(_shareBusy)return; _shareBusy=true;
  try{
    // No pisamos otros campos que ya existan en el nodo real (proyectos viejos,
    // reglas, etc. del index.html anterior) — solo actualizamos users/secciones/centros.
    await _refShare.update(cleanUndefined({users:DB.users,secciones:DB.secciones,centros:DB.centros,puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams,_v3SavedAt:Date.now()}));
    _sharePending=false;
  }catch(e){ console.error('[FB share] push error',e.message); }
  _shareBusy=false;
}
async function pushApp(){
  if(_appBusy)return; _appBusy=true;
  try{
    await _refApp.set(cleanUndefined({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{},_savedAt:Date.now()}));
    _appPending=false;
  }catch(e){ console.error('[FB app] push error',e.message); }
  _appBusy=false;
}

async function pullShare(){
  const snap=await _refShare.get();
  const remote=snap.val();
  if(remote){
    DB.users=toArr(remote.users);
    DB.secciones=toArr(remote.secciones);
    DB.centros=toArr(remote.centros);
    DB.puestos=toArr(remote.puestos);
    DB.tabulador=toTabulador(remote.tabulador);
    DB.globalParams=toGlobalParams(remote.globalParams);
  }
  _sharedLoaded=true;
  lsSetSafe(LS_SHARE,JSON.stringify({users:DB.users,secciones:DB.secciones,centros:centrosParaCache(DB.centros),puestos:DB.puestos,tabulador:DB.tabulador,globalParams:DB.globalParams}));
}
async function pullApp(){
  const snap=await _refApp.get();
  const remote=snap.val();
  if(remote){
    // Tombstones: unión de lo que este dispositivo y el remoto ya sabían que se
    // borró — así un delete de alguien más no revive algo que yo ya borré, y
    // viceversa. Ver deleteProjectPrompt/deleteDeliverablePrompt.
    const deleted=Object.assign({},DB._deleted||{},remote._deleted||{});
    DB._deleted=deleted;
    DB.projects=toArr(remote.projects).filter(p=>!deleted[p.id]);
    DB.deliverables=toArr(remote.deliverables).filter(d=>!deleted[d.id]);
  }
  _appLoaded=true;
  lsSetSafe(LS_APP,JSON.stringify({projects:DB.projects,deliverables:DB.deliverables,_deleted:DB._deleted||{}}));
}

// Escuchar cambios en vivo de otras personas conectadas
_refShare.on('value',snap=>{
  if(_shareBusy||_sharePending)return;
  const remote=snap.val(); if(!remote)return;
  DB.users=toArr(remote.users); DB.secciones=toArr(remote.secciones); DB.centros=toArr(remote.centros);
  DB.puestos=toArr(remote.puestos);
  DB.tabulador=toTabulador(remote.tabulador);
  DB.globalParams=toGlobalParams(remote.globalParams);
  _sharedLoaded=true;
  if(SESSION) render();
});
_refApp.on('value',snap=>{
  if(_appBusy||_appPending)return;
  const remote=snap.val(); if(!remote)return;
  const deleted=Object.assign({},DB._deleted||{},remote._deleted||{});
  DB._deleted=deleted;
  DB.projects=toArr(remote.projects).filter(p=>!deleted[p.id]);
  DB.deliverables=toArr(remote.deliverables).filter(d=>!deleted[d.id]);
  _appLoaded=true;
  if(SESSION) render();
});

/* ══════════════════════════════════════════════════════
   AUTENTICACIÓN — mismo esquema/login que ya usa la suite
   (sessionStorage 'li_sess', mismo formato compartido con
   Infraestructura y Plan de Inversión).
══════════════════════════════════════════════════════ */
function getLoginList(){
  // Los perfiles reales van primero — si alguien tiene el mismo "usuario" que el
  // acceso maestro, su perfil real gana. El acceso maestro queda de respaldo al final.
  const list=[];
  (DB.users||[]).forEach(u=>{
    const norm=u.customUsername||(u.name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'.');
    list.push({username:norm,password:u.loginPassword||DEFAULT_PASS,role:u.loginRole||'user',name:u.name,userId:u.id});
  });
  list.push({username:ADMIN_USER,password:ADMIN_PASS,role:'admin',name:'Admin',userId:null});
  return list;
}
async function doLogin(){
  const inputU=document.getElementById('li-user').value.trim().toLowerCase();
  const inputP=document.getElementById('li-pass').value;
  const btn=document.getElementById('btn-login');
  const errEl=document.getElementById('login-err');
  errEl.style.display='none';
  btn.disabled=true; btn.textContent='Verificando…';
  try{
    if(!_sharedLoaded) await pullShare();
    if(!_appLoaded) await pullApp();
  }catch(e){ console.error(e); }
  btn.disabled=false; btn.textContent='Iniciar sesión';

  const found=getLoginList().find(u=>u.username===inputU&&u.password===inputP);
  if(!found){
    errEl.textContent='Usuario o contraseña incorrectos.';
    errEl.style.display='block';
    return;
  }
  SESSION={userId:found.userId,name:found.name,role:found.role};
  sessionStorage.setItem('li_sess',JSON.stringify(SESSION));
  enterApp();
}
async function logout(){
  if(!await appConfirm('¿Cerrar sesión?')) return;
  SESSION=null; sessionStorage.removeItem('li_sess'); location.reload();
}
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  applyRole();
  showView('dashboard');
  openResumenPendientesDlg();
}

/* ══════════════════════════════════════════════════════
   PERMISOS — misma lógica ya construida y probada de Secciones
   (Centro de Trabajo agrupado por líder). No se rediseña, solo
   se reutiliza para decidir quién ve/edita qué.
══════════════════════════════════════════════════════ */
function isAdmin(){ return SESSION?.role==='admin'; }
function isLeader(){ return SESSION?.role==='leader'||SESSION?.role==='admin'; }
function myUser(){ return SESSION?.userId?byId(DB.users,SESSION.userId):null; }
function mySeccion(){
  return (DB.secciones||[]).find(s=>s.liderId===SESSION?.userId)||null;
}
function getMyReports(){
  if(isAdmin()) return DB.users;
  const ids=new Set();
  (DB.secciones||[]).forEach(sec=>{
    if(sec.liderId===SESSION?.userId){
      (sec.centroIds||[]).forEach(ctId=>{
        const ct=byId(DB.centros,ctId); if(!ct) return;
        if(ct.encargadoId) ids.add(ct.encargadoId);
        (ct.ingenieros||[]).forEach(uid=>ids.add(uid));
      });
    }
  });
  // Respaldo: reportsTo directo, por si alguien no quedó agrupado en ninguna Sección.
  (DB.users||[]).forEach(u=>{ if(u.reportsTo===SESSION?.userId||u.id===SESSION?.userId) ids.add(u.id); });
  return (DB.users||[]).filter(u=>ids.has(u.id));
}
function myScopeUserIds(){ return new Set(getMyReports().map(u=>u.id)); }
function seccionOfUser(userId){
  const candidatas=(DB.secciones||[]).filter(sec=>
    (sec.centroIds||[]).some(ctId=>{
      const ct=byId(DB.centros,ctId);
      return ct && (ct.encargadoId===userId||(ct.ingenieros||[]).includes(userId));
    })
  );
  if(!candidatas.length) return null;
  if(candidatas.length===1) return candidatas[0];
  // FIX: si la persona es encargada/ingeniera de Centros repartidos entre más de una
  // Sección (ambiguo — no hay una sola respuesta correcta por Centro de Trabajo),
  // se desempata con su "Reporta a": si coincide con el líder de alguna de las
  // Secciones candidatas, esa gana. Si no hay coincidencia, se queda el
  // comportamiento anterior (la primera candidata) como respaldo.
  const user=byId(DB.users,userId);
  const porReportsTo=candidatas.find(sec=>sec.liderId===user?.reportsTo);
  return porReportsTo||candidatas[0];
}
// Puesto/DGP/Funciones de una persona: solo el admin o el líder de la Sección
// a la que pertenece esa persona puede editarlo. Un integrante normal (o un
// líder de OTRA sección) nunca puede editarlo, solo verlo si es el suyo propio.
function canEditPerfil(userId){
  if(isAdmin()) return true;
  const sec=seccionOfUser(userId);
  return !!sec && sec.liderId===SESSION?.userId;
}
// Un Proyecto se liga a uno o varios Centros de Trabajo (p.centroIds), NO a una
// Sección elegida a mano. La(s) Sección(es) responsable(s) se derivan solas:
// se busca en qué Sección(es) cae cada Centro del proyecto (una Sección
// contiene una lista de centroIds) — puede haber más de una si el proyecto
// junta Centros de distintas Secciones.
function seccionesDeProyecto(p){
  if(!p) return [];
  const ids=new Set(p.centroIds||[]);
  if(!ids.size) return [];
  return (DB.secciones||[]).filter(sec=>(sec.centroIds||[]).some(ctId=>ids.has(ctId)));
}
function canManageProject(p){
  if(!p) return false;
  if(isAdmin()) return true;
  // Basta con que UNA de las Secciones derivadas del proyecto sea la del líder
  // (no se requiere que todas lo sean).
  if(seccionesDeProyecto(p).some(sec=>sec.liderId===SESSION?.userId)) return true;
  // FIX (revisión post-rewrite): antes, si ningún Centro del proyecto caía todavía
  // en ninguna Sección, SOLO el admin podía manejarlo — eso significa que, en
  // producción, con las Secciones recién empezando a armarse, TODOS los líderes
  // pierden de golpe el control de TODOS sus proyectos existentes. Este respaldo
  // se lo devuelve a quien creó el proyecto o a su equipo (por Secciones/reportsTo
  // vía getMyReports), y deja de aplicar solo, sin tocar nada, en cuanto el
  // proyecto quede cubierto por una Sección real.
  if(!seccionesDeProyecto(p).length){
    if(p.createdBy===SESSION?.userId) return true;
    const scope=new Set(getMyReports().map(u=>u.id));
    return (DB.deliverables||[]).some(d=>d.projectId===p.id&&scope.has(d.assigneeId));
  }
  return false;
}
function canManageDeliverable(d){
  if(!d) return false;
  if(isAdmin()) return true;
  const p=byId(DB.projects,d.projectId);
  if(!p || !canManageProject(p)) return false;
  // FIX (revisión post-rewrite): antes, con poder manejar el PROYECTO ya bastaba para
  // editar/aprobar/borrar CUALQUIER entregable suyo — pero un proyecto puede tocar
  // varios Centros/Secciones, así que un líder terminaba pudiendo tocar entregables de
  // OTRO equipo dentro del mismo proyecto compartido. Ahora también se exige que el
  // responsable del entregable sea gente de su propio alcance (getMyReports).
  const scope=new Set(getMyReports().map(u=>u.id));
  return scope.has(d.assigneeId);
}
function canUpdateOwnDeliverable(d){
  // El responsable asignado siempre puede actualizar el estatus de lo suyo,
  // aunque no pueda crear/editar/borrar el proyecto o el entregable completo.
  return d && d.assigneeId===SESSION?.userId;
}
function applyRole(){
  if(!SESSION) return;
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=isAdmin()?'':'none');
  const u=myUser();
  document.getElementById('sb-name').textContent=SESSION.name||'—';
  document.getElementById('sb-role').textContent=isAdmin()?'Admin':(SESSION.role==='leader'?'Líder de sección':'Integrante');
  document.getElementById('sb-av').textContent=initials(SESSION.name);
}

let currentView='dashboard';
const VIEW_RENDERERS={}; // cada vista registra aquí su función de render
function showView(name){
  currentView=name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  const root=document.getElementById('view-root');
  if(name==='admin' && !isAdmin()){ root.innerHTML=noPermissionHTML(); return; }
  const fn=VIEW_RENDERERS[name];
  if(!fn){ root.innerHTML=noPermissionHTML(); return; }
  fn(root);
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('open');
}
function render(){ showView(currentView); }
document.querySelectorAll('.nav-btn[data-view]').forEach(b=>{

/* ══════════════════════════════════════════════════════
   PROYECTOS / ENTREGABLES
══════════════════════════════════════════════════════ */
function computeProjectStatus(p){
  const dels=(DB.deliverables||[]).filter(d=>d.projectId===p.id);
  if(!dels.length) return 'Activo';
  return dels.every(d=>d.status==='Entregado') ? 'Cerrado' : 'Activo';
}
function projectProgress(p){
  const dels=(DB.deliverables||[]).filter(d=>d.projectId===p.id);
  const done=dels.filter(d=>d.status==='Entregado').length;
  return {done,total:dels.length};
}
function visibleProjects(){
  if(isLeader()) return DB.projects||[]; // admin y líderes ven todas (líder: alcance de lectura)
  const mine=SESSION?.userId;
  return (DB.projects||[]).filter(p=>(DB.deliverables||[]).some(d=>d.projectId===p.id&&d.assigneeId===mine));
}
function visibleDeliverables(projectId){
  const all=(DB.deliverables||[]).filter(d=>d.projectId===projectId);
  if(isLeader()) return all;
  return all.filter(d=>d.assigneeId===SESSION?.userId);
}

                         // entrar a un detalle — se restaura al volver (ver openProjectDetail

let _currentCentroId=null; // qué centro muestra Centro de Trabajo — null = la lista
let _ctTab='distribucion'; // qué pestaña del detalle de centro está activa

let _maqTab='id'; // sub-tab del detalle de maquina: id | vars | roi

let _reporteMaqSel=null; // Set de ids de maquina marcados en "ROI Máquinas" para el PDF — null = aun no inicializado (se marcan todas)

function renderProyectos(root){
  // Si hay un proyecto abierto (detalle), un re-render (p.ej. tras guardar) debe
  // quedarse en el detalle — solo el nav de "Proyectos" limpia _currentProjectId.
  if(_currentProjectId){ renderProyectoDetail(root); return; }
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando proyectos…'); return; }
  const canCreate=isLeader();
  const projects=visibleProjects();
  const tab=root._tab||'activos'; // 'activos' es el default al entrar — nunca se mezclan con 'cerrados'
  const countActivos=projects.filter(p=>computeProjectStatus(p)==='Activo').length;
  const countCerrados=projects.filter(p=>computeProjectStatus(p)==='Cerrado').length;
  const enTab=projects
    .filter(p=>computeProjectStatus(p)===(tab==='activos'?'Activo':'Cerrado'))
    .sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

  // Filtro por líder — solo tiene sentido si hay más de una Sección con líder
  // asignado; si no, se oculta en vez de mostrar un select vacío/inútil.
  const liderFilter=root._liderFilter||'';
  const liderOpts=[...new Map(
    (DB.secciones||[]).filter(s=>s.liderId).map(s=>[s.liderId, byId(DB.users,s.liderId)])
  ).values()].filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));

  root.innerHTML=`
    <div class="view-head">
      <div><h1>Proyectos</h1><div class="view-sub">Entregables y fechas de tu área, en un solo lugar.</div></div>
      ${canCreate?'<button class="btn primary" id="btn-new-project">＋ Nuevo proyecto</button>':''}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:${liderOpts.length>1?'10px':'16px'};flex-wrap:wrap;align-items:center" id="proj-tabs">
      <button class="btn sm ${tab==='activos'?'primary':''}" data-t="activos">Activos <span class="pill ${tab==='activos'?'ok':'muted'}" style="margin-left:6px">${countActivos}</span></button>
      <button class="btn sm ${tab==='cerrados'?'primary':''}" data-t="cerrados">Cerrados <span class="pill ${tab==='cerrados'?'ok':'muted'}" style="margin-left:6px">${countCerrados}</span></button>
    </div>
    ${liderOpts.length>1?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
      <label class="small muted" for="proj-lider-filter">Filtrar por líder:</label>
      <select class="select-input" id="proj-lider-filter" style="width:auto;padding:7px 10px;font-size:13px">
        <option value="">Todos los líderes</option>
        ${liderOpts.map(u=>`<option value="${u.id}"${liderFilter===u.id?' selected':''}>${esc(u.name)}</option>`).join('')}
      </select>
    </div>`:''}
    <div id="proj-cols-nav" class="proj-cols-nav" style="display:none">
      <button type="button" class="btn xs" id="proj-cols-prev">◀ Anterior líder</button>
      <button type="button" class="btn xs" id="proj-cols-next">Siguiente líder ▶</button>
    </div>
    <div id="proj-grid"></div>
  `;
  document.getElementById('proj-tabs').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ root._tab=b.dataset.t; renderProyectos(root); });
  });
  if(canCreate) document.getElementById('btn-new-project').addEventListener('click',openNewProjectDlg);
  const liderSel=document.getElementById('proj-lider-filter');
  if(liderSel) liderSel.addEventListener('change',()=>{ root._liderFilter=liderSel.value; renderProyectos(root); });

  const grid=document.getElementById('proj-grid');
  const nav=document.getElementById('proj-cols-nav');
  if(!projects.length){
    grid.innerHTML=emptyStateHTML('Sin proyectos todavía',
      canCreate?'Da clic en "Nuevo proyecto" para crear el primero.':'Cuando te asignen un entregable, el proyecto aparecerá aquí.');
    return;
  }
  if(!enTab.length){
    grid.innerHTML=emptyStateHTML(
      tab==='activos'?'Sin proyectos activos':'Sin proyectos cerrados todavía',
      tab==='activos'?'Todos los proyectos de tu alcance están cerrados por ahora.':'Aquí aparecerán los proyectos en cuanto se cierren (todos sus entregables en "Entregado").');
    return;
  }
  grid.className='';
  grid.innerHTML=proyectosAgrupadosHTML(enTab,liderFilter);
  if(!grid.innerHTML.trim()){
    const liderNombre=liderOpts.find(u=>u.id===liderFilter)?.name||'';
    grid.innerHTML=emptyStateHTML('Sin proyectos para este líder',
      `${liderNombre?esc(liderNombre)+' no tiene':'Ese líder no tiene'} proyectos en esta pestaña ahora mismo.`);
    return;
  }
  grid.querySelectorAll('[data-open-project]').forEach(el=>{
    el.addEventListener('click',()=>{ _proyectosScrollY=window.scrollY; openProjectDetail(el.dataset.openProject); });
  });
  // ◀▶ arriba: forma fácil de moverse entre líderes sin ir a cazar la barra
  // de scroll hasta abajo de la columna más alta — mismo scroll, otro control.
  const cols=grid.querySelector('.proj-cols');
  if(cols && cols.scrollWidth>cols.clientWidth+4){
    nav.style.display='flex';
    document.getElementById('proj-cols-prev').addEventListener('click',()=>cols.scrollBy({left:-356,behavior:'smooth'}));
    document.getElementById('proj-cols-next').addEventListener('click',()=>cols.scrollBy({left:356,behavior:'smooth'}));
  }
}
// Agrupa una lista de proyectos (ya filtrada por pestaña Activos/Cerrados) en
// 2 niveles: 1) Sección real (equipo del líder, DB.secciones), en el orden en
// que existan; los proyectos cuyos centros no caen en ninguna Sección van al
// final en "Sin equipo asignado" — 2) dentro de cada grupo, subagrupado por
// Centro de Trabajo (un proyecto con varios CT se repite bajo cada CT al que
// pertenece, sin duplicar de forma confusa: misma tarjeta, varios lugares).
// liderFilter (opcional): id de usuario líder — si viene, solo se arma la(s)
// columna(s) de Sección cuyo líder sea ese, y se oculta "Sin equipo asignado"
// (esa gente no tiene líder, no puede pertenecerle a ninguno del filtro).
function proyectosAgrupadosHTML(projects,liderFilter){
  let cols='';
  (DB.secciones||[]).forEach(sec=>{
    if(liderFilter && sec.liderId!==liderFilter) return;
    const enSec=projects.filter(p=>seccionesDeProyecto(p).some(s=>s.id===sec.id));
    if(!enSec.length) return;
    const lider=byId(DB.users,sec.liderId);
    cols+=`<div class="proj-col" style="border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)">
      <div style="font-weight:700;font-size:14.5px">🧭 ${esc(sec.nombre)}${lider?` <span class="small muted" style="font-weight:400">(líder ${esc(lider.name)})</span>`:''} <span class="pill muted" style="margin-left:4px">${enSec.length}</span></div>
      <div style="margin-top:10px">${ctSubgruposHTML(enSec, sec.centroIds||[])}</div>
    </div>`;
  });
  let html=cols?`<div class="proj-cols">${cols}</div>`:'';
  const sinEquipo=liderFilter?[]:projects.filter(p=>seccionesDeProyecto(p).length===0);
  if(sinEquipo.length){
    const ctIds=[...new Set(sinEquipo.flatMap(p=>p.centroIds||[]))];
    html+=`<div style="margin-top:${cols?'24px':'0'};padding-top:16px;border-top:2px dashed var(--border2)">
      <div style="font-weight:700;font-size:14.5px;margin-bottom:10px">⚠️ Sin equipo asignado <span class="pill muted" style="margin-left:4px">${sinEquipo.length}</span></div>
      <div>${ctIds.length>1?ctSubgruposHTML(sinEquipo,ctIds):`<div class="proj-cards-scroll">${sinEquipo.map(projectCardHTML).join('')}</div>`}</div>
    </div>`;
  }
  return html;
}
// Subgrupos por Centro de Trabajo dentro de un grupo ya filtrado. ctIds trae
// el orden de los Centros a mostrar (los de la Sección, o los detectados en
// "Sin equipo asignado"). Los proyectos sin ningún CT en esa lista (p.ej.
// centroIds:[]) caen aparte, al final, bajo "Sin centro de trabajo".
function ctSubgruposHTML(projectsInGroup, ctIds){
  let html='';
  const cubiertos=new Set();
  ctIds.forEach(ctId=>{
    const ct=byId(DB.centros,ctId); if(!ct) return;
    const enCT=projectsInGroup.filter(p=>(p.centroIds||[]).includes(ctId));
    if(!enCT.length) return;
    cubiertos.add(ctId);
    html+=`<details class="proj-subgroup" style="margin-bottom:12px">
      <summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--accent);list-style:none">🏭 ${esc(ct.nombre)} <span class="pill muted" style="margin-left:4px">${enCT.length}</span></summary>
      <div class="proj-cards-scroll" style="margin-top:8px">${enCT.map(projectCardHTML).join('')}</div>
    </details>`;
  });
  const resto=projectsInGroup.filter(p=>!(p.centroIds||[]).some(id=>cubiertos.has(id)));
  if(resto.length){
    html+=`<div style="font-weight:600;font-size:13px;color:var(--muted);margin:4px 0 8px">Sin centro de trabajo <span class="pill muted" style="margin-left:4px">${resto.length}</span></div>
      <div class="proj-cards-scroll">${resto.map(projectCardHTML).join('')}</div>`;
  }
  return html;
}
function projectCentrosBadge(p){
  const names=(p.centroIds||[]).map(id=>byId(DB.centros,id)).filter(Boolean).map(ct=>esc(ct.nombre));
  return names.length?names.join(', '):'<span class="muted">Sin centro de trabajo</span>';
}
function projectSeccionesInfo(p){
  const secs=seccionesDeProyecto(p);
  if(!secs.length) return '';
  return secs.map(s=>{
    const lider=byId(DB.users,s.liderId);
    return esc(s.nombre)+(lider?' ('+esc(lider.name)+')':'');
  }).join(' · ');
}
function projectCardHTML(p){
  const status=computeProjectStatus(p);
  const {done,total}=projectProgress(p);
  const pct=total?Math.round(done/total*100):0;
  const overdue=p.dueDate && p.dueDate<todayISO() && status==='Activo';
  return `<div class="card" style="cursor:pointer" data-open-project="${p.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div style="font-weight:600;font-size:14.5px">${esc(p.name)}</div>
      ${status==='Cerrado'?statusPillHTML([{key:'Cerrado',icon:'✅',pill:'ok'}],'Cerrado'):(overdue?'<span class="pill bad">⏰ Atrasado</span>':'<span class="pill accent">🟢 Activo</span>')}
    </div>
    <div class="small muted" style="margin-top:6px">🏭 ${projectCentrosBadge(p)}</div>
    ${projectSeccionesInfo(p)?`<div class="small muted" style="margin-top:2px">🧭 ${projectSeccionesInfo(p)}</div>`:''}
    <div class="small muted" style="margin-top:2px">📅 Entrega: ${fmtDate(p.dueDate)}</div>
    <div style="margin-top:10px">
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="small muted" style="margin-top:4px">${done}/${total} entregables completados</div>
    </div>
  </div>`;
}
function openNewProjectDlg(){
  const ctChecks=(DB.centros||[]).map(ct=>
    `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0"><input type="checkbox" value="${ct.id}"> ${esc(ct.nombre)}</label>`).join('');
  openDlg({
    title:'Nuevo proyecto',
    body:`<label class="lbl">Nombre *</label><input class="input" id="np-name"/>
      <label class="lbl" style="margin-top:10px">Centros de trabajo *</label>
      <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border2);border-radius:var(--r-sm);padding:8px">${ctChecks||'<span class="small muted">No hay centros creados todavía — pide a un admin que los dé de alta en Administración.</span>'}</div>
      <label class="lbl" style="margin-top:10px">Fecha límite *</label>
      <input class="input" type="date" id="np-due"/>`,
    onSave:()=>{
      const name=document.getElementById('np-name').value.trim();
      const centroIds=[...document.querySelectorAll('#dlg-body input[type=checkbox]:checked')].map(i=>i.value);

async function deleteProjectPrompt(id){
  const p=byId(DB.projects,id); if(!p) return;
  // Respaldo: el botón ya está oculto salvo para quien administra este proyecto
  // (admin, o el líder de su Sección/equipo) — esto cubre por si se llega a llamar
  // esta función desde otro lado. Ya no se filtra entre equipos porque
  // canManageProject solo da "sí" para el propio equipo de quien pregunta.
  if(!canManageProject(p)){ toast('No tienes permiso para eliminar este proyecto','err'); return; }
  const n=(DB.deliverables||[]).filter(d=>d.projectId===id).length;
  if(!await appConfirm(`¿Eliminar el proyecto "${p.name}"?`,n?`Se eliminarán también sus ${n} entregable${n!==1?'s':''}.`:'')) return;
  if(!DB._deleted) DB._deleted={};
  DB._deleted[id]=Date.now();
  (DB.deliverables||[]).filter(d=>d.projectId===id).forEach(d=>{ DB._deleted[d.id]=Date.now(); });
  DB.projects=DB.projects.filter(x=>x.id!==id);
  DB.deliverables=DB.deliverables.filter(d=>d.projectId!==id);
  _currentProjectId=null;
  saveDB(); toast('Proyecto eliminado');
  showView('proyectos');
}

const PROX_DIAS=5; // ventana de "por vencer"
function reportDeliverables(){
  if(isLeader()) return DB.deliverables||[];
  return (DB.deliverables||[]).filter(d=>d.assigneeId===SESSION?.userId);

    <div style="font-weight:600;margin-bottom:8px">📊 Carga por persona</div>
    <div id="rep-carga"></div>`;
  renderReporteVencidos();
  renderReporteCarga();

// Constructores puros de HTML (sin efectos, sin ids fijos) — los usa tanto la
// vista Reportes (alcance global vía reportDeliverables/getMyReports) como el
// Dashboard nuevo (alcance por Sección). Una sola lógica, dos consumidores.
function vencidosTableHTML(dels){
  const today=todayISO();
  const limite=todayISO(new Date(Date.now()+PROX_DIAS*86400000));
  const pend=dels.filter(d=>isOpenOverdueStatus(d.status)&&d.dueDate);
  const atrasados=pend.filter(d=>d.dueDate<today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const porVencer=pend.filter(d=>d.dueDate>=today&&d.dueDate<=limite).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  if(!atrasados.length&&!porVencer.length){
    return emptyStateHTML('Nada atrasado ni por vencer','Todo está al día en los próximos '+PROX_DIAS+' días.');
  }
  function rowsHTML(list,tag){
    return list.map(d=>{
      const p=byId(DB.projects,d.projectId);
      const u=byId(DB.users,d.assigneeId);
      const dias=Math.round((new Date(d.dueDate)-new Date(today))/86400000);
      return `<tr>
        <td>${esc(d.name)}</td>
        <td class="small muted">${p?esc(p.name):'—'}</td>
        <td>${u?esc(u.name):'—'}</td>
        <td>${fmtDate(d.dueDate)}</td>
        <td>${tag==='atrasado'?`<span class="pill bad">${Math.abs(dias)} día${Math.abs(dias)!==1?'s':''} tarde</span>`:`<span class="pill warn">en ${dias} día${dias!==1?'s':''}</span>`}</td>
      </tr>`;
    }).join('');
  }
  return `<div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
    <thead><tr><th>Entregable</th><th>Proyecto</th><th>Responsable</th><th>Fecha</th><th>Situación</th></tr></thead>
    <tbody>${rowsHTML(atrasados,'atrasado')}${rowsHTML(porVencer,'proximo')}</tbody>
  </table></div>`;
}
function cargaListHTML(people){
  if(!people.length) return emptyStateHTML('Sin datos todavía','No encontramos personas para mostrar aquí.');
  const rows=people.map(u=>({u,carga:cargaAbierta(u.id)})).sort((a,b)=>b.carga-a.carga);
  const max=Math.max(1,...rows.map(r=>r.carga));
  return `<div class="card">${rows.map(r=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:120px;font-size:12.5px;flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.u.name)}</div>
      <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${r.carga/max*100}%"></div></div>
      <div style="width:70px;text-align:right;font-size:12.5px" class="muted">${r.carga} abierto${r.carga!==1?'s':''}</div>
    </div>`).join('')}</div>`;
}
function renderReporteVencidos(){
  const el=document.getElementById('rep-vencidos'); if(!el) return;
  el.innerHTML=vencidosTableHTML(reportDeliverables());
}
function renderReporteCarga(){
  const el=document.getElementById('rep-carga'); if(!el) return;

}

/* ══════════════════════════════════════════════════════
   RESUMEN AL ENTRAR — ventana que aparece justo después de iniciar sesión
   (enterApp) con Actividad/Proyecto/Responsable/Líder/Avance de todo lo
   pendiente. Mismo alcance que reportDeliverables() (todo para líder/admin,
   solo lo propio para integrante) — una sola fuente de "qué es mío".
══════════════════════════════════════════════════════ */
function resumenPendientesRows(){
  const today=todayISO();
  return reportDeliverables()
    .filter(d=>d.status!=='Entregado') // todo lo no entregado (incluye "En pausa")
    .map(d=>{
      const p=byId(DB.projects,d.projectId);
      const u=byId(DB.users,d.assigneeId);
      const secs=p?seccionesDeProyecto(p):[];
      const liderNombres=secs.map(s=>byId(DB.users,s.liderId)).filter(Boolean).map(l=>l.name);
      const {done,total}=p?projectProgress(p):{done:0,total:0};
      return {
        actividad:d.name,
        proyecto:p?p.name:'—',
        responsable:u?u.name:'—',
        lider:liderNombres.length?[...new Set(liderNombres)].join(', '):'—',
        dueDate:d.dueDate,
        overdue:d.dueDate&&d.dueDate<today&&isOpenOverdueStatus(d.status),
        pct:total?Math.round(done/total*100):0,
        secciones:secs, // solo para agrupar el PDF por equipo — no se pinta tal cual
      };
    })
    .sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
}
// Mismas filas de arriba, agrupadas por Sección/equipo (para el PDF) — un
// renglón puede repetirse bajo 2 equipos si su proyecto pertenece a 2
// Secciones, igual que ya pasa en Proyectos; "Sin equipo asignado" al final.
function resumenPorEquipoGrupos(){
  const rows=resumenPendientesRows();
  const grupos=[];
  (DB.secciones||[]).forEach(sec=>{
    const enSec=rows.filter(r=>r.secciones.some(s=>s.id===sec.id));
    if(enSec.length) grupos.push({nombre:sec.nombre,lider:byId(DB.users,sec.liderId)?.name||'',rows:enSec});
  });
  const sinEquipo=rows.filter(r=>r.secciones.length===0);
  if(sinEquipo.length) grupos.push({nombre:'Sin equipo asignado',lider:'',rows:sinEquipo});
  return grupos;
}
function resumenPdfHTML(){
  const grupos=resumenPorEquipoGrupos();
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const gruposHTML=grupos.map(g=>`
    <h2>${esc(g.nombre)}${g.lider?` — líder ${esc(g.lider)}`:''} <span class="n">(${g.rows.length})</span></h2>
    <table>
      <thead><tr><th>Actividad</th><th>Proyecto</th><th>Responsable</th><th>Entrega</th><th>Avance</th></tr></thead>
      <tbody>${g.rows.map(r=>`<tr>
        <td>${esc(r.actividad)}</td><td>${esc(r.proyecto)}</td><td>${esc(r.responsable)}</td>
        <td${r.overdue?' class="bad"':''}>${fmtDate(r.dueDate)}</td><td>${r.pct}%</td>
      </tr>`).join('')}</tbody>
    </table>`).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Resumen de pendientes por equipo</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;padding:28px;color:#222}
  h1{font-size:19px;margin:0 0 2px}
  .fecha{color:#666;font-size:11.5px;margin-bottom:22px}
  h2{font-size:13.5px;margin:22px 0 6px;border-bottom:2px solid #333;padding-bottom:4px}
  h2 .n{font-weight:400;color:#666}
  table{width:100%;border-collapse:collapse;margin-bottom:4px;font-size:11px}
  th,td{border:1px solid #ccc;padding:5px 7px;text-align:left}
  th{background:#f0f0f0}
  td.bad{color:#a6402f;font-weight:700}
  @media print{ h2{page-break-after:avoid} tr{page-break-inside:avoid} }
</style></head>
<body>
  <h1>📋 Resumen de pendientes por equipo</h1>
  <div class="fecha">Generado el ${fecha}</div>
  ${gruposHTML||'<p>Nada pendiente ahora mismo.</p>'}
</body></html>`;
}
// Ventana nueva abierta de forma SÍNCRONA (antes de escribir el HTML) — así
// no la bloquea el bloqueador de pop-ups, que solo permite window.open()

/* ══════════════════════════════════════════════════════
   3 MÓDULOS NUEVOS DEL DASHBOARD — barra de avance, proyectos
   estancados, actividad reciente. Puros (reciben datos ya
   filtrados por quien los llama, no vuelven a resolver alcance).
══════════════════════════════════════════════════════ */
function daysAgoLabel(ms){
  const days=Math.floor((Date.now()-ms)/86400000);
  if(days<=0) return 'hoy';
  if(days===1) return 'hace 1 día';
  return `hace ${days} días`;
}
function fmtWhen(ms){
  if(!ms) return '—';
  const days=Math.floor((Date.now()-ms)/86400000);
  if(days<7) return daysAgoLabel(ms);
  return new Date(ms).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function progressBarHTML(dels){
  const total=dels.length;
  const done=dels.filter(d=>d.status==='Entregado').length;
  const pct=total?Math.round(done/total*100):0;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div class="small muted">Avance de entregables</div>
      <div class="small" style="font-weight:600">${pct}% · ${done}/${total} entregables</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}
const STALLED_DAYS=7; // proyecto activo sin ningún cambio de estatus en sus entregables en N días
function deliverableLastMovement(d){ return d.updatedAt||null; } // entregables viejos sin el campo: sin fecha de referencia
function projectLastMovement(p){
  const dates=(DB.deliverables||[]).filter(d=>d.projectId===p.id).map(deliverableLastMovement).filter(Boolean);
  return dates.length?Math.max(...dates):null;
}
function isProjectStalled(p){
  if(computeProjectStatus(p)!=='Activo') return false;
  const last=projectLastMovement(p);
  if(last===null) return true; // sin ningún entregable con fecha de referencia: se muestra para revisar, no se calla
  return (Date.now()-last)>=STALLED_DAYS*86400000;
}
function stalledLabel(p){
  const last=projectLastMovement(p);
  return last===null?'sin fecha de referencia':daysAgoLabel(last);
}
function stalledProjectsHTML(projects){
  const stalled=projects.filter(isProjectStalled);
  if(!stalled.length) return emptyStateHTML('Nada estancado',`Todos los proyectos activos han tenido movimiento en los últimos ${STALLED_DAYS} días.`);
  return `<div class="card">${stalled.map(p=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-size:13px">${esc(p.name)}</div>
      <span class="pill warn">⏸ ${stalledLabel(p)}</span>
    </div>`).join('')}</div>`;
}
function recentActivityHTML(dels){
  const items=dels
    .filter(d=>d.status==='Entregado'||d.approved)
    .map(d=>({d,at:d.approved?.at||d.updatedAt||d.createdAt||0}))
    .sort((a,b)=>b.at-a.at)
    .slice(0,10);
  if(!items.length) return emptyStateHTML('Sin actividad reciente','Cuando marquen o aprueben entregables, aparecerán aquí.');
  return `<div class="card">${items.map(({d,at})=>{
    const who=d.approved?.byName||(byId(DB.users,d.assigneeId)?.name)||'—';
    const accion=d.approved?'aprobado por':'marcado como entregado por';
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:600">${esc(d.name)}</div>
        <div class="small muted">${accion} ${esc(who)}</div>
      </div>
      <div class="small muted" style="white-space:nowrap">${fmtWhen(at)}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ══════════════════════════════════════════════════════
   DASHBOARD — pantalla de entrada tras el login. Reusa tal cual
   los reportes de arriba (Atrasados/por vencer y Carga por
   persona) en vez de duplicar su lógica, más 3 tarjetas de
   resumen rápido. Mismo alcance por rol que ya usa el resto de
   la app (isAdmin/isLeader/getMyReports vía reportDeliverables
   y visibleProjects — no se inventa un criterio nuevo).
══════════════════════════════════════════════════════ */
// Alcance de datos para UN bloque del dashboard (una Sección real, o el bloque
// "Sin sección asignada"). sec=null → proyectos cuyos centros no caen en
// ninguna Sección todavía.
function seccionScope(sec){
  let projects,people;
  if(sec){
    projects=(DB.projects||[]).filter(p=>seccionesDeProyecto(p).some(s=>s.id===sec.id));
    people=(DB.users||[]).filter(u=>{ const s=seccionOfUser(u.id); return s&&s.id===sec.id; });
  }else{
    projects=(DB.projects||[]).filter(p=>seccionesDeProyecto(p).length===0);
    const ids=new Set();
    projects.forEach(p=>(DB.deliverables||[]).filter(d=>d.projectId===p.id).forEach(d=>{ if(d.assigneeId) ids.add(d.assigneeId); }));
    people=(DB.users||[]).filter(u=>ids.has(u.id));
  }
  const projectIds=new Set(projects.map(p=>p.id));
  const deliverables=(DB.deliverables||[]).filter(d=>projectIds.has(d.projectId));
  return {projects,people,deliverables};
}
// Un bloque completo: resumen + los 3 módulos nuevos + los 2 reportes reusados.
function dashboardBlockHTML({icon,title,scope}){
  const {projects,people,deliverables}=scope;
  const activos=projects.filter(p=>computeProjectStatus(p)==='Activo').length;
  const pendientes=deliverables.filter(d=>d.status!=='Entregado').length;
  return `
    <div style="margin:26px 0 14px;padding-top:18px;border-top:1px solid var(--border2)">
      <h2 style="font-size:16px">${icon} ${esc(title)}</h2>
    </div>
    <div class="grid-cards" style="margin-bottom:16px">
      <div class="card"><div class="small muted">Proyectos activos</div><div style="font-size:24px;font-weight:700;margin-top:2px">${activos}</div><div class="small muted">${projects.length} en total</div></div>
      <div class="card"><div class="small muted">Entregables pendientes</div><div style="font-size:24px;font-weight:700;margin-top:2px">${pendientes}</div></div>
    </div>
    <div style="margin-bottom:16px">${progressBarHTML(deliverables)}</div>
    <div style="font-weight:600;margin-bottom:8px">⏰ Atrasados y por vencer</div>
    <div style="margin-bottom:16px">${vencidosTableHTML(deliverables)}</div>
    <div style="font-weight:600;margin-bottom:8px">📊 Carga por persona</div>
    <div style="margin-bottom:16px">${cargaListHTML(people)}</div>
    <div style="font-weight:600;margin-bottom:8px">⏸ Proyectos estancados</div>
    <div style="margin-bottom:16px">${stalledProjectsHTML(projects)}</div>
    <div style="font-weight:600;margin-bottom:8px">🕘 Actividad reciente</div>
    <div>${recentActivityHTML(deliverables)}</div>
  `;
}
function renderDashboard(root){
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando dashboard…'); return; }
  if(!isLeader()){ renderDashboardIndividual(root); return; }
  renderDashboardSecciones(root);
}
// admin: ve todas las Secciones (toda la operación). Líder: SOLO ve la(s)
// Sección(es) donde él es el líder — su equipo, nada más (pedido explícito
// del usuario: "cada líder solo debe ver en su dashboard su información y de
// su equipo"). Un bloque por Sección visible, más "Sin sección asignada" al
// final solo para admin (es información cross-equipo, no le toca a un líder).
function renderDashboardSecciones(root){
  const today=todayISO();
  const misSecciones=isAdmin()?(DB.secciones||[]):(DB.secciones||[]).filter(s=>s.liderId===SESSION.userId);
  // KPIs de arriba: se arman con el MISMO alcance que los bloques de abajo (las
  // Secciones que este rol puede ver) — así un líder ve números de su equipo,
  // nunca de la operación completa, y admin sigue viendo todo (sus Secciones +
  // "sin sección").
  const scopes=misSecciones.map(seccionScope);
  if(isAdmin()) scopes.push(seccionScope(null));
  const dashProjects=[...new Map(scopes.flatMap(s=>s.projects).map(p=>[p.id,p])).values()];
  const dashDeliverables=[...new Map(scopes.flatMap(s=>s.deliverables).map(d=>[d.id,d])).values()];
  const activos=dashProjects.filter(p=>computeProjectStatus(p)==='Activo').length;
  const totalProy=dashProjects.length;
  const pendientes=dashDeliverables.filter(d=>d.status!=='Entregado').length;
  const atrasados=dashDeliverables.filter(d=>isOpenOverdueStatus(d.status)&&d.dueDate&&d.dueDate<today).length;
  root.innerHTML=`
    <div class="view-head"><div><h1>Dashboard</h1>
      <div class="view-sub">${isAdmin()?'Toda la operación, de un vistazo.':'Tu equipo, de un vistazo.'}</div></div></div>
    <div class="grid-cards">
      <div class="card"><div class="small muted">Proyectos activos</div><div style="font-size:30px;font-weight:700;margin-top:4px">${activos}</div><div class="small muted">${totalProy} en total</div></div>
      <div class="card"><div class="small muted">Entregables pendientes</div><div style="font-size:30px;font-weight:700;margin-top:4px">${pendientes}</div></div>
      <div class="card"><div class="small muted">Atrasados ahora mismo</div><div style="font-size:30px;font-weight:700;margin-top:4px${atrasados?';color:var(--bad)':''}">${atrasados}</div></div>
    </div>
    <div id="dash-secciones"></div>
  `;
  const cont=document.getElementById('dash-secciones');
  let html=misSecciones.map(sec=>dashboardBlockHTML({icon:'🧭',title:sec.nombre,scope:seccionScope(sec)})).join('');
  if(isAdmin()){
    const sinSeccion=seccionScope(null);
    if(sinSeccion.projects.length){
      html+=dashboardBlockHTML({icon:'⚠️',title:'Sin sección asignada',scope:sinSeccion});
    }
  }
  cont.innerHTML=html||emptyStateHTML('Sin secciones todavía','Ve a Administración → Secciones para crear la primera.');
}

      <div class="card"><div class="small muted">Entregables pendientes</div><div style="font-size:30px;font-weight:700;margin-top:4px">${pendientes}</div></div>

    <div>${recentActivityHTML(reportDeliverables())}</div>

  renderReporteVencidos();

/* ══════════════════════════════════════════════════════
   EQUIPO — perfiles básicos + carga de trabajo actual.
   Simplificado a propósito: sin nómina, sin evaluación mensual,
   sin organigrama visual (eliminados del alcance de esta vista).
══════════════════════════════════════════════════════ */
function cargaAbierta(userId){
  return (DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status!=='Entregado').length;
}
// ── "Barras" del expediente (Mi puesto) — solo con datos que la app ya
// tiene de verdad (entregables). null = "sin datos todavía" (nunca se
// inventa un número para que la barra se vea llena).
function statsCompletados(userId){
  const dels=(DB.deliverables||[]).filter(d=>d.assigneeId===userId);
  if(!dels.length) return null;
  return Math.round(dels.filter(d=>d.status==='Entregado').length/dels.length*100);
}
function statsATiempo(userId){
  const entregados=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado');
  if(!entregados.length) return null;
  const aTiempo=entregados.filter(d=>!d.dueDate||!d.updatedAt||new Date(d.updatedAt)<=new Date(d.dueDate+'T23:59:59'));
  return Math.round(aTiempo.length/entregados.length*100);
}
function statsCargaRelativa(userId){
  const todos=(DB.users||[]).map(u=>cargaAbierta(u.id));
  const max=Math.max(1,...todos);
  return Math.round(cargaAbierta(userId)/max*100);
}
// % de lo entregado que además fue APROBADO (botón "Aprobar" que ya existe
// en Proyectos) — es la señal más cercana que la app tiene de "efectivo",
// no solo "lo mandé" sino "alguien revisó y quedó bien".
function statsEfectivos(userId){
  const entregados=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado');
  if(!entregados.length) return null;
  return Math.round(entregados.filter(d=>d.approved).length/entregados.length*100);
}
// Números crudos (no %) para las 2 tarjetas junto a las barras.
function statsCumplidosCount(userId){
  return (DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado').length;
}
function statsProyectosNoTerminados(userId){
  const ids=new Set((DB.deliverables||[]).filter(d=>d.assigneeId===userId).map(d=>d.projectId));
  return [...ids].map(id=>byId(DB.projects,id)).filter(Boolean).filter(p=>computeProjectStatus(p)!=='Cerrado').length;
}

function wirePersonCards(root){
  root.querySelectorAll('[data-edit-perfil]').forEach(b=>{
    b.addEventListener('click',()=>editPerfilDlg(b.dataset.editPerfil));
  });
  root.querySelectorAll('[data-ver-expediente]').forEach(b=>{
    b.addEventListener('click',()=>{ _profileUserId=b.dataset.verExpediente; showView('mipuesto'); });
  });
}
function editPerfilDlg(userId){
  const u=byId(DB.users,userId); if(!u) return;
  if(!canEditPerfil(userId)){ toast('No tienes permiso para esto','err'); return; }
  let funciones=[...(u.funciones||[])];
  function funcionesListHTML(){
    return funciones.length
      ? funciones.map((f,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <div class="small" style="flex:1">${esc(f)}</div>
          <button type="button" class="btn xs danger" data-rm-fn="${i}">✕</button>
        </div>`).join('')
      : '<div class="small muted" style="margin-bottom:4px">Sin funciones agregadas todavía.</div>';
  }
  function wireList(){
    document.getElementById('pf-fn-list').querySelectorAll('[data-rm-fn]').forEach(b=>{
      b.addEventListener('click',()=>{
        funciones.splice(Number(b.dataset.rmFn),1);
        document.getElementById('pf-fn-list').innerHTML=funcionesListHTML();
        wireList();
      });
    });
  }
  const puestoOpts=(DB.puestos||[]).map(p=>
    `<option value="${p.id}"${u.puestoId===p.id?' selected':''}>${esc(p.nombre)}${p.departamento?' — '+esc(p.departamento):''}</option>`).join('');
  openDlg({
    title:'Perfil del puesto', sub:esc(u.name),
    body:`<label class="lbl">Puesto (catálogo)</label>
      <select class="select-input" id="pf-puesto-id"><option value="">— Sin asignar —</option>${puestoOpts}</select>
      <div class="small muted" style="margin-top:4px">Trae la Misión, Actividades, Autoridades e Indicadores del DGP a su expediente ("Mi puesto"). Se administra en Administración → Puestos.</div>
      <label class="lbl" style="margin-top:14px">Puesto (texto libre, si aún no está en el catálogo)</label>
      <input class="input" id="pf-puesto" value="${esc(u.puesto||'')}" placeholder="Ej. Ingeniero de procesos"/>
      <label class="lbl" style="margin-top:10px">Notas adicionales</label>
      <textarea class="input" id="pf-dgp" style="min-height:80px" placeholder="Un párrafo breve…">${esc(u.dgpDescripcion||'')}</textarea>
      <label class="lbl" style="margin-top:10px">Funciones</label>
      <div id="pf-fn-list">${funcionesListHTML()}</div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <input class="input" id="pf-fn-new" placeholder="Nueva función…" style="flex:1"/>
        <button type="button" class="btn sm" id="pf-fn-add">＋ Agregar</button>
      </div>`,
    onSave:()=>{
      u.puestoId=document.getElementById('pf-puesto-id').value||null;
      u.puesto=document.getElementById('pf-puesto').value.trim();
      u.dgpDescripcion=document.getElementById('pf-dgp').value.trim();
      u.funciones=funciones;
      saveDB(); toast('Perfil actualizado ✓');
      render();
    }
  });
  wireList();
  document.getElementById('pf-fn-add').addEventListener('click',()=>{
    const input=document.getElementById('pf-fn-new');
    const val=input.value.trim();
    if(!val) return;
    funciones.push(val);
    input.value='';
    document.getElementById('pf-fn-list').innerHTML=funcionesListHTML();
    wireList();
  });
}

/* ══════════════════════════════════════════════════════
   MI PUESTO — expediente individual: responsabilidades reales del DGP
   (catálogo DB.puestos) + "barras" tipo videojuego. Las barras de
   entregables son 100% calculadas de datos reales; las de KPIs de
   negocio del DGP las captura a mano quien administra el perfil
   (canEditPerfil) porque la app no mide calidad/producción todavía.
══════════════════════════════════════════════════════ */
function fifaBarHTML(label,value,sub,neutral){
  const known=value!=null;
  const pct=known?Math.max(0,Math.min(100,value)):0;
  // "neutral": la barra no es un desempeño a maximizar (ej. Carga actual —
  // más alto no es "mejor"), así que no se pinta con la escala ok/warn/bad.
  const color=!known?'var(--border2)':neutral?'var(--accent)':pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)';
  return `<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
      <span style="font-weight:600">${esc(label)}</span>
      <span class="${known?'':'muted'}" style="font-weight:700">${known?pct+'%':'Sin datos'}</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${known?pct:100}%;background:${color}"></div></div>
    ${sub?`<div class="small muted" style="margin-top:2px">${esc(sub)}</div>`:''}
  </div>`;
}
function listBlockHTML(title,items){
  if(!items||!items.length) return '';
  return `<div style="margin-bottom:16px">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px">${esc(title)}</div>
    <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  </div>`;
}

}
// Ambos diálogos guardan por ÍNDICE del indicador/resultado en el arreglo del
// puesto, nunca por su texto — Firebase prohíbe ".", "#", "$", "/", "[", "]"
// en las llaves, y casi todo resultado/indicador real trae alguno (los
// resultados esperados siempre terminan en punto; ya vimos un indicador con
// "/"). Usar el texto como llave tronaba el guardado en cuanto apareciera
// cualquiera de esos caracteres. Costo real: si el catálogo reordena la
// lista después, un valor ya capturado puede quedar bajo el renglón vecino
// — aceptable frente a que la captura fallara siempre.
function editKpisDlg(userId){
  const u=byId(DB.users,userId); if(!u) return;
  if(!canEditPerfil(userId)){ toast('No tienes permiso para esto','err'); return; }
  const puesto=puestoDeUsuario(u); if(!puesto) return;
  const rows=(puesto.indicadores||[]).map((k,i)=>`
    <label class="lbl" style="margin-top:${i?10:0}px">${esc(k.label)} <span class="muted">(meta: ${esc(k.meta)})</span></label>
    <input class="input" type="number" min="0" max="100" id="kv-${i}" value="${u.kpis?.[i]??''}" placeholder="% actual — déjalo vacío si no lo tienes"/>`).join('');
  openDlg({
    title:'Capturar KPIs', sub:esc(u.name)+' · '+esc(puesto.nombre),
    body:`<div class="small muted" style="margin-bottom:10px">Captura manual (0-100). La app no mide estos indicadores de negocio — solo los muestra para que quede a la vista el avance.</div>${rows}`,
    onSave:()=>{
      const kpis={...(u.kpis||{})};
      (puesto.indicadores||[]).forEach((k,i)=>{
        const raw=document.getElementById('kv-'+i).value;
        if(raw===''){ delete kpis[i]; return; }
        const n=Math.max(0,Math.min(100,Number(raw)));
        if(!Number.isNaN(n)) kpis[i]=n;
      });
      u.kpis=kpis;
      saveDB(); toast('KPIs actualizados ✓');
      render();
    }
  });
}
function editLogrosDlg(userId){
  const u=byId(DB.users,userId); if(!u) return;
  if(!canEditPerfil(userId)){ toast('No tienes permiso para esto','err'); return; }
  const puesto=puestoDeUsuario(u); if(!puesto) return;
  const resultados=puesto.resultadosEsperados||[];
  const rows=resultados.map((r,i)=>{
    const actual=u.logros?.[i]||'No evaluado';
    return `<label class="lbl" style="margin-top:${i?10:0}px">${esc(r)}</label>
      <select class="select-input" id="lg-${i}">
        ${LOGRO_STATUS.map(s=>`<option value="${s.key}"${actual===s.key?' selected':''}>${s.icon} ${s.key}</option>`).join('')}
      </select>`;
  }).join('');
  openDlg({
    title:'Evaluar resultados esperados', sub:esc(u.name)+' · '+esc(puesto.nombre),
    body:resultados.length
      ?`<div class="small muted" style="margin-bottom:10px">Así se evalúa "Somos Efectivos" cada trimestre, según el DGP de este puesto.</div>${rows}`
      :'<div class="small muted">Este puesto no tiene resultados esperados en el catálogo todavía.</div>',
    onSave:()=>{
      const logros={...(u.logros||{})};
      resultados.forEach((r,i)=>{ logros[i]=document.getElementById('lg-'+i).value; });
      u.logros=logros;
      saveDB(); toast('Evaluación guardada ✓');
      render();
    }
  });
}

/* ══════════════════════════════════════════════════════
   CENTRO DE TRABAJO — ingeniería nativa (balanceo de líneas, CIF, resumen
   de costos, equipos/mantenimiento). Puerto de la lógica de cálculo real
   de Control_CT_v7.html (verificada línea por línea antes de portar aquí
   — balanceo serie/paralelo, cuello de botella, Takt Time, costo ideal,
   semáforo de mantenimiento son fieles al original). La presentación se
   adapta al estilo ya establecido en esta app (.card/.tbl/.pill/
   .bar-track) en vez de replicar el CSS de la app vieja. Cada centro
   guarda su propia ingeniería directo en DB.centros[i] (mismo catálogo
   compartido de siempre — ver campos agregados en applyCTMigration).
══════════════════════════════════════════════════════ */
function curCT(){ return byId(DB.centros,_currentCentroId); }
function ctEnsureShape(c){
  c.ingenieroIds=c.ingenieroIds||[]; c.operaciones=c.operaciones||[]; c.personal=c.personal||[];
  c.cif=c.cif||[]; c.equipos=c.equipos||[]; c.flujos=c.flujos||[];
  c.params=c.params||{disponibleMin:480,dias:22,turnos:1,demanda:0};
  c.consideraciones=c.consideraciones||{items:[]};
  c.asignaciones=c.asignaciones||{};
  // Fase 4 — Plan de Inversion dentro de Centro de Trabajo:
  c.maquinas=c.maquinas||[];
  c.piezasPromedioDia=c.piezasPromedioDia||0;
  c.piezasPromedioMeta=c.piezasPromedioMeta||'';
}
function ctCostoHora(c){
  ctEnsureShape(c);
  const dias=c.params.dias||22, disponible=c.params.disponibleMin||480;
  const cons=(c.consideraciones.items||[]).filter(x=>x.activa!==false).reduce((a,x)=>a+(x.min||0),0);
  const horasMes=((disponible-cons)/60)*dias;
  const mod=c.personal.reduce((a,m)=>a+(m.costo||0),0);
  const cif=c.cif.reduce((a,x)=>a+(x.monto||0),0);
  return horasMes>0?(mod+cif)/horasMes:0;
}
// Capacidad real del centro (piezas/día) — única fuente, igual que ctCostoHora: sale
// del balanceo (operaciones+personal+asignaciones, vía ctCalcularResultados) en vez de
// recalcularse aparte en cada pantalla que la necesite.
function ctCapacidadDia(c){
  return ctCalcularResultados(c).capDia;
}
// Suma los conceptos de CIF de un centro cuyo nombre coincide con alguno de los
// patrones dados (insensible a mayúsculas/acentos) — única forma de leer "Renta"
// o "Energía" del CIF real, para no volver a teclearlos a mano en Máquinas.
function ctCifPorConcepto(c,patrones){
  ctEnsureShape(c);
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return c.cif.filter(x=>patrones.some(p=>norm(x.concepto).includes(norm(p)))).reduce((a,x)=>a+(x.monto||0),0);
}
function ctCifTotal(c){ ctEnsureShape(c); return c.cif.reduce((a,x)=>a+(x.monto||0),0); }

/* ══════════════════════════════════════════════════════════════════════════
   PLAN DE INVERSION — motor de ROI (portado de LineaItalia.html, Fase 4).
   Cada maquina vive en c.maquinas[] (c = un Centro de Trabajo real). Ya no
   necesita "ctPiezasKey" (un texto libre apuntando a un CT por nombre) porque
   la maquina ya vive DENTRO de su centro — cantidadDiaReal reparte
   c.piezasPromedioDia entre las maquinas del mismo centro que no tengan
   captura manual propia.
   ══════════════════════════════════════════════════════════════════════════ */
function parseNum(v){ var n=parseFloat((v+'').toString().replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function fmtNum(v){ return (parseNum(v)).toLocaleString('es-MX',{maximumFractionDigits:2}); }
function fmtMoney(v){ return '$'+(parseNum(v)).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function getGP(){ return DB.globalParams||DEFAULT_GLOBAL_PARAMS; }
function resolveGlobal(token,gp){
  var map={"[SALARIO]":gp.salary,"[DIAS]":gp.days,"[HORAS]":gp.hours,"[TC]":gp.fx,"[CFE]":gp.cfe,"[MESES]":gp.months};
  return map[token]!==undefined?map[token]:0;
}
