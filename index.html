function rangoSemanaActual(hoy) {
  const day = hoy.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const lunes = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + diffToMonday);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);
  domingo.setHours(23, 59, 59, 999);
  return [lunes, domingo];
}
function rangoMesActual(hoy) {
  const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0, 23, 59, 59, 999);
  return [inicio, fin];
}

function renderDetallePorFamilia(p) {
  const porFamilia = new Map();
  p.partidas.forEach(it => {
    if (!porFamilia.has(it.familia)) porFamilia.set(it.familia, []);
    porFamilia.get(it.familia).push(it);
  });

  const familiasOrdenadas = Array.from(porFamilia.keys()).sort((a, b) => {
    const infoA = p.familias.find(f => f.nombre === a);
    const infoB = p.familias.find(f => f.nombre === b);
    const faltaA = infoA ? infoA.faltan > 0 : false;
    const faltaB = infoB ? infoB.faltan > 0 : false;
    if (faltaA !== faltaB) return faltaA ? -1 : 1;
    return a.localeCompare(b);
  });

  return familiasOrdenadas.map(fam => {
    const items = porFamilia.get(fam);
    const info = p.familias.find(f => f.nombre === fam);
    const estadoFam = (info && info.faltan > 0)
      ? `<span class="familia-status pend">${info.faltan}/${info.total} pendientes · ${fmtMoney(info.costoFalta)}</span>`
      : `<span class="familia-status ok">✓ Completa (${info ? info.total : items.length}/${info ? info.total : items.length})</span>`;

    return `
      <div class="familia-block">
        <div class="familia-block-header">
          <span class="familia-block-name">${fam}</span>
          ${estadoFam}
        </div>
        <table class="partidas">
          <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Estatus ERP</th><th>OP</th><th>Fecha venc. OP</th><th>Estatus de producción</th></tr></thead>
          <tbody>
            ${items.map(it => {
              const esTerminadaTarde = (it.estatus || '').startsWith('Terminada tarde');
              const rowStyle = it.garantia ? 'background:#FAF5FF;' : (!it.listo ? 'background:#FFF6F5;' : (esTerminadaTarde ? 'background:#FFF8E6;' : ''));
              const garantiaHtml = it.garantia ? '<span class="badge garantia" style="margin-right:6px;">🛡 Garantía</span>' : '';
              return `<tr style="${rowStyle}"><td class="sku">${garantiaHtml}${it.sku || ''}</td><td>${it.descripcion || ''}</td><td>${it.cantidad ?? ''}</td><td>${it.estatus_erp || ''}</td><td class="sku">${it.no_op || '—'}</td><td>${it.fecha_op || '—'}</td><td>${it.estatus || ''}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');
}

function render() {
  const search = pvRoot.getElementById('searchInput').value.trim().toLowerCase();
  const estadoFiltro = pvRoot.getElementById('estadoSelect').value;
  const sortMode = pvRoot.getElementById('sortSelect').value;
  const groupMode = pvRoot.getElementById('groupSelect').value;

  let pedidos = buildPedidos(allRows, currentTipo).map(p => ({ ...p, tipo: currentTipo, nivel: nivelDe({ ...p, tipo: currentTipo }) }));

  const pedidosManuf = buildPedidos(allRows, 'Manufactura');
  pvRoot.getElementById('kpiTotal').textContent = pedidosManuf.length;
  pvRoot.getElementById('kpiRiesgo').textContent = pedidosManuf.filter(p => p.en_riesgo).length;
  pvRoot.getElementById('kpiAtrasado').textContent = pedidosManuf.filter(p => p.peor_atraso > 0).length;
  pvRoot.getElementById('kpiProximos').textContent = pedidosManuf.filter(p => p.dias_para_entrega !== null && p.dias_para_entrega >= 0 && p.dias_para_entrega <= 7 && !p.completo).length;
  pvRoot.getElementById('kpiSinFecha').textContent = pedidosManuf.filter(p => !p.fecha_requerida).length;

  const costoTotalManuf = pedidosManuf.reduce((acc, p) => acc + (p.costo_total || 0), 0);
  const montoTotalManuf = pedidosManuf.reduce((acc, p) => acc + (p.monto_total || 0), 0);
  const pedidosCompra = buildPedidos(allRows, 'Compra');
  const costoTotalCompra = pedidosCompra.reduce((acc, p) => acc + (p.costo_total || 0), 0);
  const montoTotalCompra = pedidosCompra.reduce((acc, p) => acc + (p.monto_total || 0), 0);
  pvRoot.getElementById('heroCost').style.display = 'block';
  pvRoot.getElementById('heroCostValue').textContent = fmtMoney(costoTotalManuf + costoTotalCompra);
  pvRoot.getElementById('heroMonto').style.display = 'block';
  pvRoot.getElementById('heroMontoValue').textContent = fmtMoney(montoTotalManuf + montoTotalCompra);

  if (search) {
    pedidos = pedidos.filter(p =>
      (p.cliente || '').toLowerCase().includes(search) ||
      (p.no_documento || '').toLowerCase().includes(search)
    );
  }
  if (currentTipo === 'Manufactura' && estadoFiltro === 'sin_fecha') {
    pedidos = pedidos.filter(p => !p.fecha_requerida);
  } else if (currentTipo === 'Manufactura' && estadoFiltro !== 'todos') {
    pedidos = pedidos.filter(p => p.nivel === (estadoFiltro === 'ok' ? 'ok' : estadoFiltro));
  }
  const erpFiltro = pvRoot.getElementById('erpSelect').value;
  if (erpFiltro === 'mixto') {
    pedidos = pedidos.filter(p => (p.estatus_erp || []).length > 1);
  } else if (erpFiltro === 'No programado' || erpFiltro === 'Planificada') {
    // Estatus de riesgo: si CUALQUIER partida lo tiene, vale la pena verlo —
    // no hace falta que el pedido entero esté sin programar.
    pedidos = pedidos.filter(p => (p.estatus_erp || []).includes(erpFiltro));
  } else if (erpFiltro !== 'todos') {
    // Estatus de completitud ("Listo para embarcar" / "Programado completo"):
    // solo cuenta si TODAS las partidas del pedido comparten ese estatus.
    pedidos = pedidos.filter(p => (p.estatus_erp || []).length === 1 && p.estatus_erp[0] === erpFiltro);
  }

  // Poblar el selector de familias dinámicamente (solo una vez con datos reales)
  const familiaSelect = pvRoot.getElementById('familiaSelect');
  if (familiaSelect.dataset.poblado !== '1' && allRows.length) {
    const familiasUnicas = new Set();
    buildPedidos(allRows, 'Manufactura').forEach(p => p.familias.forEach(f => familiasUnicas.add(f.nombre)));
    Array.from(familiasUnicas).sort().forEach(fam => {
      const opt = document.createElement('option');
      opt.value = fam; opt.textContent = fam;
      familiaSelect.appendChild(opt);
    });
    familiaSelect.dataset.poblado = '1';
  }
  const familiaFiltro = familiaSelect.value;
  if (familiaFiltro !== 'todas') {
    pedidos = pedidos.filter(p => (p.familias || []).some(f => f.nombre === familiaFiltro));
  }

  const tipoVentaFiltro = currentTipoVenta;
  if (tipoVentaFiltro !== 'todas') {
    pedidos = pedidos.filter(p => (p.tipo_venta || 'Otros') === tipoVentaFiltro);
  }

  const garantiaFiltro = pvRoot.getElementById('garantiaSelect').value;
  if (garantiaFiltro === 'solo') {
    pedidos = pedidos.filter(p => p.tiene_garantia);
  } else if (garantiaFiltro === 'sin') {
    pedidos = pedidos.filter(p => !p.tiene_garantia);
  }

  const scopeEl = pvRoot.getElementById('scopeSummary');
  if (currentVista !== 'todo') {
    const hoy = new Date();
    const [ini, fin] = currentVista === 'semana' ? rangoSemanaActual(hoy) : rangoMesActual(hoy);
    pedidos = pedidos.filter(p => {
      if (!p.fecha_requerida) return false;
      const f = new Date(p.fecha_requerida);
      return f >= ini && f <= fin;
    });
    const costoScope = pedidos.reduce((acc, p) => acc + (p.costo_total || 0), 0);
    const etiquetaVista = currentVista === 'semana' ? 'esta semana' : 'este mes';
    scopeEl.style.display = 'flex';
    scopeEl.innerHTML = `<span class="n">${pedidos.length} pedido(s)</span><span class="t">requeridos ${etiquetaVista} · costo total: ${fmtMoney(costoScope)}</span>`;
  } else {
    scopeEl.style.display = 'none';
  }

  const campoOrden = sortMode.startsWith('fecha_pedido') ? 'fecha_pedido' : 'fecha_requerida';
  pedidos.sort((a, b) => {
    if (sortMode === 'cliente') return (a.cliente || '').localeCompare(b.cliente || '');
    const da = a[campoOrden] ? new Date(a[campoOrden]).getTime() : Infinity;
    const db = b[campoOrden] ? new Date(b[campoOrden]).getTime() : Infinity;
    const desc = sortMode.endsWith('desc');
    return desc ? db - da : da - db;
  });

  // --- Ocultar completos (por default) y separar "antiguos sin resolver" ---
  // Un pedido "completo" ya no requiere acción (todo listo para embarcar): verlo
  // mezclado con lo urgente solo estorba. Y un pedido viejo (más de DIAS_ANTIGUO
  // desde que se capturó) que sigue incompleto probablemente ya no se resuelve
  // con la urgencia del día a día — se separa para no tapar lo reciente, pero
  // sigue siendo visible y consultable, nunca se elimina de la vista.
  const DIAS_ANTIGUO = 90;
  const ocultarCompletosChk = pvRoot.getElementById('ocultarCompletosChk');
  const ocultarCompletos = currentTipo === 'Manufactura' && ocultarCompletosChk && ocultarCompletosChk.checked;
  if (ocultarCompletos) {
    pedidos = pedidos.filter(p => !p.completo);
  }

  let antiguos = [];
  if (currentTipo === 'Manufactura') {
    const hoyAntiguo = new Date();
    antiguos = pedidos.filter(p => !p.completo && p.fecha_pedido &&
      diasEntreFechas(new Date(p.fecha_pedido), hoyAntiguo) > DIAS_ANTIGUO);
    const idsAntiguos = new Set(antiguos);
    pedidos = pedidos.filter(p => !idsAntiguos.has(p));
  }

  pvRoot.getElementById('resultCount').textContent = pedidos.length + ' pedido(s)' +
    (antiguos.length ? ` · ${antiguos.length} antiguo(s) sin resolver (aparte, abajo)` : '');

  const list = pvRoot.getElementById('pedidoList');
  list.innerHTML = '';

  const agrupar = sortMode !== 'cliente' && groupMode !== 'none';
  const labelFn = groupMode === 'week' ? semanaLabel : mesLabel;

  // 07-sep-2026: Adrian — "quiero un rediseño de la página, esta ya toda
  // mezclada, estandariza... usa la misma logica y apariencia de esta
  // ventana de pedidos fecha de entrega". Misma tarjeta feh-* que ya
  // aprobó ahí, con lo propio de Vista de Pedidos (fecha de pedido, límite
  // de producción, días en captura, el motivo real capturado a mano) sin
  // perder nada de esa lógica — solo cambia cómo se ve.
  function crearTarjetaPedido(p, campoOrdenLocal) {
    const card = document.createElement('div');
    card.className = 'feh-card';

    // 08-sep-2026 (Adrian: "no veo la diferencia de un pedido critico a uno
    // en tiempo, recuerda que antes te dije cuando era critico un pedido") —
    // esta tarjeta mostraba CUALQUIER OP atrasada como "ATRASADO" en rojo, el
    // mismo color/urgencia que un pedido genuinamente CRÍTICO (ver
    // evaluarCriticidadPedido más abajo, ya usado en Pedidos por Fecha de
    // Entrega): una OP atrasada 1 día con 3 semanas de margen antes de la
    // fecha del cliente NO es lo mismo que una que ya se comió todo el
    // margen. Ahora solo se ve rojo/CRÍTICO cuando de verdad lo es; si está
    // atrasada pero con margen, se ve en ámbar como "EN RIESGO" (no rojo).
    const hoyMedianocheCard = (() => { const h = new Date(); h.setHours(0, 0, 0, 0); return h; })();
    const critCard = p.nivel === 'atrasado' ? evaluarCriticidadPedido(p, hoyMedianocheCard) : null;

    const estadoPill = p.tipo === 'Compra'
      ? `<span class="feh-estado compra"><span class="dot"></span>COMPRA</span>`
      : p.nivel === 'atrasado'
        ? (critCard && critCard.critico
            ? `<span class="feh-estado critico" title="Alguna OP ya venció o vence hoy y solo quedan ${critCard.margen}d hábiles antes de la fecha que espera el cliente — sin margen para armar/embarcar"><span class="dot"></span>🔴 CRÍTICO (${p.peor_atraso}d de atraso en OP)</span>`
            : `<span class="feh-estado riesgo" title="Hay una OP atrasada, pero todavía queda margen antes de que esto comprometa la fecha del cliente"><span class="dot"></span>ATRASADO (${p.peor_atraso}d) · con margen</span>`)
        : p.nivel === 'riesgo'
          ? `<span class="feh-estado riesgo"><span class="dot"></span>EN RIESGO</span>`
          : `<span class="feh-estado ok"><span class="dot"></span>AL CORRIENTE</span>`;

    let limiteChip = '';
    if (!p.completo && p.fecha_limite_produccion) {
      const dl = p.dias_para_limite_produccion;
      const limiteTxt = dl < 0 ? `venció hace ${-dl}d` : `${dl}d restantes`;
      const claseLimite = dl < 0 ? 'limite-vencido' : (dl <= 7 ? 'limite-proximo' : 'limite-ok');
      limiteChip = `<span class="limite-chip ${claseLimite}">Límite de producción: ${fmtFecha(p.fecha_limite_produccion)} (${limiteTxt})</span>`;
    }
    let capturaChip = '';
    if (!p.completo && p.dias_en_captura !== null && p.dias_en_captura !== undefined) {
      const dc = p.dias_en_captura;
      const claseCaptura = dc > 9 ? 'limite-vencido' : (dc >= 7 ? 'limite-proximo' : 'limite-ok');
      capturaChip = `<span class="limite-chip ${claseCaptura}">Días en captura: ${dc}d (máx. 9d)</span>`;
    }

    const partidas = p.partidas || [];
    const partidasPendientes = partidas.filter(x => !x.listo);
    const totalPartidas = partidas.length;
    const listasCount = totalPartidas - partidasPendientes.length;
    const pctListo = totalPartidas ? Math.round((listasCount / totalPartidas) * 100) : 0;
    const margenTxt = (p.monto_total > 0) ? `${(((p.monto_total - p.costo_total) / p.monto_total) * 100).toFixed(1)}%` : '—';
    const alertaTxt = p.completo
      ? '✓ Completo — listo para facturar/embarcar'
      : partidasPendientes.length === 0
        ? '✓ Nada pendiente por producir'
        : (p.piezas_pendientes > 0)
          ? `🔧 Faltan ${p.piezas_pendientes.toLocaleString('es-MX')} pza. por producir`
          : `🔧 ${partidasPendientes.length} SKU${partidasPendientes.length === 1 ? '' : 's'} pendiente${partidasPendientes.length === 1 ? '' : 's'} por producir`;

    // Motivo REAL capturado a mano (falla de máquina, falta de material,
    // problema de producción...) — se conserva intacta, es una captura ya
    // establecida con su propio guardado en localStorage. Solo tiene
    // sentido para lo que de verdad está atrasado/en riesgo.
    const mostrarComentario = p.tipo !== 'Compra' && (p.nivel === 'atrasado' || p.nivel === 'riesgo');
    const comentarioGuardado = (p.no_documento && comentariosRiesgo[p.no_documento]) ? comentariosRiesgo[p.no_documento].texto : '';
    const comentarioHtml = mostrarComentario ? `
        <div class="comentario-riesgo no-print" style="margin:0 0 14px;">
          <label style="display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;">📝 Motivo real (falla de máquina, falta de material, problema de producción...)</label>
          <textarea class="comentario-riesgo-input" rows="2" placeholder="Sin motivo capturado — se calcula solo por fechas/cantidades" style="width:100%; font-family:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--border,#D6DCE2); border-radius:6px; resize:vertical; box-sizing:border-box;">${escapeHtml(comentarioGuardado)}</textarea>
          <span class="comentario-riesgo-guardado" style="font-size:10.5px; color:var(--green,#3F8557); display:${comentarioGuardado ? 'inline' : 'none'};">✓ guardado</span>
        </div>` : '';

    card.innerHTML = `
      <div class="feh-head">
        ${renderSelectorLoteHtml(p)}
        <div class="feh-id">
          <div class="feh-cliente">${escapeHtml(p.cliente) || 'Sin cliente'}${p.tiene_garantia ? ' <span class="badge garantia" title="Incluye garantía">🛡</span>' : ''}</div>
          <div class="feh-meta"><span class="feh-no">${escapeHtml(p.no_documento) || '—'}</span><span class="familia-chip">${escapeHtml(p.tipo_venta) || (p.tipo === 'Compra' ? 'Compra' : 'Otros')}</span></div>
        </div>
        <div class="feh-divider"></div>
        <div class="feh-fecha-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <div><div class="l">Fecha<br>comprometida</div><div class="v">${fmtFecha(p.fecha_requerida)}</div></div>
        </div>
        ${estadoPill}
        <button type="button" class="feh-btn-alerta no-print" title="Alertar por correo sobre este pedido" onclick="this.closest('.feh-card').classList.toggle('show-alerta')">🚨</button>
        <button type="button" class="btn-exportar-pedido no-print" title="Exportar este pedido">🖨️</button>
      </div>
      ${renderAlertaPanelGenerico(p)}
      <div class="feh-kpis">
        <div class="feh-kpi c-blue">
          <div class="feh-kpi-top">📅 Fecha pedido</div>
          <div class="feh-kpi-value" style="font-size:15px;">${fmtFecha(p.fecha_pedido)}</div>
        </div>
        <div class="feh-kpi c-amber">
          <div class="feh-kpi-top">📦 Producción</div>
          <div class="feh-kpi-value">${listasCount} / ${totalPartidas}<span style="font-size:12px; font-weight:600;"> SKUs</span></div>
          <div class="feh-progress"><b style="width:${pctListo}%; background:#C67D1E;"></b></div>
        </div>
        ${kpiProyeccionHtml(p)}
      </div>
      <div class="feh-kpi-fin">
        <div class="feh-kpi-fin-item"><span class="l">💰 Costo</span><span class="v">${fmtMoney(p.costo_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">📈 Venta</span><span class="v">${fmtMoney(p.monto_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">🥧 Margen estimado</span><span class="v">${margenTxt}</span></div>
      </div>
      ${limiteChip || capturaChip ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin:0 22px 14px;">${limiteChip}${capturaChip}</div>` : ''}
      ${p.motivos ? `<div class="feh-nota riesgo">⚠ ${escapeHtml(p.motivos)}</div>` : ''}
      <button type="button" class="feh-alert ${(p.completo || partidasPendientes.length === 0) ? 'ok' : 'pend'}" onclick="this.closest('.feh-card').classList.toggle('show-pend')">
        <span class="txt">${alertaTxt}</span><span class="chev">›</span>
      </button>
      <div class="feh-detail-pend">
        ${comentarioHtml}
        ${renderDetallePendGenerico(p, new Date())}
      </div>
      <button type="button" class="feh-btn-full" onclick="this.closest('.feh-card').classList.toggle('show-full')">
        Ver pedido completo (${totalPartidas} SKU${totalPartidas === 1 ? '' : 's'}) <span class="chev">›</span>
      </button>
      <div class="feh-detail-full">${renderDetalleFullGenerico(p, new Date())}</div>
    `;

    card.querySelector('.btn-exportar-pedido').addEventListener('click', (ev) => {
      ev.stopPropagation();
      exportarPedidoIndividual(p);
    });
    if (mostrarComentario && p.no_documento) {
      const textarea = card.querySelector('.comentario-riesgo-input');
      const marcaGuardado = card.querySelector('.comentario-riesgo-guardado');
      textarea.addEventListener('click', ev => ev.stopPropagation());
      textarea.addEventListener('blur', () => {
        const texto = textarea.value.trim();
        if (texto) {
          comentariosRiesgo[p.no_documento] = { texto, fecha: new Date().toISOString() };
          if (marcaGuardado) marcaGuardado.style.display = 'inline';
        } else {
          delete comentariosRiesgo[p.no_documento];
          if (marcaGuardado) marcaGuardado.style.display = 'none';
        }
        guardarComentariosRiesgo();
      });
    }
    return card;
  }

  let grupoAnterior = null;
  pedidos.forEach((p) => {
    if (agrupar) {
      const grupoActual = labelFn(p[campoOrden]);
      if (grupoActual !== grupoAnterior) {
        const sep = document.createElement('div');
        sep.className = 'mes-separator';
        sep.textContent = grupoActual;
        list.appendChild(sep);
        grupoAnterior = grupoActual;
      }
    }
    list.appendChild(crearTarjetaPedido(p, campoOrden));
  });

  // --- Sección aparte: antiguos sin resolver ---
  if (antiguos.length) {
    antiguos.sort((a, b) => {
      const da = a[campoOrden] ? new Date(a[campoOrden]).getTime() : Infinity;
      const db = b[campoOrden] ? new Date(b[campoOrden]).getTime() : Infinity;
      return da - db; // más antiguo primero
    });
    const sepTitulo = document.createElement('div');
    sepTitulo.className = 'mes-separator antiguos-separator';
    sepTitulo.textContent = `⚠ Antiguos sin resolver — más de ${DIAS_ANTIGUO} días desde que entró el pedido (${antiguos.length})`;
    list.appendChild(sepTitulo);
    antiguos.forEach(p => list.appendChild(crearTarjetaPedido(p, campoOrden)));
  }
}

// ============================================================
// AVANCE DÍA A DÍA (02-sep-2026, a petición de Adrian: "quiero saber si
// vamos avanzando, cada día entran pedidos nuevos pero quiero saber qué se
// terminó de ayer"). No se puede comparar "hoy vs ayer" dentro del
// navegador solo — no tiene acceso al archivo de ayer. El mecanismo real:
//   1. Cada corrida exporta un snapshot con exportarSnapshotAvance() —
//      todas las partidas pendientes de hoy (pedido, SKU, piezas, costo,
//      atraso). La automatización de Playwright lo guarda como
//      reportes\AAAA-MM-DD\snapshot_avance.json.
//   2. La automatización también LEE el snapshot_avance.json más reciente
//      de un día anterior, calcula el avance en Python, y lo inyecta de
//      vuelta al Resumen Directivo con inyectarAvanceDesdeAyer(diff) ANTES
//      de generar el PDF — el cálculo del diff vive en Python porque ahí
//      sí hay acceso de archivo real; el navegador solo arma y muestra.
//   Ver skills/rutina_diaria_andon.md Paso 2a para la receta exacta.
// ============================================================
window.exportarSnapshotAvance = function () {
  const pedidos = buildPedidos(allRows, 'Manufactura');
  const items = [];
  pedidos.forEach(p => {
    (p.partidas || []).forEach(x => {
      if (x.listo) return;
      items.push({
        no_documento: p.no_documento,
        sku: x.sku,
        cliente: p.cliente,
        familia: x.familia,
        piezas_pendientes: x.piezas_pendientes || 0,
        costo: x.costo || 0,
        no_op: x.no_op || null,
        dias_atraso: x.dias_atraso || 0,
      });
    });
  });
  const hoy = new Date();
  const fecha = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
  return { fecha, items };
};

// Mismo cálculo que hace Python en la automatización (ver
// skills/rutina_diaria_andon.md Paso 2a) — espejo en JS para que Adrian
// pueda ver el avance también cuando abre la app él mismo a mano, no solo
// en el PDF que genera la tarea automática. Sin esto, "Avance desde ayer"
// SOLO existía dentro del flujo de Playwright — hueco real que Adrian
// encontró el 02-sep-2026 al abrir la app directo en su Chrome y no ver
// la sección.
window.calcularDiffAvance = function (prev, hoy) {
  const prevItems = new Map(prev.items.map(i => [i.no_documento + '||' + i.sku, i]));
  const hoyItems = new Map(hoy.items.map(i => [i.no_documento + '||' + i.sku, i]));
  let piezasCompletadas = 0;
  prevItems.forEach((pi, key) => {
    const ti = hoyItems.get(key);
    if (!ti) piezasCompletadas += pi.piezas_pendientes;
    else if (ti.piezas_pendientes < pi.piezas_pendientes) piezasCompletadas += (pi.piezas_pendientes - ti.piezas_pendientes);
  });
  const docsPrev = new Set(prev.items.map(i => i.no_documento));
  const docsHoy = new Set(hoy.items.map(i => i.no_documento));
  const pedidosCompletados = Array.from(docsPrev).filter(d => !docsHoy.has(d)).length;
  const pedidosNuevos = Array.from(docsHoy).filter(d => !docsPrev.has(d)).length;
  const costoAyerAtrasado = prev.items.filter(i => i.dias_atraso > 0).reduce((s, i) => s + (i.costo || 0), 0);
  const costoHoyAtrasado = hoy.items.filter(i => i.dias_atraso > 0).reduce((s, i) => s + (i.costo || 0), 0);
  return {
    fechaAnterior: prev.fecha, piezasCompletadas, pedidosCompletados, pedidosNuevos,
    costoAyerAtrasado, costoHoyAtrasado,
  };
};

// `diff` viene calculado desde Python (ver arriba): { fechaAnterior,
// piezasCompletadas, pedidosCompletados, pedidosNuevos, costoAyerAtrasado,
// costoHoyAtrasado }. Se inserta como una sección más del Resumen
// Directivo, justo después del TL;DR, para que se vea sin tener que leer
// el correo — solo aplica si hay un snapshot anterior con el que comparar
// (el primer día que corra esto no hay nada contra qué comparar todavía).
window.inyectarAvanceDesdeAyer = function (diff) {
  if (!diff) return;
  const wrap = pvRoot.querySelector('.resumen-wrap');
  const tldr = wrap && wrap.querySelector('.resumen-tldr');
  if (!wrap || !tldr) return;
  const deltaCosto = diff.costoHoyAtrasado - diff.costoAyerAtrasado;
  const deltaTxt = deltaCosto === 0
    ? 'igual que ayer'
    : (deltaCosto < 0
      ? `bajó ${fmtMoney(-deltaCosto)} vs. ayer`
      : `subió ${fmtMoney(deltaCosto)} vs. ayer`);
  const deltaColor = deltaCosto > 0 ? '#C1443C' : (deltaCosto < 0 ? '#3F8557' : '#6B7684');
  const div = document.createElement('div');
  div.className = 'resumen-section resumen-section-avance';
  div.innerHTML = `
    <h3>📈 Avance desde ${fmtFecha(new Date(diff.fechaAnterior + 'T00:00:00'))}</h3>
    <div class="resumen-impacto">
      <div><span class="n" style="color:#3F8557">${diff.piezasCompletadas.toLocaleString('es-MX')}</span><span class="t">Piezas terminadas desde ayer</span></div>
      <div><span class="n" style="color:#3F8557">${diff.pedidosCompletados}</span><span class="t">Pedido(s) resuelto(s) por completo</span></div>
      <div><span class="n">${diff.pedidosNuevos}</span><span class="t">Pedido(s) nuevo(s) que entraron</span></div>
      <div><span class="n" style="color:${deltaColor}">${deltaTxt}</span><span class="t">Costo atrasado: ${fmtMoney(diff.costoAyerAtrasado)} → ${fmtMoney(diff.costoHoyAtrasado)}</span></div>
    </div>`;
  tldr.after(div);
};

// ============================================================
// RESUMEN DIRECTIVO
// Panorama completo de Manufactura, siempre ignorando los filtros
// de la vista de pedidos (búsqueda, semana/mes, estado, etc.) —
// pensado para reportar "el estado real de la operación" sin
// depender de cómo haya quedado la pantalla.
// ============================================================

/* Calcula el fin de rango a partir de un inicio ya en 00:00. Pedido de
   Adrian (07-sep-2026): "solo quiero ver desde: y hasta:, elimina el
   desplegable que dice rango y semanas" — ya no hay modos (día/semana/rango),
   solo Desde/Hasta a calendario. Sin "Hasta" elegida todavía, el rango es
   nada más ese día (mismo comportamiento que antes tenía el modo "día"). */
function finDeRangoFecha(inicio, hastaStr) {
  if (hastaStr) {
    const [y, m, dd] = hastaStr.split('-').map(Number);
    const fin = new Date(y, m - 1, dd);
    fin.setHours(0, 0, 0, 0);
    return fin;
  }
  // 08-sep-2026: Adrian — "no me aparece nada actualmente". Causa real: sin
  // "Hasta" elegido, el rango colapsaba a UN SOLO DÍA (hoy) — si ningún
  // pedido vence justo hoy, la lista sale vacía apenas se abre la pestaña,
  // sin que nada esté roto. "Hasta" vacío ahora significa "sin tope" (se ven
  // todos los pedidos desde 'Desde' en adelante), como en cualquier filtro
  // de rango — Adrian sigue pudiendo acotar con "Hasta" cuando quiera.
  return new Date(9999, 11, 31);
}

/* Pedidos (ya con fecha_requerida/completo calculados por buildPedidos) cuya
   fecha requerida cae en el rango Desde/Hasta elegido — no completos
   únicamente, igual criterio que "próximos a vencer" pero con rango elegible
   en vez de fijo a 7 días. */
function pedidosPorFechaEntrega(pedidosFull, desdeStr, hastaStr) {
  let inicio;
  if (desdeStr) {
    const [y, m, dd] = desdeStr.split('-').map(Number);
    inicio = new Date(y, m - 1, dd);
  } else {
    inicio = new Date();
  }
  inicio.setHours(0, 0, 0, 0);
  const fin = finDeRangoFecha(inicio, hastaStr);
  return pedidosFull.filter(p => {
    if (!p.fecha_requerida || p.completo) return false;
    const f = new Date(p.fecha_requerida);
    f.setHours(0, 0, 0, 0);
    return f >= inicio && f <= fin;
  }).sort((a, b) => new Date(a.fecha_requerida) - new Date(b.fecha_requerida));
}

// Agregado 07-sep-2026 (Adrian, sección "Pedidos por Fecha de Entrega"): un
// pedido se vuelve CRÍTICO cuando alguna de sus OP pendientes YA VENCIÓ o
// VENCE HOY, Y el margen entre la fecha de vencimiento de ESA OP y la fecha
// que espera el cliente es MENOR A 5 días hábiles (el mínimo para armar y
// embarcar — "se considera para planear embarque"). No es lo mismo que "la
// OP está atrasada": el ejemplo real de Adrian — "hoy 7/09 vence una OP y la
// fecha del pedido es el 25 de septiembre, el pedido NO está crítico, solo
// la OP; si la fecha del pedido es el 10, el pedido SÍ se empieza a volver
// crítico" — lo que importa es el margen que queda para el CLIENTE, no el
// atraso de la OP en sí. Ojo: NO se usa `x.dias_atraso` (queda en 0 para
// partidas "Planificada"/"Terminada tarde", sería engañoso) — se calcula
// directo de `x.fecha_op` contra HOY y contra `p.fecha_requerida`.
const MARGEN_CRITICO_DIAS = 5;
function evaluarCriticidadPedido(p, hoy) {
  if (!p.fecha_requerida) return { critico: false, opCritica: null, margen: null, diasFaltanOP: null };
  let peor = null; // la OP con el margen más chico (la que más aprieta)
  (p.partidas || []).forEach(x => {
    if (x.listo || !x.fecha_op) return;
    const t = primeraFechaOP(x.fecha_op);
    if (t === null) return;
    const fechaVencOP = new Date(t);
    const diasFaltanOP = diasEntreFechas(hoy, fechaVencOP);
    if (diasFaltanOP > 0) return; // todavía no vence — esta OP no dispara la regla hoy
    const margen = diasEntreFechas(fechaVencOP, p.fecha_requerida);
    if (margen === null) return;
    if (!peor || margen < peor.margen) peor = { partida: x, margen, diasFaltanOP };
  });
  if (!peor) return { critico: false, opCritica: null, margen: null, diasFaltanOP: null };
  return { critico: peor.margen < MARGEN_CRITICO_DIAS, opCritica: peor.partida, margen: peor.margen, diasFaltanOP: peor.diasFaltanOP };
}

// Texto "días por vencer" ESPECÍFICO de una OP (pedido de Adrian: "dentro de
// cada OP puedes dejarle días por vencer OP, sé más específico") — no
// confundir con "días para vencer" del pedido (que sigue siendo contra la
// fecha del cliente, `p.dias_para_entrega`). Este es sobre la fecha de esa
// OP en particular.
function textoDiasVencerOP(x, hoy) {
  if (x.listo || !x.fecha_op) return null;
  const t = primeraFechaOP(x.fecha_op);
  if (t === null) return null;
  const dias = diasEntreFechas(hoy, new Date(t));
  if (dias > 0) return { texto: `vence en ${dias}d`, clase: dias <= 2 ? 'ambar' : 'ok' };
  if (dias === 0) return { texto: 'vence hoy', clase: 'ambar' };
  return { texto: `vencida hace ${-dias}d`, clase: 'rojo' };
}

// "Fecha proyectada de salida" (08-sep-2026, Adrian: "necesito darle una
// fecha aproximada de cual es la fecha que proyectamos salga su pedido") —
// el pedido no puede salir hasta que TODAS sus partidas pendientes estén
// listas, así que la proyección es la más tardía de las fechas de OP de lo
// que todavía falta (el cuello de botella real). Si ninguna partida
// pendiente trae fecha de OP capturada (sin programar), no hay con qué
// proyectar — se regresa null en vez de inventar una fecha.
function fechaProyectadaSalida(p) {
  let maxT = null;
  (p.partidas || []).forEach(x => {
    if (x.listo || !x.fecha_op) return;
    const t = primeraFechaOP(x.fecha_op);
    if (t === null) return;
    if (maxT === null || t > maxT) maxT = t;
  });
  return maxT === null ? null : new Date(maxT);
}

// Tile de KPI "Proyección de salida" reutilizado en las 3 tarjetas — rojo
// si la proyección cae DESPUÉS de la fecha que espera el cliente (ya se ve
// venir un atraso), verde si cae a tiempo o antes, gris si aún no hay con
// qué proyectar.
function kpiProyeccionHtml(p) {
  const proy = fechaProyectadaSalida(p);
  if (!proy) return `
    <div class="feh-kpi c-blue">
      <div class="feh-kpi-top">🚚 Proyección salida</div>
      <div class="feh-kpi-value" style="font-size:14px; color:var(--muted);">Sin proyección aún</div>
    </div>`;
  const tarde = p.fecha_requerida && proy > new Date(p.fecha_requerida);
  return `
    <div class="feh-kpi ${tarde ? 'c-amber' : 'c-green'}">
      <div class="feh-kpi-top">🚚 Proyección salida</div>
      <div class="feh-kpi-value" style="font-size:15px;">${fmtFecha(proy)}</div>
      ${tarde ? '<div style="font-size:10.5px; color:var(--amber); font-weight:700; margin-top:2px;">⚠ después de lo comprometido</div>' : ''}
    </div>`;
}

function buildResumenDirectivo() {
  const hoy = new Date();
  const DIAS_ANTIGUO = 90;
  let pedidos = buildPedidos(allRows, 'Manufactura');

  // Familias disponibles para el filtro del Resumen Directivo — se calculan
  // ANTES de filtrar por familia, para que el selector siempre muestre todas
  // las opciones posibles, no solo la que esté activa en este momento.
  const familiasDisponibles = Array.from(new Set(pedidos.map(p => familiaDominante(p)))).sort();

  if (currentResumenFamilia !== 'todas') {
    pedidos = pedidos.filter(p => familiaDominante(p) === currentResumenFamilia);
    // Esta vista es para imprimir y repartir en piso: el foco es lo que hay
    // que producir AHORA para esta familia. Un pedido viejo (+90 días) necesita
    // una decisión distinta (reprogramar/cancelar), no una alerta del día a
    // día — se saca por completo, no solo de la sección "Antiguos" (si no,
    // seguiría colándose en Atrasados/Próximos y ensuciando el impreso).
    pedidos = pedidos.filter(p => !(p.fecha_pedido && diasEntreFechas(new Date(p.fecha_pedido), hoy) > DIAS_ANTIGUO));
  }

  // Primero los que SÍ afectan la fecha del cliente (ya se pasó el límite de
  // producción, no hay margen), luego los que aún no la afectan (todavía hay
  // colchón). Sin dato para calcularlo, se trata como "sí afecta" — más vale
  // pecar de cauteloso que perder de vista un atraso real. Dentro de cada
  // grupo, el más atrasado primero.
  const afectaFechaCliente = p => (p.dias_para_limite_produccion === null || p.dias_para_limite_produccion === undefined)
    ? true
    : p.dias_para_limite_produccion < 0;
  const atrasados = pedidos.filter(p => p.peor_atraso > 0)
    .sort((a, b) => {
      const afA = afectaFechaCliente(a) ? 0 : 1;
      const afB = afectaFechaCliente(b) ? 0 : 1;
      if (afA !== afB) return afA - afB;
      return b.peor_atraso - a.peor_atraso;
    });
  const enRiesgoSolo = pedidos.filter(p => p.en_riesgo && !(p.peor_atraso > 0));
  const proximos = pedidos.filter(p => p.dias_para_entrega !== null && p.dias_para_entrega >= 0 && p.dias_para_entrega <= 7 && !p.completo)
    .sort((a, b) => a.dias_para_entrega - b.dias_para_entrega);
  const sinFecha = pedidos.filter(p => !p.fecha_requerida);
  const antiguos = pedidos.filter(p => !p.completo && p.fecha_pedido &&
    diasEntreFechas(new Date(p.fecha_pedido), hoy) > DIAS_ANTIGUO)
    .sort((a, b) => new Date(a.fecha_pedido) - new Date(b.fecha_pedido));

  // Pedidos con partida(s) de garantía (P-SUB GARANTIA) — se listan TODOS,
  // sin importar su estatus: uno "al corriente" no cae en ninguna otra
  // sección del reporte (esas solo muestran problemas), así que sin esto
  // simplemente desaparecía del Resumen Directivo. Atrasados primero.
  const garantias = pedidos.filter(p => p.tiene_garantia)
    .sort((a, b) => (b.peor_atraso || 0) - (a.peor_atraso || 0));

  // Pedidos con al menos una partida SIN PROGRAMAR: ni tiene OP en el Excel
  // de producción, ni el ERP la tiene agendada — nadie ha movido un dedo
  // todavía. Esto NUNCA pone un pedido en rojo por sí solo (ver nivelDe), así
  // que sin su propia sección se pierde de vista fácilmente. Más nuevo
  // (menos días en captura) primero, más viejo (más días esperando) al
  // final — mismo orden en la sección del Resumen Directivo y en el reporte
  // aparte, porque ambos usan esta misma lista.
  const sinProgramar = pedidos.filter(p => (p.partidas || []).some(x => (x.estatus || '').startsWith('SIN PROGRAMAR')))
    .sort((a, b) => (a.dias_en_captura ?? Infinity) - (b.dias_en_captura ?? Infinity));

  const costoTotal = pedidos.reduce((a, p) => a + (p.costo_total || 0), 0);
  const montoTotal = pedidos.reduce((a, p) => a + (p.monto_total || 0), 0);
  const costoAtrasado = atrasados.reduce((a, p) => a + (p.costo_total || 0), 0);
  const montoAtrasado = atrasados.reduce((a, p) => a + (p.monto_total || 0), 0);
  // Piezas reales pendientes de producir (CantPendiente de las OPs), no solo
  // dinero — es la magnitud que de verdad importa en piso de producción.
  const piezasPendientesTotal = pedidos.reduce((a, p) => a + (p.piezas_pendientes || 0), 0);
  const piezasPendientesAtrasadas = atrasados.reduce((a, p) => a + (p.piezas_pendientes || 0), 0);

  // Detección automática de concentración por cliente entre los atrasados —
  // si un solo cliente explica una parte grande del problema, vale la pena
  // señalarlo en vez de dejarlo perdido en una lista de 15+ renglones.
  let alertaCliente = null;
  if (atrasados.length >= 3) {
    const porCliente = new Map();
    atrasados.forEach(p => {
      const c = p.cliente || 'Sin cliente';
      if (!porCliente.has(c)) porCliente.set(c, { count: 0, costo: 0 });
      const e = porCliente.get(c);
      e.count += 1; e.costo += (p.costo_total || 0);
    });
    let top = null;
    porCliente.forEach((v, k) => { if (!top || v.count > top.count) top = { cliente: k, ...v }; });
    if (top && top.count / atrasados.length >= 0.25) {
      alertaCliente = {
        cliente: top.cliente, count: top.count, costo: top.costo,
        pctCount: top.count / atrasados.length,
        pctCosto: costoAtrasado > 0 ? top.costo / costoAtrasado : 0,
      };
    }
  }

  const familiasAtrasadas = buildResumenFamilias(atrasados, enRiesgoSolo);

  // Cuántos de los atrasados/próximos no tienen fecha comprometida capturada —
  // esto es grave: ya se sabe que hay que apurarlos, pero no hay con qué fecha
  // comparar el compromiso real con el cliente. Se resalta como alerta aparte,
  // igual que la concentración por cliente.
  const atrasadosSinFecha = atrasados.filter(p => !p.fecha_requerida).length;
  const proximosSinFecha = proximos.filter(p => !p.fecha_requerida).length;

  return {
    fecha: hoy, total: pedidos.length,
    pedidos,
    atrasados, enRiesgoSolo, proximos, sinFecha, antiguos, garantias, sinProgramar,
    costoTotal, montoTotal, costoAtrasado, montoAtrasado,
    piezasPendientesTotal, piezasPendientesAtrasadas,
    alertaCliente, familiasAtrasadas,
    atrasadosSinFecha, proximosSinFecha,
    familiasDisponibles,
  };
}

// Movido 07-sep-2026 a su propia vista ("📅 Pedidos por Fecha de Entrega",
// antes vivía dentro de Resumen Directivo). Igual que buildResumenDirectivo,
// arma su propio `pedidos` desde allRows — son vistas hermanas, no una
// depende de la otra.
function buildFechaEntregaData() {
  const hoy = new Date();
  const pedidos = buildPedidos(allRows, 'Manufactura');
  const porFechaEntrega = pedidosPorFechaEntrega(pedidos, currentFechaFiltroDesde, currentFechaFiltroHasta);
  // Etiqueta legible del rango que se está mostrando, para el encabezado de la sección.
  let fechaEntregaInicioObj;
  if (currentFechaFiltroDesde) {
    const [y, m, dd] = currentFechaFiltroDesde.split('-').map(Number);
    fechaEntregaInicioObj = new Date(y, m - 1, dd);
  } else {
    fechaEntregaInicioObj = new Date();
  }
  fechaEntregaInicioObj.setHours(0, 0, 0, 0);
  const fechaEntregaFinObj = finDeRangoFecha(fechaEntregaInicioObj, currentFechaFiltroHasta);
  const fechaEntregaRangoTxt = currentFechaFiltroHasta
    ? `Del ${fmtFecha(fechaEntregaInicioObj)} al ${fmtFecha(fechaEntregaFinObj)}`
    : `Desde ${fmtFecha(fechaEntregaInicioObj)} sin tope — pon "Hasta" para acotar el rango`;

  // 08-sep-2026: Adrian — "orden por fecha... considerando arriba los mas
  // viejos" — antes ordenaba crítico primero; ahora es estrictamente por
  // fecha que espera el cliente (el más viejo/urgente arriba), sin importar
  // si es crítico o no. Lo crítico ya no reordena la lista, solo se marca en
  // rojo (ver crearTarjeta) para que salte a la vista sin romper el orden.
  const hoyMedianoche = new Date(); hoyMedianoche.setHours(0, 0, 0, 0);
  const conCriticidad = porFechaEntrega.map(p => ({ p, crit: evaluarCriticidadPedido(p, hoyMedianoche) }));
  conCriticidad.sort((a, b) => new Date(a.p.fecha_requerida) - new Date(b.p.fecha_requerida));
  const porFechaEntregaOrdenado = conCriticidad.map(x => x.p);
  const criticidadPorPedido = new Map(conCriticidad.map(x => [x.p, x.crit]));
  const totalCriticos = conCriticidad.filter(x => x.crit.critico).length;

  return {
    fecha: hoy, hoyMedianoche,
    porFechaEntrega: porFechaEntregaOrdenado,
    criticidadPorPedido, totalCriticos,
    fechaEntregaRangoTxt, fechaEntregaInicioObj, fechaEntregaFinObj,
  };
}

function renderResumenDirectivo() {
  const el = pvRoot.getElementById('vistaResumen');
  if (!el) return;
  if (!allRows.length) {
    el.innerHTML = '<div class="empty-state" style="padding:60px 20px;"><p>Sube tus archivos para generar el resumen directivo.</p></div>';
    return;
  }
  const d = buildResumenDirectivo();
  window._ultimoResumenDirectivo = d; // usado por el botón "Copiar para correo"

  const fechaStr = d.fecha.toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });

  const LIMITE_INICIAL = 8;

  // Construye el detalle (SKU/OP) de un pedido, ordenando primero las
  // partidas que aún no están listas — esas son las que explican por qué el
  // pedido completo aparece atrasado/en riesgo. Lo que falta por producir se
  // muestra como badge, no metido dentro de una frase — es el dato que
  // importa, tiene que saltar a la vista.
  function renderPartidasDetalle(p) {
    let partidas = [...(p.partidas || [])];
    if (currentResumenFamilia !== 'todas') {
      // Vista "para imprimir" de una sola familia: el foco son SUS faltantes.
      // Se ocultan tanto las partidas ya disponibles en CEDI (ya no requieren
      // acción) como las de otras familias que puedan venir mezcladas en el
      // mismo pedido (kits) — no aportan nada en un impreso enfocado en esto.
      partidas = partidas.filter(x => x.familia === currentResumenFamilia && !x.listo);
      if (!partidas.length) return '<div class="resumen-detalle-vacio">Ya no queda nada pendiente de esta familia en este pedido — lo que falta es de otra familia o ya está en CEDI.</div>';
    }
    if (!partidas.length) return '<div class="resumen-detalle-vacio">Sin partidas registradas para este pedido.</div>';

    // Un pedido puede traer varias familias mezcladas (kits) — el encabezado
    // de la tarjeta solo muestra la familia DOMINANTE (la de más costo
    // pendiente), pero eso no significa que TODO lo del pedido sea de esa
    // familia. Aquí se separa cada partida bajo su familia real, para que
    // nunca se vea, por ejemplo, un escritorio listado bajo "Libreros".
    const porFamilia = new Map();
    partidas.forEach(x => {
      const fam = x.familia || 'Sin familia';
      if (!porFamilia.has(fam)) porFamilia.set(fam, []);
      porFamilia.get(fam).push(x);
    });
    const familiasOrdenadas = Array.from(porFamilia.keys()).sort((a, b) => {
      const infoA = (p.familias || []).find(f => f.nombre === a);
      const infoB = (p.familias || []).find(f => f.nombre === b);
      const faltaA = infoA ? infoA.faltan > 0 : false;
      const faltaB = infoB ? infoB.faltan > 0 : false;
      if (faltaA !== faltaB) return faltaA ? -1 : 1;
      return a.localeCompare(b);
    });

    return familiasOrdenadas.map(fam => {
      const items = [...porFamilia.get(fam)].sort((a, b) => (a.listo === b.listo) ? 0 : (a.listo ? 1 : -1));
      const info = (p.familias || []).find(f => f.nombre === fam);
      const estadoFam = (info && info.faltan > 0)
        ? `<span class="familia-status pend">${info.faltan}/${info.total} pendientes · ${fmtMoney(info.costoFalta)}</span>`
        : `<span class="familia-status ok">✓ Completa</span>`;
      const filas = items.map(x => {
        const pendienteHtml = !x.listo
          ? (x.piezas_pendientes > 0 ? `<span class="badge red">Faltan ${x.piezas_pendientes} pza.</span>` : `<span class="badge amber">Pendiente</span>`)
          : `<span class="badge green">✓ Listo</span>`;
        const metaTexto = [x.no_op ? `OP ${x.no_op}` : null, x.fecha_op ? `vence ${x.fecha_op}` : null].filter(Boolean).join(' · ') || x.estatus || '—';
        // Cada partida sabe si ES garantía (P-SUB GARANTIA) — antes ese dato
        // no se usaba aquí, solo se veía un 🛡 chiquito junto al cliente sin
        // decir CUÁL SKU es la garantía. Ahora el renglón se resalta en
        // morado y trae su propia etiqueta "🛡 Garantía" junto al SKU.
        const garantiaHtml = x.garantia ? '<span class="badge garantia" style="margin-right:6px;">🛡 Garantía</span>' : '';
        return `
        <tr class="${x.listo ? '' : 'partida-pendiente'}${x.garantia ? ' fila-garantia' : ''}">
          <td class="mono">${garantiaHtml}${x.sku || '—'}</td>
          <td>${x.descripcion || '—'}</td>
          <td class="num">${x.cantidad ?? '—'}</td>
          <td>${pendienteHtml}</td>
          <td style="font-size:11px; color:var(--muted);">${metaTexto}</td>
        </tr>`;
      }).join('');
      return `
      <div class="familia-block">
        <div class="familia-block-header">
          <span class="familia-block-name">${fam}</span>
          ${estadoFam}
        </div>
        <table class="resumen-detalle-table">
          <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Producción</th><th>Detalle</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
    }).join('');
  }

  // Tarjeta de un pedido en Atrasados/Próximos/Antiguos — mismo lenguaje
  // visual que las tarjetas de "Vista de pedidos" (nombre grande, chips de
  // color), pero con un número GIGANTE al centro: lo que más importa en cada
  // sección (días de retraso / días para vencer / días abierto) tiene que
  // saltar a la vista antes que cualquier otra cosa, no competir en tamaño
  // con el costo o la fecha.
  // 07-sep-2026: Adrian — "quiero un rediseño... estandariza... usa la
  // misma logica y apariencia de esta ventana de pedidos fecha de entrega".
  // Misma tarjeta feh-* para las 5 secciones (atrasados/próximos/sin
  // programar/antiguos), cada una con su propio KPI destacado como antes.
  function crearTarjetaResumen(p, tipo) {
    let estadoPill, statKpiLabel, statKpiValue, statKpiColorClase, notaExtra = '';
    if (tipo === 'atrasado') {
      // 08-sep-2026 (Adrian: "no veo la diferencia de un pedido critico a
      // uno en tiempo, recuerda que antes te dije cuando era critico un
      // pedido") — antes esta píldora siempre salía roja/"critico" con
      // cualquier OP atrasada, igual de grave se viera o no. Ahora usa la
      // misma regla real de CRÍTICO (evaluarCriticidadPedido, ya usada en
      // Pedidos por Fecha de Entrega): solo se ve rojo cuando alguna OP ya
      // venció/vence hoy Y queda menos de ${MARGEN_CRITICO_DIAS}d hábiles
      // antes de la fecha del cliente. Si está atrasada pero con margen, se
      // ve en ámbar, no rojo — la nota de abajo (✓/⚠) ya lo distinguía en
      // texto, pero la píldora (lo que más salta a la vista) no.
      const hoyMedianocheResumen = (() => { const h = new Date(); h.setHours(0, 0, 0, 0); return h; })();
      const critResumen = evaluarCriticidadPedido(p, hoyMedianocheResumen);
      estadoPill = critResumen.critico
        ? `<span class="feh-estado critico" title="Alguna OP ya venció o vence hoy y solo quedan ${critResumen.margen}d hábiles antes de la fecha que espera el cliente — sin margen para armar/embarcar"><span class="dot"></span>🔴 CRÍTICO</span>`
        : `<span class="feh-estado riesgo" title="Hay una OP atrasada, pero todavía queda margen antes de que esto comprometa la fecha del cliente"><span class="dot"></span>ATRASADO (${p.peor_atraso}d) · con margen</span>`;
      statKpiLabel = '⏱ Retraso'; statKpiValue = `${p.peor_atraso}d`; statKpiColorClase = 'c-amber';
      // Que una OP ya haya pasado SU fecha de vencimiento no siempre significa
      // que el pedido vaya a llegar tarde con el cliente — puede que todavía
      // quede margen antes del límite real de producción (fecha comprometida
      // − 10d de flete/armado). Sin este indicador, un atraso de 1 día en una
      // OP con dos semanas de colchón se ve tan grave como uno que ya se comió
      // todo el margen — y no es lo mismo.
      if (p.dias_para_limite_produccion !== null && p.dias_para_limite_produccion !== undefined) {
        notaExtra = p.dias_para_limite_produccion < 0
          ? `<div class="feh-nota" style="color:var(--red); margin:0 22px 10px;" title="Ya se pasó el límite de producción (fecha comprometida − 10d de flete/armado) — esto sí compromete la entrega">⚠ Sí afecta la fecha del cliente</div>`
          : `<div class="feh-nota" style="color:var(--green); margin:0 22px 10px;" title="Todavía hay margen antes de que esto comprometa la fecha con el cliente">✓ Aún no afecta (${p.dias_para_limite_produccion}d de margen)</div>`;
      }
    } else if (tipo === 'proximo') {
      estadoPill = `<span class="feh-estado riesgo"><span class="dot"></span>EN RIESGO</span>`;
      statKpiLabel = '⏱ Vence en'; statKpiValue = `${p.dias_para_entrega}d`; statKpiColorClase = 'c-amber';
    } else if (tipo === 'sinprogramar') {
      // El número que más importa aquí no es "días de retraso" (eso nunca
      // se dispara solo por falta de programación) sino cuánto tiempo lleva
      // esperando a que alguien lance la OP — el máximo esperado son 9 días
      // (F1 Por Capturar 2d + F2 Capturado 3d + F3 Programado 4d).
      const dc = p.dias_en_captura;
      const excedido = dc !== null && dc !== undefined && dc > 9;
      estadoPill = excedido
        ? `<span class="feh-estado critico"><span class="dot"></span>SIN PROGRAMAR (${dc}d)</span>`
        : `<span class="feh-estado riesgo"><span class="dot"></span>SIN PROGRAMAR</span>`;
      statKpiLabel = '⏱ En captura'; statKpiValue = (dc !== null && dc !== undefined) ? `${dc}d` : '—'; statKpiColorClase = excedido ? 'c-amber' : 'c-blue';
    } else {
      estadoPill = `<span class="feh-estado compra"><span class="dot"></span>ANTIGUO SIN RESOLVER</span>`;
      const diasViejo = diasEntreFechas(new Date(p.fecha_pedido), d.fecha);
      statKpiLabel = '⏱ Abierto'; statKpiValue = `${diasViejo}d`; statKpiColorClase = 'c-blue';
    }
    const skusSinProgramar = (p.partidas || []).filter(x => (x.estatus || '').startsWith('SIN PROGRAMAR')).length;
    const alertaTxt = tipo === 'sinprogramar'
      ? `🚫 ${skusSinProgramar} SKU sin OP lanzada`
      : (p.piezas_pendientes > 0)
        ? `🔧 Faltan ${p.piezas_pendientes.toLocaleString('es-MX')} pza. por producir`
        : '✓ Nada pendiente por producir';
    const totalPartidas = (p.partidas || []).length;
    const margenTxt = (p.monto_total > 0) ? `${(((p.monto_total - p.costo_total) / p.monto_total) * 100).toFixed(1)}%` : '—';

    return `
    <div class="feh-card">
      <div class="feh-head">
        ${renderSelectorLoteHtml(p)}
        <div class="feh-id">
          <div class="feh-cliente">${escapeHtml(p.cliente) || 'Sin cliente'}${p.tiene_garantia ? ' <span class="badge garantia" title="Incluye garantía">🛡</span>' : ''}</div>
          <div class="feh-meta"><span class="feh-no">${escapeHtml(p.no_documento) || '—'}</span><span class="familia-chip">${escapeHtml(p.tipo_venta) || 'Otros'}</span></div>
        </div>
        <div class="feh-divider"></div>
        <div class="feh-fecha-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <div><div class="l">Fecha que espera<br>el cliente</div><div class="v">${p.fecha_requerida ? fmtFecha(p.fecha_requerida) : '⚠ Sin fecha'}</div></div>
        </div>
        ${estadoPill}
        <button type="button" class="feh-btn-alerta no-print" title="Alertar por correo sobre este pedido" onclick="this.closest('.feh-card').classList.toggle('show-alerta')">🚨</button>
        <button type="button" class="btn-exportar-pedido no-print" title="Exportar este pedido" data-exportar-clave="${escapeHtml((p.cliente || '') + '||' + (p.no_documento || ''))}">🖨️</button>
      </div>
      ${renderAlertaPanelGenerico(p)}
      <div class="feh-kpis">
        <div class="feh-kpi ${statKpiColorClase}">
          <div class="feh-kpi-top">${statKpiLabel}</div>
          <div class="feh-kpi-value">${statKpiValue}</div>
        </div>
        <div class="feh-kpi c-blue">
          <div class="feh-kpi-top">📦 Producción</div>
          <div class="feh-kpi-value" style="font-size:15px;">${totalPartidas - (p.partidas || []).filter(x => !x.listo).length} / ${totalPartidas} SKUs</div>
        </div>
        ${kpiProyeccionHtml(p)}
      </div>
      <div class="feh-kpi-fin">
        <div class="feh-kpi-fin-item"><span class="l">💰 Costo</span><span class="v">${fmtMoney(p.costo_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">📈 Venta</span><span class="v">${fmtMoney(p.monto_total || 0)}</span></div>
        <div class="feh-kpi-fin-item"><span class="l">🥧 Margen estimado</span><span class="v">${margenTxt}</span></div>
      </div>
      ${notaExtra}
      <button type="button" class="feh-alert ${alertaTxt.startsWith('✓') ? 'ok' : 'pend'}" onclick="this.closest('.feh-card').classList.toggle('show-pend')">
        <span class="txt">${alertaTxt}</span><span class="chev">›</span>
      </button>
      <div class="feh-detail-pend">${renderDetallePendGenerico(p, d.fecha)}</div>
      <button type="button" class="feh-btn-full" onclick="this.closest('.feh-card').classList.toggle('show-full')">
        Ver pedido completo (${totalPartidas} SKU${totalPartidas === 1 ? '' : 's'}) <span class="chev">›</span>
      </button>
      <div class="feh-detail-full">${renderDetalleFullGenerico(p, d.fecha)}</div>
    </div>`;
  }

  // Arma la lista de tarjetas: las que exceden el límite inicial se marcan
  // "fila-extra" (ocultas hasta que se pida "ver todos").
  function listaExpandible(rows, tipo) {
    return rows.map((r, i) => {
      const extra = i < LIMITE_INICIAL ? '' : 'fila-extra';
      const style = i < LIMITE_INICIAL ? '' : ' style="display:none;"';
      return `<div class="${extra}"${style}>${crearTarjetaResumen(r, tipo)}</div>`;
    }).join('');
  }
  function botonVerTodos(total, singular, plural) {
    const resto = total - LIMITE_INICIAL;
    if (resto <= 0) return '';
    return `<button class="resumen-ver-todos" onclick="window.PV_ANDON.toggleFilasExtra(this)">+ ${resto} ${resto === 1 ? singular : plural} más — ver todos</button>`;
  }

  // Lista plana de tarjetas, con "ver todos" si excede el límite inicial. Ya
  // NO se sub-agrupa por familia aquí — cada tarjeta ya muestra su propio
  // desglose por familia al abrirla (renderPartidasDetalle), así que un
  // agrupado extra arriba solo repetía la misma información sin aportar
  // nada, y encima podía verse rara (un pedido con mezcla de familias solo
  // se contaba una vez, bajo su familia dominante).
  function renderListaPedidos(pedidos, tipo, singular, plural) {
    if (!pedidos.length) return '';
    return `
      <div class="pedido-list">${listaExpandible(pedidos, tipo)}</div>
      ${botonVerTodos(pedidos.length, singular, plural)}
    `;
  }
  // Separa por canal de venta (Distribuidores/Exportación/Venta
  // directa/Flex/Otros) — cada canal es un <details> desplegable, colapsado
  // por default. Si solo hay un canal presente en los datos, no se muestra
  // ese nivel extra (no aporta nada verlo con un solo grupo).
  function renderTablaPorTipoVenta(pedidos, tipo, singular, plural) {
    if (!pedidos.length) return '';
    const gruposTV = agruparPorTipoVenta(pedidos);
    if (gruposTV.length <= 1) {
      return renderListaPedidos(pedidos, tipo, singular, plural);
    }
    return gruposTV.map(([tipoVenta, lista]) => `
      <details class="resumen-tipoventa-bloque">
        <summary class="resumen-tipoventa-titulo">${tipoVenta} <span class="resumen-familia-count">· ${lista.length} ${lista.length === 1 ? singular : plural}</span></summary>
        <div class="resumen-tipoventa-body">${renderListaPedidos(lista, tipo, singular, plural)}</div>
      </details>`).join('');
  }
  el.innerHTML = `
    <div class="resumen-wrap">
      <div class="resumen-header">
        <div>
          <h2>Resumen Directivo — Producción</h2>
          <div class="resumen-fecha">Generado el ${fechaStr} · ${d.total} pedido(s) de manufactura activos analizados${currentResumenFamilia !== 'todas' ? ` · familia: ${currentResumenFamilia}` : ''}</div>
        </div>
      </div>

      <div class="resumen-reportes no-print">
        <div class="resumen-reportes-label">📥 Reportes para descargar</div>
        <div class="resumen-reportes-grid">
          <button id="btnTablaSimple" class="reporte-btn"><span class="ico">📄</span> Tabla simple de atrasos</button>
          <button id="btnReporteGarantias" class="reporte-btn"><span class="ico">🛡</span> Reporte de garantías</button>
          <button id="btnReporteSinProgramar" class="reporte-btn"><span class="ico">📋</span> Reporte de falta de programar</button>
          <button id="btnReporteFolios" class="reporte-btn"><span class="ico">🗂</span> Reporte de Folios</button>
        </div>
      </div>

      <div class="resumen-tldr ${d.atrasados.length ? 'tldr-mal' : 'tldr-ok'}">
        ${d.atrasados.length
          ? `👉 En pocas palabras: de <b>${d.total}</b> pedido${d.total === 1 ? '' : 's'} que se revis${d.total === 1 ? 'ó' : 'aron'}, <b>${d.atrasados.length}</b> ya va${d.atrasados.length === 1 ? '' : 'n'} tarde ahora mismo. Entre los que ya van tarde hay <b>${fmtMoney(d.costoAtrasado)}</b> de producto detenido y <b>${d.piezasPendientesAtrasadas.toLocaleString('es-MX')}</b> piezas paradas.`
          : `✅ En pocas palabras: de <b>${d.total}</b> pedido${d.total === 1 ? '' : 's'} que se revis${d.total === 1 ? 'ó' : 'aron'}, ninguno va tarde ahora mismo.`}
      </div>

      <div class="resumen-filtro-familia no-print">
        <label for="resumenFamiliaSelect">Imprimir solo faltantes de una familia:</label>
        <select id="resumenFamiliaSelect">
          <option value="todas" ${currentResumenFamilia === 'todas' ? 'selected' : ''}>Todas las familias (vista completa)</option>
          ${d.familiasDisponibles.map(f => `<option value="${f}" ${f === currentResumenFamilia ? 'selected' : ''}>${f}</option>`).join('')}
        </select>
        ${currentResumenFamilia !== 'todas' ? `<span class="resumen-filtro-activo">Mostrando solo lo <b>faltante de ${currentResumenFamilia}</b> — sin lo que ya está en CEDI ni pedidos viejos <button type="button" id="btnLimpiarFiltroFamilia">✕ quitar filtro</button></span>` : ''}
      </div>

      <div class="kpi-strip resumen-kpis">
        <div class="kpi-card"><div class="kpi-lamp n"></div><div><div class="kpi-value">${d.total}</div><div class="kpi-label">Pedidos revisados</div></div></div>
        <div class="kpi-card"><div class="kpi-lamp r"></div><div><div class="kpi-value">${d.atrasados.length}</div><div class="kpi-label">Ya van tarde</div></div></div>
        <div class="kpi-card"><div class="kpi-lamp a"></div><div><div class="kpi-value">${d.enRiesgoSolo.length + d.atrasados.length}</div><div class="kpi-label">En riesgo de ir tarde</div></div></div>
        <div class="kpi-card"><div class="kpi-lamp g"></div><div><div class="kpi-value">${d.proximos.length}</div><div class="kpi-label">Se entregan en ≤ 7 días</div></div></div>
        <div class="kpi-card"><div class="kpi-lamp n"></div><div><div class="kpi-value">${d.piezasPendientesTotal.toLocaleString('es-MX')}</div><div class="kpi-label">Piezas pendientes de producir</div></div></div>
      </div>

      <div class="resumen-section">
        <h3>💰 ¿Cuánto está en juego?</h3>
        <div class="resumen-impacto">
          <div><span class="n">${fmtMoney(d.costoTotal)}</span><span class="t">Vale, en total, todo lo que falta por producir</span></div>
          <div><span class="n" style="color:var(--red)">${fmtMoney(d.costoAtrasado)}</span><span class="t">De eso, esto ya está atrasado</span></div>
          <div><span class="n">${d.piezasPendientesTotal.toLocaleString('es-MX')}</span><span class="t">Piezas reales pendientes de producir (no % de avance)</span></div>
          <div><span class="n" style="color:var(--red)">${d.piezasPendientesAtrasadas.toLocaleString('es-MX')}</span><span class="t">De esas piezas, las que ya van tarde</span></div>
        </div>
      </div>

      ${d.familiasAtrasadas.length ? `
      <div class="resumen-section">
        <h3>🏭 ¿Qué producto es el que más se está atrasando?</h3>
        <table class="resumen-table">
          <thead><tr><th>Tipo de producto</th><th>Pedidos ya tarde</th><th>Pedidos en riesgo (total)</th><th>Costo atrasado</th></tr></thead>
          <tbody>
            ${d.familiasAtrasadas.map(f => `<tr>
              <td>${f.familia}</td>
              <td class="num">${f.atrasados}</td>
              <td class="num">${f.enRiesgoTotal}</td>
              <td class="num">${fmtMoney(f.costoAtrasado)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="resumen-mas">Nota: si un pedido mezcla varios tipos de producto, aquí solo se cuenta una vez, en el tipo que representa más dinero pendiente de ese pedido.</div>
      </div>` : ''}

      ${d.atrasados.length ? `
      <div class="resumen-section resumen-critica">
        <h3>🔴 Ya van tarde — hay que actuar hoy (${d.atrasados.length})</h3>
        ${d.alertaCliente ? `<div class="resumen-alert">⚠ El cliente <b>${d.alertaCliente.cliente}</b> por sí solo tiene ${d.alertaCliente.count} de los ${d.atrasados.length} pedidos atrasados (${Math.round(d.alertaCliente.pctCount * 100)}%) — son ${fmtMoney(d.alertaCliente.costo)}, el ${Math.round(d.alertaCliente.pctCosto * 100)}% de todo el atraso. Vale la pena revisar si hay un problema puntual con este cliente.</div>` : ''}
        ${d.atrasadosSinFecha > 0 ? `<div class="resumen-alert resumen-alert-fecha">⚠ De estos pedidos atrasados, ${d.atrasadosSinFecha} no tienen registrada la fecha que el cliente espera — no sabemos qué tan grave es el atraso para él hasta que se capture esa fecha.</div>` : ''}
        ${renderTablaPorTipoVenta(d.atrasados, 'atrasado', 'pedido atrasado', 'pedidos atrasados')}
      </div>` : `<div class="resumen-section resumen-ok">✅ Ningún pedido va tarde en producción en este momento.</div>`}

      ${d.sinProgramar.length ? `
      <div class="resumen-section">
        <h3>📋 Falta lanzar OP — nadie ha empezado a producirlos (${d.sinProgramar.length})</h3>
        <div class="resumen-mas">Ni tienen OP en el Excel de producción, ni el ERP los tiene agendados. Esto nunca pone un pedido en rojo por sí solo — pero si nadie lanza la OP, es solo cuestión de tiempo. Máximo esperado: 9 días desde que entra el pedido.</div>
        ${renderTablaPorTipoVenta(d.sinProgramar, 'sinprogramar', 'pedido sin programar', 'pedidos sin programar')}
      </div>` : ''}

      ${d.proximos.length ? `
      <div class="resumen-section">
        <h3>🟠 Se atrasan esta semana si no se hace nada (${d.proximos.length})</h3>
        ${d.proximosSinFecha > 0 ? `<div class="resumen-alert resumen-alert-fecha">⚠ De estos, ${d.proximosSinFecha} no tienen registrada la fecha que el cliente espera.</div>` : ''}
        ${renderTablaPorTipoVenta(d.proximos, 'proximo', 'pedido', 'pedidos')}
      </div>` : ''}

      ${(d.antiguos.length || d.sinFecha.length) ? `
      <details class="resumen-admin no-print-collapse">
        <summary>📋 Pendientes administrativos — revisar cuando puedas (${d.antiguos.length + (d.sinFecha.length ? 1 : 0)})</summary>
        <div class="resumen-admin-body">
        ${d.antiguos.length ? `
        <div class="resumen-section">
          <h3>⚠️ Pedidos viejos que nadie ha resuelto — llevan más de 90 días abiertos (${d.antiguos.length})</h3>
          ${renderTablaPorTipoVenta(d.antiguos, 'antiguo', 'pedido antiguo', 'pedidos antiguos')}
          <div class="resumen-mas">Alguien tiene que decidir qué hacer con ellos: reprogramarlos, cancelarlos o darles prioridad ya — llevan demasiado tiempo sin resolverse.</div>
        </div>` : ''}
        ${d.sinFecha.length ? `
        <div class="resumen-section resumen-warn">
        <h3>📋 Pedidos sin fecha de entrega registrada</h3>
        <p>${d.sinFecha.length} pedido(s) no tienen capturada la fecha en que el cliente espera su entrega. Sin esa fecha no podemos saber si van tarde o no — hay que pedirle a Customer Service que la capture.</p>
      </div>` : ''}
        </div>
      </details>` : ''}
    </div>
  `;

  const btnTablaSimple = pvRoot.getElementById('btnTablaSimple');
  const btnReporteGarantias = pvRoot.getElementById('btnReporteGarantias');
  const btnReporteSinProgramar = pvRoot.getElementById('btnReporteSinProgramar');
  const btnReporteFolios = pvRoot.getElementById('btnReporteFolios');
  // 04-sep-2026: se quitaron los botones "Exportar reporte general"/"Copiar
  // para correo"/"Ver avance vs. otro día" y "Vista de Piso" (auditoría de
  // Adrian: "elimina..."). OJO al tocar esta zona en el futuro:
  // `window.abrirTodosLosDetallesParaImprimir`/`exportarSnapshotAvance`/
  // `calcularDiffAvance`/`inyectarAvanceDesdeAyer` NO se borraron aunque ya
  // no las use ningún botón aquí — las sigue llamando directo, vía
  // page.evaluate(), la automatización del correo diario
  // (`skills/rutina_diaria_andon.md`). Borrarlas rompería ese envío.
  if (!window.abrirTodosLosDetallesParaImprimir) {
    window.abrirTodosLosDetallesParaImprimir = function () {
      window.__detallesCerradosParaRestaurar = Array.from(pvRoot.querySelectorAll('details:not([open])'));
      window.__detallesCerradosParaRestaurar.forEach(det => { det.open = true; });
    };
    window.addEventListener('afterprint', () => {
      (window.__detallesCerradosParaRestaurar || []).forEach(det => { det.open = false; });
      window.__detallesCerradosParaRestaurar = [];
    });
  }
  if (btnTablaSimple) btnTablaSimple.addEventListener('click', () => exportarTablaSimpleAtrasos(d));
  if (btnReporteGarantias) btnReporteGarantias.addEventListener('click', () => exportarReporteGarantias(d));
  if (btnReporteSinProgramar) btnReporteSinProgramar.addEventListener('click', () => exportarReporteSinProgramar(d));
  if (btnReporteFolios) btnReporteFolios.addEventListener('click', () => exportarReporteFolios());

  const resumenFamiliaSelect = pvRoot.getElementById('resumenFamiliaSelect');
  if (resumenFamiliaSelect) resumenFamiliaSelect.addEventListener('change', () => {
    currentResumenFamilia = resumenFamiliaSelect.value;
    renderResumenDirectivo();
  });
  // 07-sep-2026: los filtros/wiring de "Pedidos por fecha de entrega"
  // (fechaFiltroInput/Modo/HastaInput, btnFechaFiltroHoy, btnExportarFechaEntrega)
  // se movieron a su propia vista — ver renderPedidosPorFechaEntrega() más abajo.
  const btnLimpiarFiltroFamilia = pvRoot.getElementById('btnLimpiarFiltroFamilia');
  if (btnLimpiarFiltroFamilia) btnLimpiarFiltroFamilia.addEventListener('click', () => {
    currentResumenFamilia = 'todas';
    renderResumenDirectivo();
  });
}

// ---------------------------------------------------------------------
// Vista "📅 Pedidos por Fecha de Entrega" (movida 07-sep-2026 fuera de
// Resumen Directivo, a petición de Adrian: "esto lo quiero fuera de resumen
// directivo y generes una nueva sección"). Vista hermana de Resumen
// Directivo, no depende de ella — arma su propio `pedidos` vía
// buildFechaEntregaData(). Agrega 2 cosas nuevas que no existían dentro de
// Resumen Directivo:
//   1. "Días por vencer OP" específico por cada OP en el detalle (antes solo
//      se veía "vence DD/MM/AAAA", sin decir qué tan próximo/vencido está).
//   2. Bandera 🔴 CRÍTICO a nivel pedido (ver evaluarCriticidadPedido) — NO
//      es lo mismo que "alguna OP está atrasada": ejemplo real de Adrian,
//      una OP que vence hoy con el pedido comprometido para dentro de 18
//      días NO es crítico (sobra margen); la misma OP con el pedido
//      comprometido en 3 días SÍ.
// ---------------------------------------------------------------------
// 07-sep-2026: Adrian — "cuando le dé clic solo quiero ver faltantes o en
// riesgo". Lista solo lo que todavía falta por producir. Un pedido con TODO
// listo muestra un aviso en vez de tabla vacía. Promovida a función global
// (antes vivía solo dentro de renderPedidosPorFechaEntrega) — pedido de
// Adrian: "estandariza, usa la misma logica y apariencia" en Vista de
// Pedidos y Resumen Directivo también, sin repetir este código 3 veces.
function renderDetallePendGenerico(p, hoy) {
  const partidas = (p.partidas || []).filter(x => !x.listo);
  if (!partidas.length) return '<div class="resumen-detalle-vacio">✓ Todo lo de este pedido ya está listo — nada pendiente por producir.</div>';
  const filas = partidas.map(x => {
    const pendienteHtml = x.piezas_pendientes > 0 ? `<span class="badge red">Faltan ${x.piezas_pendientes} pza.</span>` : `<span class="badge amber">Pendiente</span>`;
    const diasOP = textoDiasVencerOP(x, hoy);
    const colorOP = diasOP ? (diasOP.clase === 'rojo' ? '#C1443C' : diasOP.clase === 'ambar' ? '#C67D1E' : '#3F8557') : 'var(--muted)';
    const diasOPHtml = diasOP ? `<span style="font-weight:700; color:${colorOP};">${diasOP.texto}</span>` : '<span style="color:var(--muted);">—</span>';
    const garantiaHtml = x.garantia ? '<span class="badge garantia" style="margin-right:6px;">🛡 Garantía</span>' : '';
    return `
    <tr>
      <td class="mono">${garantiaHtml}${escapeHtml(x.sku) || '—'}</td>
      <td>${escapeHtml(x.descripcion) || '—'}</td>
      <td class="num">${x.cantidad ?? '—'}</td>
      <td>${pendienteHtml}</td>
      <td style="font-family:'IBM Plex Mono',monospace; font-size:11px;">${x.no_op ? escapeHtml(x.no_op) : '—'}</td>
      <td style="font-size:11px;">${x.fecha_op ? escapeHtml(x.fecha_op) : '—'}</td>
      <td style="font-size:11.5px;">${diasOPHtml}</td>
    </tr>`;
  }).join('');
  return `
    <table>
      <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Producción</th><th>OP</th><th>Fecha venc. OP</th><th>Días por vencer OP</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    ${botonCerrarPanelHtml('show-pend')}`;
}

// Botón "Ver pedido completo": TODAS las partidas, listas y pendientes —
// pedido de Adrian: "y si quiero ver todo el pedido? me pusiste ese botón
// independiente". Toggle aparte del de arriba, no comparten estado. También
// promovida a función global por el mismo motivo que la de arriba.
function renderDetalleFullGenerico(p, hoy) {
  const partidas = [...(p.partidas || [])];
  if (!partidas.length) return '<div class="resumen-detalle-vacio">Sin partidas registradas para este pedido.</div>';
  const filas = partidas.map(x => {
    const pendienteHtml = x.listo
      ? '<span class="badge green">✓ Listo</span>'
      : (x.piezas_pendientes > 0 ? `<span class="badge red">Faltan ${x.piezas_pendientes} pza.</span>` : `<span class="badge amber">Pendiente</span>`);
    const diasOP = textoDiasVencerOP(x, hoy);
    const colorOP = diasOP ? (diasOP.clase === 'rojo' ? '#C1443C' : diasOP.clase === 'ambar' ? '#C67D1E' : '#3F8557') : 'var(--muted)';
    const diasOPHtml = diasOP ? `<span style="font-weight:700; color:${colorOP};">${diasOP.texto}</span>` : '<span style="color:var(--muted);">—</span>';
    const garantiaHtml = x.garantia ? '<span class="badge garantia" style="margin-right:6px;">🛡 Garantía</span>' : '';
    return `
    <tr class="${x.listo ? 'fila-listo' : ''}">
      <td class="mono">${garantiaHtml}${escapeHtml(x.sku) || '—'}</td>
      <td>${escapeHtml(x.descripcion) || '—'}</td>
      <td class="num">${x.cantidad ?? '—'}</td>
      <td>${pendienteHtml}</td>
      <td style="font-family:'IBM Plex Mono',monospace; font-size:11px;">${x.no_op ? escapeHtml(x.no_op) : '—'}</td>
      <td style="font-size:11px;">${x.fecha_op ? escapeHtml(x.fecha_op) : '—'}</td>
      <td style="font-size:11.5px;">${diasOPHtml}</td>
    </tr>`;
  }).join('');
  return `
    <table>
      <thead><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>Producción</th><th>OP</th><th>Fecha venc. OP</th><th>Días por vencer OP</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    ${botonCerrarPanelHtml('show-full')}`;
}

// 08-sep-2026: Adrian — "necesito que se vuelvan a contraer... no puedo
// cerrarla". El botón que abre el panel (arriba de la tarjeta) es el mismo
// que lo cierra — pero un pedido con muchas partidas puede volverse largo, y
// para cerrarlo había que scrollear hasta arriba a buscar ese mismo botón.
// Este botón se repite AL FINAL del panel, mismo toggle, para poder cerrar
// sin tener que subir. `claseToggle` es 'show-pend' o 'show-full' según cuál
// de los 2 paneles lo llama.
function botonCerrarPanelHtml(claseToggle) {
  return `<button type="button" class="feh-btn-cerrar-panel no-print" onclick="this.closest('.feh-card').classList.remove('${claseToggle}')">▲ Cerrar</button>`;
}

// Panel de "Avisar por correo" (07-sep-2026, botón tipo Alerta) — genérico,
// reutilizado en Fecha de Entrega, Vista de Pedidos y Resumen Directivo.
// 08-sep-2026: Adrian — "en el correo da detalle de lo que falta del pedido
// SKU OP estatus" — se arma aquí (una vez, con los datos reales de p) y se
// guarda en data-detalle para que enviarAlertaPedido lo use tal cual, sin
// tener que volver a tocar el motor de cruce.
function detalleFaltantesTexto(p) {
  const pendientes = (p.partidas || []).filter(x => !x.listo);
  if (!pendientes.length) return 'Nada pendiente por producir.';
  return pendientes.map(x => `- ${x.sku || '—'} | OP: ${x.no_op || 'sin OP'} | ${x.estatus || 'Pendiente'}`).join('\n');
}

// Checkbox de selección para el correo de "varios pedidos con el mismo
// problema" (08-sep-2026, Adrian: "quiero tener la opcion de mandar varios
// correos con ese mismo problema de atraso... con algun selector"). Guarda
// todo lo que hace falta para el correo en data-* — el manejador global
// (toggleSeleccionLote, delegado sobre document) los lee de ahí, así no
// hace falta tocar nada del resto de la tarjeta.
function renderSelectorLoteHtml(p) {
  const cliente = escapeHtml(p.cliente) || 'Sin cliente';
  const pedido = escapeHtml(p.no_documento) || '—';
  const fecha = fmtFecha(p.fecha_requerida);
  const detalle = escapeHtml(detalleFaltantesTexto(p));
  return `<label class="feh-select-wrap no-print" title="Seleccionar para incluir en un correo de varios pedidos" onclick="event.stopPropagation();">
    <input type="checkbox" class="feh-select-checkbox" data-cliente="${cliente}" data-pedido="${pedido}" data-fecha="${fecha}" data-detalle="${detalle}">
  </label>`;
}

function renderAlertaPanelGenerico(p) {
  const cliente = escapeHtml(p.cliente) || 'Sin cliente';
  const pedido = escapeHtml(p.no_documento) || '—';
  const fecha = fmtFecha(p.fecha_requerida);
