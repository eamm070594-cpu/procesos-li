    <div class="small">${t.grupos.length} grupos, ${t.categorias.length} categorías, ${t.niveles.length} niveles — se copian completos, con ids reales nuevos.</div>`;
}
function applyCTMigration(plan){
  plan.ingPlan.forEach(p=>{
    if(!p.match) return;
    if(p.rolSugerido==='leader'&&p.match.loginRole==='user') p.match.loginRole='leader'; // nunca degrada, solo sube
    (p.ctAreas||[]).forEach(idx=>{
      const cp=plan.centroPlan[idx]; if(!cp||cp.candidatos.length!==1) return;
      const centroReal=byId(DB.centros,cp.candidatos[0].id); if(!centroReal) return;
      centroReal.ingenieroIds=centroReal.ingenieroIds||[];
      if(!centroReal.ingenieroIds.includes(p.match.id)) centroReal.ingenieroIds.push(p.match.id);
    });
  });
  plan.centroPlan.forEach(cp=>{
    if(cp.candidatos.length!==1) return;
    const centroReal=byId(DB.centros,cp.candidatos[0].id); if(!centroReal) return;
    centroReal.ingenieroIds=centroReal.ingenieroIds||[];
    centroReal.etapas=centroReal.etapas||[];
    centroReal.flujos=centroReal.flujos&&centroReal.flujos.length?centroReal.flujos:(cp.ctFlujos||[]);
    // Todo lo de abajo viene de control_ct/state[i] — SOLO si el centro real no tiene ya lo
    // suyo (13-sep-2026: se descubrió que control_ct sí tenía ingeniería real y viva —
    // operaciones/personal/CIF/equipos/parámetros/consideraciones — la corrida anterior de
    // esta migración solo inicializaba arreglos vacíos porque se leía la ruta equivocada).
    if((!centroReal.operaciones||!centroReal.operaciones.length)&&cp.ctOps.length){
      centroReal.operaciones=cp.ctOps.map(o=>({nombre:o.nombre||'',min:Number(o.min)||0,recursos:Number(o.recursos)||1,piezas:Number(o.piezas)||1,modoFlujo:o.modoFlujo||'serie',depende:o.depende||[],activa:o.activa!==false,flujo:o.flujo||null}));
    } else centroReal.operaciones=centroReal.operaciones||[];
    if((!centroReal.personal||!centroReal.personal.length)&&cp.ctMod.length){
      centroReal.personal=cp.ctMod.map(m=>({puesto:m.puesto||'',costo:Number(m.costo)||0,presente:true,habilidades:m.habilidades||[]}));
    } else centroReal.personal=centroReal.personal||[];
    if((!centroReal.asignaciones||!Object.keys(centroReal.asignaciones).length)&&cp.ctAsignaciones){
      const asig={}; (cp.ctAsignaciones||[]).forEach((arr,i)=>{ if(arr&&arr.length) asig[i]=arr; });
      centroReal.asignaciones=asig;
    } else centroReal.asignaciones=centroReal.asignaciones||{};
    if((!centroReal.consideraciones||!centroReal.consideraciones.items||!centroReal.consideraciones.items.length)&&cp.ctCons){
      centroReal.consideraciones={disponible:cp.ctCons.disponible??null,items:(cp.ctCons.items||[]).map(x=>({nombre:x.nombre||'',min:Number(x.min)||0,activa:x.activa!==false}))};
    } else centroReal.consideraciones=centroReal.consideraciones||{disponible:null,items:[]};
    if((!centroReal.cif||!centroReal.cif.length)&&cp.ctCif&&cp.ctCif.length){
      centroReal.cif=cp.ctCif.map(x=>({concepto:x.concepto||'',monto:Number(x.monto)||0,nota:x.nota||''}));
    } else centroReal.cif=centroReal.cif||[];
    if((!centroReal.equipos||!centroReal.equipos.length)&&cp.ctEquipos&&cp.ctEquipos.length){
      centroReal.equipos=cp.ctEquipos.map(x=>({nombre:x.nombre||'',tipo:x.tipo||'Máquina',modelo:x.modelo||'',anio:x.anio||'',valor:Number(x.valor)||0,ultimoMtto:x.ultimoMtto||'',proxMtto:x.proxMtto||'',notas:x.notas||'',url:x.url||''}));
    } else centroReal.equipos=centroReal.equipos||[];
    const parDefault={disponibleMin:480,dias:22,turnos:1,demanda:0,modo:'serie'};
    const parVacio=!centroReal.params||(centroReal.params.demanda===0&&centroReal.params.disponibleMin===480&&centroReal.params.dias===22);
    if(parVacio&&cp.ctParams){
      centroReal.params={
        disponibleMin:Number(cp.ctParams.disponible)||480,
        dias:Number(cp.ctParams.dias)||22,
        turnos:Number(cp.ctParams.turnos)||1,
        demanda:Number(cp.ctParams.demanda)||0,
        modo:cp.ctParams.modo||'serie',
      };
    } else centroReal.params=centroReal.params||parDefault;
  });
  const t=plan.tabuladorSrc;
  const grupos=t.grupos.map(g=>({id:uid('grp'),nombre:g.nombre}));
  const categorias=t.categorias.map(c=>({id:uid('cat'),nombre:c.nombre,grupoId:grupos[c.grupoIdx]?.id||null}));
  const niveles=t.niveles.map(n=>({id:uid('niv'),categoriaId:categorias[n.categoriaIdx]?.id||null,num:n.num,desc:n.desc,ascenso:n.ascenso,autonomia:n.autonomia,salario:n.salario,incremento:n.incremento}));
  DB.tabulador={grupos,categorias,niveles};
  saveDB();
  render();
  const sinMatch=plan.ingPlan.filter(p=>!p.match).length;
  toast('Migración aplicada ✓'+(sinMatch?` — ${sinMatch} ingeniero(s) sin match, solo referencia`:''));
}

};

// Mapeo ctPiezasKey (LineaItalia) -> nombre real de centro (index.html), ya validado
// a mano esta sesion contra los 22 centros reales.
var CT_KEY_A_NOMBRE = {
  "CARP":"Carpinteria", "ENCHAPADO":"Enchapado", "TROQUELES":"Troqueles",
  "ESTRUCTURA MUEBLES":"Estructura de muebles", "LASER":"Corte laser",

function buildMaquinasMigrationPlan(machines){

function migrarUnaMaquina(m,centro){
  ctEnsureShape(centro);
  // Ya migrada antes (mismo id de LineaItalia)? no duplicar.
  if(centro.maquinas.some(x=>x.__origId===m.id)) return false;
  const nueva={
    id:uid('maq'), __origId:m.id,
    code:m.code||'', name:m.name||'Sin nombre', model:m.model||'', frase:m.frase||'',
    color:m.color||'#94a3b8',
    inv:m.inv||0, replaceVal:m.replaceVal||0, yr:m.yr||8, res:m.res||0, opx_extra:m.opx_extra||0,
    status:m.status||'', statusNota:m.statusNota||'',
    fechaInicioOperacion:m.fechaInicioOperacion||'',
    valorPorPieza:m.valorPorPieza||0, costoAnteriorPorPieza:m.costoAnteriorPorPieza||0,

    unidadManualEtiqueta:m.unidadManualEtiqueta||'',
    cotLink:m.cotLink||'', xlsxLink:m.xlsxLink||'', videoUrl:m.videoUrl||'',
    heroPhoto:m.heroPhoto||null, impactos:m.impactos||[], specs:m.specs||[],
    vars:JSON.parse(JSON.stringify(m.vars||{}))
    // cotPdf/fichaPdf (base64) NO se migran — igual que LineaItalia, quedan solo como link.
  };
  centro.maquinas.push(nueva);
  if(!centro.piezasPromedioDia && m.ctPiezasKey && PIEZAS_PROMEDIO_CT[m.ctPiezasKey]){
    centro.piezasPromedioDia=PIEZAS_PROMEDIO_CT[m.ctPiezasKey];
    centro.piezasPromedioMeta=PIEZAS_PROMEDIO_META;
  }
  centro.updatedAt=Date.now();
  return true;
}
function applyMaquinasMigration(plan,asignManual){

      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(g.nombre)}</div><div class="small muted">${nCat} categoría${nCat!==1?'s':''}</div></div>
      <button class="btn xs" data-edit-grupo="${g.id}">✎ Editar</button>
      <button class="btn xs danger" data-del-grupo="${g.id}">✕</button>

  </div>`;
  c.querySelectorAll('[data-edit-grupo]').forEach(b=>b.addEventListener('click',()=>editGrupoDlg(b.dataset.editGrupo)));
  c.querySelectorAll('[data-del-grupo]').forEach(b=>b.addEventListener('click',()=>deleteGrupoPrompt(b.dataset.delGrupo)));

function editGrupoDlg(id){

  openDlg({
    title:g?'Editar grupo':'Nuevo grupo',
    body:`<label class="lbl">Nombre *</label><input class="input" id="tg-nombre" value="${esc(g?.nombre||'')}"/>`,
    onSave:()=>{
      const nombre=document.getElementById('tg-nombre').value.trim();
      if(!nombre){ toast('Ingresa un nombre'); return false; }
      if(g) g.nombre=nombre; else DB.tabulador.grupos.push({id:uid('grp'),nombre});
      saveDB(); renderAdminTabulador(); toast(g?'Grupo actualizado ✓':'Grupo creado ✓');
    }
  });
}
async function deleteGrupoPrompt(id){
  const g=byId(DB.tabulador.grupos,id); if(!g) return;
  const nCat=DB.tabulador.categorias.filter(c=>c.grupoId===id).length;
  if(!await appConfirm(`¿Eliminar el grupo "${g.nombre}"?`,nCat?`También se eliminan sus ${nCat} categoría(s) y los niveles dentro de ellas.`:'')) return;
  const catIds=DB.tabulador.categorias.filter(c=>c.grupoId===id).map(c=>c.id);
  DB.tabulador.grupos=DB.tabulador.grupos.filter(x=>x.id!==id);
  DB.tabulador.categorias=DB.tabulador.categorias.filter(c=>c.grupoId!==id);
  DB.tabulador.niveles=DB.tabulador.niveles.filter(n=>!catIds.includes(n.categoriaId));
  saveDB(); renderAdminTabulador(); toast('Grupo eliminado');
}

function editCategoriaDlg(id,onDone){
  const cat=id?byId(DB.tabulador.categorias,id):null;

async function deleteCategoriaPrompt(id,onDone){
  const cat=byId(DB.tabulador.categorias,id); if(!cat) return;
  const nNiv=DB.tabulador.niveles.filter(n=>n.categoriaId===id).length;
  if(!await appConfirm(`¿Eliminar la categoría "${cat.nombre}"?`,nNiv?`También se eliminan sus ${nNiv} nivel(es).`:'')) return;
  DB.tabulador.categorias=DB.tabulador.categorias.filter(x=>x.id!==id);
  DB.tabulador.niveles=DB.tabulador.niveles.filter(n=>n.categoriaId!==id);
  saveDB(); renderAdminTabulador(); toast('Categoría eliminada');
  openCategoriasNivelesDlg(); // este diálogo sigue abierto (no vino de un onSave), se refresca directo
}
function openNivelesDlg(categoriaId){
  const cat=byId(DB.tabulador.categorias,categoriaId); if(!cat) return;
  const body=()=>{
    const niveles=DB.tabulador.niveles.filter(n=>n.categoriaId===categoriaId).sort((a,b)=>(a.num||0)-(b.num||0));
    const rows=niveles.map(n=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)">
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">Nivel ${n.num}${n.desc?' — '+esc(n.desc):''}</div>
        <div class="small muted">$${(n.salario||0).toLocaleString('es-MX',{minimumFractionDigits:2})}${n.incremento?' + '+n.incremento+'% = $'+calcNivelFinal(n.salario,n.incremento).toLocaleString('es-MX',{minimumFractionDigits:2}):''}</div></div>
      <button class="btn xs" data-edit-niv="${n.id}">✎</button><button class="btn xs danger" data-del-niv="${n.id}">✕</button>
    </div>`).join('');
    return `<div class="small muted" style="margin-bottom:8px">Niveles de "${esc(cat.nombre)}".</div>${rows||'<div class="small muted">Sin niveles todavía.</div>'}
      <button class="btn sm primary" id="tn-new-niv" style="margin-top:8px">＋ Nuevo nivel</button>`;
  };
  openDlg({ title:'Niveles', sub:esc(cat.nombre), saveLabel:'Cerrar', showCancel:false, body:body(), onSave:()=>{} });
  const wire=()=>{
    document.getElementById('tn-new-niv')?.addEventListener('click',()=>editNivelDlg(categoriaId,null));
    document.querySelectorAll('[data-edit-niv]').forEach(b=>b.addEventListener('click',()=>editNivelDlg(categoriaId,b.dataset.editNiv)));
    document.querySelectorAll('[data-del-niv]').forEach(b=>b.addEventListener('click',()=>deleteNivelPrompt(categoriaId,b.dataset.delNiv)));
  };
  wire();
}
function editNivelDlg(categoriaId,id){
  const n=id?byId(DB.tabulador.niveles,id):null;
  openDlg({
    title:n?'Editar nivel':'Nuevo nivel',
    body:`<label class="lbl">Número de nivel *</label><input class="input" type="number" id="tn-num" value="${n?.num??''}"/>
      <label class="lbl" style="margin-top:10px">Descripción</label><input class="input" id="tn-desc" value="${esc(n?.desc||'')}"/>
      <label class="lbl" style="margin-top:10px">Salario base *</label><input class="input" type="number" step="0.01" id="tn-salario" value="${n?.salario??''}"/>
      <label class="lbl" style="margin-top:10px">Incremento (%)</label><input class="input" type="number" step="0.01" id="tn-incremento" value="${n?.incremento||0}"/>
      <label class="lbl" style="margin-top:10px">Requisitos de ascenso</label><input class="input" id="tn-ascenso" value="${esc(n?.ascenso||'')}"/>
      <label class="lbl" style="margin-top:10px">Autonomía</label><input class="input" id="tn-autonomia" value="${esc(n?.autonomia||'')}"/>`,
    onSave:()=>{
      const num=Number(document.getElementById('tn-num').value);
      const salario=Number(document.getElementById('tn-salario').value);
      if(isNaN(num)||isNaN(salario)){ toast('Ingresa número de nivel y salario válidos'); return false; }
      const entry={num,categoriaId,desc:document.getElementById('tn-desc').value.trim(),salario,
        incremento:Number(document.getElementById('tn-incremento').value)||0,
        ascenso:document.getElementById('tn-ascenso').value.trim(),autonomia:document.getElementById('tn-autonomia').value.trim()};
      if(n) Object.assign(n,entry); else DB.tabulador.niveles.push({id:uid('niv'),...entry});
      saveDB(); toast(n?'Nivel actualizado ✓':'Nivel creado ✓'); renderAdminTabulador();
      setTimeout(()=>openNivelesDlg(categoriaId),0); // el diálogo se cierra justo después de este onSave — reabrir hasta el siguiente tick
    }
  });
}
async function deleteNivelPrompt(categoriaId,id){
  if(!await appConfirm('¿Eliminar este nivel?')) return;
  DB.tabulador.niveles=DB.tabulador.niveles.filter(n=>n.id!==id);
  saveDB(); toast('Nivel eliminado'); renderAdminTabulador();
  openNivelesDlg(categoriaId); // este diálogo sigue abierto (no vino de un onSave), se refresca directo
}

function editUserDlg(id){
  const u=id?byId(DB.users,id):null;
  const reportsOpts=DB.users.filter(x=>x.id!==id).map(x=>
    `<option value="${x.id}"${u?.reportsTo===x.id?' selected':''}>${esc(x.name)}</option>`).join('');
  openDlg({
    title:u?'Editar usuario':'Nuevo usuario',
    body:`<label class="lbl">Nombre completo *</label><input class="input" id="eu-name" value="${esc(u?.name||'')}"/>
      <div class="form-row" style="margin-top:10px">
        <div><label class="lbl">Usuario (para iniciar sesión) *</label><input class="input" id="eu-username" value="${esc(u?.customUsername||'')}" placeholder="nombre.apellido"/></div>
        <div><label class="lbl">Contraseña ${u?'(vacío = sin cambio)':'*'}</label><input class="input" type="password" id="eu-pass"/></div>
      </div>
      <label class="lbl">Permiso en la app *</label>
      <select class="select-input" id="eu-role">
        <option value="user"${(u?.loginRole||'user')==='user'?' selected':''}>Integrante — solo ve/captura lo suyo</option>
        <option value="leader"${u?.loginRole==='leader'?' selected':''}>Líder de sección</option>
        <option value="admin"${u?.loginRole==='admin'?' selected':''}>Admin — acceso total</option>
      </select>
      <label class="lbl" style="margin-top:10px">Reporta a</label>
      <select class="select-input" id="eu-reportsto"><option value="">— Ninguno —</option>${reportsOpts}</select>`,
    onSave:()=>{
      const name=document.getElementById('eu-name').value.trim();
      const username=document.getElementById('eu-username').value.trim().toLowerCase();
      const pass=document.getElementById('eu-pass').value;
      if(!name){ toast('Ingresa un nombre'); return false; }
      if(!username){ toast('Ingresa un usuario para iniciar sesión'); return false; }
      const taken=DB.users.some(x=>x.id!==id&&(x.customUsername===username));
      if(taken){ toast('Ese usuario ya lo tiene otra persona'); return false; }
      if(!u&&!pass){ toast('Ingresa una contraseña para el usuario nuevo'); return false; }
      const target=u||{id:uid('u')};
      target.name=name;
      target.customUsername=username;
      target.loginRole=document.getElementById('eu-role').value;
      target.reportsTo=document.getElementById('eu-reportsto').value||null;
      if(pass) target.loginPassword=pass;
      if(!u) DB.users.push(target);
      saveDB(); renderAdminUsuarios(); toast(u?'Usuario actualizado ✓':'Usuario creado ✓');
    }
  });
}
async function deleteUserPrompt(id){
  const u=byId(DB.users,id); if(!u) return;
  if(u.id===SESSION.userId){ toast('No puedes eliminar tu propio usuario','err'); return; }
  if(!await appConfirm(`¿Eliminar a "${u.name}"?`,'Sus entregables asignados no se borran, pero se quedan sin responsable visible.')) return;
  DB.users=DB.users.filter(x=>x.id!==id);
  saveDB(); renderAdminUsuarios(); toast('Usuario eliminado');
}

  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Work Sans', sans-serif; font-weight: 700; letter-spacing: -.01em; }

  /* ---------- App shell: sidebar + main ---------- */
  .app-shell { display: flex; min-height: 100vh; align-items: flex-start; }

  /* Barra lateral: antes tema oscuro industrial (fondo casi negro, lámpara
     ámbar brillante) — ahora tema claro tipo barra lateral de Finder/Mail en
     macOS: fondo gris muy claro, texto oscuro, fila seleccionada en azul de
     sistema. Solo visual — mismos ids/clases, mismo comportamiento JS. */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    color: var(--ink);
    min-height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    z-index: 40;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  .lamp-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--blue);
    flex-shrink: 0;
  }
  .sidebar-brand .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; color: var(--ink); }
  .sidebar-brand .brand-subtitle {
    font-family: 'Work Sans', sans-serif; text-transform: none; letter-spacing: 0;
    font-size: 11.5px; color: var(--muted); margin-top: 2px;
  }
  .sidebar-close {
    display: none;
    margin-left: auto;
    background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px;
  }

  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 14px 12px; border-bottom: 1px solid var(--line); }
  .sidebar-nav button {
    display: flex; align-items: center; gap: 10px;
    background: transparent; border: none; border-radius: 8px;
    color: var(--ink); font-family: 'Work Sans', sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 9px 12px; text-align: left; cursor: pointer; width: 100%;
    transition: background .15s, color .15s;
  }
  .sidebar-nav button:hover { background: rgba(0,0,0,.05); }
  .sidebar-nav button.active { background: var(--blue); color: #fff; }

  .sidebar-section { border-bottom: 1px solid var(--line); }
  .sidebar-section-toggle {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: transparent; border: none; color: var(--muted);
    font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    padding: 14px 18px; cursor: pointer;
  }
  .sidebar-section-toggle:hover { background: rgba(0,0,0,.04); }
  .sidebar-section-toggle .chevron-mini { color: var(--muted); transition: transform .15s; }
  .sidebar-section-toggle.open .chevron-mini { transform: rotate(180deg); }
  .sidebar-panel { padding: 2px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-panel[hidden] { display: none; }

  .sidebar-status { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.5; }

  .filtro-grupo { display: flex; flex-direction: column; gap: 6px; }
  .filtro-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
  }
  .sidebar .seg { flex-wrap: wrap; background: var(--card); border-color: var(--line); }
  .sidebar .seg button { flex: 1 1 auto; border-right-color: var(--line); color: var(--muted); }
  .sidebar .seg button.active { background: var(--blue); color: #fff; }
  .sidebar select, .sidebar input[type="text"], .sidebar input[type="date"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
  }
  .sidebar select:disabled { opacity: .45; cursor: not-allowed; }
  .sidebar input[type="text"]::placeholder { color: var(--muted); }
  .sidebar .ocultar-completos-label { color: var(--ink); }
  .sidebar .filter-advanced-toggle {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .sidebar .filter-advanced-toggle:hover { background: rgba(0,0,0,.04); color: var(--ink); }
  .sidebar .filter-advanced-toggle.open { color: var(--ink); border-color: var(--blue); }
  .filtro-avanzado-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .filtro-avanzado-panel[hidden] { display: none; }

  /* 08-sep-2026: Adrian — remasterización TOTAL de "Pedidos por Fecha de
     Entrega": después de 3 intentos (tarjetas largas, acordeón, sidebar
     angosto + panel central) quedó claro que el trabajo real de esta
     pantalla es TRIAGE — escanear muchos pedidos rápido y decidir a cuál
     entrarle, no navegar uno por uno. Se cambió a una tabla ancha,
     ordenable, con expansión en línea (la fila se abre hacia abajo) en vez
     de tarjetas apiladas o un panel aparte. */
  .feh-tabla-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin: 14px 0; }
  .feh-tabla-toolbar .filtro-grupo { min-width: 150px; }
  .feh-tabla-toolbar label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
  .feh-tabla-toolbar input, .feh-tabla-toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--card); color: var(--ink); }
  .feh-tabla-toolbar button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .feh-tabla-toolbar button:hover { background: rgba(0,0,0,.04); color: var(--ink); }
  .feh-tabla-aviso { margin: 0 0 10px; padding: 10px 16px; background: #C1443C; color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; border-radius: 10px; }
  .feh-tabla-aviso:hover { background: #A8382F; }
  .feh-tabla { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
  .feh-tabla-fila-grid { display: grid; grid-template-columns: 105px 1fr 150px 1.4fr 110px 80px; align-items: center; column-gap: 10px; }
  /* 08-sep-2026: Adrian — "estan todas movidas" (las columnas no alineaban
     entre filas). Causa: cada fila es su propio grid, y una columna \`1fr\`
     por default no se encoge más allá del contenido que tenga adentro (su
     "auto mínimo" es el ancho del texto sin cortar) — una fila con
     "Distribuidores" (más largo que "Venta directa") en la columna Cliente
     empujaba TODO lo de la derecha (Estado, Qué falta, etc.) más a la
     derecha que en las demás filas. \`min-width:0\` en cada celda obliga a
     respetar el ancho fijo de la columna en vez de crecer por el contenido. */
  .feh-tabla-fila-grid > * { min-width: 0; }
  .feh-tabla-head { background: var(--panel); border-bottom: 1px solid var(--line); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 10px 16px; }
  .feh-tabla-head .th { cursor: pointer; user-select: none; }
  .feh-tabla-head .th:hover { color: var(--ink); }
  .feh-tabla-head .th.activo { color: var(--blue); }
  .feh-tabla-fila { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .feh-tabla-fila:last-child { border-bottom: none; }
  .feh-tabla-fila:hover { background: rgba(0,0,0,.025); }
  .feh-tabla-fila.critica { background: #FDF1F0; }
  .feh-tabla-fila.critica:hover { background: #FBE4E2; }
  .feh-tabla-fila.expandida { background: var(--blue-bg); }
  .feh-td-fecha { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .feh-td-fecha.critico { color: #C1443C; }
  .feh-td-cliente .nombre { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feh-td-cliente .doc { font-size: 10.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feh-td-estado { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .feh-badge-estado { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
  .feh-badge-estado.atrasado { background: #FBE4E2; color: #C1443C; }
  .feh-badge-estado.riesgo { background: #FCF0D8; color: #C67D1E; }
  .feh-badge-estado.ok { background: #E1F0E6; color: #3F8557; }
  .feh-badge-critico-mini { font-size: 9px; font-weight: 800; color: #fff; background: #C1443C; padding: 1px 6px; border-radius: 999px; }
  .feh-td-falta { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feh-td-restantes { font-size: 12px; font-weight: 700; }
  .feh-td-acciones { display: flex; gap: 6px; justify-content: flex-end; }
  .feh-td-acciones button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 13px; }
  .feh-td-acciones button:hover { background: rgba(0,0,0,.04); }
  .feh-tabla-vacio { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }
  /* El detalle expandido reusa .feh-card (mismos botones/estilos de
     Vista de Pedidos y Resumen Directivo, sin reescribir esas 3 funciones
     compartidas) pero con look de "panel bajo la fila", no de tarjeta suelta. */
  .feh-fila-detalle-wrap.feh-card { border: none; border-radius: 0; box-shadow: none; background: var(--blue-bg); padding-top: 4px; }

  .upload-zone {
    background: var(--card);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--blue); background: var(--blue-bg); }
  .upload-zone input { display: none; }
  .upload-zone .btn-label {
    font-family: 'Work Sans', sans-serif;
    letter-spacing: 0;
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
  }
  .upload-zone .file-name {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 30;
  }

  /* ---------- Main area / topbar ---------- */
  .main-area { flex: 1; min-width: 0; }

  .topbar {
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .hamburger {
    display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    width: 38px; height: 38px; font-size: 16px; cursor: pointer; color: var(--ink); flex-shrink: 0;
  }
  .topbar-title { font-family: 'Work Sans', sans-serif; letter-spacing: -.01em; font-size: 16px; font-weight: 700; color: var(--ink); }
  .topbar-heroes { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  /* Antes: cajas con degradado oscuro café/verde-azulado (look "tablero de
     control" industrial). Ahora: chip plano con el mismo lenguaje que los
     KPI de las tarjetas de pedido (fondo de tinte suave, número a color). */
  .hero-cost {
    background: var(--amber-bg);
    border: none;
    border-radius: 12px;
    padding: 8px 18px;
    text-align: right;
  }
  .hero-cost .hero-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--amber); margin-bottom: 2px; font-weight: 600;
  }
  .hero-cost .hero-value {
    font-family: 'Work Sans', sans-serif; font-size: 19px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums;
  }
  .hero-monto {
    background: var(--green-bg);
  }
  .hero-monto .hero-label { color: var(--green); }
  .hero-monto .hero-value { color: var(--green); }

  main { padding: 22px 28px 60px; max-width: 1180px; margin: 0 auto; }

  /* ---------- Empty state ---------- */
  .empty-state {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 70px 30px;
    text-align: center;
    margin-top: 20px;
  }
  .empty-state .lamps { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; }
  .empty-state .lamp { width: 20px; height: 20px; border-radius: 50%; background: var(--line); box-shadow: none; }
  .empty-state h2 { font-family: 'Work Sans', sans-serif; letter-spacing: -.01em; font-size: 21px; font-weight: 700; margin: 0 0 10px; color: var(--ink); }
  .empty-state p { color: var(--muted); font-size: 14px; max-width: 460px; margin: 0 auto; line-height: 1.6; }

  /* ---------- KPI strip ---------- */
  .kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; margin-top: 20px; background: var(--line); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .kpi-card {
    background: var(--card);
    border: none;
    border-radius: 0;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .kpi-lamp { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .kpi-lamp.g { background: var(--green); box-shadow: none; }
  .kpi-lamp.a { background: var(--amber); box-shadow: none; }
  .kpi-lamp.r { background: var(--red); box-shadow: none; }
  .kpi-lamp.n { background: var(--muted); box-shadow: none; }
  .kpi-value { font-family: 'Work Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 4px; }

  /* ---------- Filtros (viven en el sidebar) ---------- */
  .filter-advanced-toggle {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: nowrap; width: 100%; text-align: left;
    display: flex; align-items: center; justify-content: space-between;
  }
  .filter-advanced-toggle:hover { background: #EEF1F4; color: var(--ink); }
  .filter-advanced-toggle.open { color: var(--ink); border-color: var(--steel); }
  .filter-advanced-toggle .chevron-mini { display: inline-block; transition: transform .15s; }
  .filter-advanced-toggle.open .chevron-mini { transform: rotate(180deg); }
  .ocultar-completos-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  .ocultar-completos-label input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--ink, #1a1a1a); }
  .mes-separator.antiguos-separator { background: #FFF3E0; color: #B45309; border-left: 3px solid #F59E0B; font-weight: 700; }

  .resumen-wrap { max-width: 920px; margin: 0 auto; }
  .resumen-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .resumen-header h2 { font-family: 'Work Sans', sans-serif; letter-spacing: -.01em; font-size: 24px; font-weight: 700; margin: 0; color: var(--ink); }
  .resumen-fecha { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .resumen-tldr {
    font-size: 16px; line-height: 1.6; font-weight: 500; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--steel);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 18px;
  }
  .resumen-tldr.tldr-mal { border-left-color: var(--red); }
  .resumen-tldr.tldr-ok { border-left-color: var(--green); }
  .resumen-tldr b { font-family: 'Work Sans', sans-serif; font-weight: 700; }
  /* La sección de "ya van tarde" es la más importante del reporte: se marca
     con más peso visual (borde más grueso, fondo tenue, título más grande)
     que el resto — para que salte a la vista sin tener que leer todo. */
  .resumen-section.resumen-critica {
    border: 1px solid #F0C9C5; border-left: 8px solid var(--red); background: #FFFBFA;
    padding: 20px 22px;
  }
  .resumen-section.resumen-critica h3 { color: var(--red); font-size: 16px; }
  /* "Pendientes administrativos" (viejos sin resolver, sin fecha) es lo menos
     urgente del reporte — se colapsa por default, discreto, para no competir
     visualmente con lo que sí requiere acción hoy. */
  .resumen-admin { margin-top: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 4px 18px; }
  .resumen-admin summary {
    cursor: pointer; padding: 12px 0; font-family: 'Work Sans', sans-serif; font-weight: 700;
    font-size: 13px; color: var(--muted); list-style: none;
  }
  .resumen-admin summary::-webkit-details-marker { display: none; }
  .resumen-admin summary::before { content: '▸ '; }
  .resumen-admin[open] summary::before { content: '▾ '; }
  .resumen-admin-body { padding-bottom: 12px; }
  @media print {
    .resumen-admin { display: none; }
  }
  /* Canal de venta (Distribuidores/Exportación/...): acordeón desplegable,
     colapsado por default — un clic en el título lo abre. */
  .resumen-tipoventa-bloque { margin-top: 18px; }
  .resumen-tipoventa-bloque:first-of-type { margin-top: 4px; }
  .resumen-tipoventa-titulo {
    cursor: pointer; list-style: none;
    font-family: 'Work Sans', sans-serif; letter-spacing: 0;
    font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0;
    padding: 10px 14px; background: var(--panel); border-radius: 12px; display: block;
  }
  .resumen-tipoventa-titulo:hover { background: var(--line); }
  .resumen-tipoventa-titulo::-webkit-details-marker { display: none; }
  .resumen-tipoventa-titulo::before { content: '▸ '; }
  .resumen-tipoventa-bloque[open] > .resumen-tipoventa-titulo::before { content: '▾ '; }
  .resumen-tipoventa-titulo .resumen-familia-count { text-transform: none; font-family: 'Work Sans', sans-serif; }
  .resumen-tipoventa-body { padding-top: 4px; }
  @media print {
    /* Ojo (02-sep-2026): esta regla por sí sola NO basta — Chrome esconde el
       contenido de un <details> cerrado con content-visibility (no solo
       display), así que "display:block!important" aquí no lo revierte. El fix
       real es forzar el atributo [open] por JS antes de imprimir — ver
       window.abrirTodosLosDetallesParaImprimir(), llamada por el botón
       "Exportar reporte general" y por la automatización de Playwright del
       reporte diario. Se deja esta regla como respaldo inofensivo. */
    .resumen-tipoventa-bloque, .resumen-tipoventa-bloque > .resumen-tipoventa-body { display: block !important; }
    .resumen-tipoventa-titulo::before { content: ''; }
  }
  .resumen-filtro-familia { display: flex; align-items: center; gap: 10px; margin: -4px 0 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .resumen-filtro-familia select {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card);
    font-family: 'Work Sans', sans-serif; font-size: 13px; color: var(--ink);
  }
  .resumen-filtro-activo { display: flex; align-items: center; gap: 8px; background: #EEF1F4; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; }
  .resumen-filtro-activo button { border: none; background: none; color: var(--steel); font-weight: 700; cursor: pointer; font-size: 12px; padding: 0; }
  .resumen-filtro-activo button:hover { text-decoration: underline; }
  /* 15-sep-2026 (Adrian: "reportes claros y simples de bajar") — antes estos
     4 botones vivían apretados junto al título como texto plano; ahora son
     su propia sección con nombre, para que sea obvio que ahí se descargan
     los reportes. Mismos ids/onclick de siempre, solo cambia la envoltura. */
  .resumen-reportes { background: var(--blue-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .resumen-reportes-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--steel); margin-bottom: 10px; }
  .resumen-reportes-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .reporte-btn {
    display: flex; align-items: center; gap: 9px; font-family: 'Work Sans', sans-serif;
    font-size: 13px; font-weight: 600; color: var(--ink); text-align: left; line-height: 1.25;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; box-shadow: var(--shadow-card);
  }
  .reporte-btn .ico { font-size: 18px; flex-shrink: 0; }
  .reporte-btn:hover { border-color: var(--steel); }
  .resumen-kpis { margin-bottom: 18px; }
  .resumen-section {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .resumen-section h3 {
    font-family: 'Work Sans', sans-serif; letter-spacing: -.005em; font-weight: 700;
    font-size: 15px; margin: 0 0 12px; color: var(--ink);
  }
  .resumen-section.resumen-ok { color: var(--green); font-weight: 600; text-align: center; padding: 20px; }
  .resumen-section.resumen-warn { background: var(--amber-bg); border-color: var(--amber); }

  .resumen-impacto { display: flex; gap: 32px; flex-wrap: wrap; }
  .resumen-impacto > div { display: flex; flex-direction: column; }
  .resumen-impacto .n { font-family: 'Work Sans', sans-serif; font-size: 24px; font-weight: 700; color: var(--ink); }

  .resumen-alert {

  .resumen-mas { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .resumen-ver-todos {

  @media print {
    /* 03-sep-2026 (Adrian: "mantenle el mismo formato de vista que tienes al
       de impresión, no tiene color ni misma estructura"): sin esto, el
       navegador no imprime colores de fondo por default — el Resumen
       Directivo se vería plano/sin color al imprimir aunque en pantalla se

    :host { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .no-print, .sidebar, .topbar, #vistaPedidos, .kpi-strip:not(.resumen-kpis) { display: none !important; }
    .app-shell { display: block; }
    :host { background: #fff; }
    .resumen-section { break-inside: avoid; border: 1px solid #ccc; }
  }
  .resumen-detalle-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .resumen-detalle-table th {
    text-align: left; font-family: 'Work Sans', sans-serif; font-size: 10.5px; font-weight: 600;
    color: var(--muted); padding: 5px 6px; border-bottom: 1px solid var(--line);
  }
  .resumen-detalle-table td { padding: 5px 6px; border-bottom: 1px solid #EEF0F2; }
  .resumen-detalle-table tr.partida-pendiente td { color: var(--red); font-weight: 600; }
  /* Garantía (P-SUB GARANTIA) siempre gana el resaltado, aunque también

  .resumen-detalle-table tr.fila-garantia td:first-child { border-left: 3px solid #7A3FC9; }
  .resumen-detalle-vacio { font-size: 12px; color: var(--muted); padding: 6px 0; }
  .resumen-familia-count { font-weight: 500; color: var(--muted); }
  .seg {

  }
  .seg button {
    border: none; background: transparent; padding: 9px 14px; font-family: 'Work Sans', sans-serif;
    font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: none; }

  .result-count { font-size: 12px; color: var(--muted); margin: 14px 2px 8px; }

  .scope-summary {

  .scope-summary .n { font-family: 'Work Sans', sans-serif; font-size: 20px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
  .scope-summary .t { font-size: 12.5px; color: var(--blue); opacity: .85; }

  .section-title {
    font-family: 'Work Sans', sans-serif; letter-spacing: -.005em;
    font-size: 15px; font-weight: 700; color: var(--ink); margin: 4px 2px 12px;
  }

  .mes-separator {
    font-family: 'Work Sans', sans-serif;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 14px 4px 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .mes-separator:first-child { padding-top: 2px; }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    font-size: 11.5px; color: var(--muted); margin: 10px 2px 0;
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend .dot.r { background: var(--red); }
  .legend .dot.a { background: var(--amber); }

  /* ---------- Pedido rows ---------- */
  /* 07-sep-2026 (Adrian: "dale una arreglada a todo el diseño de la app,
     deja todo estandar usando la misma logica y apariencia de esta ventana
     de pedidos fecha de entrega") — reskin visual (radio más redondo,
     sombra suave, borde de estado más delgado, etiquetas en mayúsculas más
     marcadas) sobre estas MISMAS clases compartidas por Vista de Pedidos Y
     Resumen Directivo — a propósito NO se tocó ni una línea de JS ni se
     renombró ninguna clase: cero riesgo de romper el filtrado, el motivo
     real capturado a mano, los botones de exportar, ni nada que ya
     funcionaba. Solo cambia cómo se ve, no cómo funciona. */
  .pedido-list { display: flex; flex-direction: column; gap: 10px; }
  .pedido-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--steel);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,24,32,.04);
  }
  .pedido-card.nivel-atrasado { border-left-color: var(--red); }
  .pedido-card.nivel-riesgo { border-left-color: var(--amber); }
  .pedido-card.nivel-ok { border-left-color: var(--green); }
  .pedido-card.nivel-compra { border-left-color: var(--muted); }

  .pedido-head {
    display: grid;
    grid-template-columns: 1.5fr 0.85fr 1.1fr 1.15fr 0.9fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 15px 18px;
    cursor: pointer;
  }
  .pedido-head:hover { background: #FAFBFC; }
  /* Tarjetas del Resumen Directivo (Atrasados/Próximos/Antiguos): un grid
     propio, más corto que el de Vista de pedidos, porque su protagonista es
     el número grande de .resumen-stat-dias, no una fila de celdas parejas. */
  .resumen-card-head { grid-template-columns: 1.7fr 1.1fr 1.3fr 1fr auto auto; }
  .btn-exportar-pedido {
    background: none; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    font-size: 14px; padding: 6px 9px; color: var(--muted); line-height: 1;
  }
  .btn-exportar-pedido:hover { background: #F1F3F6; color: var(--ink); }
  .resumen-stat-dias {
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 32px; line-height: 1;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  }
  .resumen-stat-dias span {
    font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 10px;
    text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
  }
  .resumen-stat-dias.rojo { color: var(--red); }
  .resumen-stat-dias.ambar { color: var(--amber); }
  .resumen-stat-dias.gris { color: var(--steel); }
  .resumen-stat-dias.verde { color: var(--green); }
  .cliente-cell .cliente-name { font-weight: 700; font-size: 14px; }
  .cliente-cell .pedido-no { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cell-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .cell-value { font-size: 13px; font-weight: 600; }
  .cell-value.mono { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  .cell-value.costo-dominante {
    font-family: 'Work Sans', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #A8730E;
  }
  .cell-label.gold { color: #B5821A; font-weight: 700; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
  }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.amber { background: var(--amber-bg); color: var(--amber); }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.gray { background: #EDEFF2; color: var(--muted); }
  .badge.garantia { background: #F1E6FF; color: #7A3FC9; }
  .chevron { color: var(--muted); font-size: 13px; transition: transform .15s; justify-self: end; }
  .pedido-card.open .chevron { transform: rotate(90deg); }

  .pedido-detail { display: none; border-top: 1px solid var(--line); background: #FAFBFC; padding: 4px 16px 14px; }
  .pedido-card.open .pedido-detail { display: block; }

  .falta-strip {
    padding: 0 16px 12px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .falta-strip .falta-ok {
    font-size: 12px; font-weight: 700; color: var(--green); display: flex; align-items: center; gap: 5px;
  }
  .falta-strip .falta-chip {
    font-size: 11.5px; font-weight: 600; color: var(--red); background: var(--red-bg);
    padding: 3px 9px; border-radius: 999px;
  }
  .limite-chip {
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px dashed currentColor;
  }
  .limite-chip.limite-vencido { color: var(--red); background: var(--red-bg); }

  /* Tarjeta de pedido de "Pedidos por Fecha de Entrega" (07-sep-2026,
     rediseño aprobado por Adrian sobre una referencia que mandó — dashboard
     con tiles de KPI, fecha destacada y 2 botones de expandir independientes:
     uno solo para lo pendiente, otro para el pedido completo). Namespace
     propio (feh-*), no reutiliza .pedido-card/.pedido-head del resto de la
     app — así este rediseño no puede afectar Vista de Pedidos ni Resumen
     Directivo, que se quedan exactamente igual que siempre. */
  .feh-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-card); }
  .feh-head { display: flex; align-items: center; gap: 16px; padding: 18px 22px; flex-wrap: wrap; }
  .feh-id { flex: 1; min-width: 180px; }
  .feh-cliente { font-weight: 800; font-size: 17px; letter-spacing: -.01em; color: var(--ink); }
  .feh-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .feh-no { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .feh-divider { width: 1px; align-self: stretch; background: var(--line); }
  .feh-fecha-box { display: flex; align-items: center; gap: 10px; background: var(--blue-bg); border-radius: 12px; padding: 9px 16px; flex: none; }
  .feh-fecha-box .l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--blue); line-height: 1.3; }
  .feh-fecha-box .v { font-size: 18px; font-weight: 800; font-family: 'Work Sans', sans-serif; color: var(--blue); }
  .feh-estado { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 999px; flex: none; }
  .feh-estado.ok { background: var(--green-bg); color: var(--green); }
  .feh-estado.critico { background: var(--red-bg); color: var(--red); }
  .feh-estado.riesgo { background: var(--amber-bg); color: var(--amber); }
  .feh-estado.compra { background: #EDEFF2; color: var(--muted); }
  .feh-nota { font-size: 12px; color: var(--muted); margin: 0 22px 10px; }
  .feh-nota.riesgo { color: var(--amber); }
  .feh-estado .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .feh-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; padding: 0 22px 18px; }
  .feh-kpi { border-radius: 12px; padding: 14px 16px; }
  .feh-kpi.c-blue { background: var(--blue-bg); } .feh-kpi.c-amber { background: var(--amber-bg); } .feh-kpi.c-green { background: var(--green-bg); }
  .feh-kpi.c-indigo { background: #EDEDFB; } .feh-kpi.c-purple { background: #F8ECFB; }
  .feh-kpi-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .feh-kpi-value { font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; color: var(--ink); }
  .feh-kpi.c-blue .feh-kpi-value { color: var(--blue); } .feh-kpi.c-amber .feh-kpi-value { color: var(--amber); } .feh-kpi.c-green .feh-kpi-value { color: var(--green); }
  .feh-kpi.c-indigo .feh-kpi-value { color: #5856D6; } .feh-kpi.c-purple .feh-kpi-value { color: #AF52DE; }
  /* 08-sep-2026: Costo/Venta/Margen estimado — Adrian: "los quiero también
     comprimidos y menos colores parece capirotada de colores". Antes eran 3
     tarjetas grandes (verde/índigo/morado) igual de vistosas que Producción/
     Restantes. Ahora es una sola franja angosta y neutra (sin color, solo
     texto) — misma información, mucho menos espacio y sin ruido visual. */
  .feh-kpi-fin { display: flex; margin: 0 22px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .feh-kpi-fin-item { flex: 1; padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .feh-kpi-fin-item:last-child { border-right: none; }
  .feh-kpi-fin-item .l { display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 3px; }
  .feh-kpi-fin-item .v { display: block; font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feh-progress { height: 6px; border-radius: 999px; background: rgba(37,99,235,.15); margin-top: 9px; overflow: hidden; }
  .feh-progress b { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
  .feh-alert { display: flex; align-items: center; gap: 12px; margin: 0 22px 10px; padding: 13px 16px; border-radius: 12px; cursor: pointer; border: none; width: calc(100% - 44px); text-align: left; font-family: inherit; }
  .feh-alert.pend { background: var(--red-bg); color: var(--red); }
  .feh-alert.ok { background: var(--green-bg); color: var(--green); }
  .feh-alert .txt { flex: 1; font-size: 13.5px; font-weight: 700; }
  .feh-alert .chev { font-size: 16px; transition: transform .15s; }
  .feh-card.show-pend .feh-alert .chev { transform: rotate(90deg); }
  .feh-detail-pend { display: none; margin: 0 22px 14px; }
  .feh-card.show-pend .feh-detail-pend { display: block; }
  .feh-btn-full { display: flex; align-items: center; gap: 6px; margin: 0 22px 20px; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .feh-btn-full:hover { color: var(--ink); }
  .feh-btn-full .chev { font-size: 13px; transition: transform .15s; }
  .feh-card.show-full .feh-btn-full .chev { transform: rotate(90deg); }
  .feh-detail-full { display: none; margin: 0 22px 20px; }
  .feh-card.show-full .feh-detail-full { display: block; }
  .feh-detail-pend table, .feh-detail-full table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .feh-detail-pend th, .feh-detail-full th { text-align: left; font-size: 10px; text-transform: uppercase; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .feh-detail-pend td, .feh-detail-full td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .feh-detail-full tr.fila-listo td { color: var(--muted); }
  .feh-btn-cerrar-panel { display: block; width: 100%; margin-top: 10px; padding: 9px; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
  .feh-btn-cerrar-panel:hover { background: var(--line); color: var(--ink); }

  /* Botón "Alerta" + panel de correo (07-sep-2026, pedido de Adrian: "un
     botón tipo Alerta para enviar correo... barra de mensajes automáticos y
     opción de escribir la razón manual"). El correo lo arma un mailto: — es
     un archivo HTML estático sin backend, no puede enviar correo por sí
     solo; mailto: abre el cliente de correo del usuario con Para/Asunto/
     Cuerpo ya listos, y desde ahí Adrian revisa el destinatario y da
     enviar — eso es justo lo que pidió como "ajustable a mano". */
  .feh-btn-alerta { background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 14px; padding: 6px 9px; color: var(--muted); line-height: 1; }

  /* Selección de varios pedidos para un correo conjunto (08-sep-2026,
     Adrian: "quiero tener la opcion de mandar varios correos con ese mismo
     problema de atraso... con algun selector"). El checkbox vive en cada
     tarjeta; la barra flotante y su panel son ÚNICOS para toda la app. */
  .feh-select-wrap { display: flex; align-items: center; flex: none; cursor: pointer; }
  .feh-select-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue); }
  /* Barra flotante tipo "toast" de macOS/iOS (Control Center, AirDrop): oscura
     y translúcida con blur, no un panel plano — mismo patrón que usa Apple
     para overlays flotantes incluso en modo claro. */
  .feh-lote-bar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(29,29,31,.85); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    color: #fff; border-radius: 20px; padding: 12px 18px;
    display: none; align-items: center; gap: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 500;
  }
  .feh-lote-bar .n { font-size: 13.5px; font-weight: 700; }
  .feh-lote-bar button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .feh-lote-bar .feh-btn-lote-abrir { background: var(--blue); color: #fff; }
  .feh-lote-bar .feh-btn-lote-limpiar { background: rgba(255,255,255,.15); color: #fff; }
  .feh-lote-panel {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--card); color: var(--ink); border-radius: 18px; padding: 18px 20px;
    width: 420px; max-width: calc(100vw - 40px); max-height: 60vh; overflow-y: auto;
    box-shadow: 0 10px 32px rgba(0,0,0,.3); display: none; z-index: 501;
  }
  .feh-lote-panel.show, .feh-lote-bar.show { display: flex; }
  .feh-lote-panel.show { display: block; }
  .feh-lote-lista { font-size: 11.5px; color: var(--muted); max-height: 90px; overflow-y: auto; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .feh-btn-alerta:hover { background: #FBE4E2; color: var(--red); border-color: var(--red); }
  .feh-alerta-panel { display: none; margin: 0 22px 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #FAFBFC; }
  .feh-card.show-alerta .feh-alerta-panel { display: block; }
  .feh-alerta-titulo { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .feh-alerta-detalle-preview { font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.7; color: var(--steel); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; max-height: 120px; overflow-y: auto; }
  .feh-alerta-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .feh-alerta-para { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 12.5px; box-sizing: border-box; margin-bottom: 10px; }
  .feh-alerta-fecha-nueva { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 12.5px; box-sizing: border-box; margin-bottom: 10px; color: inherit; background: var(--card); }

function _pvInit(pvRoot){

// causa. En vez de esperar a que alguien lo capture en Business Central
// (campo "Comentarios" existe pero nadie lo usa), se captura AQUÍ, en Andon.

// sigue ahí hasta que tú lo borres. Es la base para el envío automático a CS
// (fase 2, pendiente): ese correo necesita saber "hay un motivo real nuevo
// capturado hoy", y eso solo existe si el comentario persiste entre días.
const COMENTARIOS_RIESGO_KEY = 'andon_comentarios_riesgo_v1';
function cargarComentariosRiesgo() {
  try {
    const raw = localStorage.getItem(COMENTARIOS_RIESGO_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function guardarComentariosRiesgo() {
  try { localStorage.setItem(COMENTARIOS_RIESGO_KEY, JSON.stringify(comentariosRiesgo)); } catch (e) {}
}

// Avance, la última OP vista de cada SKU (Modelo). Así, aunque el Avance de

// fecha en que se vio) en lugar de darla por perdida. Se acumula solo con

  } catch (e) { return {}; }
}
function guardarHistorialOP() {
  try { localStorage.setItem(HISTORIAL_OP_KEY, JSON.stringify(historialOP)); } catch (e) {}

      historialOP[sku] = {
        noOp: p.No_OP,
        fecha: p.Fecha_Vencimiento ? fmtFecha(p.Fecha_Vencimiento) : null,
        fechaMs: tMs,
        vistoEl: hoyTxt,
      };
    }
  }
  guardarHistorialOP();
}

async function parseAvanceExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  const sheetName = wb.SheetNames.includes('Data') ? 'Data' : wb.SheetNames[0];
  const filas = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });

  const requeridas = ['NoOP', 'Modelo', 'FechaVenc', 'DeAvance', 'Cant', 'CantPendiente', 'CantTerminada'];
  if (!filas.length || !requeridas.every(c => Object.prototype.hasOwnProperty.call(filas[0], c))) {
    throw new Error(
      'Este Excel no tiene las columnas esperadas (NoOP, Modelo, FechaVenc, DeAvance, Cant, CantPendiente, CantTerminada). ' +
      '¿Es el archivo correcto de "Avance del programa de producción"?'
    );
  }

  return filas.map(f => ({
    Centro_Trabajo: f.NombreCTrabajo || null,
    No_OP: f.NoOP,
    Fecha_Vencimiento: toDateSafe(f.FechaVenc),
    Modelo: f.Modelo,
    Cant_Total: Number(f.Cant) || 0,
    Cant_Pendiente: Number(f.CantPendiente) || 0,
    Cant_Terminada: Number(f.CantTerminada) || 0,
    Pct_Avance: Number(f.DeAvance) || 0,
    // Agregado 03-sep-2026 (Adrian: "necesitamos verlas [las Planificadas]
    // porque eso hace que te aparezcan como no planificados cuando ya están
    // así pero aún no se lanzan"): antes esta columna ni se leía — el filtro
    // de descarga en Business Central solo traía Estado=Lanzada|Terminada,
    // así que una OP Planificada simplemente no llegaba al Excel y cualquier
    // SKU que solo tuviera una OP planificada (sin ninguna lanzada) se veía
    // igual que "sin ninguna OP en absoluto" (SIN PROGRAMAR). Ahora que el
    // filtro de descarga también incluye Planificada|Planif. firme (ver
    // skills/descargar_excels_business_central.md), hace falta este campo
    // para no tratar una OP planificada como si ya estuviera en producción.
    Estado: f.Estado || null,
  }));
}

// El valor real de esta columna puede traer espacios o mayúsculas/minúsculas
// distintas según cómo se exportó el Excel — se normaliza antes de comparar
// para no perder garantías (o clasificarlas mal como "Compra") por un detalle
// de formato. Mismo tipo de problema que ya pasó con los nombres de columna
// de fecha — una comparación exacta (===) se rompe en silencio.
function normalizaCategoriaInventario(v) {
  return String(v || '').trim().toUpperCase();
}
const CATS_MANUFACTURADO = ['PT-MANUFAC-NAC', 'PT-MANUFAC-EXP', 'P-SUB GARANTIA'].map(normalizaCategoriaInventario);
const COLUMNAS_REQUERIDAS = ['No_Documento', 'Nombre_del_Cliente', 'No_Producto_SKU', 'Outstanding_Quantity', 'Inventory_Posting_Group', 'Estatus'];

async function leerFilasDeUnXlsx(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  const sheetName = wb.SheetNames.includes('Data') ? 'Data' : wb.SheetNames[0];
  return XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });
}

async function parseXlsxPedidos(files) {
  const listaFiles = Array.isArray(files) ? files : [files];
  const todasLasFilas = [];
  for (const file of listaFiles) {
    const filas = await leerFilasDeUnXlsx(file);
    todasLasFilas.push(...filas);
  }

  if (!todasLasFilas.length || !COLUMNAS_REQUERIDAS.every(c => Object.prototype.hasOwnProperty.call(todasLasFilas[0], c))) {
    throw new Error(
      'Este Excel no tiene las columnas esperadas (No_Documento, Nombre_del_Cliente, No_Producto_SKU, ' +
      'Outstanding_Quantity, Inventory_Posting_Group). ¿Es el archivo correcto de pedidos pendientes?'
    );
  }

  // Combinar varios archivos sin duplicar renglones: la llave única de cada
  // línea de pedido es No_Documento + Line_No_. Si el mismo renglón aparece
  // en más de un archivo, nos quedamos con la primera copia.
  const vistos = new Set();
  const filasUnicas = [];
  for (const r of todasLasFilas) {
    const llave = `${r.No_Documento}||${r.Line_No_}`;
    if (vistos.has(llave)) continue;
    vistos.add(llave);
    filasUnicas.push(r);
  }

  const pendientes = filasUnicas.filter(r => (r.Outstanding_Quantity || 0) > 0);
  // 03-sep-2026 (Adrian, con OPs de garantía reales en papel — OPG01854,
  // OPG01855, OPGS00427, etc. — ya Lanzadas y sin aparecer en el Reporte de
  // Garantías): "recuerda que todo lo OPG OPGS son de garantías". Se
  // verificó el caso: esas 12 OPs SÍ tenían su línea de venta correctamente
  // marcada `Estatus_de_factura = Garantias`, pero 8 de las 12 caían en
  // `Inventory_Posting_Group` fuera de CATS_MANUFACTURADO (ej. PP-MANUFAC,
  // PT-COMP-NAC — no son "PT-MANUFAC-NAC/EXP" ni "P-SUB GARANTIA") y por eso
  // el pedido completo se iba al bucket "Compra", que NINGÚN reporte
  // (Garantías, Folios, Tabla de Atrasos, Resumen Directivo) revisa — se
  // perdían de vista por completo, no solo mal etiquetadas. Una garantía
  // debe verse SIEMPRE en los reportes de Manufactura sin importar qué
  // posting group le haya quedado en BC, así que aquí se fuerza a
  // "manufactura" en cuanto el ERP la marca como garantía, sin esperar a que
  // el posting group también cuadre.
  const esGarantiaErp = r => normalizaTexto(campoFlexible(r, 'Estatus_de_factura')) === 'garantias';
  const manufactura = pendientes.filter(r => CATS_MANUFACTURADO.includes(normalizaCategoriaInventario(r.Inventory_Posting_Group)) || esGarantiaErp(r));
  const comprados = pendientes.filter(r => !CATS_MANUFACTURADO.includes(normalizaCategoriaInventario(r.Inventory_Posting_Group)) && !esGarantiaErp(r));
  return { manufactura, comprados, totalArchivos: listaFiles.length, totalFilasCombinadas: filasUnicas.length, totalFilasCrudas: todasLasFilas.length };
}
