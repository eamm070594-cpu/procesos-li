/* ══════════════════════════════════════════════════════
   3 MÓDULOS NUEVOS DEL DASHBOARD — barra de avance, proyectos
   estancados, actividad reciente. Puros (reciben datos ya
   filtrados por quien los llama, no vuelven a resolver alcance).
══════════════════════════════════════════════════════ */
function daysAgoLabel(ms){
  const days=Math.floor((Date.now()-ms)/86400000);
  if(days<=0) return 'hoy';
  if(days===1) return 'hace 1 día';
  return `hace ${days} días`;
}
function fmtWhen(ms){
  if(!ms) return '—';
  const days=Math.floor((Date.now()-ms)/86400000);
  if(days<7) return daysAgoLabel(ms);
  return new Date(ms).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function progressBarHTML(dels){
  const total=dels.length;
  const done=dels.filter(d=>d.status==='Entregado').length;
  const pct=total?Math.round(done/total*100):0;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div class="small muted">Avance de entregables</div>
      <div class="small" style="font-weight:600">${pct}% · ${done}/${total} entregables</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}
const STALLED_DAYS=7; // proyecto activo sin ningún cambio de estatus en sus entregables en N días
function deliverableLastMovement(d){ return d.updatedAt||null; } // entregables viejos sin el campo: sin fecha de referencia
function projectLastMovement(p){
  const dates=(DB.deliverables||[]).filter(d=>d.projectId===p.id).map(deliverableLastMovement).filter(Boolean);
  return dates.length?Math.max(...dates):null;
}
function isProjectStalled(p){
  if(computeProjectStatus(p)!=='Activo') return false;
  const last=projectLastMovement(p);
  if(last===null) return true; // sin ningún entregable con fecha de referencia: se muestra para revisar, no se calla
  return (Date.now()-last)>=STALLED_DAYS*86400000;
}
function stalledLabel(p){
  const last=projectLastMovement(p);
  return last===null?'sin fecha de referencia':daysAgoLabel(last);
}
function stalledProjectsHTML(projects){
  const stalled=projects.filter(isProjectStalled);
  if(!stalled.length) return emptyStateHTML('Nada estancado',`Todos los proyectos activos han tenido movimiento en los últimos ${STALLED_DAYS} días.`);
  return `<div class="card">${stalled.map(p=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-size:13px">${esc(p.name)}</div>
      <span class="pill warn">⏸ ${stalledLabel(p)}</span>
    </div>`).join('')}</div>`;
}
function recentActivityHTML(dels){
  const items=dels
    .filter(d=>d.status==='Entregado'||d.approved)
    .map(d=>({d,at:d.approved?.at||d.updatedAt||d.createdAt||0}))
    .sort((a,b)=>b.at-a.at)
    .slice(0,10);
  if(!items.length) return emptyStateHTML('Sin actividad reciente','Cuando marquen o aprueben entregables, aparecerán aquí.');
  return `<div class="card">${items.map(({d,at})=>{
    const who=d.approved?.byName||(byId(DB.users,d.assigneeId)?.name)||'—';
    const accion=d.approved?'aprobado por':'marcado como entregado por';
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:600">${esc(d.name)}</div>
        <div class="small muted">${accion} ${esc(who)}</div>
      </div>
      <div class="small muted" style="white-space:nowrap">${fmtWhen(at)}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ══════════════════════════════════════════════════════
   DASHBOARD — pantalla de entrada tras el login. Reusa tal cual
   los reportes de arriba (Atrasados/por vencer y Carga por
   persona) en vez de duplicar su lógica, más 3 tarjetas de
   resumen rápido. Mismo alcance por rol que ya usa el resto de
   la app (isAdmin/isLeader/getMyReports vía reportDeliverables
   y visibleProjects — no se inventa un criterio nuevo).
══════════════════════════════════════════════════════ */
// Alcance de datos para UN bloque del dashboard (una Sección real, o el bloque
// "Sin sección asignada"). sec=null → proyectos cuyos centros no caen en
// ninguna Sección todavía.
function seccionScope(sec){
  let projects,people;
  if(sec){
    projects=(DB.projects||[]).filter(p=>seccionesDeProyecto(p).some(s=>s.id===sec.id));
    people=(DB.users||[]).filter(u=>{ const s=seccionOfUser(u.id); return s&&s.id===sec.id; });
  }else{
    projects=(DB.projects||[]).filter(p=>seccionesDeProyecto(p).length===0);
    const ids=new Set();
    projects.forEach(p=>(DB.deliverables||[]).filter(d=>d.projectId===p.id).forEach(d=>{ if(d.assigneeId) ids.add(d.assigneeId); }));
    people=(DB.users||[]).filter(u=>ids.has(u.id));
  }
  const projectIds=new Set(projects.map(p=>p.id));
  const deliverables=(DB.deliverables||[]).filter(d=>projectIds.has(d.projectId));
  const centros=(sec?.centroIds||[]).map(id=>byId(DB.centros,id)).filter(Boolean);
  return {projects,people,deliverables,centros};
}
// KPIs de líder agregados a nivel Sección (costo/hora real vs. ideal, capacidad
// vs. producción real, ROI real de las máquinas de sus centros) — cada uno
// reusa la MISMA fuente única ya construida para Centro de Trabajo/Máquinas
// (ctCostoIdealCalc/ctCapacidadDia/gananciaPorPiezas/roiPorPiezas/acumuladoReal),
// solo sumados entre los centros de esta Sección. Nunca se recalcula la fórmula.
function seccionCostoResumen(centros){
  let real=0, ideal=0, nValidos=0;
  centros.forEach(c=>{
    ctEnsureShape(c);
    const ci=ctCostoIdealCalc(c);
    real+=ci.costoRealMensual;
    if(ci.valido){ ideal+=ci.costoIdealMensual; nValidos++; }
  });
  return {real,ideal,nValidos,totalCentros:centros.length};
}
function seccionCapacidadResumen(centros){
  let cap=0, real=0;
  centros.forEach(c=>{ ctEnsureShape(c); cap+=ctCapacidadDia(c); real+=(c.piezasPromedioDia||0); });
  return {cap,real,pct:cap>0?(real/cap*100):null};
}
function seccionMaquinasResumen(centros){
  let total=0, conDato=0, pagadas=0, paybackSum=0, paybackN=0;
  centros.forEach(c=>{
    (c.maquinas||[]).forEach(m=>{
      total++;
      const abReal=gananciaPorPiezas(m,c);
      if(abReal!==null&&abReal>0){
        conDato++;
        const rr=roiPorPiezas(m,abReal);
        const acum=acumuladoReal(m,c);
        if(acum?.pagada) pagadas++;
        if(isFinite(rr.pay)){ paybackSum+=rr.pay; paybackN++; }
      }
    });
  });
  return {total,conDato,pagadas,paybackAvg:paybackN?paybackSum/paybackN:null};
}
function seccionATiempoPct(people){
  const vals=people.map(u=>statsATiempo(u.id)).filter(v=>v!==null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
}
// Reconocimiento — top 3 del equipo (nunca el líder: se reconoce a la gente,
// no a quien ya lidera). Score = promedio de las 3 "barras" que ya existen
// en el expediente (completados/a tiempo/efectivos) — nada nuevo que capturar.
function personScore(u){
  const vals=[statsCompletados(u.id),statsATiempo(u.id),statsEfectivos(u.id)].filter(v=>v!==null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function seccionTop3HTML(liderId,people){
  const ranking=people
    .filter(u=>u.id!==liderId)
    .map(u=>({u,score:personScore(u)}))
    .filter(x=>x.score!==null)
    .sort((a,b)=>b.score-a.score)
    .slice(0,3);
  if(!ranking.length) return '';
  const medals=['🥇','🥈','🥉'];
  return `<div class="card" style="margin-bottom:16px;background:var(--surface2)">
    <div style="font-weight:700;font-size:12.5px;margin-bottom:8px">🏆 Top del equipo</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      ${ranking.map((r,i)=>`<div style="display:flex;align-items:center;gap:7px">
        <span style="font-size:19px">${medals[i]}</span>
        <div><div style="font-weight:600;font-size:12.5px">${esc(r.u.name)}</div><div class="small muted">${Math.round(r.score)}% desempeño</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}
// Listas crudas de atrasados/por vencer (mismo criterio que vencidosTableHTML,
// reusado aquí para no duplicar el filtro y para poder mandarlas por correo).
function vencidosListas(dels){
  const today=todayISO();
  const limite=todayISO(new Date(Date.now()+PROX_DIAS*86400000));
  const pend=dels.filter(d=>isOpenOverdueStatus(d.status)&&d.dueDate);
  return {
    atrasados:pend.filter(d=>d.dueDate<today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)),
    porVencer:pend.filter(d=>d.dueDate>=today&&d.dueDate<=limite).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)),
  };
}
// Compacto — mismo dato que cargaListHTML, menos espacio (fila más angosta,
// barra más delgada) para que quepan varias personas sin empujar el resto
// del bloque de líder hacia abajo.
function cargaListCompactHTML(people){
  if(!people.length) return emptyStateHTML('Sin datos todavía','No encontramos personas para mostrar aquí.');
  const rows=people.map(u=>({u,carga:cargaAbierta(u.id)})).sort((a,b)=>b.carga-a.carga);
  const max=Math.max(1,...rows.map(r=>r.carga));
  return `<div class="card" style="padding:10px 14px">${rows.map(r=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="width:110px;font-size:11.5px;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.u.name)}</div>
      <div class="bar-track" style="flex:1;height:5px"><div class="bar-fill" style="width:${r.carga/max*100}%"></div></div>
      <div style="width:46px;text-align:right;font-size:11px" class="muted">${r.carga}</div>
    </div>`).join('')}</div>`;
}
// Un bloque completo: resumen + KPIs de líder + los módulos ya existentes,
// ahora colapsables (Atrasados/por vencer, Carga, Estancados) para no llenar
// la pantalla — y un botón para avisarle al equipo por correo. idx identifica
// este bloque entre los que arma renderDashboardSecciones (para wire-up).

  const costoR=seccionCostoResumen(centros);
  const capR=seccionCapacidadResumen(centros);
  const maqR=seccionMaquinasResumen(centros);
  const costoDiffPct=(costoR.nValidos>0&&costoR.ideal>0)?((costoR.real-costoR.ideal)/costoR.ideal*100):null;
  const top3=liderId?seccionTop3HTML(liderId,people):'';
  return `
    <div style="margin:26px 0 14px;padding-top:18px;border-top:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

    </div>
    <div class="grid-cards" style="margin-bottom:16px">
      <div class="card"><div class="small muted">Proyectos activos</div><div style="font-size:24px;font-weight:700;margin-top:2px">${activos}</div><div class="small muted">${projects.length} en total</div></div>
      <div class="card"><div class="small muted">Entregables pendientes</div><div style="font-size:24px;font-weight:700;margin-top:2px">${pendientes}</div></div>
      <div class="card"><div class="small muted">Entregables a tiempo</div><div style="font-size:24px;font-weight:700;margin-top:2px">${aTiempo!==null?aTiempo+'%':'—'}</div><div class="small muted">promedio del equipo</div></div>
      <div class="card"><div class="small muted">Costo real vs. ideal</div><div style="font-size:24px;font-weight:700;margin-top:2px;color:${costoDiffPct===null?'inherit':costoDiffPct>5?'var(--bad)':costoDiffPct<-5?'var(--ok)':'var(--warn)'}">${costoDiffPct!==null?(costoDiffPct>=0?'+':'')+costoDiffPct.toFixed(0)+'%':'—'}</div><div class="small muted">${costoR.nValidos?fmtMoney(costoR.real)+'/mes real':'sin demanda capturada'}</div></div>
      <div class="card"><div class="small muted">Utilización de capacidad</div><div style="font-size:24px;font-weight:700;margin-top:2px">${capR.pct!==null?capR.pct.toFixed(0)+'%':'—'}</div><div class="small muted">${capR.cap>0?fmtNum(capR.real)+' de '+fmtNum(capR.cap)+' pz/día':'sin capacidad calculada'}</div></div>

    </div>
    ${top3}
    <div style="margin-bottom:16px">${progressBarHTML(deliverables)}</div>
    <details style="margin-bottom:12px">
      <summary style="cursor:pointer;font-weight:600;list-style:none">⏰ Atrasados y por vencer <span class="pill ${atrasados.length?'bad':'muted'}" style="margin-left:4px">${atrasados.length} atrasado${atrasados.length!==1?'s':''}</span> <span class="pill ${porVencer.length?'warn':'muted'}">${porVencer.length} por vencer</span></summary>

// Compone y abre un mailto: con un resumen real del equipo (atrasados/por
// vencer/estancados) — el líder (o admin) solo revisa y le da Enviar en su
// cliente de correo. No hay backend de correo en esta app: mailto es la
// forma sin dependencias de darles "la opción de avisar a su equipo".
const LIMITE_LISTA_AVISO=15;
function listaTxt(items,map){
  if(!items.length) return '(nada)';
  const shown=items.slice(0,LIMITE_LISTA_AVISO).map(map).join('\n');
  return items.length>LIMITE_LISTA_AVISO?shown+`\n… y ${items.length-LIMITE_LISTA_AVISO} más`:shown;
}
function dTxtLinea(d){
  const p=byId(DB.projects,d.projectId), u=byId(DB.users,d.assigneeId);
  return `- ${d.name} (${p?p.name:'—'}) — ${u?u.name:'—'} — ${fmtDate(d.dueDate)}`;
}
function enviarAvisoEquipo(titulo,scope){
  const {projects,people,deliverables}=scope;
  const {atrasados,porVencer}=vencidosListas(deliverables);
  const estancados=projects.filter(isProjectStalled);
  const destinatarios=[...new Set(people.map(u=>u.email).filter(e=>e&&e.includes('@')))];
  if(!destinatarios.length){ toast('Nadie en este equipo tiene correo capturado (Administración → Usuarios)','err'); return; }
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const dTxt=dTxtLinea;
  let body=`Aviso de equipo — ${titulo}\nGenerado el ${fecha}\n\n`
    +`⏰ ATRASADOS (${atrasados.length})\n${listaTxt(atrasados,dTxt)}\n\n`
    +`📅 POR VENCER en los próximos ${PROX_DIAS} días (${porVencer.length})\n${listaTxt(porVencer,dTxt)}\n\n`
    +`⏸ PROYECTOS ESTANCADOS (${estancados.length})\n${listaTxt(estancados,p=>`- ${p.name} — ${stalledLabel(p)}`)}\n\n`
    +`Enviado desde LI · Procesos.`;
  const subject=`Aviso de equipo — ${titulo}`;
  let mailto=`mailto:${destinatarios.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if(mailto.length>1800){
    // Cuerpo corto de respaldo — algunos clientes truncan/rechazan mailto: muy largos.
    const bodyCorto=`Aviso de equipo — ${titulo}\nGenerado el ${fecha}\n\n`
      +`⏰ ${atrasados.length} atrasado(s) · 📅 ${porVencer.length} por vencer · ⏸ ${estancados.length} estancado(s)\n\n`
      +`Revisa el detalle en LI · Procesos → Dashboard.`;
    mailto=`mailto:${destinatarios.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyCorto)}`;
  }
  abrirMailto(mailto);
}
// Vista previa en pantalla — EXACTAMENTE lo mismo que enviarAvisoIndividual
// manda por correo (mismos atrasados/por vencer/al día), pero como HTML en
// vez de texto plano, para que veas qué le va a llegar antes de mandarlo.
function resumenIndividualHTML(userId){
  const u=byId(DB.users,userId); if(!u) return '';
  const dels=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status!=='Entregado');
  const {atrasados,porVencer}=vencidosListas(dels);
  const idsFuera=new Set([...atrasados,...porVencer].map(d=>d.id));
  const alDia=dels.filter(d=>!idsFuera.has(d.id));
  const filaHTML=d=>{
    const p=byId(DB.projects,d.projectId);
    return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border2);font-size:12.5px;cursor:pointer" data-ir-proyecto="${d.projectId}" data-ir-entregable="${d.id}" title="Ver este entregable">
      <div><b>${esc(d.name)}</b> <span class="small muted">— ${p?esc(p.name):'—'}</span></div>
      <div class="small muted" style="white-space:nowrap">${fmtDate(d.dueDate)} ↗</div>
    </div>`;
  };
  const yaEnviado=(DB.notificaciones||[]).filter(n=>n.tipo==='aviso_individual'&&n.paraUserIds.includes(userId)&&n.emailEnviado).sort((a,b)=>b.emailEnviado.at-a.emailEnviado.at)[0];
  return `<div class="card" style="margin-bottom:16px">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:2px">${esc(u.name)} — ${dels.length} entregable${dels.length!==1?'s':''} pendiente${dels.length!==1?'s':''}</div>
    <div style="display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap">
      <span class="pill ${atrasados.length?'bad':'muted'}">${atrasados.length} atrasado${atrasados.length!==1?'s':''}</span>
      <span class="pill ${porVencer.length?'warn':'muted'}">${porVencer.length} por vencer (próx. ${PROX_DIAS} días)</span>
      <span class="pill ${alDia.length?'ok':'muted'}">${alDia.length} en tiempo</span>
    </div>
    ${atrasados.length?`<div style="font-weight:600;font-size:12px;color:var(--bad);margin-bottom:4px">⏰ Atrasados</div>${atrasados.map(filaHTML).join('')}`:''}
    ${porVencer.length?`<div style="font-weight:600;font-size:12px;color:var(--warn);margin:10px 0 4px">📅 Por vencer</div>${porVencer.map(filaHTML).join('')}`:''}
    ${alDia.length?`<div style="font-weight:600;font-size:12px;color:var(--ok);margin:10px 0 4px">✅ En tiempo</div>${alDia.map(filaHTML).join('')}`:''}
    ${!dels.length?'<div class="small muted" style="padding:8px 0">Sin pendientes — todo entregado.</div>':''}
    <div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn sm primary" id="btn-aviso-individual" ${!u.email?'disabled title="Sin correo capturado"':''}>✉️ Enviar aviso a ${esc(u.name)}</button>
      ${yaEnviado?`<span class="small muted">último enviado ${fmtWhen(yaEnviado.emailEnviado.at)}</span>`:''}
    </div>
  </div>`;
}
// Aviso a UNA sola persona (desde el filtro por usuario en Proyectos) — mismo
// criterio que el aviso de equipo, pero acotado a lo suyo, y deja registro
// como notificación in-app (con emailEnviado ya marcado, porque se manda ahí
// mismo al confirmar).
function enviarAvisoIndividual(userId){
  const u=byId(DB.users,userId); if(!u){ toast('Usuario no encontrado','err'); return; }
  if(!u.email||!u.email.includes('@')){ toast(`${u.name} no tiene correo capturado (Administración → Usuarios)`,'err'); return; }
  const dels=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status!=='Entregado');
  const {atrasados,porVencer}=vencidosListas(dels);
  const alDia=dels.length-atrasados.length-porVencer.length;
  const fecha=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  const nombrePersona=u.name.split(' ')[0];
  const body=`Hola ${nombrePersona}, este es tu resumen de pendientes al ${fecha}.\n\n`
    +`⏰ ATRASADOS (${atrasados.length})\n${listaTxt(atrasados,dTxtLinea)}\n\n`
    +`📅 POR VENCER en los próximos ${PROX_DIAS} días (${porVencer.length})\n${listaTxt(porVencer,dTxtLinea)}\n\n`
    +`Total pendiente: ${dels.length} (${alDia} al día)\n\n`
    +`Recuerda que las fechas son fijas — si algo no va a poder cumplirse, avísame para platicarlo con tiempo.\n\n— ${SESSION?.name||'Tu líder'}`;
  const subject=`Aviso individual — ${u.name}`;
  const mailto=`mailto:${u.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const n=crearNotificacion({tipo:'aviso_individual',texto:`Aviso personal de pendientes (${dels.length})`,paraUserIds:[userId]});
  n.emailEnviado={at:Date.now(),by:SESSION?.userId||null};
  saveDB();
  abrirMailto(mailto);
}
function renderDashboard(root){
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando dashboard…'); return; }
  if(!isLeader()){ renderDashboardIndividual(root); return; }
  renderDashboardSecciones(root);
}
// admin: ve todas las Secciones (toda la operación). Líder: SOLO ve la(s)
// Sección(es) donde él es el líder — su equipo, nada más (pedido explícito
// del usuario: "cada líder solo debe ver en su dashboard su información y de
// su equipo"). Un bloque por Sección visible, más "Sin sección asignada" al
// final solo para admin (es información cross-equipo, no le toca a un líder).
function renderDashboardSecciones(root){
  const misSecciones=isAdmin()?(DB.secciones||[]):(DB.secciones||[]).filter(s=>s.liderId===SESSION.userId);
  const bloques=misSecciones.map(sec=>({icon:'🧭',title:sec.nombre,liderId:sec.liderId,scope:seccionScope(sec)}));
  if(isAdmin()){
    const sinSeccion=seccionScope(null);
    if(sinSeccion.projects.length) bloques.push({icon:'⚠️',title:'Sin sección asignada',scope:sinSeccion});
  }
  // El resumen de arriba (3 tarjetas) solo tiene sentido cuando hay MÁS de un
  // bloque abajo — si solo ves tu propia Sección, ese resumen sería idéntico
  // al bloque único de abajo (se repetía el mismo número dos veces).
  let resumenHTML='';
  if(bloques.length>1){
    const today=todayISO();
    const dashProjects=[...new Map(bloques.flatMap(b=>b.scope.projects).map(p=>[p.id,p])).values()];
    const dashDeliverables=[...new Map(bloques.flatMap(b=>b.scope.deliverables).map(d=>[d.id,d])).values()];
    const activos=dashProjects.filter(p=>computeProjectStatus(p)==='Activo').length;
    const totalProy=dashProjects.length;
    const pendientes=dashDeliverables.filter(d=>d.status!=='Entregado').length;

/* ══════════════════════════════════════════════════════
   EQUIPO — perfiles básicos + carga de trabajo actual.
   Simplificado a propósito: sin nómina, sin evaluación mensual,
   sin organigrama visual (eliminados del alcance de esta vista).
══════════════════════════════════════════════════════ */
function cargaAbierta(userId){
  return (DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status!=='Entregado').length;
}
// ── "Barras" del expediente (Mi puesto) — solo con datos que la app ya
// tiene de verdad (entregables). null = "sin datos todavía" (nunca se
// inventa un número para que la barra se vea llena).
function statsCompletados(userId){
  const dels=(DB.deliverables||[]).filter(d=>d.assigneeId===userId);
  if(!dels.length) return null;
  return Math.round(dels.filter(d=>d.status==='Entregado').length/dels.length*100);
}
function statsATiempo(userId){
  const entregados=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado');
  if(!entregados.length) return null;
  const aTiempo=entregados.filter(d=>!d.dueDate||!d.updatedAt||new Date(d.updatedAt)<=new Date(d.dueDate+'T23:59:59'));
  return Math.round(aTiempo.length/entregados.length*100);
}
function statsCargaRelativa(userId){
  const todos=(DB.users||[]).map(u=>cargaAbierta(u.id));
  const max=Math.max(1,...todos);
  return Math.round(cargaAbierta(userId)/max*100);
}
// % de lo entregado que además fue APROBADO (botón "Aprobar" que ya existe
// en Proyectos) — es la señal más cercana que la app tiene de "efectivo",
// no solo "lo mandé" sino "alguien revisó y quedó bien".
function statsEfectivos(userId){
  const entregados=(DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado');
  if(!entregados.length) return null;
  return Math.round(entregados.filter(d=>d.approved).length/entregados.length*100);
}
// Números crudos (no %) para las 2 tarjetas junto a las barras.
function statsCumplidosCount(userId){
  return (DB.deliverables||[]).filter(d=>d.assigneeId===userId&&d.status==='Entregado').length;
}
function statsProyectosNoTerminados(userId){
  const ids=new Set((DB.deliverables||[]).filter(d=>d.assigneeId===userId).map(d=>d.projectId));
  return [...ids].map(id=>byId(DB.projects,id)).filter(Boolean).filter(p=>computeProjectStatus(p)!=='Cerrado').length;
}

/* ══════════════════════════════════════════════════════
   PT — PLAN DE TRABAJO. Cumplimiento mensual real por persona: cada
   entregable cuenta para el mes de su FECHA ORIGINAL (dueDateOriginal —
   nunca cambia, aunque la fecha de entrega sí se mueva después). Un cambio
   de fecha por algo fuera de las posibilidades de la persona NO se
   penaliza (se excluye del cálculo); un cambio por ineficiencia SÍ se
   penaliza, aunque termine cumpliendo la nueva fecha — mover la fecha fue
   lo que costó, no el resultado final.
══════════════════════════════════════════════════════ */
// 1 = cumplió completo, 0 = no cumplió, un número entre 0-1 = penalización
// parcial (ineficiencia), null = excluido del cálculo (fuera de su control).
function ptScoreEntregable(d){
  const cambios=d.cambiosFecha||[];
  const huboIneficiencia=cambios.some(c=>c.motivo==='ineficiencia');
  const entregadoATiempo=d.status==='Entregado'&&(!d.dueDate||!d.updatedAt||new Date(d.updatedAt)<=new Date(d.dueDate+'T23:59:59'));
  if(huboIneficiencia) return 1-(getGP().ptPenalizacion??0.5); // se penaliza aunque cumpla la fecha nueva
  if(entregadoATiempo) return 1;
  const huboFueraControl=cambios.some(c=>c.motivo==='fuera_de_control');
  if(huboFueraControl) return null; // no se le cuenta ni a favor ni en contra
  const vencidoSinEntregar=d.dueDate&&d.dueDate<todayISO()&&d.status!=='Entregado';
  if(vencidoSinEntregar) return 0; // no cumplió, sin ninguna justificación registrada
  return null; // todavía activo y dentro de fecha — no se evalúa hasta que venza o se entregue
}
// Cumplimiento de UNA persona en UN mes calendario (year, month 0-based).
function ptDelPeriodo(userId,year,month){
  const dels=(DB.deliverables||[]).filter(d=>{
    if(d.assigneeId!==userId) return false;
    const orig=d.dueDateOriginal||d.dueDate; if(!orig) return false;
    const dt=new Date(orig+'T00:00:00');
    return dt.getFullYear()===year&&dt.getMonth()===month;
  });
  const scores=dels.map(ptScoreEntregable).filter(s=>s!==null);
  const pct=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100):null;
  return {total:dels.length,evaluados:scores.length,excluidos:dels.length-scores.length,pct,deliverables:dels};
}
function ptMesActual(userId){ const hoy=new Date(); return ptDelPeriodo(userId,hoy.getFullYear(),hoy.getMonth()); }
function ultimoDiaDelMes(d){ return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
function esUltimoDiaDelMes(d){ return d.getDate()===ultimoDiaDelMes(d); }
const NOMBRES_MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
// Sin servidor no hay cron real — esto corre cada vez que alguien con
// visibilidad de equipo (admin/líder) entra a la app, y solo genera algo el
// día 15 o el último día del mes, una sola vez por persona y periodo (revisa
// si ya existe antes de crear otra). Si nadie entra ese día exacto, se genera
// en cuanto alguien vuelva a entrar — se queda pendiente, no se pierde.
function checkYGenerarNotificacionesPT(){
  if(!isLeader()||!dataReady()) return;
  const hoy=new Date();
  const esDia15=hoy.getDate()===15, esUltimo=esUltimoDiaDelMes(hoy);
  if(!esDia15&&!esUltimo) return;
  const periodo=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
  const tipo=esUltimo?'pt_mensual':'pt_quincena';
  let creoAlguna=false;
  (DB.users||[]).forEach(u=>{
    const yaExiste=(DB.notificaciones||[]).some(n=>n.tipo===tipo&&n.periodo===periodo&&n.paraUserIds.includes(u.id));
    if(yaExiste) return;
    const pt=ptMesActual(u.id);
    if(pt.evaluados===0) return; // nada evaluable todavía este mes
    const texto=esUltimo
      ? `Tu cumplimiento PT de ${NOMBRES_MES[hoy.getMonth()]}: ${pt.pct}% (${pt.evaluados} entregable${pt.evaluados!==1?'s':''} evaluado${pt.evaluados!==1?'s':''})`
      : `Tu PT acumulado hasta hoy en ${NOMBRES_MES[hoy.getMonth()]}: ${pt.pct}%`;
    const n=crearNotificacion({tipo,texto,paraUserIds:[u.id]});
    n.periodo=periodo;
    creoAlguna=true;
  });
  if(creoAlguna) saveDB();
}

/* ══════════════════════════════════════════════════════
   MI PUESTO — expediente individual: responsabilidades reales del DGP
   (catálogo DB.puestos) + "barras" tipo videojuego. Las barras de
   entregables son 100% calculadas de datos reales; las de KPIs de
   negocio del DGP las captura a mano quien administra el perfil
   (canEditPerfil) porque la app no mide calidad/producción todavía.
══════════════════════════════════════════════════════ */
function fifaBarHTML(label,value,sub,neutral){
  const known=value!=null;
  const pct=known?Math.max(0,Math.min(100,value)):0;
  // "neutral": la barra no es un desempeño a maximizar (ej. Carga actual —
  // más alto no es "mejor"), así que no se pinta con la escala ok/warn/bad.
  const color=!known?'var(--border2)':neutral?'var(--accent)':pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)';
  return `<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
      <span style="font-weight:600">${esc(label)}</span>
      <span class="${known?'':'muted'}" style="font-weight:700">${known?pct+'%':'Sin datos'}</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${known?pct:100}%;background:${color}"></div></div>
    ${sub?`<div class="small muted" style="margin-top:2px">${esc(sub)}</div>`:''}
  </div>`;
}
function listBlockHTML(title,items){
  if(!items||!items.length) return '';
  return `<div style="margin-bottom:16px">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px">${esc(title)}</div>
    <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  </div>`;
}

// Ambos diálogos guardan por ÍNDICE del indicador/resultado en el arreglo del
// puesto, nunca por su texto — Firebase prohíbe ".", "#", "$", "/", "[", "]"
// en las llaves, y casi todo resultado/indicador real trae alguno (los
// resultados esperados siempre terminan en punto; ya vimos un indicador con
// "/"). Usar el texto como llave tronaba el guardado en cuanto apareciera
// cualquiera de esos caracteres. Costo real: si el catálogo reordena la
// lista después, un valor ya capturado puede quedar bajo el renglón vecino
// — aceptable frente a que la captura fallara siempre.
function editKpisDlg(userId){
  const u=byId(DB.users,userId); if(!u) return;
  if(!canEditPerfil(userId)){ toast('No tienes permiso para esto','err'); return; }
  const puesto=puestoDeUsuario(u); if(!puesto) return;
  const rows=(puesto.indicadores||[]).map((k,i)=>`
    <label class="lbl" style="margin-top:${i?10:0}px">${esc(k.label)} <span class="muted">(meta: ${esc(k.meta)})</span></label>
    <input class="input" type="number" min="0" max="100" id="kv-${i}" value="${u.kpis?.[i]??''}" placeholder="% actual — déjalo vacío si no lo tienes"/>`).join('');
  openDlg({
    title:'Capturar KPIs', sub:esc(u.name)+' · '+esc(puesto.nombre),
    body:`<div class="small muted" style="margin-bottom:10px">Captura manual (0-100). La app no mide estos indicadores de negocio — solo los muestra para que quede a la vista el avance.</div>${rows}`,
    onSave:()=>{
      const kpis={...(u.kpis||{})};
      (puesto.indicadores||[]).forEach((k,i)=>{
        const raw=document.getElementById('kv-'+i).value;
        if(raw===''){ delete kpis[i]; return; }
        const n=Math.max(0,Math.min(100,Number(raw)));
        if(!Number.isNaN(n)) kpis[i]=n;
      });
      u.kpis=kpis;
      saveDB(); toast('KPIs actualizados ✓');
      render();
    }
  });
}
function editLogrosDlg(userId){
  const u=byId(DB.users,userId); if(!u) return;
  if(!canEditPerfil(userId)){ toast('No tienes permiso para esto','err'); return; }
  const puesto=puestoDeUsuario(u); if(!puesto) return;
  const resultados=puesto.resultadosEsperados||[];
  const rows=resultados.map((r,i)=>{
    const actual=u.logros?.[i]||'No evaluado';
    return `<label class="lbl" style="margin-top:${i?10:0}px">${esc(r)}</label>

    title:'Evaluar resultados esperados', sub:esc(u.name)+' · '+esc(puesto.nombre),
    body:resultados.length
      ?`<div class="small muted" style="margin-bottom:10px">Así se evalúa "Somos Efectivos" cada trimestre, según el DGP de este puesto.</div>${rows}`

/* ══════════════════════════════════════════════════════
   CENTRO DE TRABAJO — ingeniería nativa (balanceo de líneas, CIF, resumen
   de costos, equipos/mantenimiento). Puerto de la lógica de cálculo real
   de Control_CT_v7.html (verificada línea por línea antes de portar aquí
   — balanceo serie/paralelo, cuello de botella, Takt Time, costo ideal,
   semáforo de mantenimiento son fieles al original). La presentación se
   adapta al estilo ya establecido en esta app (.card/.tbl/.pill/
   .bar-track) en vez de replicar el CSS de la app vieja. Cada centro
   guarda su propia ingeniería directo en DB.centros[i] (mismo catálogo
   compartido de siempre — ver campos agregados en applyCTMigration).
══════════════════════════════════════════════════════ */
function curCT(){ return byId(DB.centros,_currentCentroId); }
function ctEnsureShape(c){
  c.ingenieroIds=c.ingenieroIds||[]; c.operaciones=c.operaciones||[]; c.personal=c.personal||[];
  c.cif=c.cif||[]; c.equipos=c.equipos||[]; c.flujos=c.flujos||[];
  c.params=c.params||{disponibleMin:480,dias:22,turnos:1,demanda:0};
  c.consideraciones=c.consideraciones||{items:[]};
  c.asignaciones=c.asignaciones||{};
  // Fase 4 — Plan de Inversion dentro de Centro de Trabajo:
  c.maquinas=c.maquinas||[];
  c.piezasPromedioDia=c.piezasPromedioDia||0;
  c.piezasPromedioMeta=c.piezasPromedioMeta||'';
}
function ctCostoHora(c){
  ctEnsureShape(c);
  const dias=c.params.dias||22, disponible=c.params.disponibleMin||480;
  const cons=(c.consideraciones.items||[]).filter(x=>x.activa!==false).reduce((a,x)=>a+(x.min||0),0);
  const horasMes=((disponible-cons)/60)*dias;
  const mod=c.personal.reduce((a,m)=>a+(m.costo||0),0);
  const cif=c.cif.reduce((a,x)=>a+(x.monto||0),0);
  return horasMes>0?(mod+cif)/horasMes:0;
}
// Capacidad real del centro (piezas/día) — única fuente, igual que ctCostoHora: sale
// del balanceo (operaciones+personal+asignaciones, vía ctCalcularResultados) en vez de
// recalcularse aparte en cada pantalla que la necesite.
function ctCapacidadDia(c){
  return ctCalcularResultados(c).capDia;
}
// Suma los conceptos de CIF de un centro cuyo nombre coincide con alguno de los
// patrones dados (insensible a mayúsculas/acentos) — única forma de leer "Renta"
// o "Energía" del CIF real, para no volver a teclearlos a mano en Máquinas.
function ctCifPorConcepto(c,patrones){
  ctEnsureShape(c);
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return c.cif.filter(x=>patrones.some(p=>norm(x.concepto).includes(norm(p)))).reduce((a,x)=>a+(x.monto||0),0);
}
function ctCifTotal(c){ ctEnsureShape(c); return c.cif.reduce((a,x)=>a+(x.monto||0),0); }
// Costo real vs. costo ideal (Takt Time) de un centro — única fuente, la misma
// que usa Resumen del centro, para que el dashboard de líderes agregue exactamente
// lo mismo que ya ves ahí adentro, nunca una fórmula recalculada aparte.
// costoRealMensual/costoIdealMensual son $/mes (sumables entre centros); costoRealHr/
// costoIdealHr son $/hr (NO sumables entre centros con distintas horas/mes).
function ctCostoIdealCalc(c){
  const r=ctCalcularResultados(c);
  const modMensual=c.personal.reduce((a,m)=>a+(m.costo||0),0);
  const cifMensual=c.cif.reduce((a,x)=>a+(x.monto||0),0);
  const opTot=Math.max(1,c.personal.length);
  const horasMes=(r.tiempoReal/60)*r.dias;
  const costoRealMensual=modMensual+cifMensual;
  const costoRealHr=ctCostoHora(c);
  if(!(r.demanda&&r.taktTime)) return {valido:false, costoRealHr, costoRealMensual};
  const opsTeoricos=Math.ceil(r.totalOps/r.taktTime);
  const costoPorOp=modMensual/opTot;
  const modIdealMensual=costoPorOp*opsTeoricos;
  const costoIdealMensual=modIdealMensual+cifMensual;
  const costoIdealHr=horasMes>0?costoIdealMensual/horasMes:0;
  return {valido:true, costoRealHr, costoRealMensual, costoIdealHr, costoIdealMensual, opTot, opsTeoricos};
}

function parseNum(v){ var n=parseFloat((v+'').toString().replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function fmtNum(v){ return (parseNum(v)).toLocaleString('es-MX',{maximumFractionDigits:2}); }
function fmtMoney(v){ return '$'+(parseNum(v)).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  return map[token]!==undefined?map[token]:0;
}

// calcVar/calcVarRaw reciben la MAQUINA directo (m), no un id + arreglo global —
// aqui no hay un unico MACHINES plano, cada centro tiene su propio c.maquinas[].
function calcVar(m, varId) {
  if (!m || !m.vars) return 0;
  var mv = m.vars[varId];
  if (!mv || !mv.on) return 0;
  if (mv.mode === "simple") return parseNum(mv.simpleVal) || 0;
  var gp = getGP();
  var vdef = VAR_LIB.find(function(v){ return v.id === varId; });
  var rows = mv.detail || (vdef ? JSON.parse(JSON.stringify(vdef.detail)) : []);
  var acc = null;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var val = row.type === "global" ? resolveGlobal(row.val, gp) : parseNum(row.val);
    if (acc === null) acc = val;
    else {
      var op = row.op;
      if (op === "+") acc = acc + val;
      else if (op === "-") acc = acc - val;
      else if (op === "*") acc = acc * val;
      else if (op === "/") acc = val !== 0 ? acc / val : 0;
    }
  }
  return acc || 0;
}
function calcVarRaw(m, varId) {
  if (!m || !m.vars) return 0;
  var mv = m.vars[varId];
  if (!mv) return 0;
  if (mv.mode === "simple") return parseNum(mv.simpleVal) || 0;
  var gp = getGP();
  var vdef = VAR_LIB.find(function(v){ return v.id === varId; });
  var rows = mv.detail || (vdef ? JSON.parse(JSON.stringify(vdef.detail)) : []);
  var acc = null;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var val = row.type === "global" ? resolveGlobal(row.val, gp) : parseNum(row.val);
    if (acc === null) acc = val;
    else {
      var op = row.op;
      if (op === "+") acc = acc + val;
      else if (op === "-") acc = acc - val;
      else if (op === "*") acc = acc * val;
      else if (op === "/") acc = val !== 0 ? acc / val : 0;
    }
  }
  return acc || 0;
}
function calcOpex(m) {
  var total = 0;
  if (!m.vars || typeof m.vars !== 'object' || Array.isArray(m.vars)) return 0;
  Object.keys(m.vars).forEach(function(vid) {
    var vdef = VAR_LIB.find(function(v){ return v.id === vid; });
    if (vdef && vdef.cat === "opex") total += calcVar(m, vid);
  });
  return total;
}
function calcBenefits(m) {
  var total = 0;
  if (!m.vars || typeof m.vars !== 'object' || Array.isArray(m.vars)) return 0;
  Object.keys(m.vars).forEach(function(vid) {
    var vdef = VAR_LIB.find(function(v){ return v.id === vid; });
    if (vdef && vdef.cat !== "opex") total += calcVar(m, vid);
  });
  return total;
}
// "ROI Proyectado" — basado en supuestos capturados al planear la compra.
function calcROI(m) {
  var ab = calcBenefits(m);
  var opx = calcOpex(m) + (parseNum(m.opx)||0);
  var fl = ab - opx;
  var netInv = (m.inv||0) - (m.replaceVal||0);
  var tot = fl * (m.yr||1) + (m.res||0);
  var ng = tot - netInv;
  var roi = netInv > 0 ? (ng / netInv) * 100 : 0;
  var pay = fl > 0 ? netInv / fl : Infinity;
  return { ab:ab, opx:opx, fl:fl, ng:ng, roi:roi, pay:pay, netInv:netInv };
}

// "ROI Real" — con base en lo que de verdad se produce, no en supuestos. m = maquina,
// c = su Centro de Trabajo (para repartir c.piezasPromedioDia entre las maquinas que
// no tengan su propia captura manual).
function cantidadDiaReal(m, c) {
  var manual = parseNum(m.unidadManualDia);
  if (manual > 0) return manual;
  var total = parseNum(c && c.piezasPromedioDia);
  if (!(total > 0)) return null;
  var comparten = ((c && c.maquinas) || []).filter(function(x){
    return !(parseNum(x.unidadManualDia) > 0);
  }).length || 1;
  return total / comparten;
}
function valorRealPorUnidad(m) {
  var vpp = parseNum(m.valorPorPieza);
  var ant = parseNum(m.costoAnteriorPorPieza);
  if (ant > 0) return ant - vpp;
  return vpp;
}
function gananciaPorPiezas(m, c) {
  var ctP = cantidadDiaReal(m, c);
  var vpp = valorRealPorUnidad(m);
  if (!ctP || !(vpp > 0)) return null;
  // Se anualiza SIEMPRE con la misma base — días hábiles/mes × meses/año (Parámetros
  // globales), nunca 365 días de calendario. Antes, "cantidad manual por día" usaba
  // 365 (asumiendo produccion los 7 dias de la semana, todo el ano) mientras que el
  // reparto por CT usaba dias habiles reales — mismo tipo de dato, dos resultados
  // distintos. Corregido: una sola base de anualizacion para los dos caminos.
  var gp = getGP();
  var diasHabilesAno = (gp.days||21.5) * (gp.months||12);
  var usaManual = parseNum(m.unidadManualDia) > 0;
  if (usaManual) {
    var periodo = m.unidadManualPeriodo || 'dia';
    var periodosPorAno = periodo === 'semana' ? diasHabilesAno/5 : periodo === 'mes' ? (gp.months||12) : diasHabilesAno;
    return ctP * vpp * periodosPorAno;
  }
  return ctP * vpp * diasHabilesAno;
}
function roiPorPiezas(m, abReal) {
  var yaEsNeto = parseNum(m.costoAnteriorPorPieza) > 0;
  var opx = yaEsNeto ? 0 : (calcOpex(m) + (parseNum(m.opx)||0));
  var fl = abReal - opx;
  var netInv = (m.inv||0) - (m.replaceVal||0);
  var tot = fl * (m.yr||1) + (m.res||0);
  var ng = tot - netInv;
  var roi = netInv > 0 ? (ng / netInv) * 100 : 0;
  var pay = fl > 0 ? netInv / fl : Infinity;
  return { roi: roi, pay: pay, fl: fl, netInv: netInv };
}
function acumuladoReal(m, c) {
  var abReal = gananciaPorPiezas(m, c);
  if (abReal === null || !m.fechaInicioOperacion) return null;
  var inicio = new Date(m.fechaInicioOperacion + 'T00:00:00');
  if (isNaN(inicio.getTime())) return null;
  var diasCal = Math.round((new Date() - inicio) / 86400000);
  if (diasCal < 0) return null;
  var rr = roiPorPiezas(m, abReal);
  var meses = diasCal / 30.44;
  var acumulado = (rr.fl / 12) * meses;
  return {
    acumulado: acumulado, dias: diasCal, meses: meses, netInv: rr.netInv,
    pagada: acumulado >= rr.netInv, excedente: acumulado - rr.netInv,
    faltante: rr.netInv - acumulado,
    pctRecuperado: rr.netInv > 0 ? Math.min(100, (acumulado / rr.netInv) * 100) : 0
  };
}
// ── Estatus de máquina (portado de LineaItalia.html) ──
const STATUS_OPTIONS=[
  {key:'operando',         label:'Operando',           icon:'✅', color:'#16A34A', defaultSub:'Con ahorro real capturado'},
  {key:'transito',         label:'En tránsito',        icon:'🚛', color:'#7C3AED', defaultSub:'Comprada, aún no llega a planta'},
  {key:'recien_instalada', label:'Recién instalada',   icon:'🆕', color:'#2563EB', defaultSub:''},
  {key:'tramite',          label:'Compra en trámite',  icon:'📄', color:'#D97706', defaultSub:'Solicitud interna, aún no instalada'},
  {key:'cotizacion',       label:'En cotización',      icon:'🚚', color:'#6B7280', defaultSub:'Aún no se compra'},
  {key:'en_venta',         label:'En venta',           icon:'📤', color:'#DC2626', defaultSub:'Máquina en proceso de venta/baja'},
];
function mEstatus(m,hd){
  const opt=STATUS_OPTIONS.find(s=>s.key===m.status);
  if(opt) return {key:opt.key,label:opt.label,icon:opt.icon,color:opt.color,sub:(m.statusNota||opt.defaultSub)};
  return hd ? {key:'operando',label:'Operando',icon:'✅',sub:'Con ahorro real capturado',color:'#16A34A'}
            : {key:'cotizacion',label:'En cotización',icon:'🚚',sub:'Aún no se compra',color:'#6B7280'};
}
const STATUS_SORT_PRIORITY={operando:0,transito:1,recien_instalada:2,tramite:3,cotizacion:4,en_venta:5};
function statusSortPriority(m){
  const r=calcROI(m), est=mEstatus(m,r.ab>0);
  const p=STATUS_SORT_PRIORITY[est.key];
  return p===undefined?99:p;
}
// ── Compresión de imágenes para heroPhoto (portado de LineaItalia.html) ──
function compressImg(file,maxW,maxH,quality,callback){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      if(h>maxH){ w=Math.round(w*maxH/h); h=maxH; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function centrosResumenHTML(centros){
  const filas=centros.map(c=>{
    ctEnsureShape(c);
    const mod=c.personal.reduce((a,p)=>a+(p.costo||0),0);
    const cif=c.cif.reduce((a,x)=>a+(x.monto||0),0);
    return {nombre:c.nombre, costo:mod+cif};
  }).filter(f=>f.costo>0).sort((a,b)=>b.costo-a.costo);
  if(!filas.length) return '';
  const total=filas.reduce((a,f)=>a+f.costo,0);
  const top=filas.slice(0,8);
  const resto=filas.slice(8);
  const barras=top.map(f=>{
    const pct=total>0?(f.costo/total*100):0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
        <span style="font-weight:600">${esc(f.nombre)}</span>
        <span style="font-weight:700">${fmtMoney(f.costo)} <span class="small muted" style="font-weight:400">(${pct.toFixed(1)}%)</span></span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:18px">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:2px">📊 ¿Cuánto representa cada centro?</div>
    <div class="small muted" style="margin-bottom:12px">Costo mensual (MOD + CIF) de cada centro vs. el total de ${fmtMoney(total)}/mes entre los ${filas.length} centros con datos capturados.</div>
    ${barras}
    ${resto.length?`<div class="small muted" style="margin-top:4px">+ ${resto.length} centro${resto.length!==1?'s':''} más, ${fmtMoney(resto.reduce((a,f)=>a+f.costo,0))}/mes en total (${(resto.reduce((a,f)=>a+f.costo,0)/total*100).toFixed(1)}%)</div>`:''}
  </div>`;
}

/* ── Distribución: operaciones, personal, asignación, balanceo ── */
function ctTC(o){ return (o.min||0)*(o.piezas||1)/(o.recursos||1); }
function ctCalcularResultados(c){
  ctEnsureShape(c);
  const p=c.params, disponible=p.disponibleMin||480, dias=p.dias||22, demanda=p.demanda||0;
  const ops=c.operaciones.filter(o=>o.activa!==false);
  ops.forEach(o=>{ if(!o.depende) o.depende=[]; });
  const cons=(c.consideraciones.items||[]).filter(x=>x.activa!==false).reduce((a,x)=>a+(x.min||0),0);
  const tiempoReal=disponible-cons;
  const totalOps=ops.reduce((a,o)=>a+(o.min||0),0);
  const asigs=c.asignaciones||{};
  const flujos=c.flujos||[];
  function calcGrupo(opsGrupo,modo){
    if(!opsGrupo.length) return {tc:0,cap:0,cuello:null};
    if(modo==='paralelo'){
      const cap=opsGrupo.reduce((sum,o)=>{ const base=(o.min||0)*(o.piezas||1); return sum+(base>0?Math.floor(tiempoReal/base)*(o.recursos||1):0); },0);
      let tc=0,cuello=null; opsGrupo.forEach(o=>{ const t=ctTC(o); if(t>tc){tc=t;cuello=o;} });
      return {tc,cap,cuello};
    }
    const carga={};
    opsGrupo.forEach(o=>{
      const idx=c.operaciones.indexOf(o), t=ctTC(o);
      const a=(asigs[idx]||asigs[String(idx)]||[]).map(Number); const n=a.length||1;
      a.forEach(mi=>{ carga[mi]=(carga[mi]||0)+t/n; });
    });
    let tc=0,cuello=null;
    if(Object.keys(carga).length){
      tc=Math.max(...Object.values(carga));
      const mi=Object.keys(carga).reduce((a,b)=>carga[a]>carga[b]?a:b);
      cuello=c.personal[Number(mi)];
    } else { opsGrupo.forEach(o=>{ const t=ctTC(o); if(t>tc){tc=t;cuello=o;} }); }
    return {tc,cap:tc>0?Math.floor(tiempoReal/tc):0,cuello};
  }
  const porFlujo=flujos.map(f=>{
    const opsFlujo=ops.filter(o=>o.flujo===f.id);
    const modo=opsFlujo[0]?.modoFlujo||'serie';
    return {nombre:f.nombre,modo,ops:opsFlujo,...calcGrupo(opsFlujo,modo)};
  }).filter(r=>r.ops.length);
  const opsSinFlujo=ops.filter(o=>!o.flujo||!flujos.find(f=>f.id===o.flujo));
  if(opsSinFlujo.length) porFlujo.push({nombre:'Sin flujo',modo:'serie',ops:opsSinFlujo,...calcGrupo(opsSinFlujo,'serie')});
  const capDia=porFlujo.reduce((a,r)=>a+r.cap,0);
  const cuelloGlobal=porFlujo.length?porFlujo.reduce((a,b)=>a.cap<b.cap?a:b):null;
  const tiempoCiclo=cuelloGlobal?cuelloGlobal.tc:(ops.length?Math.max(...ops.map(ctTC)):0);
  const demandaDia=demanda>0?demanda/dias:0;
  const taktTime=demandaDia>0?tiempoReal/demandaDia:0;
  return {disponible,dias,tiempoReal,totalOps,porFlujo,capDia,cuelloGlobal,tiempoCiclo,taktTime,demanda};
}
function ctAutoBalancear(c){
  ctEnsureShape(c);
  const ops=c.operaciones.filter(o=>o.activa!==false).sort((a,b)=>b.min-a.min);
  const personal=c.personal.filter(m=>m.presente!==false);
  if(!ops.length||!personal.length){ toast('Necesitas operaciones y personal capturados primero','err'); return; }
  c.asignaciones={};
  const carga={}; personal.forEach(m=>{ carga[c.personal.indexOf(m)]=0; });
  ops.forEach(o=>{
    const opIdx=c.operaciones.indexOf(o);
    const candidatos=personal.filter(m=>{ const h=m.habilidades||[]; return h.length===0||h.includes(opIdx); });
    if(!candidatos.length){ c.asignaciones[opIdx]=[]; return; }
    const elegido=candidatos.reduce((a,b)=>(carga[c.personal.indexOf(a)]||0)<=(carga[c.personal.indexOf(b)]||0)?a:b);
    const mIdx=c.personal.indexOf(elegido);
    c.asignaciones[opIdx]=[mIdx];
    carga[mIdx]=(carga[mIdx]||0)+(o.min||0);
  });
  c.updatedAt=Date.now();
  saveDB(); toast('Auto-balanceado ✓'); render();
}

/* ── Resumen: costo/hora real vs. ideal (Takt Time) ── */
function renderCTResumen(el,c){
  const r=ctCalcularResultados(c);
  const modMensual=c.personal.reduce((a,m)=>a+(m.costo||0),0);
  const cifMensual=c.cif.reduce((a,x)=>a+(x.monto||0),0);
  const opTot=Math.max(1,c.personal.length);
  const horasMes=(r.tiempoReal/60)*r.dias;
  // Única fuente del costo/hora real del centro — ctCostoHora(c) — para que
  // Máquinas y cualquier otro cálculo que lo necesite usen siempre el mismo
  // valor, nunca uno recalculado aparte (mismo número, misma fórmula).
  const costoReal=ctCostoHora(c);
  let idealHTML='<div class="small muted">Captura demanda mensual en Parámetros (pestaña Distribución) para calcular el costo ideal.</div>';
  if(r.demanda&&r.taktTime){
    const opsTeoricos=Math.ceil(r.totalOps/r.taktTime);
    const costoPorOp=modMensual/opTot;
    const modIdeal=costoPorOp*opsTeoricos;
    const costoIdeal=horasMes>0?(modIdeal+cifMensual)/horasMes:0;
    const diff=costoReal-costoIdeal, isOver=diff>0, pct=costoIdeal?Math.abs(diff/costoIdeal*100):0;
    idealHTML=`<div style="font-weight:700;font-size:14px;margin-bottom:8px;color:${Math.abs(diff)<costoIdeal*0.05?'var(--warn)':isOver?'var(--bad)':'var(--ok)'}">
        ${Math.abs(diff)<costoIdeal*0.05?'🎯 Operando cerca del ideal':isOver?'🚨 Más personal del que la demanda justifica':'✅ Por debajo del costo ideal'}</div>
      <div class="grid-cards">
        <div class="card" style="background:var(--surface2)"><div class="small muted">Costo real</div><div style="font-size:18px;font-weight:700">$${costoReal.toFixed(2)}/hr</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Costo ideal</div><div style="font-size:18px;font-weight:700;color:var(--ok)">$${costoIdeal.toFixed(2)}/hr</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Operadores reales vs. teóricos</div><div style="font-size:18px;font-weight:700">${opTot} vs. ${opsTeoricos}</div></div>
      </div>
      <div class="small muted" style="margin-top:10px;background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.9;font-family:monospace">
        Takt Time = ${r.tiempoReal.toFixed(0)} min ÷ (${r.demanda} pzas ÷ ${r.dias} días) = ${r.taktTime.toFixed(2)} min/pza<br>
        Operadores teóricos = ⌈${r.totalOps.toFixed(2)} ÷ ${r.taktTime.toFixed(2)}⌉ = ${opsTeoricos}<br>
        Costo promedio/op = $${modMensual.toLocaleString('es-MX',{minimumFractionDigits:2})} ÷ ${opTot} = $${costoPorOp.toFixed(2)}/op<br>
        MOD ideal = $${costoPorOp.toFixed(2)} × ${opsTeoricos} = $${modIdeal.toLocaleString('es-MX',{minimumFractionDigits:2})}<br>
        Total ideal = ($${modIdeal.toLocaleString('es-MX',{minimumFractionDigits:2})} + $${cifMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}) ÷ ${horasMes.toFixed(1)} hrs = $${costoIdeal.toFixed(2)}/hr
      </div>
      <div style="margin-top:12px;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100,(costoIdeal/Math.max(costoReal,costoIdeal,0.01)*100))}%;background:var(--ok);border-radius:5px"></div>
      </div>
      <div class="small muted" style="margin-top:4px">Diferencia: ${isOver?'+':''}$${Math.abs(diff).toFixed(2)}/hr (${pct.toFixed(1)}%) · ${isOver?'+$'+Math.abs(diff*horasMes).toLocaleString('es-MX',{minimumFractionDigits:2})+'/mes':'ahorro de $'+Math.abs(diff*horasMes).toLocaleString('es-MX',{minimumFractionDigits:2})+'/mes'}</div>`;
  }
  // Única fuente de la capacidad real del centro — ctCapacidadDia(c) — mismo criterio
  // que el costo/hora: un solo valor, todos lo consultan, nadie lo recalcula aparte.
  const capDia=ctCapacidadDia(c);
  el.innerHTML=`<div class="card" style="margin-bottom:16px">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:10px">📊 Costo/hora real</div>
      <div class="grid-cards">
        <div class="card" style="background:var(--surface2)"><div class="small muted">MOD mensual</div><div style="font-size:18px;font-weight:700">$${modMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">CIF mensual</div><div style="font-size:18px;font-weight:700">$${cifMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Horas reales/mes</div><div style="font-size:18px;font-weight:700">${horasMes.toFixed(1)}</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Costo/hora</div><div style="font-size:18px;font-weight:700;color:var(--accent)">$${costoReal.toFixed(2)}</div></div>
      </div>
      <div class="small muted" style="margin-top:10px;background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.9;font-family:monospace">
        MOD: $${modMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}/mes (${opTot} operario${opTot!==1?'s':''}) · CIF: $${cifMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}/mes<br>
        Costo/hr = ($${modMensual.toLocaleString('es-MX',{minimumFractionDigits:2})} + $${cifMensual.toLocaleString('es-MX',{minimumFractionDigits:2})}) ÷ ${horasMes.toFixed(1)} hrs = $${costoReal.toFixed(2)}/hr
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:10px">⚙️ Capacidad del centro</div>
      <div class="grid-cards">
        <div class="card" style="background:var(--surface2)"><div class="small muted">Capacidad (balanceo)</div><div style="font-size:18px;font-weight:700;color:var(--accent)">${capDia} pzas/día</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Producción real promedio</div><div style="font-size:18px;font-weight:700">${c.piezasPromedioDia?fmtNum(c.piezasPromedioDia)+' pzas/día':'Sin captura'}</div></div>
        <div class="card" style="background:var(--surface2)"><div class="small muted">Utilización</div><div style="font-size:18px;font-weight:700">${capDia>0&&c.piezasPromedioDia?(c.piezasPromedioDia/capDia*100).toFixed(0)+'%':'—'}</div></div>
      </div>
      <div class="small muted" style="margin-top:8px">Capacidad = lo que el balanceo (Distribución) dice que el centro puede producir. Producción real = el promedio real capturado (piezas/día del centro, usado también en Máquinas).</div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:10px">🎯 Costo ideal (Takt Time)</div>
      ${idealHTML}
    </div>`;
}

/* ── Equipos: inventario + semáforo de mantenimiento (mismos umbrales que
     Control_CT: vencido si ya pasó, ámbar si faltan ≤15 días, si no verde) ── */
function ctMttoStatus(proxMtto){
  if(!proxMtto) return {pill:'muted',label:'Sin fecha'};
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const prox=new Date(proxMtto+'T00:00:00');
  const diff=Math.ceil((prox-hoy)/86400000);
  if(diff<0) return {pill:'bad',label:'Vencido '+Math.abs(diff)+'d'};
  if(diff<=15) return {pill:'warn',label:'En '+diff+' días'};
  return {pill:'ok',label:'Vigente'};
}

function maqCostosCTDefault(){
  return [
    {concepto:'Renta (espacio)',antes:0,ahora:0,esMoney:true},
    {concepto:'Luz / Energía',antes:0,ahora:0,esMoney:true},
    {concepto:'MOI y otros indirectos',antes:0,ahora:0,esMoney:true},
    {concepto:'Capacidad de producción (pzas/día)',antes:0,ahora:0,esMoney:false},
  ];
}
// Intenta traer el valor "con la máquina" en vivo: si el concepto suena a Renta/Luz
// usa el CIF real del centro; si suena a Capacidad usa ctCapacidadDia(c); si no,
// devuelve null (el usuario lo captura a mano).
function maqCostosCTAutoValor(c,concepto){
  const s=(concepto||'').toLowerCase();
  if(s.includes('renta')) return ctCifPorConcepto(c,['renta']);
  if(s.includes('luz')||s.includes('energ')) return ctCifPorConcepto(c,['energ','luz']);
  if(s.includes('capacidad')) return ctCapacidadDia(c);
  if(s.includes('moi')||s.includes('indirect')) return Math.max(0,ctCifTotal(c)-ctCifPorConcepto(c,['renta'])-ctCifPorConcepto(c,['energ','luz']));
  return null;
}

  document.getElementById('mi-model').addEventListener('change',e=>maqUpd(c,m,'model',e.target.value.trim()));
  document.getElementById('mi-frase').addEventListener('change',e=>maqUpd(c,m,'frase',e.target.value.trim()));
  document.getElementById('mi-status').addEventListener('change',e=>{ maqUpd(c,m,'status',e.target.value); render(); });

  el.querySelectorAll('[data-cct-antes]').forEach(inp=>inp.addEventListener('change',e=>{
    m.costosCT[Number(e.target.dataset.cctAntes)].antes=parseNum(e.target.value); c.updatedAt=Date.now(); saveDB(); render();
  }));
  el.querySelectorAll('[data-cct-ahora]').forEach(inp=>inp.addEventListener('change',e=>{
    m.costosCT[Number(e.target.dataset.cctAhora)].ahora=parseNum(e.target.value); c.updatedAt=Date.now(); saveDB(); render();
  }));
  el.querySelectorAll('[data-cct-auto]').forEach(b=>b.addEventListener('click',()=>{
    m.costosCT[Number(b.dataset.cctAuto)].ahora=parseNum(b.dataset.cctAutoVal); c.updatedAt=Date.now(); saveDB(); render();
  }));
}
// Todos los valores reales que ya tiene capturados el Centro de Trabajo — cada
// concepto de CIF, más costo/hora, capacidad y MOD — para elegirlos de un
// desplegable en vez de teclear el nombre y adivinar si el 🔄 lo va a encontrar.
function ctValoresDisponibles(c){
  ctEnsureShape(c);
  const out=c.cif.map(x=>({label:`CIF: ${x.concepto} — ${fmtMoney(x.monto||0)}`,concepto:x.concepto,valor:x.monto||0,esMoney:true}));
  out.push({label:`Costo/hora del centro — ${fmtMoney(ctCostoHora(c))}/hr`,concepto:'Costo/hora del centro',valor:ctCostoHora(c),esMoney:true});
  out.push({label:`Capacidad de producción — ${fmtNum(ctCapacidadDia(c))} pzas/día`,concepto:'Capacidad de producción (pzas/día)',valor:ctCapacidadDia(c),esMoney:false});
  out.push({label:`MOD (personal) mensual — ${fmtMoney(c.personal.reduce((a,p)=>a+(p.costo||0),0))}`,concepto:'MOD (personal) mensual',valor:c.personal.reduce((a,p)=>a+(p.costo||0),0),esMoney:true});
  if(c.piezasPromedioDia) out.push({label:`Producción real promedio — ${fmtNum(c.piezasPromedioDia)} pzas/día`,concepto:'Producción real promedio (pzas/día)',valor:c.piezasPromedioDia,esMoney:false});
  return out;
}
function maqCostosCTDlg(c,m,idx){
  const r=idx!=null?m.costosCT[idx]:null;
  const valores=ctValoresDisponibles(c);
  openDlg({
    title:r?'Editar concepto':'Nuevo concepto', sub:esc(m.name)+' — Costos del Centro de Trabajo',
    body:`<label class="lbl">Traer de los valores del centro (opcional)</label>
      <select class="select-input" id="cct-quick">
        <option value="">— Elegir un valor real de ${esc(c.nombre)} —</option>
        ${valores.map((v,i)=>`<option value="${i}">${esc(v.label)}</option>`).join('')}
      </select>
      <label class="lbl" style="margin-top:10px">Concepto *</label><input class="input" id="cct-concepto" value="${esc(r?.concepto||'')}" placeholder="Ej. Renta, Luz, MOI, Capacidad, Seguridad..."/>
      <label class="lbl" style="margin-top:10px">Sin la máquina</label><input class="input" type="number" step="0.01" id="cct-antes" value="${r?.antes??0}"/>
      <label class="lbl" style="margin-top:10px">Con la máquina</label><input class="input" type="number" step="0.01" id="cct-ahora" value="${r?.ahora??0}"/>
      <label class="lbl" style="margin-top:10px"><input type="checkbox" id="cct-money" ${r?.esMoney!==false?'checked':''}/> Es un valor monetario ($) — desmárcalo para cosas como capacidad (pzas/día)</label>`,
    onSave:()=>{
      const concepto=document.getElementById('cct-concepto').value.trim();
      if(!concepto){ toast('Ingresa un concepto'); return false; }
      const entry={concepto,antes:parseNum(document.getElementById('cct-antes').value),ahora:parseNum(document.getElementById('cct-ahora').value),esMoney:document.getElementById('cct-money').checked};
      if(idx!=null) m.costosCT[idx]=entry; else m.costosCT.push(entry);
      c.updatedAt=Date.now(); saveDB(); toast('Guardado ✓'); render();
    }
  });
  document.getElementById('cct-quick').addEventListener('change',e=>{
    if(e.target.value===''){ return; }
    const v=valores[Number(e.target.value)];
    document.getElementById('cct-concepto').value=v.concepto;
    document.getElementById('cct-ahora').value=v.valor;
    document.getElementById('cct-money').checked=v.esMoney;
  });
}

function renderMaqTabVars(el,c,m){
  m.vars=m.vars||{};
  const cats=['costos','personal','produccion','calidad','mercado','capacidad','opex'];
  let h='';
  cats.forEach(cat=>{
    const catVars=VAR_LIB.filter(v=>v.cat===cat);
    h+=`<div class="card" style="margin-bottom:10px"><div style="font-weight:700;font-size:12.5px;margin-bottom:8px">${CAT_NAMES[cat]}</div>`;
    catVars.forEach(vdef=>{
      const mv=m.vars[vdef.id]||{on:false,mode:'detail',detail:JSON.parse(JSON.stringify(vdef.detail))};
      const isOn=mv.on; const isOpen=_openVarId===vdef.id&&isOn;
      const result=calcVar(m,vdef.id);
      h+=`<div style="border-bottom:1px solid var(--border2);padding:6px 0">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn xs ${isOn?'primary':''}" data-tog-var="${vdef.id}">${isOn?'ON':'OFF'}</button>
          <div style="flex:1;font-size:12.5px;${isOn?'':'color:var(--muted)'}">${vdef.name}</div>
          ${isOn?`<div class="small" style="font-weight:700">${fmtMoney(result)}/año</div><button class="btn xs" data-exp-var="${vdef.id}">${isOpen?'▲':'▼'}</button>`:''}
        </div>
        ${isOpen?`<table class="tbl" style="margin-top:8px"><tbody>${mv.detail.map((row,ri)=>`
          <tr><td style="width:60%">${esc(row.label)}</td>
          <td>${row.type==='global'?`<span class="pill muted">${row.val}</span>`:`<input class="input" style="width:110px" data-var-row="${vdef.id}|${ri}" value="${row.val}">`}</td>
          <td class="small muted">${row.op}</td></tr>`).join('')}</tbody></table>`:''}
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('[data-tog-var]').forEach(b=>b.addEventListener('click',()=>{
    const vid=b.dataset.togVar;
    if(!m.vars[vid]){ const vdef=VAR_LIB.find(v=>v.id===vid); m.vars[vid]={on:false,mode:'detail',detail:JSON.parse(JSON.stringify(vdef.detail))}; }
    m.vars[vid].on=!m.vars[vid].on;
    if(m.vars[vid].on) _openVarId=vid;
    c.updatedAt=Date.now(); saveDB(); render();
  }));
  el.querySelectorAll('[data-exp-var]').forEach(b=>b.addEventListener('click',()=>{
    _openVarId=(_openVarId===b.dataset.expVar)?null:b.dataset.expVar; render();
  }));
  el.querySelectorAll('[data-var-row]').forEach(inp=>inp.addEventListener('change',e=>{
    const [vid,ri]=e.target.dataset.varRow.split('|');
    m.vars[vid].detail[Number(ri)].val=parseNum(e.target.value);
    c.updatedAt=Date.now(); saveDB(); render();
  }));
}

function renderEquipo(root){
  if(!dataReady()){ root.innerHTML=loadingHTML('Cargando equipo…'); return; }
  root.innerHTML=`<div class="view-head"><div><h1>Equipo</h1>
    <div class="view-sub">Quién es quién y cuánto tiene abierto ahora mismo.</div></div></div>
    <details class="proj-col" open style="margin-bottom:16px">
      <summary>🪪 Mi puesto</summary>
      <div class="proj-col-inner" id="equipo-mipuesto"></div>
    </details>
    <div id="equipo-body"></div>`;
  // "Mi puesto" vive aquí adentro, siempre tu propio expediente — nunca el de
  // quien hayas visto la última vez desde una tarjeta de Equipo.
  const prevProfileId=_profileUserId;
  _profileUserId=null;
  renderMiPuesto(document.getElementById('equipo-mipuesto'));
  _profileUserId=prevProfileId;
  const body=document.getElementById('equipo-body');

  if(!isLeader()){
    // Integrante: solo se ve a sí mismo — no nómina ni datos de otros.
    const me=myUser();
    if(!me){ body.innerHTML=emptyStateHTML('No encontramos tu perfil','Pídele a tu líder o al admin que revise tu usuario.'); return; }
    body.innerHTML=personCardHTML(me);
    wirePersonCards(body);
    return;
  }
  if(!DB.users.length){ body.innerHTML=emptyStateHTML('Sin personas todavía','Un admin puede darlas de alta en Administración → Usuarios.'); return; }

  const bySec=new Map();
  const sinSeccion=[];
  DB.users.forEach(u=>{
    const sec=seccionOfUser(u.id);
    if(sec){ if(!bySec.has(sec.id)) bySec.set(sec.id,[]); bySec.get(sec.id).push(u); }
    else sinSeccion.push(u);
  });
  // El líder de una Sección le pertenece a ella siempre, sea o no también
  // encargado/ingeniero de algún Centro (seccionOfUser puede no encontrarlo
  // por ese camino) — si no cayó solo, se agrega a la fuerza en vez de
  // dejarlo perdido en "Sin sección asignada".
  DB.secciones.forEach(sec=>{
    if(!sec.liderId) return;
    const arr=bySec.get(sec.id)||[];
    if(!arr.some(u=>u.id===sec.liderId)){
      const lider=byId(DB.users,sec.liderId);
      if(lider){
        arr.unshift(lider);
        bySec.set(sec.id,arr);
        const i=sinSeccion.findIndex(u=>u.id===sec.liderId);
        if(i>=0) sinSeccion.splice(i,1);
      }
    }
  });
  // Tipo organigrama: cada Sección es UN bloque con una barra de color a la
  // izquierda — el líder arriba, sus reportes abajo, sangrados y con línea
  // punteada de por medio, para que se vea de un vistazo "esto le reporta a
  // esto" (nunca una cuadrícula plana donde el líder se confunde con su
  // propia gente). El único lugar donde se arma este árbol es reportsTo —
  // ver seccionOfUser/getMyReports — así que lo que se ve aquí es siempre
  // exactamente lo mismo que ya rige permisos en el resto de la app.
  let html='';
  DB.secciones.forEach(sec=>{
    const people=bySec.get(sec.id)||[];
    const lider=people.find(u=>u.id===sec.liderId);
    const reportes=people.filter(u=>u.id!==sec.liderId);
    if(!lider && !reportes.length) return;
    const puedeAgregar=isAdmin()||SESSION?.userId===sec.liderId;
    html+=`<div class="card" style="border-left:3px solid var(--accent);margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <div style="font-weight:700;font-size:14px">🧭 ${esc(sec.nombre)}</div>
        ${puedeAgregar?`<button class="btn xs" data-add-reporte="${sec.id}">＋ Agregar reporte directo</button>`:''}
      </div>
      ${lider?`<div class="small muted" style="font-weight:600;margin-bottom:6px">👑 Líder</div><div class="grid-cards">${personCardHTML(lider)}</div>`:''}
      ${reportes.length?`<div style="margin-top:14px;padding-left:14px;border-left:2px dashed var(--border2)">
          <div class="small muted" style="font-weight:600;margin-bottom:8px">↳ Reportan a ${lider?esc(lider.name):esc(sec.nombre)} <span class="pill muted" style="margin-left:4px">${reportes.length}</span></div>
          <div class="grid-cards">${reportes.map(personCardHTML).join('')}</div>
        </div>`:''}
      </div>`;
  });
  if(sinSeccion.length){
    html+=`<div class="card" style="border-left:3px solid var(--border2);margin-bottom:16px">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">⚠️ Sin sección asignada</div>
      <div class="small muted" style="margin-bottom:8px">Nadie los puso a reportarle a un líder todavía — usa "＋ Agregar reporte directo" en la sección que corresponda.</div>
      <div class="grid-cards">${sinSeccion.map(personCardHTML).join('')}</div>
      </div>`;
  }
  body.innerHTML=html||emptyStateHTML('Nadie agrupado todavía','Ve a Administración → Secciones para agrupar a la gente por Centro de Trabajo.');
  wirePersonCards(body);
  body.querySelectorAll('[data-add-reporte]').forEach(b=>{
    b.addEventListener('click',()=>openAgregarReporteDlg(byId(DB.secciones,b.dataset.addReporte)));
  });
}

/* Puestos (DGP) — catálogo admin-only. Formularios de lista larga se
   capturan como texto de una línea por elemento (igual de simple que
   "Funciones" en el perfil de persona) en vez de UI dinámica de
   agregar/quitar por campo — son 6 listas distintas por puesto y esto
   se captura una sola vez por puesto, no todos los días. */
function linesToArr(text){ return (text||'').split('\n').map(s=>s.trim()).filter(Boolean); }
function arrToLines(arr){ return (arr||[]).join('\n'); }
function indicadoresToLines(arr){ return (arr||[]).map(k=>`${k.label} | ${k.meta}`).join('\n'); }
function linesToIndicadores(text){
  return linesToArr(text).map(line=>{
    const [label,meta]=line.split('|').map(s=>(s||'').trim());
    return {label,meta:meta||''};
  });
}

/* ══════════════════════════════════════════════════════
   CENTRO DE TRABAJO — importación desde Control_CT_v7.html (nodo Firebase
   separado `control_ct`; SOLO LECTURA desde aquí, nunca se escribe ahí).
   CORRECCIÓN (13-sep-2026): la verificación original de esta fase decía que
   control_ct estaba vacío de ingeniería — eso era falso o quedó desactualizado.
   En vivo tiene 16/18 centros con CIF real, 18/18 con parámetros reales
   (disponible/dias/demanda/turnos/modo) y varios con equipos reales — todo
   capturado en la app vieja mientras esta vivía en paralelo. `operaciones`/
   `personal` (balanceo) siguen vacíos en los 18 — eso sí sigue sin usarse.
   Por eso la migración ahora SÍ trae cif/params/equipos reales (no solo el
   catálogo de nombres/ingenieros/tabulador) — se copian solo si el centro
   real todavía no tiene nada propio, para no pisar captura nativa futura.

   Emparejamiento por nombre — mismo algoritmo ya probado contra los datos
   reales (ver scratchpad de la sesión): normalizar acentos/mayúsculas/
   puntuación → tokens → quitar stopwords → sinónimos de abreviatura
   {est→estructura, ens→empaque} → match si el conjunto de tokens de un
   lado es subconjunto del otro. Con esto: 6/7 ingenieros y 18/18 centros
   (3 de ellos — "Ens. Sillas"/"Ens. Sillones"/"SILLAS/SILLONES" —
   colapsan al mismo centro real, fusión ya decidida con el usuario).
══════════════════════════════════════════════════════ */
const CT_STOPWORDS=new Set(['de','y','del','la','el','los','las']);
const CT_SYNONYMS={est:'estructura',ens:'empaque'};
function ctNormalize(s){
  const DIACRITICS=new RegExp('[̀-ͯ]','g'); // marcas combinantes tras normalize('NFD')
  return (s||'').toLowerCase().normalize('NFD').replace(DIACRITICS,'').replace(/[^\w\s]/g,' ');
}
function ctTokens(s){
  return ctNormalize(s).split(/\s+/).filter(t=>t&&!CT_STOPWORDS.has(t)).map(t=>CT_SYNONYMS[t]||t);
}
function ctTokenSubsetMatch(a,b){
  const ta=ctTokens(a),tb=ctTokens(b);
  if(!ta.length||!tb.length) return false;
  const setA=new Set(ta),setB=new Set(tb);
  return [...setA].every(t=>setB.has(t))||[...setB].every(t=>setA.has(t));
}
function buildCTMigrationPlan(ct){
  const ingenieros=(ct?.equipoState?.ingenieros)||[];
  const ctCentros=(ct?.centros)||[];
  const ctState=(ct?.state)||[]; // ingeniería real por centro, indexada igual que ctCentros
  const ingPlan=ingenieros.map(ing=>{
    const match=DB.users.find(u=>ctTokenSubsetMatch(ing.nombre,u.name))||null;
    return {ctNombre:ing.nombre,ctRol:ing.rol,ctAreas:ing.areas||[],match,rolSugerido:ing.rol==='gerente'?'leader':'user'};
  });
  const centroPlan=ctCentros.map((c,i)=>{
    const s=ctState[i]||{};
    return {
      ctIndex:i, ctNombre:c.n,
      candidatos:DB.centros.filter(dc=>ctTokenSubsetMatch(c.n,dc.nombre)),
      ctCif:s.cif||[], ctEquipos:s.equipos||[], ctParams:s.params||null,
      ctOps:s.ops||[], ctMod:s.mod||[], ctAsignaciones:s.asignaciones||null,
      ctCons:s.cons||null, ctFlujos:s.flujos||[],
    };
  });
  return {ingPlan,centroPlan,tabuladorSrc:ct?.tabulador||{grupos:[],categorias:[],niveles:[]}};
}
function ctMigrationReportHTML(plan){
  const ingRows=plan.ingPlan.map(p=>{
    if(!p.match) return `<tr><td>${esc(p.ctNombre)}</td><td colspan="3" class="small muted">Sin match — no se crea cuenta, queda solo como referencia histórica</td></tr>`;
    const sube=p.rolSugerido==='leader'&&p.match.loginRole==='user';
    return `<tr><td>${esc(p.ctNombre)}</td><td>${esc(p.match.name)}</td><td>${p.ctRol==='gerente'?'Gerente':'Ingeniero'}</td><td>${sube?'user → <b>leader</b>':'sin cambio ('+esc(p.match.loginRole)+')'}</td></tr>`;
  }).join('');
  const centroRows=plan.centroPlan.map(p=>{
    if(!p.candidatos.length) return `<tr><td>${esc(p.ctNombre)}</td><td colspan="2" class="small muted">Sin match — se omite, no se crea centro nuevo</td></tr>`;
    if(p.candidatos.length>1) return `<tr><td>${esc(p.ctNombre)}</td><td colspan="2">${p.candidatos.map(c=>esc(c.nombre)).join(' / ')} <span class="pill warn">ambiguo</span></td></tr>`;
    const yaTiene=p.candidatos[0].cif&&p.candidatos[0].cif.length||p.candidatos[0].operaciones&&p.candidatos[0].operaciones.length;
    const partes=[];
    if(p.ctOps.length) partes.push(`${p.ctOps.length} operaciones`);
    if(p.ctMod.length) partes.push(`${p.ctMod.length} personal`);
    if(p.ctCif.length) partes.push(`${p.ctCif.length} CIF`);
    if(p.ctEquipos.length) partes.push(`${p.ctEquipos.length} equipos`);
    if(p.ctParams) partes.push('parámetros');
    if(p.ctCons) partes.push('consideraciones');
    const detalle=yaTiene?'<span class="small muted">ya tiene datos propios — no se pisa</span>':(partes.length?partes.join(', '):'<span class="small muted">sin datos capturados en Control_CT</span>');
    return `<tr><td>${esc(p.ctNombre)}</td><td>${esc(p.candidatos[0].nombre)}</td><td>${detalle}</td></tr>`;
  }).join('');
  const t=plan.tabuladorSrc;
  return `<div class="small muted" style="margin-bottom:10px">Revisa esto — no se guarda nada todavía, hasta que le des "Aplicar migración".</div>
    <div style="font-weight:700;margin-bottom:6px">👤 Ingenieros (${plan.ingPlan.length})</div>
    <table class="tbl" style="margin-bottom:16px"><thead><tr><th>Control CT</th><th>Usuario real</th><th>Rol CT</th><th>Cambio de permiso</th></tr></thead><tbody>${ingRows}</tbody></table>
    <div style="font-weight:700;margin-bottom:6px">🏭 Centros (${plan.centroPlan.length}) — operaciones/personal/CIF/equipos/parámetros reales que se traen</div>
    <table class="tbl" style="margin-bottom:16px"><thead><tr><th>Control CT</th><th>Centro real</th><th>Se copia</th></tr></thead><tbody>${centroRows}</tbody></table>
